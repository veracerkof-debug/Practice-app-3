<title>Учебник русского языка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Одна колонка ≤72ch, схемы в тексте; цвет только по смыслу. Токены по образцу учебника Melete. */
:root{
  --bg:#F3F2EE; --cell:#FFFFFF; --ink:#161514; --l2:#87847E; --l3:#B3AFA7;
  --sep:rgba(60,55,45,.15); --fill:rgba(120,115,105,.12); --fill2:rgba(120,115,105,.2);
  --tint:#9C7242; --tint-text:#765A38; --on-tint:#FFFFFF; --red:#A75750;
  --T:#5E8A55; --S:#5B7FA6; --D:#A75750; --V:#7A6A9E; --A:#4E8079;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1C1C1E; --ink:#FFFFFF; --l2:#8D8D93; --l3:#5A5A5E;
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --tint:#BC9361; --tint-text:#BC9361; --on-tint:#1A0E00; --red:#C47D74;
  --T:#7FAE74; --S:#7FA0C6; --D:#C47D74; --V:#9C8CC0; --A:#6FA59D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --ink:#FFFFFF; --l2:#8D8D93; --l3:#5A5A5E;
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --tint:#BC9361; --tint-text:#BC9361; --on-tint:#1A0E00; --red:#C47D74;
  --T:#7FAE74; --S:#7FA0C6; --D:#C47D74; --V:#9C8CC0; --A:#6FA59D; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;margin:0;
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--cell)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
.kick{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tint-text)}
.sub{color:var(--l2);font-size:14px}
h2{font-size:27px;line-height:1.15;letter-spacing:-.3px;text-wrap:balance;margin:2px 0 0}
h3{font-size:19px;margin:22px 0 4px;text-wrap:balance}
h4{font-size:14px;color:var(--l2);font-weight:600;margin:14px 0 2px}
p{margin:0}
.bktext{max-width:72ch;display:flex;flex-direction:column;gap:10px;min-width:0}

/* Герой оглавления */
.bhero{border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--tint) 16%,var(--cell)),var(--cell));border:1px solid var(--sep)}
.bhero .row{display:flex;gap:12px;align-items:center}
.bhero .row svg{flex:0 0 auto}
.bhero h1{font-size:27px;line-height:1.1;margin:0;letter-spacing:-.3px}
.bsearch{width:100%;min-height:44px;border-radius:12px;border:0;background:var(--fill);padding:0 14px;font:inherit;color:var(--ink)}
.bsearch::placeholder{color:var(--l2)}
.sres{display:flex;flex-direction:column;gap:4px}
.sres button{all:unset;cursor:pointer;display:flex;flex-direction:column;padding:10px 12px;border-radius:12px;background:var(--cell);border:1px solid var(--sep)}
.sres button small{color:var(--l2);font-size:13px}

/* Переключатель режимов */
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:3px}
.seg{flex-wrap:wrap}
.seg button{flex:1 1 auto;padding:0 8px;border:0;background:transparent;min-height:40px;border-radius:10px;font-weight:600;font-size:15px;color:var(--l2)}
.seg button[aria-pressed="true"]{background:var(--cell);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Части и карточки глав */
.bpart{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bpart>header{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.num{width:22px;height:22px;border-radius:11px;display:grid;place-items:center;font-size:12px;color:var(--on-tint);background:var(--pc)}
.bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bcard{all:unset;cursor:pointer;position:relative;overflow:hidden;background:var(--cell);border:1px solid var(--sep);border-radius:16px;
  min-height:96px;padding:14px 12px 12px;display:flex;flex-direction:column;gap:2px}
.bcard::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--pc)}
.bcard .n{font-size:13px;font-weight:700;color:var(--pc)}
.bcard .t{font-size:17px;font-weight:700;line-height:1.2}
.bcard .s{font-size:13px;color:var(--l2);line-height:1.35}
.bcard.soon{opacity:.62}
.bcard .badge{margin-top:auto;align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:8px;background:color-mix(in srgb,var(--T) 18%,var(--cell));color:var(--T)}
.bcard .badge.wait{background:var(--fill);color:var(--l2)}

/* Путь */
.bpath{all:unset;cursor:pointer;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--sep);
  background:linear-gradient(135deg,color-mix(in srgb,var(--T) 18%,var(--cell)),color-mix(in srgb,var(--S) 14%,var(--cell)))}
.bpath .t{font-size:19px;font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--T);border-radius:3px}

/* Глава */
.bkhbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--cell);border-bottom:1px solid var(--sep);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bkhbar .in{max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.back{all:unset;cursor:pointer;color:var(--tint-text);font-weight:600;min-height:40px;display:flex;align-items:center}
.bkhbar .where{font-size:13px;color:var(--l2);text-align:right}
.bklnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.bklnav::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:0;min-height:40px;border-radius:20px;padding:0 14px;background:var(--fill);font-size:14px;font-weight:600;white-space:nowrap}
.pill.done{background:color-mix(in srgb,var(--T) 18%,var(--cell));color:var(--T)}
.bkles{display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:1px solid var(--sep);scroll-margin-top:70px}
.bkles:first-of-type{border-top:0}
.bklh{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.bklh .kick{flex:0 0 auto}
.bklh .t{font-size:19px;font-weight:700;line-height:1.25}
.ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
b.m{color:var(--tint-text)}
.ex{font-style:italic}

/* Вставки */
.bins{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.bins>.h{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.bkey{background:color-mix(in srgb,var(--tint) 13%,var(--cell))}
.bkey>.h{color:var(--tint-text)}
.bnorm{background:color-mix(in srgb,var(--S) 11%,var(--cell));border-left:3px solid var(--S);border-radius:4px 14px 14px 4px}
.bnorm>.h{color:var(--S)}
.btip{background:var(--fill)}
.btip>.h{color:var(--l2)}

/* Таблица */
.tblw{overflow-x:auto;border:1px solid var(--sep);border-radius:14px;background:var(--cell)}
.bktbl{border-collapse:collapse;width:100%;font-size:15px}
.bktbl.wide{min-width:460px}
.chaint td{padding:8px 8px}.chaint td:first-child{width:34%;font-size:13px!important}.chaint td:last-child{width:46px}
.bktbl th,.bktbl td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--sep);vertical-align:top}
.bktbl th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--l2);font-weight:700}
.bktbl tr:last-child td{border-bottom:0}
.tagN,.tagNN{display:inline-block;min-width:34px;text-align:center;font-weight:800;border-radius:8px;padding:0 6px}
.tagN{background:color-mix(in srgb,var(--S) 16%,var(--cell));color:var(--S)}
.tagNN{background:color-mix(in srgb,var(--tint) 18%,var(--cell));color:var(--tint-text)}

/* Термин */
.bterm{color:var(--tint-text);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;background:none;border:0;padding:0;font:inherit}

/* Схема */
.blab{background:var(--cell);border:1px solid var(--sep);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;container-type:inline-size}
.blab .cap{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipc{border:0;min-height:42px;border-radius:12px;background:var(--fill);padding:0 12px;font-size:15px}
.chipc[aria-pressed="true"]{background:var(--tint);color:var(--on-tint)}
.tree{display:flex;flex-direction:column;gap:8px}
.step{border-radius:14px;padding:10px 12px;background:var(--fill);display:flex;flex-direction:column;gap:8px}
.step .q{font-weight:700}
.step .opts{display:flex;flex-direction:column;gap:6px}
.opt{border:1px solid var(--sep);background:var(--cell);text-align:left;border-radius:12px;padding:9px 12px;min-height:44px;font-size:15px}
.opt.on{border:2px solid var(--tint);padding:8px 11px;background:color-mix(in srgb,var(--tint) 10%,var(--cell))}
.opt[disabled]:not(.on){opacity:.5;cursor:default}
.result{border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--T) 14%,var(--cell))}
.result .big{font-size:28px;font-weight:800;color:var(--T);min-width:56px;text-align:center}
.bkhint{font-size:13px;color:var(--l2)}
.linkbtn{all:unset;cursor:pointer;color:var(--tint-text);font-weight:600;font-size:14px}

/* Упражнения */
.bklex{border-radius:16px;padding:12px;background:color-mix(in srgb,var(--tint) 6%,var(--cell));border:1px solid var(--sep);
  display:flex;flex-direction:column;gap:10px}
.bklex>.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bklex>.top b{font-size:17px}
.items{display:flex;flex-direction:column;gap:6px}
.item{background:var(--cell);border:1px solid var(--sep);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.item .line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.item .w{font-size:18px}
.slot{display:inline-block;min-width:30px;border-bottom:2px solid var(--l3);text-align:center;font-weight:800;color:var(--l2)}
.slot.ok{color:var(--T);border-color:var(--T)}
.slot.bad{color:var(--red);border-color:var(--red)}
.ans{display:flex;gap:6px}
.ans button{min-width:52px;min-height:40px;border-radius:10px;border:0;background:var(--fill);font-weight:700;font-size:16px}
.ans button.ok{background:color-mix(in srgb,var(--T) 22%,var(--cell));color:var(--T)}
.ans button.bad{background:color-mix(in srgb,var(--red) 18%,var(--cell));color:var(--red)}
.why{font-size:14px;color:var(--l2)}
.why b.badt{color:var(--red)}
.why b.okt{color:var(--T)}
.score{font-size:14px;color:var(--l2);display:flex;justify-content:space-between;align-items:center;gap:8px}
details.bkhelp{border-radius:12px;background:var(--fill)}
details.bkhelp summary{list-style:none;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;cursor:pointer;font-weight:600}
details.bkhelp summary::-webkit-details-marker{display:none}
details.bkhelp summary::before{content:"›";display:inline-block;transition:transform .15s;font-size:18px;color:var(--l2)}
details.bkhelp[open] summary::before{transform:rotate(90deg)}
details.bkhelp.fix summary{color:var(--red)}
details.bkhelp.deep summary{color:var(--S)}
details.bkhelp .body{padding:0 14px 12px;display:flex;flex-direction:column;gap:6px}
.bkldone{min-height:44px;border-radius:14px;border:0;background:var(--tint);color:var(--on-tint);font-weight:700;font-size:16px}
.bkldone.is{background:color-mix(in srgb,var(--T) 20%,var(--cell));color:var(--T)}
.bsrc{border-top:1px solid var(--sep);padding-top:10px;font-size:12.5px;color:var(--l2);max-width:72ch}
.bpn{display:flex;justify-content:space-between;gap:8px}
.bpn button{all:unset;cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--tint-text);font-weight:600}
.bpn button[disabled]{visibility:hidden}

/* Карточки */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.deck{all:unset;cursor:pointer;background:var(--cell);border:1px solid var(--sep);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.deck::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--pc)}
.deck .t{font-size:17px;font-weight:700}
.deck .facts{display:flex;gap:14px;font-size:13px;color:var(--l2);font-variant-numeric:tabular-nums}
.deck .facts b{color:var(--ink);font-size:17px;display:block}
.study{display:flex;flex-direction:column;gap:12px;max-width:560px;width:100%;margin:0 auto}
.card{background:var(--cell);border:1px solid var(--sep);border-radius:20px;padding:22px 18px;min-height:260px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.card .ty{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--l2)}
.card .qq{font-size:22px;line-height:1.3;font-weight:700;text-wrap:balance}
.card .aa{font-size:17px;border-top:1px solid var(--sep);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.card .word{font-size:30px;font-weight:700;letter-spacing:.5px;text-align:center}
.vow{border:0;background:var(--fill);border-radius:6px;font-size:30px;font-weight:700;padding:0 1px;min-height:46px;margin:0 1px;line-height:1}
.sword{display:flex;justify-content:center;align-items:center;flex-wrap:nowrap}
.vow.ok{background:color-mix(in srgb,var(--T) 25%,var(--cell));color:var(--T)}
.vow.bad{background:color-mix(in srgb,var(--red) 20%,var(--cell));color:var(--red)}
.cons{font-size:30px;font-weight:700}
.big2{display:flex;gap:8px}
.big2 button{flex:1;min-height:48px;border-radius:14px;border:0;font-weight:700;font-size:16px}
.again{background:color-mix(in srgb,var(--red) 16%,var(--cell));color:var(--red)}
.good{background:color-mix(in srgb,var(--T) 20%,var(--cell));color:var(--T)}
.main{background:var(--tint);color:var(--on-tint)}
.ghost{background:var(--fill)}
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--l2);font-variant-numeric:tabular-nums}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:12px;color:var(--l2);text-align:center}
.boxes div{background:var(--fill);border-radius:10px;padding:6px 2px}
.boxes b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--l2)}


.tl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--l2);margin-top:4px}
.seg button[role=tab]{font-size:15px}
.prac{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.pbtn{all:unset;cursor:pointer;background:var(--cell);border:1px solid var(--sep);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.pbtn b{color:var(--tint-text);font-size:16px}.pbtn span{font-size:13px;color:var(--l2)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cols>div{background:var(--fill);border-radius:14px;padding:8px;min-height:90px;display:flex;flex-direction:column;gap:6px}
.colh{text-align:center}
.wchip{border:1px solid var(--sep);background:var(--cell);border-radius:10px;min-height:40px;font-size:15px;padding:4px 8px;text-align:left}
.wchip.ok{border-color:var(--T);color:var(--T)} .wchip.bad{border-color:var(--red);color:var(--red);text-decoration:line-through}
.wfreel{display:flex;flex-direction:column;gap:6px}
.wfree{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:17px;border-bottom:1px solid var(--sep);padding-bottom:6px}
.errl{display:flex;flex-direction:column;gap:6px}
.errl .opt{font-size:18px}
.opt.eok{border:2px solid var(--T);color:var(--T)} .opt.ebad{border:2px solid var(--red);color:var(--red)}
.clex{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--sep);scroll-margin-top:70px}
.clex .clh{display:flex;gap:10px;align-items:baseline}
.okm{font-size:13px;color:var(--T);font-weight:600}
.clex .task{font-weight:600}
.clex .cbody{font-size:17px;line-height:1.7;background:var(--cell);border:1px solid var(--sep);border-radius:14px;padding:12px 14px}
.clex .pill{align-self:flex-start}
.bkldone[disabled],.main[disabled]{opacity:.45;cursor:default}


.chhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.easy{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--sep);background:var(--cell);border-radius:20px;min-height:40px;padding:0 12px 0 8px;font-weight:600;font-size:14px;margin-top:4px}
.easy .sw{width:34px;height:20px;border-radius:10px;background:var(--fill2);position:relative;transition:background .15s}
.easy .sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:8px;background:var(--cell);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.easy[aria-pressed="true"]{border-color:var(--T);color:var(--T)}
.easy[aria-pressed="true"] .sw{background:var(--T)} .easy[aria-pressed="true"] .sw i{left:16px}
.stars{color:var(--tint);letter-spacing:1px;font-size:13px;margin-right:4px}.stars span{color:var(--l3)}
.obr{background:color-mix(in srgb,var(--T) 10%,var(--cell));border-radius:12px;padding:8px 12px;font-size:15px}
.obr b{color:var(--T)}
.wchip.on{border-color:var(--tint);background:color-mix(in srgb,var(--tint) 10%,var(--cell))}


.cluster{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
@container (max-width:520px){.cluster{grid-template-columns:1fr}.core{order:-1}}
.side{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.side.vb{background:color-mix(in srgb,var(--S) 11%,var(--cell));border:1px solid color-mix(in srgb,var(--S) 30%,var(--cell))}
.side.aj{background:color-mix(in srgb,var(--T) 11%,var(--cell));border:1px solid color-mix(in srgb,var(--T) 30%,var(--cell))}
.side .sh{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.side.vb .sh{color:var(--S)} .side.aj .sh{color:var(--T)}
.pf{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-top:1px solid var(--sep);padding-top:4px}
.pf span{color:var(--l2)} .pf b{text-align:right}
.core{display:flex;flex-direction:column;align-items:center;gap:6px}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:10px;
 background:conic-gradient(var(--S) 0 50%,var(--T) 50% 100%);}
.ring span{background:var(--cell);border-radius:50%;width:130px;height:130px;display:grid;place-items:center;font-weight:700;font-size:14px;padding:4px;overflow-wrap:anywhere}
.mfacts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--l2)} .mfacts b{color:var(--ink)}
.mgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:stretch}
.mh{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--l2);text-align:center;align-self:end}
.mh.mr{align-self:center;text-align:left}
.mc{border-radius:12px;min-height:56px;display:grid;place-items:center;text-align:center;padding:6px;font-size:16px}

 {id:'nn1',t:'Прилагательные от существительных',
  hint:'Найти суффикс. -ан-, -ян-, -ин- — одна н; -онн-, -енн- или основа на н — две. Исключения: стеклянный, оловянный, деревянный; ветреный.',
  h:`<p>Написание н или нн всегда зависит от того, как образовано слово. Поэтому первый шаг — найти исходное слово. Этот урок посвящён прилагательным, образованным от существительных: <span class="ex">кожа → кожаный, клюква → клюквенный, лимон → лимонный</span>. Такие прилагательные называют [[otym|отымёнными]]. В них всё решает [[suff|суффикс]].</p>
  <h4>Одна н</h4>
  <p>Одна <b class="m">н</b> пишется в суффиксах <b class="m">-ан-</b>, <b class="m">-ян-</b>, <b class="m">-ин-</b>: <span class="ex">кожаный, песчаный, ржаной; глиняный, серебряный, конопляный, торфяной, дровяной; гусиный, лебединый, змеиный, соловьиный</span>. Ударение на написание не влияет: <span class="ex">ржаной, торфяной, дровяной</span> пишутся с одной н, как и безударные.</p>
  <h4>Две н</h4>
  <ol class="ul">
   <li>В суффиксах <b class="m">-онн-</b>, <b class="m">-енн-</b>: <span class="ex">революционный, ревизионный, дискуссионный; клюквенный, соломенный, производственный, утренний</span>.</li>
   <li>На стыке основы, которая оканчивается на <b class="m">н</b>, и суффикса <b class="m">-н-</b>: <span class="ex">лимон + н → лимонный, сон → сонный, длина → длинный, осень → осенний, камень → каменный</span>. Сюда же прилагательные от существительных на <b class="m">-мя</b>: <span class="ex">имя (имен-) → именной, время → временный, племя → племенной, семя → семенной</span>.</li>
  </ol>
  {{lab:morph}}
  {{table}}
  <h4>Исключения</h4>
  <p>С двумя <b class="m">н</b>, хотя суффикс -ян-: <b>стеклянный, оловянный, деревянный</b>. С одной <b class="m">н</b>, хотя суффикс -ен-: <b>ветреный</b>. Слова с приставками пишутся с двумя н: <span class="ex">безветренный, обветренный, заветренный</span>.</p>
  <h4>Слова без суффикса -н-</h4>
  <p>В словах <span class="ex">юный, синий, зелёный, багряный, пряный, пьяный, рдяный, румяный, рьяный, свиной</span> буква н не принадлежит суффиксу -н-: она входит в корень или в старый суффикс, который сейчас не выделяется. Поэтому пишется одна н.</p>
  <h4>Различать по значению</h4>
  <div class="tblw"><table class="bktbl"><thead><tr><th>Слово</th><th>Значение</th><th>Примеры</th></tr></thead><tbody>
   <tr><td><b>масляный</b></td><td>из масла, для масла, на масле (суффикс -ян-)</td><td class="ex">масляная краска, масляный насос, масляное пятно</td></tr>
   <tr><td><b>масленый</b></td><td>смазанный, пропитанный маслом (от глагола маслить)</td><td class="ex">масленые руки, масленый блин, масленая каша; Масленая неделя</td></tr>
   <tr><td><b>ветреный</b></td><td>с ветром; легкомысленный (исключение, одна н)</td><td class="ex">ветреный день, ветреный человек</td></tr>
   <tr><td><b>ветряной</b></td><td>приводимый в движение ветром</td><td class="ex">ветряной двигатель, ветряная мельница</td></tr>
   <tr><td><b>ветряный</b></td><td>только в названии болезни</td><td class="ex">ветряная оспа</td></tr>
  </tbody></table></div>
  <div class="bins bkey"><div class="h">Главное</div><p>-ан-, -ян-, -ин- — одна н; -онн-, -енн- и стык н + н — две. Исключения: стеклянный, оловянный, деревянный (две н) и ветреный (одна н).</p></div>`,
  lite:`<p>Слово сделано от существительного: <span class="ex">кожа → кожаный</span>. Нужно посмотреть на кусочек после корня — суффикс.</p>
  <div class="tblw"><table class="bktbl"><tbody>
   <tr><td class="ex">кож<b class="m">ан</b>ый, глин<b class="m">ян</b>ый, гус<b class="m">ин</b>ый</td><td><span class="tagN">н</span> одна</td></tr>
   <tr><td class="ex">клюкв<b class="m">енн</b>ый, революци<b class="m">онн</b>ый</td><td><span class="tagNN">нн</span> две</td></tr>
   <tr><td class="ex">лимо<b class="m">н</b> + <b class="m">н</b> = лимо<b class="m">нн</b>ый</td><td><span class="tagNN">нн</span> две: одна из слова, одна из суффикса</td></tr>
  </tbody></table></div>
  {{lab:morph}}
  <div class="bins bkey"><div class="h">Запомнить</div><p>Стеклянный, оловянный, деревянный — с двумя н. Ветреный — с одной.</p></div>`,
  deep:`<p><b>Существительные с похожими суффиксами</b> разобраны в уроке 6: <span class="ex">дровяник, нефтяник</span> — одна н, <span class="ex">дружинник, племянник</span> — две.</p><p><b>Юннат</b> (юный натуралист) пишется с двумя н: это сложносокращённое слово, на стыке частей встречаются две н.</p>`,
  easy:'Разделить слово на части: кож + ан + ый. Если суффикс -ан-, -ян- или -ин- — одна н. Если -енн-, -онн- или основа сама кончается на н — две.',
  fix:'Чаще всего ошибаются в исключениях. Помогает фраза: «Стеклянный, оловянный, деревянный — три слова с двумя н, а ветреный — с одной».'
 },
 {id:'nn2',t:'Причастия и прилагательные от глаголов',
  hint:'Проверить приметы причастия: приставка (кроме не-), зависимое слово, суффикс -ова-/-ева-, совершенный вид. Есть хотя бы одна — две н.',
  h:`<p>Если слово образовано от глагола, это либо [[prich|причастие]], либо [[otgl|отглагольное прилагательное]]. Причастие называет признак по действию: <span class="ex">зажаренная на огне рыба</span>. Отглагольное прилагательное называет постоянный признак, без действия: <span class="ex">жареная рыба</span>. В полном причастии пишется две <b class="m">н</b>, в отглагольном прилагательном — одна.</p>
  <h4>Четыре приметы причастия</h4>
  <p>Две <b class="m">н</b> пишутся, если есть хотя бы одна из примет:</p>
  <ol class="ul">
   <li>[[pref|Приставка]], кроме <b class="m">не-</b>: <span class="ex">зажаренный, прочитанный, вымощенный, подстриженный</span>.</li>
   <li>[[dep|Зависимое слово]]: <span class="ex">жаренная на масле картошка, мощённая булыжником дорога, крашенный маляром пол</span>.</li>
   <li>Суффикс <b class="m">-ова-</b>, <b class="m">-ева-</b> (<b class="m">-ёва-</b>): <span class="ex">балованный, маринованный, рискованный, корчёванный</span>.</li>
   <li>Образовано от глагола [[sov|совершенного вида]], даже без приставки: <span class="ex">брошенный (бросить), решённый (решить), купленный, лишённый, пленённый, данный</span>.</li>
  </ol>
  <p>Если ни одной приметы нет, это отглагольное прилагательное, и пишется одна <b class="m">н</b>: <span class="ex">жареный, варёный, солёный, стриженый, крашеный, вяленый, мощёный, тканый, плетёный, ломаный, путаный, рваный, стираный</span>.</p>
  {{lab:tree}}
  <h4>Приставка не-</h4>
  <p>Приставка <b class="m">не-</b> приметой не считается: <span class="ex">незваный, некрашеный, нехоженый, некошеный, непрошеный, неезженый, непуганый, неписаный закон</span>. Но если появляется зависимое слово, это причастие, и не пишется раздельно: <span class="ex">не крашенный маляром пол</span>.</p>
  <h4>-ов-, -ев- в корне</h4>
  <p>В словах <span class="ex">кованый, жёваный, клёваный</span> сочетания -ов-, -ев- входят в корень (<span class="ex">ковать, жевать, клевать</span>), это не суффикс -ова-. Поэтому одна н. С приставкой — две: <span class="ex">подкованный, изжёванный</span>.</p>
  <h4>Исключения: две н без примет</h4>
  <p><span class="ex">Желанный, жеманный, медленный, нечаянный, священный, чеканный, чванный, деланный, окаянный, считанный (минуты); невиданный, негаданный, неожиданный, неслыханный, нежданный, недреманный</span>. Сюда же немногие причастия от глаголов несовершенного вида: <span class="ex">виданный, виденный, слыханный, читанный</span>.</p>
  <div class="bins bnorm"><div class="h">Норма сегодня · Правила 2006</div><p>Основное правило в справочнике Розенталя и в Правилах 2006 года одинаково; списки исключений в разных пособиях немного различаются. Сочетание с приставкой не- пишется слитно: <span class="ex">некошеная трава, незваные гости</span>. В некоторых пособиях встречается раздельное «не кошеная», «не званые» — это ошибка.</p></div>
  <div class="bins bkey"><div class="h">Главное</div><p>Приставка (кроме не-), зависимое слово, -ова-/-ева-, совершенный вид — хотя бы одна примета даёт две н. Нет ни одной — одна н, кроме слов-исключений.</p></div>`,
  lite:`<p>Слово сделано от глагола: <span class="ex">жарить → жареный</span>. Тогда нужно поискать четыре приметы. Если есть хоть одна — пишем <b>две н</b>.</p>
  <ol class="ul">
   <li><b>Приставка</b>: <span class="ex">за</span>жаренный. (Приставка <b>не-</b> не считается: некрашеный.)</li>
   <li><b>Слово рядом, которое к нему относится</b>: жаренный <span class="ex">на масле</span>.</li>
   <li><b>-ова-, -ева-</b>: марин<span class="ex">ова</span>нный.</li>
   <li><b>Сделано из «что сделать?»</b>: решить → решённый.</li>
  </ol>
  <p>Нет ни одной приметы — <b>одна н</b>: <span class="ex">жареная картошка, варёный рис</span>.</p>
  {{lab:tree}}
  <div class="bins bkey"><div class="h">Запомнить</div><p>С двумя н без примет: желанный, медленный, нечаянный, неслыханный, невиданный, неожиданный, священный, чеканный.</p></div>`,
  easy:'Проверять приметы по одной, сверху вниз, и остановиться на первой найденной. Схема выше делает то же самое.',
  fix:'Если путаются «жареный» и «жаренный», задать к слову вопрос: «жаренный (на чём?) на масле». Вопрос задаётся — есть зависимое слово, пишется две н.'
 },
 {id:'nn3',t:'Трудные случаи',
  hint:'Устойчивые сочетания (названый брат), повторы (глаженый-переглаженый) и сложные слова (гладкокрашеный) пишутся с одной н.',
  h:`<p>Основное правило покрывает почти все слова. Остаются случаи, где приметы обманывают.</p>
  <h4>Решает значение</h4>
  <p>Иногда граница между причастием и прилагательным проходит по смыслу. В предложении <span class="ex">Будучи раненным, солдат оставался в строю</span> пишется две н: слово обозначает временное состояние, связанное с действием, это причастие, хотя приставки и зависимых слов нет.</p>
  <h4>Приставка — две н, даже у прилагательных</h4>
  <p>Если есть приставка (кроме не-), пишется нн, даже когда слово стало прилагательным: <span class="ex">выдержанное вино, подержанные книги, поношенное платье, ускоренный шаг, наложенным платежом</span>.</p>
  <h4>Устойчивые сочетания с одной н</h4>
  <div class="tblw"><table class="bktbl"><thead><tr><th>Одна н (значение прилагательного)</th><th>Две н (причастие)</th></tr></thead><tbody>
   <tr><td class="ex">названый брат (побратим)</td><td class="ex">названный в честь деда</td></tr>
   <tr><td class="ex">посажёный отец (на свадьбе)</td><td class="ex">посаженное дерево</td></tr>
   <tr><td class="ex">смышлёный мальчик</td><td>—</td></tr>
   <tr><td class="ex">конченый человек</td><td class="ex">законченная работа</td></tr>
   <tr><td class="ex">писаная красавица</td><td class="ex">написанное письмо</td></tr>
   <tr><td class="ex">верченый парень (легкомысленный)</td><td class="ex">верченный в руках</td></tr>
   <tr><td class="ex">Прощёное воскресенье</td><td class="ex">прощённый ученик</td></tr>
  </tbody></table></div>
  <h4>Повторы</h4>
  <p>В сочетаниях вида <span class="ex">глаженые-переглаженые брюки, стираное-перестираное бельё, штопаные-перештопаные носки, латаная-перелатаная куртка, ношеный-переношеный костюм</span> во второй части пишется одна н, хотя есть приставка пере-: всё сочетание обозначает высокую степень качества.</p>
  <h4>Сложные слова</h4>
  <p>Отглагольное прилагательное сохраняет одну н и в составе сложного слова: <span class="ex">гладкокрашеный, горячекатаный, холоднокатаный, цельнокроеный, домотканый, златотканый, малоезженый, малохоженый, малоношеный, малосолёный, свежемороженый</span>. Если вторая часть образована от приставочного глагола, пишется нн: <span class="ex">гладкоокрашенный, свежезамороженный, малонаезженный</span>.</p>
  {{lab:chain}}
  <div class="bins bkey"><div class="h">Главное</div><p>Приставка (кроме не-) даёт нн даже у прилагательных. Исключения — устойчивые сочетания (названый брат, посажёный отец, смышлёный) и повторы с пере-; одна н и в сложных словах без приставки во второй части.</p></div>`,
  lite:`<p>Это урок о редких случаях. Их немного, и их проще запомнить списком.</p>
  <ul class="ul">
   <li><b>Одна н в устойчивых сочетаниях:</b> <span class="ex">названый брат, посажёный отец, смышлёный мальчик, конченый человек, писаная красавица, Прощёное воскресенье</span>.</li>
   <li><b>Повторы — одна н в обеих частях:</b> <span class="ex">глаженые-переглаженые, стираное-перестираное</span>.</li>
   <li><b>Сложные слова — одна н:</b> <span class="ex">гладкокрашеный, свежемороженый, домотканый</span>.</li>
   <li><b>С приставкой — всегда две н:</b> <span class="ex">выдержанное вино, подержанные книги</span>.</li>
  </ul>
  {{lab:chain}}`,
  easy:'Сначала проверить, не стоит ли слово в одном из трёх списков (устойчивые сочетания, повторы, сложные слова). Если нет — решать по обычным приметам.',

 {id:'nn4',t:'Краткие формы',
  hint:'Подходит «очень» — краткое прилагательное, пишется как в полной форме. Подходит «кем? чем?» — краткое причастие, одна н.',
  h:`<p>В [[krat|краткой форме]] правило другое. Сначала нужно понять, причастие перед нами или прилагательное.</p>
  <p><b>Краткое причастие</b> называет действие и пишется с одной <b class="m">н</b>: <span class="ex">задача решена, письма написаны, ошибка исправлена, дни сочтены</span>. К нему можно поставить вопрос «кем? чем?»: <span class="ex">решена (кем?) учеником</span>.</p>
  <p><b>Краткое прилагательное</b> называет качество и сохраняет столько <b class="m">н</b>, сколько в полной форме: <span class="ex">девушка воспитанна (воспитанная), ответы продуманны, ночь туманна, дорога длинна</span>. Оно отвечает на вопрос «каков?», к нему подходит «очень».</p>
  <div class="tblw"><table class="bktbl"><thead><tr><th>Причастие: одна н</th><th>Прилагательное: как в полной форме</th></tr></thead><tbody>
   <tr><td>Девочка воспита<b class="m">н</b>а бабушкой.</td><td>Девочка воспита<b class="m">нн</b>а и умна.</td></tr>
   <tr><td>Тучи рассея<b class="m">н</b>ы ветром.</td><td>Студентка рассея<b class="m">нн</b>а и молчалива.</td></tr>
   <tr><td>Население взволнова<b class="m">н</b>о сообщением.</td><td>Море сегодня взволнова<b class="m">нн</b>о.</td></tr>
   <tr><td>Ресурсы изыска<b class="m">н</b>ы экономистами.</td><td>Манеры барышни изыска<b class="m">нн</b>ы.</td></tr>
   <tr><td>Масштабы работ ограниче<b class="m">н</b>ы средствами.</td><td>Его возможности ограниче<b class="m">нн</b>ы (= малы).</td></tr>
  </tbody></table></div>
  <h4>Краткие отымённые прилагательные</h4>
  <p>Как в полной форме: <span class="ex">длинный → длинен, длинна; туманный → туманна; ветреный → ветрена; юный → юна</span>.</p>
  <h4>Особые случаи</h4>
  <p>Некоторые прилагательные с приставкой в краткой форме пишутся с одной н, как причастия: <span class="ex">заплаканные глаза — глаза заплаканы; поношенное платье — платье поношено; общепризнанное превосходство — превосходство общепризнано</span>.</p>
  <p>Несколько слов меняют написание в зависимости от значения и окружения:</p>
  <div class="tblw"><table class="bktbl"><tbody>
   <tr><td>Сестра намере<b class="m">н</b>а уехать (имеет намерение, есть инфинитив).</td><td>Его дерзость намере<b class="m">нн</b>а (нарочита).</td></tr>
   <tr><td>Мы преда<b class="m">н</b>ы Родине (есть дополнение).</td><td>Старые друзья всегда преда<b class="m">нн</b>ы.</td></tr>
   <tr><td>Спортсмены увере<b class="m">н</b>ы в победе (есть дополнение).</td><td>Движения гимнастов легки и увере<b class="m">нн</b>ы.</td></tr>
  </tbody></table></div>
  <div class="bins bkey"><div class="h">Главное</div><p>Краткое причастие — одна н. Краткое прилагательное — как в полной форме.</p></div>`,

  <li>Можно поставить <b>«очень»</b> — это качество, пишем как в полном слове: <span class="ex">девушка очень воспитанна (воспитанная — две н)</span>.</li></ul>

function CC(){return CHAPTERS[route&&route.id]||NN}

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const gap=it=>it.w.includes('_');
function trPool(){return CC().bank.filter(b=>TR.les.includes(b.l))}
function groupCols(pool){
 // столбики: только задания с пропуском и двумя вариантами, сгруппированные по одинаковым вариантам
 const by={};pool.filter(it=>gap(it)&&OPTS(it).length===2).forEach(it=>{const k=OPTS(it).join('|');(by[k]=by[k]||[]).push(it)});
 const out=[];Object.values(by).forEach(arr=>{for(let i=0;i<arr.length;i+=6){const g=arr.slice(i,i+6);if(g.length>=3)out.push({k:'cols',items:g,set:{},opts:OPTS(g[0])});else g.forEach(it=>out.push({k:'pick',it}))}});
 return out;
}
function groupErr(pool){
 const g=pool.filter(gap),rest=pool.filter(it=>!gap(it)),out=[];
 for(let i=0;i<g.length;i+=4){const x=g.slice(i,i+4);if(x.length<3){x.forEach(it=>out.push({k:'pick',it}));continue}out.push({k:'err',items:x,bad:Math.floor(Math.random()*x.length),pick:null})}
 rest.forEach(it=>out.push({k:'pick',it}));return out;
}
function trStart(items){
 const pool=items||shuffle(trPool()).slice(0,TR.cnt==='all'?9999:TR.cnt);

 else if(TR.mode==='mix'){const a=shuffle(pool),n=Math.ceil(a.length/3);tasks=shuffle([...a.slice(0,n).map(it=>({k:'pick',it})),...groupErr(a.slice(n,2*n)),...groupCols(a.slice(2*n))])}

 TR.run={tasks,i:0,ok:0,tot:0,wrong:[],pool};
}

}

let CLF=0;
const clKey=e=>'cl-'+CC().id+'-'+e.n;

 let h=`<div class="bktext"><div class="bins btip"><div class="h">Как работать</div><p>Упражнения выполняются письменно, в тетради. После выполнения — сверка с ответами и отметка «Выполнено». Номера сквозные по главе: учитель может задать «упражнения 4–6».</p><p>Сложность — от одной до пяти звёзд: ${STARS(1)} по образцу, ${STARS(2)} простое применение правила, ${STARS(3)} с объяснением, ${STARS(4)} поиск ошибок и разбор, ${STARS(5)} текст, диктант, сочинение.</p></div>
 <div class="chips">${LN.map((n,l)=>`<button class="chipc" data-clf="${l}" aria-pressed="${CLF===l}">${l?l+'. '+n:'Все ('+CL.length+')'}</button>`).join('')}</div>
 <div class="tl">Сложность</div><div class="chips">${[0,1,2,3,4,5].map(s=>`<button class="chipc" data-cls="${s}" aria-pressed="${(S.cls||0)===s}">${s?'★'.repeat(s):'Любая'}</button>`).join('')}</div>
 <div class="prog"><span>Выполнено ${doneN} из ${CL.length}</span></div><div class="bar"><i style="width:${doneN/CL.length*100}%"></i></div>`;
 let cur=0,shown=0;
 CL.filter(e=>(!CLF||e.l===CLF)&&(!S.cls||e.st===S.cls)).forEach(e=>{
  shown++;
  if(e.l!==cur){cur=e.l;h+=`<h3>${cur<last?'Урок '+cur+'. ':''}${LN[cur]}</h3>${c.bookref&&c.bookref[cur]?`<div class="bkhint">Ещё упражнения на эту тему в книге: ${c.bookref[cur]}.</div>`:''}`}
  const dn=S.done[clKey(e)];
  h+=`<section class="clex ${dn?'is':''}" id="cl${e.n}"><div class="clh"><span class="kick">Упражнение ${e.n}</span>${STARS(e.st)}${dn?'<span class="okm">✓ выполнено</span>':''}</div>
  <p class="task">${e.task}</p>${e.obr?(S.easy?`<div class="obr"><b>Образец.</b> ${e.obr}</div>`:`<details class="bkhelp"><summary>Образец</summary><div class="body"><p>${e.obr}</p></div></details>`):''}<p class="cbody">${esc(e.body)}</p>
  <details class="bkhelp"><summary>Ответы</summary><div class="body"><p>${e.key}</p></div></details>
  <button class="pill ${dn?'done':''}" data-cldone="${e.n}">${dn?'✓ Выполнено':'Отметить: выполнено'}</button></section>`;
 });
 if(!shown) h+='<p class="note">Под этот отбор упражнений нет.</p>';
 return h+'</div>';
}

 {id:'pr1',t:'Что такое причастие',

  h:`<p><b>Причастие</b> — особая форма глагола, которая обозначает признак предмета по действию и отвечает на вопросы прилагательного: <i>какой? что делающий? что сделавший?</i> <span class="ex">Бегущий ручей</span> — ручей, который бежит; <span class="ex">прочитанная книга</span> — книга, которую прочитали.</p>
  <p>Причастие соединяет признаки двух частей речи. От глагола оно берёт действие и всё, что с ним связано, от прилагательного — форму и согласование с существительным.</p>
  {{lab:parse}}
  <h4>Признаки глагола</h4>

   <li><b>Переходность и управление</b>, как у глагола: <span class="ex">читающий (что?) книгу, любующийся (чем?) закатом</span>.</li>

  deep:`<p><b>Переход в прилагательные.</b> Причастие может потерять значение действия и стать прилагательным: <span class="ex">блестящий ответ</span> (отличный), <span class="ex">выдающийся учёный</span>, <span class="ex">вызывающее поведение</span>, <span class="ex">подержанные книги</span>. Сравнить: <span class="ex">блестящий на солнце снег</span> — причастие.</p>

  h:`<p><b>Действительные причастия</b> называют признак предмета, который сам совершает действие: <span class="ex">читающий ученик</span> (ученик читает), <span class="ex">распустившийся цветок</span>.</p>

   <tr><td><b>Страдательные прошедшего</b></td><td>инфинитива</td><td><b class="m">-нн-</b>, <b class="m">-енн-</b> (<b class="m">-ённ-</b>), <b class="m">-т-</b></td><td class="ex">прочитанный, увиденный, спасённый; колотый, вымытый, взятый</td></tr>
  </tbody></table></div>
  <p>Суффикс <b class="m">-т-</b> встречается у глаголов на <b class="m">-оть, -уть, -ыть, -ереть</b>, у односложных на <b class="m">-ить</b> и на <b class="m">-нять, -чать, -жать</b> (но: <span class="ex">дать → данный, звать → званный</span>): <span class="ex">колоть → колотый, обуть → обутый, мыть → мытый, стереть → стёртый, бить → битый, взять → взятый</span>.</p>
  <div class="bins bkey"><div class="h">Главное</div><p>Настоящее время — от основы «они …», прошедшее — от основы инфинитива. Затем суффикс: -ущ-/-ющ-, -ащ-/-ящ-, -ем-/-ом-, -им-, -вш-, -ш-, -нн-, -енн-, -т-.</p></div>`,
  lite:`<p>У глагола два «начала», от них и строятся причастия.</p>
  <div class="tblw"><table class="bktbl"><tbody>
   <tr><td>«они <b class="m">чита</b>ют»</td><td>→</td><td class="ex">чита<b class="m">ющ</b>ий, чита<b class="m">ем</b>ый</td></tr>
   <tr><td>«<b class="m">чита</b>ть»</td><td>→</td><td class="ex">чита<b class="m">вш</b>ий, чита<b class="m">нн</b>ый</td></tr>
  </tbody></table></div>
  {{lab:build}}
  <div class="bins bkey"><div class="h">Запомнить</div><p>Сейчас — от «они …». Раньше — от «…ть».</p></div>`,
  easy:'Записать два слова: «они …» и неопределённую форму. От первого строить причастия на -ущ-, -ющ-, -ащ-, -ящ-, -ем-, -им-; от второго — на -вш-, -ш-, -нн-, -енн-, -т-.',
  fix:'Конструктор выше показывает каждый шаг. Стоит собрать в нём все четыре причастия для «читать» и для «нести» — у второго основы разные.'
 },
 {id:'pr4',t:'Гласные в суффиксах причастий',
  hint:'Гласная суффикса настоящего времени — как в окончании «они …»: колеблют → колеблющий, клеят → клеящий. Перед -вш- — как перед -ть. Перед -нн-: -ать/-ять → а/я, иначе е.',
  h:`<h4>Причастия настоящего времени: решает спряжение</h4>
  <p>Гласная в суффиксе зависит от спряжения глагола:</p>
  <ul class="ul"><li><b>I спряжение</b> → <b class="m">-ущ-/-ющ-</b>, <b class="m">-ем-</b> (<b class="m">-ом-</b>): <span class="ex">колеблют → колеблющий, колеблемый; борются → борющийся</span>;</li>
  <li><b>II спряжение</b> → <b class="m">-ащ-/-ящ-</b>, <b class="m">-им-</b>: <span class="ex">клеят → клеящий; видят → видящий, видимый; гонят → гонящий, гонимый</span>.</li></ul>
  <p>Проще всего сверяться с формой 3-го лица множественного числа: гласная суффикса та же, что в окончании. <span class="ex">Они колебл-ют → колебл-ющ-ий; они кле-ят → кле-ящ-ий</span>.</p>
  {{lab:spr}}
  <p>Если окончание безударное, спряжение определяют по инфинитиву. Ко II спряжению относятся глаголы на <b class="m">-ить</b> (кроме <span class="ex">брить, стелить, зиждиться</span>) и одиннадцать исключений: <span class="ex">гнать, держать, дышать, слышать; смотреть, видеть, ненавидеть, обидеть, терпеть, вертеть, зависеть</span>. Остальные — I спряжение.</p>
  <p><b>Исключения:</b> <span class="ex">движимый</span> (от устаревшего «движить»), <span class="ex">брезжущий</span> (от «брезжить»).</p>
  <h4>Перед суффиксом -вш-</h4>
  <p>Сохраняется та же гласная, что перед <b class="m">-ть</b> в инфинитиве: <span class="ex">обидеть → обидевший, клеить → клеивший, посеять → посеявший, надеяться → надеявшийся</span>.</p>
  <h4>Перед суффиксом -нн-</h4>
  <p>Пишется <b class="m">-анн-</b>/<b class="m">-янн-</b>, если глагол оканчивается на <b class="m">-ать/-ять</b>: <span class="ex">написать → написанный, посеять → посеянный, настоять → настоянный</span>. Пишется <b class="m">-енн-</b>/<b class="m">-ённ-</b>, если глагол на <b class="m">-еть, -ить, -ти, -чь</b>: <span class="ex">увидеть → увиденный, застрелить → застреленный, спасти → спасённый, сберечь → сбережённый</span>.</p>
  {{lab:pairs}}
  <p><b>Примечание.</b> От разговорных форм <span class="ex">мерять, мучать</span> причастия пишутся с -енн-, как от литературных <span class="ex">мерить, мучить</span>: <span class="ex">меренный, мученный</span>.</p>
  <div class="bins bkey"><div class="h">Главное</div><p>Настоящее время — гласная как в «они …». Перед -вш- — как перед -ть. Перед -нн-: от -ать/-ять — а/я, от -еть/-ить/-ти/-чь — е.</p></div>`,
  lite:`<p>Три подсказки — и ошибок не будет.</p>
  <ol class="ul"><li><b>-ющ-/-ящ-, -ем-/-им-</b>: сказать «они …» и посмотреть на гласную. Они колебл<b class="m">ю</b>т → колебл<b class="m">ю</b>щий. Они кле<b class="m">я</b>т → кле<b class="m">я</b>щий.</li>
  <li><b>-вш-</b>: гласная как перед «-ть»: обид<b class="m">е</b>ть → обид<b class="m">е</b>вший.</li>
  <li><b>-нн-</b>: если «-ать/-ять» — пишем а/я (посе<b class="m">я</b>ть → посе<b class="m">я</b>нный), если «-ить/-еть» — е (увид<b class="m">е</b>ть → увид<b class="m">е</b>нный).</li></ol>
  {{lab:spr}}
  <div class="bins bkey"><div class="h">Запомнить</div><p>Движимый — исключение.</p></div>`,
  easy:'Сначала сказать «они …» и найти гласную окончания — она же будет в суффиксе причастия.',
  fix:'Если не получается определить спряжение, пройти схему «Спряжение → суффикс»: она показывает каждый шаг для 15 глаголов.'
 },
 {id:'pr5',t:'Полные и краткие причастия. Склонение',
  hint:'Окончание полного причастия проверяется вопросом: (о каком?) о читающем. Краткая форма бывает только у страдательных причастий.',
  h:`<p><b>Полные причастия</b> изменяются по родам, числам и падежам, как прилагательные, и имеют те же окончания: <span class="ex">читающий, читающего, читающему…</span> Окончание проверяется вопросом: <span class="ex">о (каком?) читающем мальчике</span>.</p>
  {{lab:decl}}
  <p><b>Краткие формы</b> есть только у страдательных причастий: <span class="ex">прочитан, прочитана, прочитано, прочитаны</span>. Они изменяются по родам и числам, но не по падежам. В предложении краткое причастие — сказуемое: <span class="ex">Книга прочитана</span>. Полное — определение: <span class="ex">Прочитанная книга лежит на столе</span>.</p>
  <p>В кратких страдательных причастиях пишется одна <b class="m">н</b>: <span class="ex">прочитана, решены</span> (подробно — в главе «Н и НН»).</p>
  <p>У действительных причастий краткой формы нет: нельзя сказать «ученик читающ».</p>
  <div class="bins bkey"><div class="h">Главное</div><p>Полное причастие склоняется, как прилагательное, и в предложении — определение. Краткое есть только у страдательных, не склоняется и в предложении — сказуемое.</p></div>`,
  lite:`<p>Причастие меняет окончания, как прилагательное. Чтобы не ошибиться, нужно задать вопрос: <span class="ex">о (каком?) читающ<b class="m">ем</b> мальчике, с (какой?) прочитанн<b class="m">ой</b> книгой</span>.</p>
  {{lab:decl}}
  <p>Короткие формы (<span class="ex">книга прочитана</span>) бывают только у страдательных причастий, в них одна н.</p>`,
  easy:'Задать вопрос от существительного: окончание причастия будет таким же, как окончание вопроса (каком — читающем).',
  fix:'Таблица склонения выше показывает все окончания. Стоит пройти её для «читающий» и для «прочитанный».'
 },
 {id:'pr6',t:'Правописание причастий',
  hint:'НЕ слитно с полным причастием без зависимых слов; раздельно — при зависимых словах, при противопоставлении и с краткой формой. Ненавидящий — всегда слитно.',
  h:`<h4>НЕ с причастиями</h4>
  <p><b>Слитно</b> пишется не с полными причастиями, у которых нет зависимых слов: <span class="ex">непрочитанная книга, неработающий лифт, незамеченная ошибка</span>. Слитно всегда, если без не слово не употребляется: <span class="ex">ненавидящий, негодующий, недоумевающий</span>.</p>
  <p><b>Раздельно</b>:</p>
  <ul class="ul"><li>при зависимых словах: <span class="ex">не прочитанная мною книга, лифт, не работающий с утра</span>;</li>
  <li>при противопоставлении с союзом «а»: <span class="ex">не прочитанная, а пролистанная книга</span>;</li>
  <li>с краткими причастиями: <span class="ex">книга не прочитана, ошибка не замечена</span>;</li>
  <li>при словах <span class="ex">вовсе, отнюдь, ничуть, далеко</span>: <span class="ex">вовсе не интересующийся</span>.</li></ul>
  {{lab:ne}}
  <h4>Н и НН</h4>
  <p>В полных страдательных причастиях прошедшего времени пишется <b class="m">нн</b> (<span class="ex">прочитанный, решённый</span>), в кратких — <b class="m">н</b> (<span class="ex">прочитана</span>). Как отличить причастие от отглагольного прилагательного (<span class="ex">жареный — зажаренный</span>), подробно разобрано в главе «Н и НН».</p>
  <div><button class="linkbtn" data-ch="nn">Глава «Н и НН» ›</button></div>
  <h4>Ё после шипящих</h4>
  <p>В суффиксах причастий и отглагольных прилагательных под ударением после шипящих пишется <b class="m">ё</b>: <span class="ex">решённый, привлечённый, сожжённый, испечённый, тушёный, копчёный, жжёный</span>.</p>
  <div class="bins bnorm"><div class="h">Норма сегодня · Правила 2006</div><p>Правило о не с причастиями одинаково у Розенталя и в Правилах 2006 года. Не путать не с приставкой <b class="m">недо-</b>: <span class="ex">недосоленный суп, недооценённый талант</span> — это приставка со значением «меньше нормы», она пишется слитно всегда.</p></div>
  <div class="bins bkey"><div class="h">Главное</div><p>Полное без зависимых слов — слитно. Зависимые слова, противопоставление, краткая форма — раздельно. Ненавидящий и подобные — всегда слитно.</p></div>`,
  lite:`<p>Как писать не с причастием — подскажут три вопроса.</p>
  <ol class="ul"><li>Слово <b>короткое</b> (книга не прочитана)? — <b>отдельно</b>.</li>
  <li>Есть <b>слово-помощник</b> рядом (не прочитанная <span class="ex">мною</span>) или <b>«а»</b> (не прочитанная, <span class="ex">а</span> пролистанная)? — <b>отдельно</b>.</li>
  <li>Иначе — <b>слитно</b>: непрочитанная книга.</li></ol>
  {{lab:ne}}
  <div class="bins bkey"><div class="h">Запомнить</div><p>Ненавидящий, негодующий — всегда вместе. После шипящих под ударением в причастиях — ё: решённый.</p></div>`,
  easy:'Проверить три вещи по очереди: краткая форма? зависимое слово или «а»? Если ничего нет — слитно.',
  fix:'Схема «НЕ слитно или раздельно» проводит по шагам. Начать с пар «непрочитанная — не прочитанная мною».'
 },
 {id:'pr7',t:'Причастный оборот',
  hint:'Оборот после определяемого слова — выделяется запятыми; перед ним — нет. Оборот при личном местоимении выделяется всегда.',
  h:`<p><b>Причастный оборот</b> — причастие вместе с зависимыми словами: <span class="ex">дети, [игравшие во дворе]</span>. В предложении весь оборот — одно определение. Слово, к которому относится оборот, называют <b>определяемым</b>.</p>
  <h4>Запятые</h4>
  <ul class="ul">
   <li>Оборот <b>после</b> определяемого слова выделяется запятыми: <span class="ex">Листья, опавшие за ночь, лежали на дорожке.</span></li>
   <li>Оборот <b>перед</b> определяемым словом запятыми не выделяется: <span class="ex">Опавшие за ночь листья лежали на дорожке.</span></li>
   <li>Оборот, относящийся к <b>личному местоимению</b>, выделяется всегда: <span class="ex">Уставшие после похода, мы легли спать. Мы, уставшие после похода, легли спать.</span></li>
   <li>Оборот перед определяемым словом может выделяться, если имеет добавочное значение причины или уступки: <span class="ex">Утомлённые долгой дорогой, путники быстро уснули</span> (= так как были утомлены).</li>
  </ul>
  {{lab:commas}}
  <h4>Типичные ошибки</h4>
  <div class="tblw"><table class="bktbl"><thead><tr><th>Неверно</th><th>Верно</th></tr></thead><tbody>
   <tr><td>Собравшиеся ученики в зале…</td><td>Собравшиеся в зале ученики… / Ученики, собравшиеся в зале, …</td></tr>
   <tr><td>Ученики, сдавшего экзамен, …</td><td>Ученики, сдавшие экзамен, …</td></tr>
   <tr><td>Человек, прочитающий книгу, …</td><td>Человек, который прочитает книгу, …</td></tr>
   <tr><td>Письмо, получившее вчера, …</td><td>Письмо, полученное вчера, …</td></tr>
  </tbody></table></div>
  <p>Оборот нельзя разрывать определяемым словом; причастие согласуется с определяемым словом в роде, числе и падеже; залог причастия должен соответствовать смыслу.</p>
  <div class="bins bkey"><div class="h">Главное</div><p>После слова — запятые, перед словом — без запятых. При местоимении — запятые всегда.</p></div>`,
  lite:`<p>Причастный оборот — причастие с «помощниками»: <span class="ex">опавшие за ночь</span>.</p>
  <ul class="ul"><li>Стоит <b>после</b> слова — запятые: <span class="ex">Листья, опавшие за ночь, лежали.</span></li>
  <li>Стоит <b>перед</b> словом — без запятых: <span class="ex">Опавшие за ночь листья лежали.</span></li>
  <li>Относится к <b>мы, он, она</b> — запятые всегда.</li></ul>
  {{lab:commas}}`,
  easy:'Найти слово, к которому относится оборот. Оборот справа от него — ставим запятые, слева — не ставим.',
  fix:'В схеме «Где запятые» оборот можно поставить перед словом и после него и сразу увидеть, как меняются знаки.'
 }
 ]
};

// гласная в «торты» на позиции 1 и т.п. — индексы букв от нуля
const VOW='аеёиоуыэюяАЕЁИОУЫЭЮЯ';
const BOX=[0,1,3,7,16];
const today=()=>Math.floor(Date.now()/864e5);
const cst=id=>S.cards[id]||{b:0,due:0,seen:0};
function deckStats(d){const c=DECKS[d].cards;let due=0,nw=0,learned=0;const bx=[0,0,0,0,0];
 c.forEach(x=>{const s=S.cards[x.id];if(!s){nw++;return}bx[s.b]++;if(s.due<=today())due++;if(s.b>=3)learned++});return {n:c.length,due,nw,learned,bx}}
let study=null;
function startStudy(d){
 const c=DECKS[d].cards;
 const due=c.filter(x=>S.cards[x.id]&&S.cards[x.id].due<=today());
 const nw=c.filter(x=>!S.cards[x.id]).slice(0,10);
 let q=[...due,...nw];
 if(!q.length) q=[...c].sort(()=>Math.random()-.5).slice(0,10);
 q.sort(()=>Math.random()-.5);
 study={d,q,i:0,shown:false,pick:null,right:0,total:q.length};
}
function grade(ok){
 const card=study.q[study.i];const s=cst(card.id);
 s.b=ok?Math.min(4,s.b+1):0; s.due=today()+(ok?BOX[s.b]:0); s.seen=(s.seen||0)+1; S.cards[card.id]=s; save();
 if(ok) study.right++; else study.q.push(card);
 study.i++; study.shown=false; study.pick=null; render();
}

 nesov:{t:'Несовершенный вид',d:'Вид глагола, который называет действие без указания на его завершение и отвечает на вопрос «что делать?». Только от таких глаголов образуются причастия настоящего времени.',ex:'читать → читающий, читаемый',cat:'Морфология',f:'несовершенн[а-яё]* вид(?:а|у|ом|е)?',at:'pr2',see:['sov','vid','nast']},
 nul:{t:'Нулевое окончание',d:'Окончание, которое не выражено ни звуком, ни буквой, но показывает форму слова.',ex:'лимон, конь, (книга) прочитан',cat:'Морфемика и словообразование',f:'нулев[а-яё]* окончани[а-яё]*',at:'',see:['okonch','osnova']},
 obosob:{t:'Обособление',d:'Выделение части предложения запятыми на письме и интонацией в речи. Причастный оборот обособляется, если стоит после определяемого слова или относится к личному местоимению.',ex:'Листья, опавшие за ночь, лежали на дорожке. Уставшие после похода, мы легли спать.',cat:'Синтаксис и пунктуация',f:'обособ[а-яё]*|выделя(?:ется|ются|ться) запят[а-яё]*',at:'pr7',see:['prich_ob','zapyat','opr_slovo','dobav']},
 obst:{t:'Обстоятельство',d:'Второстепенный член предложения, который показывает, как, где, когда или почему совершается действие. Часто выражается наречием.',ex:'Он отвечал обдуманно. Листья лежали на дорожке.',cat:'Синтаксис и пунктуация',f:'обстоятельств[а-яё]*',at:'',see:['narech','chlen','deepr']},
 odnokor:{t:'Однокоренные слова',d:'Слова с одним и тем же корнем и близким значением.',ex:'жарить, жареный, зажаренный, жаркое',cat:'Морфемика и словообразование',f:'однокоренн[а-яё]*',at:'',see:['koren','ishod']},
 okonch:{t:'Окончание',d:'Изменяемая часть слова, которая показывает его связь с другими словами. Окончание полного причастия проверяют вопросом от существительного.',ex:'о (каком?) читающем мальчике; с (какой?) прочитанной книгой',cat:'Морфемика и словообразование',f:'окончани[а-яё]*',at:'pr5',see:['osnova','nul','sklon']},
 opred:{t:'Определение',d:'Второстепенный член предложения, который обозначает признак предмета и отвечает на вопросы «какой? чей?». Полное причастие и причастный оборот в предложении — определение.',ex:'прочитанная книга; листья, опавшие за ночь',cat:'Синтаксис и пунктуация',f:'определени[а-яё]*',at:'pr1',see:['opr_slovo','prich_ob','chlen']},
 opr_slovo:{t:'Определяемое слово',d:'Слово, к которому относится определение или причастный оборот. С ним причастие согласуется, и от него задают вопрос «какой?».',ex:'Листья (какие?), опавшие за ночь, … — определяемое слово «листья»',cat:'Синтаксис и пунктуация',f:'определяем(?:ое|ого|ому|ым|ом|ые|ых|ыми)',at:'pr7',see:['opred','prich_ob','obosob']},
 orfogramma:{t:'Орфограмма',d:'Место в слове, где можно ошибиться и где написание выбирают по правилу.',ex:'н или нн в «жаре_ый»; гласная в «колебл_щий»',cat:'Орфография',f:'орфограмм[а-яё]*',at:'',see:['orfogr','pravop']},
 orfogr:{t:'Орфография',d:'Система правил написания слов и раздел науки о языке, который эти правила изучает.',ex:'правописание н и нн, не с причастиями, гласных в суффиксах',cat:'Орфография',f:'орфографи[а-яё]*',at:'',see:['orfogramma','pravop','punkt']},
 osnova:{t:'Основа',d:'Часть слова без окончания и постфикса. Если основа оканчивается на н, а суффикс тоже начинается с н, получается нн.',ex:'лимон + н → лимонный; чита-ть: основа инфинитива чита-',cat:'Морфемика и словообразование',f:'основ(?:а|ы|е|у|ой|ам|ами|ах)?',at:'pr3',see:['osn_nast','osn_inf','okonch','styk']},
 osn_inf:{t:'Основа инфинитива',d:'Часть инфинитива без -ть (-ти). От неё образуются причастия прошедшего времени.',ex:'чита-ть → чита-вший, чита-нный; увиде-ть → увиде-вший',cat:'Морфемика и словообразование',f:'основ[а-яё]* инфинитива',at:'pr3',see:['osn_nast','prosh','infin']},
 osn_nast:{t:'Основа настоящего времени',d:'Основа глагола, которую легко найти, отбросив окончание в форме «они …». От неё образуются причастия настоящего времени.',ex:'они чита-ют → чита-ющий; они нес-ут → нес-омый',cat:'Морфемика и словообразование',f:'основ[а-яё]* настоящего времени',at:'pr3',see:['osn_inf','nast','sprya']},
 otgl:{t:'Отглагольное прилагательное',d:'Прилагательное, образованное от глагола. В отличие от причастия, оно называет постоянный признак без действия и пишется с одной н.',ex:'жареная рыба (но: зажаренная на огне — причастие); варёный, кованый',cat:'Морфология',f:'отглагольн[а-яё]*',at:'nn2',see:['prich','otym','glag']},
 otym:{t:'Отымённое прилагательное',d:'Прилагательное, образованное от существительного. Сколько в нём писать н, зависит от суффикса.',ex:'кожа → кожаный, клюква → клюквенный, лимон → лимонный',cat:'Морфология',f:'отым[её]нн[а-яё]*',at:'nn1',see:['pril','suff','otgl','sush']},
 padezh:{t:'Падеж',d:'Форма имени, которая показывает его связь с другими словами в предложении. Падежей шесть: именительный, родительный, дательный, винительный, творительный, предложный.',ex:'читающего ученика (Р. п.), читающими детьми (Т. п.)',cat:'Морфология',f:'падеж(?:а|у|ом|е|и|ей|ам|ами|ах)?',at:'',see:['sklon','rod','chislo']},
 perekhod:{t:'Переход в другую часть речи',d:'Случай, когда слово теряет прежние признаки и начинает употребляться как слово другой части речи.',ex:'блестящий ответ (прилагательное); учащиеся, заведующий (существительные)',cat:'Морфология',f:'переход(?:а|ом|е)? в (?:прилагательн|существительн)[а-яё]*',at:'pr1',see:['prich','pril','sush']},
 perekh:{t:'Переходный глагол',d:'Глагол, который может управлять существительным в винительном падеже без предлога. Только от переходных глаголов образуются страдательные причастия.',ex:'читать (что?) книгу → читаемая книга',cat:'Морфология',f:'переходн[а-яё]*',at:'pr2',see:['neperekh','strad','upravl']},
 povtor:{t:'Повтор',d:'Сочетание из одного слова, взятого дважды, во второй раз — с приставкой пере-. Обозначает высокую степень качества; обе части пишутся с одной н.',ex:'глаженые-переглаженые брюки, штопаные-перештопаные носки',cat:'Морфемика и словообразование',f:'повтор(?:ы|ах|ов|ами)?',at:'nn3',see:['defis','otgl','pref']},
 podl:{t:'Подлежащее',d:'Главный член предложения, который называет, о ком или о чём говорится. Отвечает на вопросы «кто?» или «что?».',ex:'Задача решена. Мы легли спать.',cat:'Синтаксис и пунктуация',f:'подлежащ(?:ее|его|ему|им|ем|ие|их|ими)',at:'',see:['skaz','chlen','predl']},
 poln:{t:'Полная форма',d:'Основная форма прилагательного или причастия, которая изменяется по родам, числам и падежам и в предложении обычно бывает определением.',ex:'прочитанная книга, длинная дорога',cat:'Морфология',f:'полн[а-яё]* форм[а-яё]*|полн[а-яё]* и кратк[а-яё]* форм[а-яё]*',at:'pr5',see:['krat','opred','sklon']},
 postf:{t:'Постфикс',d:'Часть слова, которая стоит после окончания. В глаголах и причастиях это -ся (-сь); он делает слово возвратным.',ex:'строящий-ся, умывший-ся',cat:'Морфемика и словообразование',f:'постфикс[а-яё]*',at:'pr1',see:['vozvr','suff','okonch']},
 pravop:{t:'Правописание',d:'Написание слов по правилам орфографии; так называют и само правило.',ex:'правописание причастий, правописание н и нн',cat:'Орфография',f:'правописани[а-яё]*',at:'pr6',see:['orfogr','orfogramma']},
 predlog:{t:'Предлог',d:'Служебная часть речи, которая связывает существительное или местоимение с другими словами.',ex:'жаренная на масле; о читающем мальчике; с книгой',cat:'Морфология',f:'предлог(?:а|у|ом|е|и|ов|ами|ах)?',at:'',see:['sluzh','padezh','soyuz']},
 predl:{t:'Предложение',d:'Слово или несколько слов, которые выражают законченную мысль. В конце предложения ставится точка, вопросительный или восклицательный знак.',ex:'Книга прочитана. Листья лежали на дорожке.',cat:'Синтаксис и пунктуация',f:'предложени[а-яё]*',at:'',see:['chlen','podl','skaz']},
 priznak:{t:'Признак предмета',d:'Свойство предмета: цвет, качество, материал, принадлежность. Прилагательное называет постоянный признак, причастие — признак по действию.',ex:'синий (просто цвет) — синеющий (который синеет)',cat:'Морфология',f:'признак[а-яё]* предмет[а-яё]*',at:'pr1',see:['pril','prich','opred']},
 pril:{t:'Прилагательное',d:'Самостоятельная часть речи, которая обозначает признак предмета и отвечает на вопросы «какой? чей?». Изменяется по родам, числам и падежам.',ex:'кожаный, лимонный, длинный, красивый',cat:'Морфология',f:'прилагательн[а-яё]*',at:'',see:['otym','otgl','prich','krpril']},
 pref:{t:'Приставка',d:'Часть слова перед корнем, которая служит для образования новых слов. В слове от глагола любая приставка, кроме не-, указывает на причастие и две н.',ex:'за-жаренный, про-читанный; но: не-крашеный',cat:'Морфемика и словообразование',f:'приставк[а-яё]*|приставочн[а-яё]*',at:'nn2',see:['koren','suff','otgl']},
 prich:{t:'Причастие',d:'Особая форма глагола, которая обозначает признак предмета по действию и отвечает на вопросы «какой? что делающий? что сделавший?». Сочетает признаки глагола и прилагательного.',ex:'бегущий ручей (который бежит), прочитанная книга (которую прочитали)',cat:'Морфология',f:'причасти[а-яё]*',at:'pr1',see:['deepr','pril','glag','prich_ob']},
 prich_ob:{t:'Причастный оборот',d:'Причастие вместе с зависимыми словами. В предложении весь оборот — одно определение.',ex:'дети, игравшие во дворе; опавшие за ночь листья',cat:'Синтаксис и пунктуация',f:'причастн[а-яё]* оборот[а-яё]*',at:'pr7',see:['prich','dep','obosob','opr_slovo']},
 proizv:{t:'Производное слово',d:'Слово, образованное от другого слова с помощью приставки, суффикса или иным способом.',ex:'кожаный (от «кожа»), воспитанник (от «воспитанный»)',cat:'Морфемика и словообразование',f:'производн[а-яё]* слов[а-яё]*',at:'',see:['ishod','slovoobr']},
 ishod:{t:'Производящее слово',d:'Слово, от которого образовано другое слово; его называют также исходным. С него начинается проверка н и нн.',ex:'кожа → кожаный; неожиданный → неожиданно; гостиный → гостиная',cat:'Морфемика и словообразование',f:'исходн[а-яё]* слов[а-яё]*|производящ[а-яё]* слов[а-яё]*',at:'nn1',see:['proizv','slovoobr','odnokor']},
 protivop:{t:'Противопоставление',d:'Сочетание, в котором одно отрицается, а другое утверждается, обычно с союзом «а». При противопоставлении не с причастием пишется раздельно.',ex:'не прочитанная, а пролистанная книга',cat:'Синтаксис и пунктуация',f:'противопоставлени[а-яё]*',at:'pr6',see:['ne_prich','soyuz','razdelno']},
 prosh:{t:'Прошедшее время',d:'Время действия, которое было до момента речи. Причастия прошедшего времени образуются от основы инфинитива.',ex:'читавший, нёсший, прочитанный, взятый',cat:'Морфология',f:'прошедш[а-яё]* врем(?:я|ени|енем)',at:'pr2',see:['nast','osn_inf','bud']},
 punkt:{t:'Пунктуация',d:'Правила расстановки знаков препинания, а также раздел науки о языке, который их изучает.',ex:'запятые при причастном обороте',cat:'Синтаксис и пунктуация',f:'пунктуаци[а-яё]*',at:'',see:['znaki','zapyat','sintaksis']},
 morf_sostav:{t:'Разбор по составу',d:'Выделение в слове всех его частей: приставки, корня, суффикса, окончания, постфикса.',ex:'за-жар-енн-ый, вы-мыт-ый, строя-щ-ий-ся',cat:'Морфемика и словообразование',f:'разбор[а-яё]* (?:слова )?по составу|морфемн[а-яё]* разбор[а-яё]*',at:'',see:['morfema','koren','suff']},
 razgovor:{t:'Разговорная форма',d:'Форма слова, привычная в непринуждённой устной речи, но не соответствующая строгой литературной норме.',ex:'мерять, мучать (литературные: мерить, мучить)',cat:'Общие понятия',f:'разговорн[а-яё]*',at:'',see:['norma','lityaz']},
 razdelno:{t:'Раздельное написание',d:'Написание слов отдельно друг от друга, через пробел.',ex:'не прочитанная мною книга; книга не прочитана',cat:'Орфография',f:'раздельн(?:о|ое|ого|ому|ым|ом)',at:'pr6',see:['slitno','defis','ne_prich']},
 razryad:{t:'Разряд',d:'Группа слов одной части речи, объединённых общим признаком. Причастия делятся на четыре разряда по залогу и времени.',ex:'действительные настоящего времени: читающий; страдательные прошедшего: прочитанный',cat:'Морфология',f:'разряд(?:а|у|ом|е|ы|ов|ам|ами|ах)?',at:'pr2',see:['zalog','vremya','dejst','strad']},
 rod:{t:'Род',d:'Признак, по которому слова делятся на мужской, женский и средний род. У существительного род постоянный, а прилагательное и причастие меняют род вслед за существительным.',ex:'читающий мальчик, читающая девочка, читающее дитя',cat:'Морфология',f:'(?:мужск|женск|средн)[а-яё]* род(?:а|у|ом|е)?',at:'',see:['chislo','padezh','soglas']},
 samost:{t:'Самостоятельная часть речи',d:'Часть речи, слова которой называют предметы, признаки, действия или количество и бывают членами предложения.',ex:'существительное, прилагательное, глагол, наречие',cat:'Морфология',f:'самостоятельн[а-яё]* част[а-яё]* речи',at:'pr1',see:['chast_rechi','sluzh']},
 sintaksis:{t:'Синтаксис',d:'Раздел науки о языке, который изучает словосочетания и предложения.',ex:'причастный оборот и запятые при нём',cat:'Общие понятия',f:'синтаксис[а-яё]*',at:'',see:['predl','slovosoch','punkt']},
 skaz:{t:'Сказуемое',d:'Главный член предложения, который сообщает, что делает подлежащее, каково оно или что с ним происходит. Краткое причастие в предложении — сказуемое.',ex:'Задача решена. Дорога длинна. Ученики собрались.',cat:'Синтаксис и пунктуация',f:'сказуем[а-яё]*',at:'pr5',see:['podl','krprich','chlen']},
 sklon:{t:'Склонение',d:'Изменение слова по падежам и числам. Полное причастие склоняется так же, как прилагательное.',ex:'читающий, читающего, читающему, о читающем',cat:'Морфология',f:'склонени[а-яё]*|склоня(?:ется|ются)',at:'pr5',see:['padezh','okonch','poln']},
 slitno:{t:'Слитное написание',d:'Написание частей слова вместе, без пробела и дефиса.',ex:'непрочитанная книга, незваный, ненавидящий',cat:'Орфография',f:'слитн(?:о|ое|ого|ому|ым|ом)',at:'pr6',see:['razdelno','defis','ne_prich']},
 slovoobr:{t:'Словообразование',d:'Образование новых слов от уже существующих, а также раздел науки о языке, который это изучает.',ex:'дружина → дружинник; жарить → жареный',cat:'Морфемика и словообразование',f:'словообразовани[а-яё]*|словообразовательн[а-яё]*',at:'',see:['ishod','proizv','morfema']},
 slovosoch:{t:'Словосочетание',d:'Два или больше самостоятельных слова, связанных по смыслу и грамматически: одно из них главное, другое зависимое.',ex:'читаемая книга, мощённая булыжником, любующийся закатом',cat:'Синтаксис и пунктуация',f:'словосочетани[а-яё]*',at:'',see:['glavslovo','dep','soglas','upravl']},
 slozhn:{t:'Сложное слово',d:'Слово, в котором два корня или больше.',ex:'гладкокрашеный, домотканый, свежемороженый',cat:'Морфемика и словообразование',f:'сложн(?:ое|ого|ому|ым|ом|ые|ых|ыми) слов[а-яё]*',at:'nn3',see:['koren','slozhnosokr']},
 slozhnosokr:{t:'Сложносокращённое слово',d:'Слово, составленное из сокращённых частей нескольких слов.',ex:'юннат (юный натуралист), вуз, спецкор',cat:'Морфемика и словообразование',f:'сложносокращ[её]нн[а-яё]*',at:'nn1',see:['slozhn','styk']},
 sluzh:{t:'Служебная часть речи',d:'Часть речи, слова которой ничего не называют и не бывают членами предложения: они связывают слова или добавляют оттенки смысла.',ex:'предлоги, союзы, частицы',cat:'Морфология',f:'служебн[а-яё]* част[а-яё]* речи',at:'',see:['chast_rechi','predlog','soyuz','chastica']},
 sov:{t:'Совершенный вид',d:'Вид глагола, который обозначает законченное действие или его результат и отвечает на вопрос «что сделать?». Причастие от глагола совершенного вида пишется с нн даже без приставки.',ex:'бросить → брошенный, решить → решённый, купить → купленный',cat:'Морфология',f:'совершенн[а-яё]* вид(?:а|у|ом|е)?',at:'pr2',see:['nesov','vid','prich']},
 soglasn:{t:'Согласный звук',d:'Звук, при произнесении которого воздух встречает во рту преграду: губы, зубы или язык.',ex:'н, т, ш, ж; нёс-ший: после согласной суффикс -ш-',cat:'Общие понятия',f:'согласн(?:ый|ая|ое|ые|ого|ой|ому|ую|ым|ыми|ых|ом)',at:'',see:['glasn','shipyash','zvuk']},
 soglas:{t:'Согласование',d:'Связь, при которой зависимое слово ставится в том же роде, числе и падеже, что и главное. Так причастие и прилагательное связаны с существительным.',ex:'читающего ученика, читающей девочке, читающими детьми',cat:'Синтаксис и пунктуация',f:'согласовани[а-яё]*|согласу(?:ется|ются|ющ[а-яё]*)',at:'pr1',see:['upravl','rod','chislo','padezh']},
 soyuz:{t:'Союз',d:'Служебная часть речи, которая связывает однородные члены предложения или части сложного предложения.',ex:'и, а, но, потому что; не прочитанная, а пролистанная',cat:'Морфология',f:'союз(?:а|у|ом|е|ы|ов|ами|ах)?',at:'',see:['sluzh','protivop','chastica']},
 sprya:{t:'Спряжение',d:'Изменение глагола по лицам и числам; так же называют две группы глаголов — I и II спряжение — с разными личными окончаниями. От спряжения зависит гласная в суффиксе причастия настоящего времени.',ex:'I: колеблют → колеблющий; II: клеят → клеящий, видят → видимый',cat:'Морфология',f:'спряжени[а-яё]*',at:'pr4',see:['gl_iskl','osn_nast','litso','okonch']},
 strad:{t:'Страдательное причастие',d:'Причастие, которое называет признак предмета, на который направлено чужое действие. Образуется только от переходных глаголов.',ex:'читаемая учеником книга, построенный дом',cat:'Морфология',f:'страдательн[а-яё]*',at:'pr2',see:['dejst','zalog','perekh','krprich']},
 styk:{t:'Стык морфем',d:'Место, где встречаются две части слова. Если основа оканчивается на н, а суффикс начинается с н, на стыке пишется нн.',ex:'лимон + н → лимонный; дружина + ник → дружинник',cat:'Морфемика и словообразование',f:'стык(?:а|е|ом|и|ах)?',at:'nn1',see:['osnova','suff','morfema']},
 suff:{t:'Суффикс',d:'Часть слова после корня, которая служит для образования новых слов или форм. В прилагательных и причастиях от суффикса зависит, сколько писать н.',ex:'кож-ан-ый, клюкв-енн-ый, марин-ова-нный, чита-ющ-ий',cat:'Морфемика и словообразование',f:'суффикс[а-яё]*',at:'nn1',see:['pref','koren','suff_prich']},
 suff_prich:{t:'Суффиксы причастий',d:'Суффиксы, с помощью которых причастия образуются от глагола: -ущ-/-ющ-, -ащ-/-ящ-, -ем-/-ом-, -им-, -вш-, -ш-, -нн-, -енн-, -т-.',ex:'несущий, видимый, читавший, нёсший, прочитанный, взятый',cat:'Морфемика и словообразование',f:'суффикс[а-яё]* причасти[а-яё]*',at:'pr3',see:['suff','sprya','osn_nast','osn_inf']},
 sush:{t:'Существительное',d:'Самостоятельная часть речи, которая обозначает предмет и отвечает на вопросы «кто? что?». Имеет род, изменяется по числам и падежам.',ex:'кожа, лимон, дружинник, мороженое',cat:'Морфология',f:'существительн[а-яё]*',at:'nn6',see:['pril','rod','padezh']},
 udar:{t:'Ударение',d:'Выделение одного слога в слове голосом: он звучит сильнее и дольше остальных. На выбор н или нн в прилагательных ударение не влияет.',ex:'ржано́й, торфяно́й — одна н, как и безударные кожаный, глиняный',cat:'Общие понятия',f:'ударени[а-яё]*|ударн(?:ый|ая|ое|ые|ого|ой|ом|ых|ым)',at:'',see:['bezud','glasn','shipyash']},
 upravl:{t:'Управление',d:'Связь, при которой главное слово требует, чтобы зависимое стояло в определённом падеже. Причастие управляет так же, как глагол, от которого оно образовано.',ex:'читающий (что?) книгу; любующийся (чем?) закатом',cat:'Синтаксис и пунктуация',f:'управлени[а-яё]*',at:'pr1',see:['soglas','perekh','padezh']},
 ustar:{t:'Устаревшее слово',d:'Слово или форма, которые вышли из живого употребления, но иногда сохраняются в образованных от них словах.',ex:'«движить» → движимый',cat:'Общие понятия',f:'устаревш[а-яё]*',at:'',see:['norma','iskl']},
 ustoich:{t:'Устойчивое сочетание',d:'Сочетание слов с цельным значением, которое не составляют каждый раз заново, а берут из языка готовым.',ex:'названый брат, посажёный отец, писаная красавица, Прощёное воскресенье',cat:'Общие понятия',f:'устойчив[а-яё]* сочетани[а-яё]*',at:'nn3',see:['znach','otgl']},
 forma:{t:'Форма слова',d:'Вариант одного и того же слова, который отличается окончанием (иногда суффиксом) и выражает грамматическое значение.',ex:'читающий, читающего, читающими — формы одного причастия',cat:'Морфология',f:'форм[а-яё]* слов(?:а|о)',at:'',see:['okonch','sklon','gram_priznak']},
 chastica:{t:'Частица',d:'Служебная часть речи, которая добавляет слову или предложению оттенок значения: отрицание, вопрос, усиление. Не — отрицательная частица.',ex:'книга не прочитана; вовсе не интересующийся',cat:'Морфология',f:'частиц(?:а|ы|е|у|ей|ами|ам|ах)?',at:'',see:['sluzh','ne_prich','soyuz']},
 chast_rechi:{t:'Часть речи',d:'Большая группа слов с общим значением, общими вопросами и грамматическими признаками. Части речи бывают самостоятельные и служебные.',ex:'существительное, прилагательное, глагол, наречие; предлог, союз, частица',cat:'Морфология',f:'част(?:ь|и|ей|ям|ями|ях) речи',at:'pr1',see:['samost','sluzh','gram_priznak']},
 cheredov:{t:'Чередование',d:'Замена одного звука другим в одной и той же части слова в разных словах или формах.',ex:'бросить — брошенный (с/ш), купить — купленный (п/пл)',cat:'Морфемика и словообразование',f:'чередовани[а-яё]*',at:'',see:['koren','osnova']},
 chislo:{t:'Число',d:'Признак, который показывает, один предмет или несколько. Число бывает единственное и множественное.',ex:'читающий — читающие; книга — книги',cat:'Морфология',f:'(?:единственн|множественн)[а-яё]* числ(?:о|а|у|ом|е)',at:'',see:['rod','padezh','soglas']},
 chlen:{t:'Член предложения',d:'Слово или сочетание слов, которое выполняет в предложении определённую роль. Главные члены — подлежащее и сказуемое, второстепенные — определение, дополнение и обстоятельство.',ex:'Прочитанная (опр.) книга (подл.) лежит (сказ.) на столе (обст.).',cat:'Синтаксис и пунктуация',f:'член[а-яё]* предложени[а-яё]*',at:'',see:['podl','skaz','opred','dop']},
 shipyash:{t:'Шипящие',d:'Согласные ж, ш, ч, щ. После них в суффиксах причастий и отглагольных прилагательных под ударением пишется ё.',ex:'решённый, сожжённый, испечённый, тушёный, копчёный',cat:'Орфография',f:'шипящ(?:ие|их|им|ими)',at:'pr6',see:['soglasn','udar','suff']},
 norma:{t:'Языковая норма',d:'Принятое в литературном языке правило произношения, написания или употребления слова. Нормы записаны в словарях и справочниках, например в Правилах 2006 года.',ex:'правильно: тот, кто прочитает; ошибка: «прочитающий»',cat:'Общие понятия',f:'языков[а-яё]* норм[а-яё]*|литературн[а-яё]* норм[а-яё]*',at:'',see:['lityaz','orfogr','razgovor']}
};

const CYR='а-яёА-ЯЁ';
const GL=Object.entries(GLOSS).map(([id,g])=>({id,...g,re:g.f?new RegExp('(^|[^'+CYR+'])('+g.f+')(?![' + CYR + '])','i'):null}));
GL.sort((a,b)=>b.t.length-a.t.length);
const GLA=[...GL].sort((a,b)=>a.t.localeCompare(b.t,'ru'));
const LES={};Object.values(CHAPTERS).forEach(ch=>ch.lessons.forEach((l,i)=>{LES[l.id]={ch:ch.id,i,t:l.t,n:i+1}}));
const lesName=id=>{const L=LES[id];if(!L)return '';const m=chById(L.ch);return `${m?m.t:''} · урок ${L.n}`};
const strip=h=>String(h).replace(/<[^>]+>/g,' ').replace(/\[\[\w+\|([^\]]+)\]\]/g,'$1').replace(/\{\{[^}]+\}\}/g,' ');
// где встречается каждый термин
const TUSE={};GL.forEach(g=>{TUSE[g.id]=[];if(!g.re)return;Object.values(CHAPTERS).forEach(ch=>ch.lessons.forEach(l=>{
 const txt=strip(l.h+' '+(l.deep||''));if(g.re.test(txt)||new RegExp('\\[\\['+g.id+'\\|').test(l.h))TUSE[g.id].push(l.id)}))});
// разделы уроков (h4) для оглавления
const secs=l=>[...String(l.h).matchAll(/<h4>([^<]+)<\/h4>/g)].map((m,k)=>({id:l.id+'-s'+k,t:m[1].trim()}));
const h4ids=(h,lid)=>{let k=0;return h.replace(/<h4>/g,()=>`<h4 id="${lid}-s${k++}">`)};

// пост-обработка текста главы: термины и перекрёстные ссылки
const SKIP='.lab,button,h4,.bklh,.ex,.m,summary,.prac,.top,input,label,thead,.bkldone,.bpn,.xref,mark';
function enhance(root,chId){
 const ch=CHAPTERS[chId];if(!ch||!root)return;
 root.querySelectorAll('.bkles').forEach(sec=>{
  const linked=new Set([...sec.querySelectorAll('.bterm')].map(b=>b.dataset.term));
  const nodes=()=>{const out=[];const w=document.createTreeWalker(sec,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest(SKIP)||!n.nodeValue.trim()?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});let n;while(n=w.nextNode())out.push(n);return out};
  // ссылки «в уроке 6», «в главе «Н и НН»»
  nodes().forEach(n=>{
   const re=/(урок[аеуи]?|уроках|уроками)\s(\d)(?:\s?[–-]\s?(\d))?|глав[аеуыой]{1,2}\s«([^»]+)»/g;
   const s=n.nodeValue;if(!re.test(s))return;re.lastIndex=0;
   const frag=document.createDocumentFragment();let last=0,m;
   while(m=re.exec(s)){
    let btn=null;
    if(m[2]){const L=ch.lessons[+m[2]-1];if(L){btn=document.createElement('button');btn.className='xref';btn.dataset.jump=L.id;btn.title=L.t}}
    else{const c=ALLCH.find(c=>c.t===m[4]);if(c&&CHAPTERS[c.id]&&c.id!==chId){btn=document.createElement('button');btn.className='xref';btn.dataset.ch=c.id}}
    if(!btn)continue;
    frag.append(s.slice(last,m.index));btn.textContent=m[0];frag.append(btn);last=m.index+m[0].length;
   }
   if(last){frag.append(s.slice(last));n.replaceWith(frag)}
  });
  // первое упоминание каждого термина в уроке
  GL.forEach(g=>{
   if(!g.re||linked.has(g.id))return;
   for(const n of nodes()){const m=g.re.exec(n.nodeValue);if(!m)continue;
    const st=m.index+m[1].length,en=st+m[2].length,s=n.nodeValue;
    const b=document.createElement('button');b.className='bterm';b.dataset.term=g.id;b.textContent=s.slice(st,en);
    n.replaceWith(s.slice(0,st),b,s.slice(en));linked.add(g.id);break}
  });
 });
}
