  body:'1. Вот мы и свернули налево и кое-как, после многих хлопот, добрались до скудного приюта состоящего из двух саклей сложе..ых из плит и булыжника и обведё..ых такою же стеною; оборва..ые хозяева приняли нас радушно. 2. В одном из домов слободки построе..ом на краю обрыва заметил я чрезвычайное освещение… 3. Я слез и подкрался к окну; неплотно притворё..ый ставень позволил мне видеть пирующих и расслышать их слова. (М. Ю. Лермонтов, «Герой нашего времени») 4. Мы проходили через селения разорё..ые бунтовщиками и поневоле отбирали у бедных жителей то, что успели они спасти. (А. С. Пушкин, «Капитанская дочка») Пояснения: сакля — горское жилище; слобода, слободка — пригород, посёлок; пирующие — те, кто пирует; разорить — опустошить, разграбить.'},
 {n:90,l:7,st:4,task:'(В формате ОГЭ/ЕГЭ, для 8–11 классов.) Укажите все цифры, на месте которых пишется НН. Выполнить задание для каждого предложения и записать ответ цифрами без пробелов. Затем объяснить написание каждого слова.',
  body:'1. Ю(1)ый художник показал нам рисунки, выполне(2)ые карандашом на тонкой льня(3)ой бумаге, и несколько картин, писа(4)ых маслом. 2. Тиши(1)а была необыкнове(2)ой: в ледя(3)ом воздухе застыли осе(4)ие листья, а дальний лес казался нарисова(5)ым. 3. Сбивчивые объяснения гостя были прерва(1)ы: в комнату вошёл дежурный с запечата(2)ым конвертом, и все взгляды мгнове(3)о обратились к нему. 4. Я посмотрелся в зеркало; тусклая бледность покрывала лицо моё, хранившее следы мучительной бессо(1)ицы; но глаза, хотя окружё(2)ые коричневою тенью, блистали гордо и неумолимо. (М. Ю. Лермонтов, «Герой нашего времени»)'},
 {n:91,l:7,st:4,task:'(В формате ОГЭ/ЕГЭ, для 8–11 классов.) Укажите варианты ответов, в которых во всех словах одного ряда пропущена одна буква Н. Записать номера ответов, затем вставить буквы во все слова и объяснить, почему остальные ряды не подходят.',
  body:'1) льня..ая скатерть, соловьи..ая трель, румя..ые щёки; 2) мочё..ые яблоки, вяза..ая шапка, вяле..ая рыба; 3) клюкве..ый морс, жела..ый гость, лишё..ый наследства; 4) ошибка исправле..а, поля засея..ы, некоше..ый луг; 5) мгнове..о, нечая..о, рья..о; 6) варе..ики, пря..ики, смышлё..ость; 7) утре..яя прохлада, лимо..ый сок, назва..ый брат.'},
 {n:92,l:7,st:4,task:'(В формате ОГЭ/ЕГЭ, для 8–11 классов.) Прочитайте текст и выполните задания. 1) Укажите варианты ответов, в которых дано верное объяснение написания выделенного слова. 2) Из предложения 4 выпишите причастие, в котором нет суффикса с н (суффикс -т-). 3) Из предложения 5 выпишите прилагательное, образованное от существительного с помощью суффикса -енн-. 4) Из предложения 5 выпишите краткие прилагательные и объясните, почему в них одна н.',
  body:'(1) Графиня стала раздеваться перед зеркалом. (2) Откололи с неё чепец, УКРАШЕННЫЙ розами; сняли НАПУДРЕННЫЙ парик с её седой и плотно ОСТРИЖЕННОЙ головы. (3) Булавки дождём сыпались около неё. (4) Жёлтое платье, шитое серебром, упало к её распухлым ногам. (5) Германн был свидетелем отвратительных таинств её туалета; наконец графиня осталась в спальной кофте и ночном чепце: в этом наряде, более СВОЙСТВЕННОМ её старости, она казалась менее УЖАСНА и безобразна. (А. С. Пушкин, «Пиковая дама») Варианты к заданию 1: 1) УКРАШЕННЫЙ (розами) — в полном страдательном причастии с зависимым словом пишется НН. 2) НАПУДРЕННЫЙ — в прилагательном, образованном от существительного с помощью суффикса -ЕНН-, пишется НН. 3) СВОЙСТВЕННОМ — в прилагательном, образованном от существительного с помощью суффикса -ЕНН-, пишется НН. 4) ОСТРИЖЕННОЙ — в отглагольном прилагательном без приставки пишется НН. 5) УЖАСНА — в кратком прилагательном пишется столько же Н, сколько в полной форме. Пояснения: таинства туалета — здесь: долгое переодевание; распухлые — распухшие.'},
 {n:89,l:7,st:5,os:'работа с текстом',task:'Прочитать отрывок. 1) Переписать, вставляя пропущенные буквы. 2) Выписать все слова с пропусками и распределить их по правилам: прилагательные от существительных (суффикс -ян-, слово-исключение, н в корне, суффикс -н- после основы не на н); причастия; краткие формы. 3) Сравнить слова «ледя..ые», «серебря..ые» и «оловя..ая»: объяснить, почему написание различается. 4) Объяснить написание слова «тёмно-зелё..ой»: влияет ли на него то, что слово сложное? 5) Найти причастные обороты, выписать их вместе с определяемыми словами и объяснить запятые. 6) Определить, какой формой являются слова «ненуже..» и «ненуж..о», и объяснить их написание. 7) Разобрать по составу слова «настоя..ой» и «прониза..ых».',
  body:'День был светлый; в два окна, сквозь ледя..ые стёкла, смотрели косые лучи зимнего солнца; на столе, убра..ом к обеду, тускло блестела оловя..ая посуда, графин с рыжим квасом и другой с тёмно-зелё..ой дедовой водкой, настоя..ой на буквице и зверобое. В проталины окон был виден ослепительно сверкающий снег на крышах, искрились серебря..ые чепчики на столбах забора и скворешне. На косяках окон, в клетках, прониза..ых солнцем, играли мои птицы: щебетали весёлые руч..ые чижи, скрипели снегири, заливался щегол. Но весёлый, серебря..ый и звонкий этот день не радовал, был ненуже.., и всё было ненуж..о. (М. Горький, «Детство») Пояснения: буквица, зверобой — лекарственные травы; проталина — оттаявшее место на замёрзшем стекле; серебряные чепчики — здесь: снежные шапки; чиж, снегирь, щегол — певчие птицы.'},
 {n:39,l:7,st:5,os:'диктант',task:'Диктант. Учитель (или родитель) читает текст, ученик записывает его. Знаки препинания, которые ещё не изучались (точка с запятой, тире на месте пропущенного слова), учитель называет при чтении. После диктанта подчеркнуть все слова, в которых пишется н или нн в суффиксе или на стыке корня и суффикса, и объяснить их написание; для сравнения отметить два слова, где н входит в корень; причастные обороты выделить. Текст для проверки — ниже.',
  body:'Германн вошёл в спальню. Перед кивотом, наполненным старинными образами, теплилась золотая лампада. Полинялые штофные кресла и диваны с пуховыми подушками, с сошедшей позолотою, стояли в печальной симметрии около стен, обитых китайскими обоями. На стене висели два портрета, писанные в Париже <…>. Один из них изображал мужчину лет сорока, румяного и полного, в светло-зелёном мундире и со звездою; другой — молодую красавицу с орлиным носом, с зачёсанными висками и с розою в пудреных волосах. По всем углам торчали фарфоровые пастушки, столовые часы <…>, коробочки, рулетки, веера и разные дамские игрушки, изобретённые в конце минувшего столетия <…>. Германн пошёл за ширмы. За ними стояла маленькая железная кровать. (А. С. Пушкин, «Пиковая дама») Пояснения: кивот (киот) — застеклённый шкафчик для икон; образа — иконы; лампада — светильник перед иконой; штофный — обитый плотной шёлковой тканью; со звездою — с орденом; ширмы — складная перегородка; текст немного сокращён.'},
 {n:40,l:7,st:5,os:'сочинение',task:'Сочинение-миниатюра «Ярмарка» (8–10 предложений). Употребить не меньше двенадцати слов с н и нн на все случаи правила: прилагательные от существительных (в том числе одно слово-исключение); отглагольные прилагательные и причастия (в том числе причастие с зависимым словом); одно слово из урока 3 (сложное слово или устойчивое сочетание); краткие причастия и краткие прилагательные; наречия; существительные. Подчеркнуть эти слова и над каждым указать номер урока.',
  body:'Опорные слова (можно брать не все): расписные игрушки, тканые пояса, домотканые половики, точёные ложки, печённые в золе картофелины, вяленая рыба, румяные калачи, стеклянные бусы, льняные скатерти; ряды увешаны флагами, цены названы громко, торговцы приветливы и веселы, площадь многолюдна; торговали увлечённо, расхваливали товар неутомимо; пряники, вареники, родственники, единомышленники.'},

const LNAMES=['','Прилагательные от существительных','Причастия и прилагательные от глаголов','Трудные случаи','Краткие формы','Наречия','Существительные','Повторение'];
const BOOKREF={1:'Розенталь, «Русский язык» (пособие), упр. 166–175',2:'Розенталь, «Русский язык» (пособие), упр. 240–250',3:'Розенталь, «Русский язык» (пособие), упр. 240–250',4:'Розенталь, «Русский язык» (пособие), упр. 240–250'};


// ---------- тренажёр (общий для всех глав) ----------
function CC(){return CHAPTERS[route&&route.id]||NN}
const TR={ch:null,les:[],mode:'pick',cnt:10,run:null};
function trSync(){const c=CC();if(TR.ch!==c.id){TR.ch=c.id;TR.les=c.lessons.map((_,i)=>i+1);TR.run=null;TR.mode=c.wk?'all':'pick'}}
const TR_OLD={pick:'По одному',cols:'Столбики',err:'Найти ошибку',mix:'Вперемешку'};
const TR_DESC={pick:'Одно задание за раз: выбрать верный вариант.',cols:'Несколько слов сразу — разложить по столбикам, потом проверить.',err:'Слова написаны полностью, в одном ошибка — найти её.',mix:'Все виды заданий вперемешку.',all:'Задания всех видов вперемешку: выделить, подчеркнуть, собрать, разобрать, расставить запятые, выбрать букву и правило. Где была ошибка — задание вернётся в конце серии.'};
const trIsMech=m=>m==='all'||!!MECH[m];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fill=(w,v)=>w.replace('_',v);
const OPTS=it=>it.opts||['н','нн'];
const gap=it=>it.w.includes('_');
function trPool(){return CC().bank.filter(b=>TR.les.includes(b.l))}
function groupCols(pool){
 // столбики: только задания с пропуском и двумя вариантами, сгруппированные по одинаковым вариантам
 const by={};pool.filter(it=>gap(it)&&OPTS(it).length===2).forEach(it=>{const k=OPTS(it).join('|');(by[k]=by[k]||[]).push(it)});
 const out=[];Object.values(by).forEach(arr=>{for(let i=0;i<arr.length;i+=6){const g=arr.slice(i,i+6);if(g.length>=3)out.push({k:'cols',items:g,set:{},opts:OPTS(g[0])});else g.forEach(it=>out.push({k:'pick',it}))}});
 return out;
}
function groupErr(pool){
 const g=pool.filter(gap),rest=pool.filter(it=>!gap(it)),out=[];
 for(let i=0;i<g.length;i+=4){const x=g.slice(i,i+4);if(x.length<3){x.forEach(it=>out.push({k:'pick',it}));continue}out.push({k:'err',items:x,bad:Math.floor(Math.random()*x.length),pick:null})}
 rest.forEach(it=>out.push({k:'pick',it}));return out;
}
function trStart(items){
 if(items&&items.some(it=>it.mt)){TR.run={tasks:items.map(it=>it.mt?mClone(it.mt):{k:'pick',it}),i:0,ok:0,tot:0,wrong:[],pool:items};return}
 if(!items&&trIsMech(TR.mode)){ // механики: каждое задание создаётся заново из размеченного материала
  const c=CC(),av=mAvail(c,TR.les),bank=shuffle(trPool()),N=TR.cnt==='all'?20:TR.cnt,tasks=[];let prev='';
  for(let k=0;k<N;k++){
   if(TR.mode!=='all'){tasks.push(mGen(c,TR.mode,TR.les));continue}
   if(bank.length&&(Math.random()<.3||!av.length)){tasks.push({k:'pick',it:bank.pop()});prev='pick';continue}
   const ch=av.filter(m=>m!==prev),m=pick1(ch.length?ch:av);tasks.push(mGen(c,m,TR.les));prev=m;
  }
  if(TR.mode==='all'&&TR.les.length>1){ // сначала блоком (по урокам, по порядку), затем вперемешку — PRINCIPLES.md §5.2
   const lv=x=>x.k==='m'?x.l:(x.it&&x.it.l)||0,k=Math.ceil(tasks.length*.4),head=tasks.slice(0,k).sort((a,b)=>lv(a)-lv(b));tasks.splice(0,k,...head)}
  TR.run={tasks,i:0,ok:0,tot:0,wrong:[],pool:[]};return;
 }
 const pool=items||shuffle(trPool()).slice(0,TR.cnt==='all'?9999:TR.cnt);
 let tasks;
 if(TR.mode==='cols') tasks=groupCols(pool);
 else if(TR.mode==='err') tasks=groupErr(pool);
 else if(TR.mode==='mix'){const a=shuffle(pool),n=Math.ceil(a.length/3);tasks=shuffle([...a.slice(0,n).map(it=>({k:'pick',it})),...groupErr(a.slice(n,2*n)),...groupCols(a.slice(2*n))])}
 else tasks=pool.map(it=>({k:'pick',it}));
 TR.run={tasks,i:0,ok:0,tot:0,wrong:[],pool};
}
function trSetupHTML(){
 trSync();const c=CC(),n=trPool().length,av=mAvail(c,TR.les);
 if(c.wk&&MECH[TR.mode]&&!av.includes(TR.mode))TR.mode='all';
 const chip=(k,t)=>`<button class="chipc" data-trm="${k}" aria-pressed="${TR.mode===k}">${t}</button>`;
 const modes=c.wk?`<div class="tl">Вид задания</div><div class="chips">${chip('all','Все виды вперемешку')}</div>
  <div class="tl">Действия — как в тетради</div><div class="chips">${av.map(m=>chip(m,MECH[m].t)).join('')||'<span class="note">Для выбранных уроков нет.</span>'}</div>
  <div class="tl">Выбор варианта</div><div class="chips">${['pick','cols','err'].map(k=>chip(k,TR_OLD[k])).join('')}</div>`
  :`<div class="tl">Вид задания</div><div class="seg" role="radiogroup">${Object.entries(TR_OLD).map(m=>`<button role="radio" data-trm="${m[0]}" aria-pressed="${TR.mode===m[0]}">${m[1]}</button>`).join('')}</div>`;
 const mech=trIsMech(TR.mode),can=mech?av.length>0:n>0;
 return `<div class="blab"><div class="cap"><b>Тренажёр</b><span class="bkhint">${c.wk?`${mAvail(c,c.lessons.map((_,i)=>i+1)).length} видов действий · `:''}в банке ${c.bank.length} заданий</span></div>
 <div class="tl">Уроки</div><div class="chips">${c.lessons.map((l,i)=>`<button class="chipc" data-trl="${i+1}" aria-pressed="${TR.les.includes(i+1)}">${i+1}. ${c.lnames[i+1]}</button>`).join('')}</div>
 ${modes}
 <div class="tl">Сколько заданий</div><div class="seg" role="radiogroup">${(mech?[10,15,20]:[10,20,40,'all']).map(x=>`<button role="radio" data-trc="${x}" aria-pressed="${String(TR.cnt)===String(x)}">${x==='all'?'Все ('+n+')':x}</button>`).join('')}</div>
 <button class="bkldone" data-trgo ${can?'':'disabled'}>Начать</button>
 <div class="bkhint">${MECH[TR.mode]?MECH[TR.mode].d:TR_DESC[TR.mode]}</div></div>`;
}
const ok_=t=>`<b style="color:var(--T)">${t}</b>`,bad_='<b style="color:var(--red)">Неверно.</b>';
function trTaskHTML(t){
 const c=CC();
 if(t.k==='m')return mechHTML(t);
 if(t.k==='pick'){
  const it=t.it,a=t.ans,op=OPTS(it),g=gap(it);
  const w=g?esc(it.w).replace('_',`<span class="slot ${a?(a===it.a?'ok':'bad'):''}">${a?it.a:'…'}</span>`):esc(it.w);
  const long=op.some(v=>v.length>4);
  return `<div class="card"><div class="ty">${it.q||(g?'Выбрать вариант':'Ответить')} · урок ${it.l}</div><div class="word" style="font-size:${g?26:22}px">${w}</div>
  <div class="${long?'errl':'ans'}" style="justify-content:center">${op.map(v=>{let cl='';if(a){if(v===it.a)cl='ok';else if(v===a)cl='bad'}if(!a&&t.first===v)cl='bad';
   return long?`<button class="opt ${cl?'e'+cl:''}" data-trp="${esc(v)}" ${a||t.first===v?'disabled':''}>${esc(v)}</button>`:`<button data-trp="${esc(v)}" class="${cl}" ${a||t.first===v?'disabled':''} style="min-width:80px;min-height:52px;font-size:19px">${esc(v)}</button>`}).join('')}</div>
  ${t.hinted&&!a?`<div class="obr"><b>Подсказка.</b> ${c.lessons[it.l-1].hint} Попробовать ещё раз.</div>`:''}
  ${a?`<div class="aa"><div>${a===it.a?ok_(t.hinted?'Теперь верно.':'Верно.'):bad_} ${it.why}</div></div>`:''}</div>`;
 }
 if(t.k==='cols'){
  const chk=t.checked,[v1,v2]=t.opts;
  const col=v=>t.items.map((it,i)=>{if(t.set[i]!==v)return'';const cls=chk?(it.a===v?'ok':'bad'):'';return `<button class="wchip ${cls}" data-trcol="${i}" ${chk?'disabled':''}>${esc(fill(it.w,v))}</button>`}).join('');
  const free=t.items.map((it,i)=>t.set[i]?'':`<div class="wfree"><span>${esc(it.w).replace('_','<span class="slot">…</span>')}</span><span class="ans">${t.opts.map(v=>`<button data-trset="${i}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</span></div>`).join('');
  return `<div class="card" style="justify-content:flex-start"><div class="ty">Разложить по столбикам</div>${free?`<div class="wfreel">${free}</div>`:''}
  <div class="cols"><div><div class="colh"><span class="tagN">${esc(v1)}</span></div>${col(v1)}</div><div><div class="colh"><span class="tagNN">${esc(v2)}</span></div>${col(v2)}</div></div>
  ${chk?`<div class="aa">${t.items.map((it,i)=>t.set[i]===it.a?'':`<div><b style="color:var(--red)">${esc(fill(it.w,it.a))}</b> — ${it.why}</div>`).join('')||'<div><b style="color:var(--T)">Всё верно.</b></div>'}</div>`:`<div class="bkhint">Нажатие на слово в столбике возвращает его назад.</div>`}</div>`;
 }
 const p=t.pick;
 return `<div class="card" style="justify-content:flex-start"><div class="ty">Найти слово с ошибкой</div><div class="errl">${t.items.map((it,i)=>{
   const wrongV=OPTS(it).find(v=>v!==it.a);const shown=fill(it.w,i===t.bad?wrongV:it.a);let cl='';if(p!=null){if(i===t.bad)cl='ok';else if(i===p)cl='bad'}
   return `<button class="opt ${cl?'e'+cl:''}" data-tre="${i}" ${p!=null?'disabled':''}>${esc(shown)}</button>`}).join('')}</div>
  ${p!=null?`<div class="aa"><div>${p===t.bad?ok_('Верно.'):bad_} Правильно: <b>${esc(fill(t.items[t.bad].w,t.items[t.bad].a))}</b>. ${t.items[t.bad].why}</div></div>`:''}</div>`;
}
const shownAns=it=>gap(it)?fill(it.w,it.a):it.w+' — '+it.a;
function trRunHTML(){
 const r=TR.run;
 if(r.i>=r.tasks.length){
  return `<div class="card" style="text-align:center;align-items:center"><div class="ty">Серия закончена</div><div class="qq">Верно ${r.ok} из ${r.tot}</div>
  ${r.wrong.length?`<div class="aa" style="text-align:left;width:100%">${r.wrong.map(it=>`<div><b>${esc(shownAns(it))}</b> — ${it.why}</div>`).join('')}</div>`:'<div class="note">Ошибок нет.</div>'}</div>
  <div class="big2">${r.wrong.length?`<button class="again" data-trerr>Повторить ошибки</button>`:''}<button class="main" data-trgo>Новая серия</button></div><button class="linkbtn" data-trsetup>Настройки тренажёра</button>`;
 }
 const t=r.tasks[r.i];
 const done=t.k==='m'?!!t.res:t.k==='pick'?!!t.ans:t.k==='err'?t.pick!=null:!!t.checked;
 const allset=t.k==='cols'&&t.items.every((_,i)=>t.set[i]);
 return `<div class="prog"><span>Задание ${r.i+1} из ${r.tasks.length}</span><span>Верно: ${r.ok} из ${r.tot}</span></div><div class="bar"><i style="width:${r.i/r.tasks.length*100}%"></i></div>
 ${trTaskHTML(t)}
 <div class="big2">${done?`<button class="main" data-trnext>Дальше</button>`:t.k==='m'?`<button class="main" data-mcheck ${MECH[t.m].ready(t)?'':'disabled'}>Проверить</button>`:t.k==='cols'?`<button class="main" data-trcheck ${allset?'':'disabled'}>Проверить</button>`:''}</div>
 <button class="linkbtn" data-trsetup>Закончить и вернуться к настройкам</button>`;
}
function trScore(list){const r=TR.run;list.forEach(([it,ok])=>{r.tot++;if(ok)r.ok++;else r.wrong.push(it)})}
function trainerHTML(){trSync();return `<div class="study" id="trainer">${TR.run?trRunHTML():trSetupHTML()}</div>`}

// ---------- упражнения в тетрадь ----------
// Ответы показываются только в версии для учителя (TEACHER, см. tools/build.py); в версии ученика их нет в файле.
// Навигация: карта номеров (по урокам), поле «Найти по номеру», ссылка на упражнения.
// Номер упражнения (e.n) постоянный: задан в данных главы и никогда не меняется.
// Задание от учителя («упр. 12–15») открывается отдельным видом: видны только эти упражнения,
// фильтры не действуют — так ученик не перепутает, что задано.
let CLF=0;      // фильтр по уроку (0 — все)
let CLR=null;   // показаны только эти номера (массив) — по полю номера или по ссылке
let CLU=false;  // только невыполненные
let CLO=false;  // только особые (диктант, сочинение, изложение, работа с текстом — длинные жанры, поле e.os)
const clKey=e=>'cl-'+CC().id+'-'+e.n;
const STARS=n=>`<span class="stars" title="Сложность: ${n} из 5">${'★'.repeat(n)}<span>${'★'.repeat(5-n)}</span></span>`;
const clLabel=(c,l)=>l<c.lnames.length-1?'Урок '+l:c.lnames[l];
// «12», «12-15», «12–15, 18», «упр. 12 и 14» → [12,13,14,15,18] (только существующие номера)
function clParse(c,v){
 const have=new Set(c.classic.map(e=>e.n)),out=new Set();
 String(v).toLowerCase().replace(/упр[а-яё]*\.?|№/g,' ').replace(/(^|\s)и(?=\s)/g,',').replace(/\s*[-–—]\s*/g,'-').split(/[,;\s]+/).forEach(part=>{
  const m=part.trim().match(/^(\d+)(?:-(\d+))?$/);if(!m)return;
  let a=+m[1],b=m[2]?+m[2]:a;if(b<a)[a,b]=[b,a];if(b-a>300)return;
  for(let k=a;k<=b;k++)if(have.has(k))out.add(k)});
 return [...out].sort((x,y)=>x-y);
}
// [12,13,14,15,18] → «12–15, 18» (для текста) или «12-15,18» (для ссылки)
function clFmt(list,link){
 const r=[];list.forEach(n=>{const g=r[r.length-1];if(g&&n===g[1]+1)g[1]=n;else r.push([n,n])});
 return r.map(([a,b])=>a===b?a:a+(link?'-':'–')+b).join(link?',':', ');
}
const clLink=(c,list)=>location.href.split('#')[0]+'#ex-'+c.id+'-'+clFmt(list,true);

// поле «Найти по номеру» и карта номеров — в главе, в боковой колонке и в шторке «Содержание»
function clFindHTML(side){
 return `<form class="clfind" data-clform><input name="q" type="text" enterkeyhint="go" autocomplete="off" placeholder="${side?'12 или 12–15':'Номер: 12 или 12–15'}" aria-label="Номера упражнений, например 12 или 12–15"><button type="submit">Показать</button></form>`;
}
function clMapHTML(c){
 const by={};c.classic.forEach(e=>(by[e.l]||(by[e.l]=[])).push(e));
 return `<div class="clmap" aria-label="Номера упражнений">${Object.keys(by).map(l=>`<div class="cmr"><span class="cml">${clLabel(c,+l)}</span><div class="cmn">${by[l].map(e=>{
  const dn=S.done['cl-'+c.id+'-'+e.n],on=CLR&&CLR.includes(e.n);
  return `<button class="cmb${dn?' dn':''}${on?' on':''}" data-clgo="${e.n}" title="Упражнение ${e.n} · сложность ${e.st} из 5${e.os?' · особое: '+e.os:''}${dn?' · выполнено':''}" aria-label="Упражнение ${e.n}${dn?', выполнено':''}">${e.n}</button>`}).join('')}</div></div>`).join('')}</div>
 <div class="cmleg"><span><i class="cmb dn"></i>выполнено</span><span><i class="cmb"></i>не выполнено</span></div>`;
}

// материал упражнения: каждое пронумерованное предложение — с новой строки, подпись автора — отдельно и мельче,
// «Пояснения: …» в конце (значения редких и старых слов в цитатах) — отдельной строкой
const clBody=b=>esc(b).replace(/ (\d{1,2})\. (?=[А-ЯЁ(])/g,'<br>$1. ').replace(/\(([А-ЯЁ]\. [А-ЯЁ]\. [А-ЯЁа-яё-]+, «[^»]+»)\)/g,'<span class="clsrc">$1</span>').replace(/ Пояснения: (.*)$/,'<span class="clgl"><b>Пояснения:</b> $1</span>');
function clExHTML(c,e){
 const dn=S.done[clKey(e)];
 return `<section class="clex ${dn?'is':''}" id="cl${e.n}"><div class="clh"><span class="cln">Упражнение ${e.n}</span>${STARS(e.st)}${e.os?`<span class="clos" title="Особое упражнение: длинный жанр">особое · ${e.os}</span>`:''}${dn?'<span class="okm">✓ выполнено</span>':''}<button class="cllink" data-cllink="${e.n}" title="Скопировать ссылку на это упражнение">ссылка</button></div>
  <p class="task">${e.task}</p>${e.obr?(S.easy?`<div class="obr"><b>Образец.</b> ${e.obr}</div>`:`<details class="bkhelp"><summary>Образец</summary><div class="body"><p>${e.obr}</p></div></details>`):''}<p class="cbody">${clBody(e.body)}</p>
  ${TEACHER&&e.key?`<details class="bkhelp tkey"><summary>Ответы (для учителя)</summary><div class="body"><p>${e.key}</p></div></details>`:''}
  <button class="pill ${dn?'done':''}" data-cldone="${e.n}">${dn?'✓ Выполнено':'Отметить: выполнено'}</button></section>`;
}
function clList(c,list,books){
 let h='',cur=0;
 list.forEach(e=>{
  if(e.l!==cur){cur=e.l;h+=`<h3>${clLabel(c,cur)}${cur<c.lnames.length-1?'. '+c.lnames[cur]:''}</h3>`;
   if(books&&c.bookref&&c.bookref[cur])h+=`<div class="clbook"><b>Ещё — в бумажной книге:</b> ${c.bookref[cur]}. <span>Номера там — по той книге, а не по этому учебнику.</span></div>`}
  h+=clExHTML(c,e)});
 return h;
}

function classicHTML(){
 const c=CC(),CL=c.classic,LN=c.lnames;
 const doneN=CL.filter(e=>S.done[clKey(e)]).length;
 // вид «задание»: только выбранные номера
 if(CLR&&CLR.length){
  const L=CL.filter(e=>CLR.includes(e.n)),dn=L.filter(e=>S.done[clKey(e)]).length,meta=chById(c.id);
  return `<div class="bktext"><div class="clset" id="clset"><div class="kick">Глава ${meta.part.n}.${meta.part.ch.indexOf(meta)+1} · ${meta.t}</div>
  <div class="t">${L.length>1?'Упражнения':'Упражнение'} ${clFmt(CLR)}</div>
  <div class="sub">Показаны только ${L.length>1?'эти упражнения':'это упражнение'}${L.length>1?`: ${L.length} шт., выполнено ${dn}`:dn?' · выполнено':''}.</div>
  <div class="row"><button class="pill" data-clcopy>Скопировать ссылку</button><button class="pill" data-clall>Все упражнения главы</button></div></div>
  ${clList(c,L,false)}
  <div class="row"><button class="pill" data-clall>‹ Все упражнения главы</button></div></div>`;
 }
 let h=`<div class="bktext">${TEACHER?'<div class="bins bkey tnote"><div class="h">Версия для учителя</div><p>Ответы к упражнениям открыты. В версии для учеников ответов нет.</p></div>':''}<details class="bins btip clhow"${S.clhow?' open':''} data-clhow><summary class="h">Как работать с упражнениями</summary><p>Упражнения выполняются письменно, в тетради. Проверяет учитель; после выполнения — отметка «Выполнено».</p><p>У каждого упражнения <b>свой постоянный номер</b>. Задали, например, «упражнения 12–15» — ввести номера в поле ниже или открыть ссылку от учителя: на экране останутся только заданные упражнения.</p><p>Сложность — от одной до пяти звёзд: ${STARS(1)} по образцу, ${STARS(2)} простое применение правила, ${STARS(3)} с объяснением, ${STARS(4)} поиск ошибок и разбор, ${STARS(5)} самое сложное — с тонкостями и неочевидными случаями. Пометка <span class="clos">особое</span> — длинные жанры: диктант, сочинение, изложение, работа с текстом; на них уходит больше времени.</p></details>
 <div class="clnav">${clFindHTML()}${clMapHTML(c)}</div>
 <div class="tl">Урок</div><div class="chips">${LN.map((n,l)=>`<button class="chipc" data-clf="${l}" aria-pressed="${CLF===l}">${l?clLabel(c,l):'Все уроки'}</button>`).join('')}</div>
 <div class="tl">Сложность</div><div class="chips">${[0,1,2,3,4,5].map(s=>`<button class="chipc" data-cls="${s}" aria-pressed="${(S.cls||0)===s}">${s?'★'.repeat(s):'Любая'}</button>`).join('')}${CL.some(e=>e.os)?`<button class="chipc" data-clo aria-pressed="${CLO}">Особые</button>`:''}<button class="chipc" data-clu aria-pressed="${CLU}">Только невыполненные</button></div>
 <div class="prog"><span>Выполнено ${doneN} из ${CL.length}</span></div><div class="bar"><i style="width:${doneN/CL.length*100}%"></i></div>`;
 const L=CL.filter(e=>(!CLF||e.l===CLF)&&(!S.cls||e.st===S.cls)&&(!CLU||!S.done[clKey(e)])&&(!CLO||e.os));
 h+=L.length?clList(c,L,true):'<p class="note">Под этот отбор упражнений нет.</p>';
 return h+'</div>';
}

// переходы
function clShow(list){CLR=list.length?list:null;S.tab='classic';save();go({v:'ch',id:CC().id});setTimeout(()=>{const t=document.getElementById('clset');if(t)t.scrollIntoView({block:'start'})},30)}
function clJump(n){ // к одному упражнению в общем списке: снять мешающие фильтры
 const c=CC(),e=c.classic.find(x=>x.n===n);if(!e)return;
 const hidden=(CLF&&e.l!==CLF)||(S.cls&&e.st!==S.cls)||(CLU&&S.done[clKey(e)])||(CLO&&!e.os);
 if(CLR||hidden||(S.tab||'theory')!=='classic'){CLR=null;CLF=0;S.cls=0;CLU=false;CLO=false;S.tab='classic';save();go({v:'ch',id:c.id},true)}
 setTimeout(()=>{const el=document.getElementById('cl'+n);if(!el)return;el.scrollIntoView({behavior:RM()?'auto':'smooth',block:'start'});el.classList.add('clhl');setTimeout(()=>el.classList.remove('clhl'),1600)},40);
}
function clCopy(text){
 const done=()=>toast('Ссылка скопирована');
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,()=>prompt('Скопировать ссылку:',text));
 else prompt('Скопировать ссылку:',text);
}
function toast(t){const o=document.querySelector('.toast');if(o)o.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),1800)}
document.addEventListener('submit',e=>{const f=e.target;if(!f.matches('[data-clform]'))return;e.preventDefault();
 const v=f.q.value,list=clParse(CC(),v);
 if(!list.length){toast(v.trim()?'Таких номеров в этой главе нет':'Введите номер упражнения');return}
 closeSheet();clShow(list)});

// Слова и сочетания — свои: примеры тренажёра (bank.js) и упражнений (classic.js) не повторяются,
// кроме закрытых списков (исключения, слова с особым значением), где они даны с новыми словами.
// Все ответы бесспорные (Розенталь, Правила 2006); тонкостей из «deep» в тестах нет.
// В уроке 5 в пропусках перед н пишется е, а не ё: буква ё не должна подсказывать, наречие это или причастие.

 src:'Д. Э. Розенталь. Русский язык: учебное пособие (§ 50–52); Классический справочник по русскому языку (§ 47–48) · Правила русской орфографии и пунктуации. Полный академический справочник (2006) · Т. В. Адамчик. Самый полный курс русского языка · О. Наумова. Морфология простым языком · Сидорова и др. Русский язык для абитуриентов · Д. Э. Розенталь, И. Б. Голуб, М. А. Теленкова. Современный русский язык',

 {id:'pr1',t:'Что такое причастие',
  hint:'Причастие обозначает признак по действию: бегущий — тот, кто бежит. Прилагательное — постоянный признак: красивый.',
  h:`<p><b>Причастие</b> — особая форма глагола, которая обозначает признак предмета по действию и отвечает на вопросы прилагательного: <i>какой? что делающий? что сделавший?</i> <span class="ex">Бегущий ручей</span> — ручей, который бежит; <span class="ex">прочитанная книга</span> — книга, которую прочитали.</p>
  <p>Причастие соединяет признаки двух частей речи. От глагола оно берёт действие и всё, что с ним связано, от прилагательного — форму и согласование с существительным.</p>
  {{lab:parse}}
  <h4>Признаки глагола</h4>
  <ul class="ul">
   <li><b>Вид</b>: <span class="ex">читающий</span> (несовершенный) — <span class="ex">прочитавший</span> (совершенный).</li>
   <li><b>Время</b>: настоящее (<span class="ex">читающий</span>) и прошедшее (<span class="ex">читавший</span>). Будущего времени у причастий нет.</li>
   <li><b>Залог</b>: действительный (<span class="ex">читающий ученик</span>) и страдательный (<span class="ex">читаемая книга</span>) — урок 2.</li>
   <li><b>Возвратность</b>: <span class="ex">строящийся, умывшийся</span> — с постфиксом <b class="m">-ся</b>; после гласной он не сокращается до -сь: <span class="ex">строящаяся</span>.</li>
   <li><b>Переходность и управление</b>, как у глагола: <span class="ex">читающий (что?) книгу, любующийся (чем?) закатом</span>.</li>
  </ul>
  <h4>Признаки прилагательного</h4>
  <ul class="ul">
   <li><b>Род, число, падеж</b>: причастие согласуется с существительным — <span class="ex">читающего ученика, читающей девочке, читающими детьми</span>.</li>
   <li><b>Полная и краткая форма</b>: краткую форму имеют только страдательные причастия — <span class="ex">книга прочитана</span> (урок 5).</li>
   <li><b>Роль в предложении</b>: полное причастие обычно определение, краткое — сказуемое. Полное причастие может стоять и без существительного, называя того, кто совершает действие: <span class="ex">перед глазами ехавших</span> (тех, кто ехал); тогда в предложении оно играет роль существительного.</li>
  </ul>
  <div class="bins bnorm"><div class="h">Два взгляда</div><p>В школьных учебниках причастие часто называют самостоятельной частью речи. В научной грамматике (Розенталь, Голуб, Теленкова; академическая «Русская грамматика») это гибридная форма глагола. Для письма разница не важна: правила одни и те же.</p></div>
  <div class="bins bkey"><div class="h">Главное</div><p>Причастие = действие глагола + форма прилагательного. Оно отвечает на вопрос «какой?», но обозначает признак по действию: что делающий или что сделавший.</p></div>`,
  lite:`<p><b>Причастие</b> — слово, которое называет признак предмета <b>по действию</b>. Оно отвечает на вопрос <b>какой?</b>, как прилагательное, но внутри у него «спрятан» глагол.</p>
  <p><span class="ex">Бегущий ручей</span> — ручей, который <b>бежит</b>. <span class="ex">Прочитанная книга</span> — книга, которую <b>прочитали</b>.</p>
  <p><b>Как узнать причастие — три шага:</b></p>
  <ol class="ul"><li>Задать вопрос от существительного: ручей (какой?) бегущий.</li>
  <li>Попробовать заменить слово словами «<b>который</b>…» с глаголом: бегущий — который бежит; прочитанная — которую прочитали.</li>
  <li>Проверить <b>суффикс</b>. У причастий он особый: <b class="m">-ущ-/-ющ-, -ащ-/-ящ-, -ем-/-им-, -вш-/-ш-, -нн-/-енн-, -т-</b>. Есть такой суффикс, и слово образовано от глагола — это причастие. Нет — прилагательное, даже если в нём слышится глагол: <span class="ex">спелый, усталый</span>. Осторожно: <span class="ex">деревянный</span> образовано от существительного «дерево» — это прилагательное, хотя в нём есть нн.</li></ol>
  <p>От глагола у причастия — <b>действие и время</b>: бегущий (сейчас), бежавший (раньше). От прилагательного — <b>вопрос «какой?» и окончания</b>: бегущий, бегущая, бегущее, бегущие.</p>
  {{lab:parse}}
  <div class="bins bkey"><div class="h">Запомнить</div><p>Слово можно заменить на «который делает / сделал» или «который делают / сделали», и в нём есть суффикс причастия — значит, это причастие.</p></div>`,
  deep:`<p><b>Переход в прилагательные.</b> Причастие может потерять значение действия и стать прилагательным: <span class="ex">блестящий ответ</span> (отличный), <span class="ex">выдающийся учёный</span>, <span class="ex">вызывающее поведение</span>, <span class="ex">подержанные книги</span>. Сравнить: <span class="ex">блестящий на солнце снег</span> — причастие.</p>
  <p><b>Переход в существительные:</b> <span class="ex">учащиеся, заведующий, отдыхающие, раненые, командующий</span>. Они отвечают на вопрос «кто?» и не имеют при себе существительного.</p>
  <p><b>Отглагольные прилагательные</b> (<span class="ex">жареный, кованый, стираный</span>) похожи на причастия, но не обозначают действия — о них в главе «Н и НН».</p>`,
  easy:'Поставить вопрос «какой?» и попробовать заменить слово на «который делает / который сделал». Получилось — причастие.',
  fix:'Сравнить пары: синий — синеющий, белый — белеющий. Первое слово — просто цвет, второе — «который синеет», признак по действию.'
 },
 {id:'pr2',t:'Действительные и страдательные. Время',
  hint:'Действительное — предмет сам делает действие (читающий ученик). Страдательное — над предметом действие совершают (читаемая книга).',
  h:`<p><b>Действительные причастия</b> называют признак предмета, который сам совершает действие: <span class="ex">читающий ученик</span> (ученик читает), <span class="ex">распустившийся цветок</span>.</p>
  <p><b>Страдательные причастия</b> называют признак предмета, над которым действие совершает кто-то другой: <span class="ex">читаемая учеником книга</span> (книгу читают), <span class="ex">построенный дом</span>.</p>
  <p>По времени причастия бывают <b>настоящего</b> (<span class="ex">читающий, читаемый</span>) и <b>прошедшего</b> (<span class="ex">читавший, прочитанный</span>). Получается четыре разряда.</p>
  <p><b>Причастия с -ся</b> всегда действительные: <span class="ex">строящийся дом, умывшийся котёнок</span>. Страдательных причастий с -ся не бывает, даже если по смыслу действие совершают над предметом.</p>
  <div class="tblw"><table class="bktbl"><thead><tr><th></th><th>Настоящее время</th><th>Прошедшее время</th></tr></thead><tbody>
   <tr><td><b>Действительные</b></td><td class="ex">читающий, строящий, несущий</td><td class="ex">читавший, строивший, нёсший</td></tr>
   <tr><td><b>Страдательные</b></td><td class="ex">читаемый, строимый, несомый</td><td class="ex">прочитанный, построенный, принесённый</td></tr>
  </tbody></table></div>
  <h4>Сколько причастий у глагола</h4>
  <p>Набор причастий зависит от двух свойств глагола:</p>
  <ul class="ul">
   <li><b>вида</b>: причастия настоящего времени образуются только от глаголов несовершенного вида (<span class="ex">читать → читающий</span>; от <span class="ex">прочитать</span> — нет);</li>
   <li><b>переходности</b>: страдательные причастия образуются только от переходных глаголов (<span class="ex">читать книгу → читаемая книга</span>; от <span class="ex">спать, идти</span> — нет).</li>
  </ul>
  {{lab:matrix}}
  <p>Отсюда правило четырёх клеток: у переходного глагола несовершенного вида может быть до четырёх причастий, у переходного совершенного — два, у непереходного несовершенного — два, у непереходного совершенного — одно. Страдательные причастия настоящего времени есть не у всех переходных глаголов: от <span class="ex">писать, брать, пить, ждать, мыть</span> они в литературном языке не употребляются.</p>
  <div class="bins bnorm"><div class="h">Частая ошибка</div><p>Причастий будущего времени нет. Неверно: <span class="ex">прочитающий, сделающий, победящий</span>. Правильно: <span class="ex">тот, кто прочитает</span>; <span class="ex">победивший</span> (прошедшее время).</p></div>
  <div class="bins"><div class="h">Морфологический разбор причастия</div><p>Разбор выполняется по школьному плану, по пунктам.</p>
  <p><b>I.</b> Часть речи (особая форма глагола). Общее значение: признак предмета по действию.<br><b>II.</b> Морфологические признаки:<br>1. Начальная форма (именительный падеж единственного числа мужского рода).<br>2. Постоянные признаки: а) действительное или страдательное; б) время; в) вид.<br>3. Непостоянные признаки: а) полная или краткая форма (у страдательных причастий, см. урок 5); б) число; в) род (в единственном числе); г) падеж (у полных причастий).<br><b>III.</b> Синтаксическая роль.</p>
  <p><b>Образец.</b> <span class="ex">Мы любовались чайкой, летящей над рекой.</span></p>
  <p>Летящей (чайкой) — причастие, обозначает признак предмета по действию: чайкой (какой?) летящей.<br>1. Н. ф. — летящий.<br>2. Пост. признаки: действ., наст. вр., несов. в.<br>3. Непост. признаки: ед. ч., ж. р., Т. п.<br>В предложении — определение (в составе причастного оборота).</p></div>
  <div class="bins bkey"><div class="h">Главное</div><p>Сам делает — действительное; над ним делают — страдательное. Настоящее время — только от несовершенного вида, страдательные — только от переходных глаголов.</p></div>`,
  lite:`<p>Причастия делятся на две группы — смотря <b>кто делает действие</b>.</p>
  <ul class="ul"><li><b>Действительное</b> — предмет делает действие <b>сам</b>: <span class="ex">читающий ученик</span> — ученик сам читает.</li>
  <li><b>Страдательное</b> — действие делают <b>над предметом</b>: <span class="ex">читаемая книга</span> — книгу читают, сама она ничего не делает.</li></ul>
  <p><b>Проверка:</b> заменить причастие словами «который…». «Который читает» — делает сам → действительное. «Которую читают» — над ним делают → страдательное.</p>
  <p><b>Время</b> у причастия — только <b>настоящее</b> — то, что происходит сейчас (<span class="ex">читающий</span>), и <b>прошедшее</b> — то, что было раньше (<span class="ex">читавший, прочитанный</span>).</p>
  <p><b>Будущего времени у причастий нет.</b> Слова «прочитающий» не существует — правильно сказать «тот, кто прочитает».</p>
  <p><b>Не от каждого глагола бывают все причастия.</b> Причастия настоящего времени — только от глаголов, которые отвечают на вопрос «что делать?» (<span class="ex">читать → читающий</span>; от «прочитать» — нельзя). Страдательные — только от глаголов, к которым можно задать вопрос «кого? что?» без предлога (<span class="ex">читать что? книгу → читаемая книга</span>; от «спать», «идти» — нельзя).</p>
  {{lab:matrix}}
  <div class="bins"><div class="h">Морфологический разбор причастия</div><p>Разбор выполняется по школьному плану, по пунктам.</p>
  <p><b>I.</b> Часть речи (особая форма глагола). Общее значение: признак предмета по действию.<br><b>II.</b> Морфологические признаки:<br>1. Начальная форма (именительный падеж единственного числа мужского рода).<br>2. Постоянные признаки: а) действительное или страдательное; б) время; в) вид.<br>3. Непостоянные признаки: а) полная или краткая форма (у страдательных причастий, см. урок 5); б) число; в) род (в единственном числе); г) падеж (у полных причастий).<br><b>III.</b> Синтаксическая роль.</p>
  <p><b>Образец.</b> <span class="ex">Мы любовались чайкой, летящей над рекой.</span></p>
  <p>Летящей (чайкой) — причастие, обозначает признак предмета по действию: чайкой (какой?) летящей.<br>1. Н. ф. — летящий.<br>2. Пост. признаки: действ., наст. вр., несов. в.<br>3. Непост. признаки: ед. ч., ж. р., Т. п.<br>В предложении — определение (в составе причастного оборота).</p></div>
  <div class="bins bkey"><div class="h">Запомнить</div><p>Сам делает — действительное. Над ним делают — страдательное. Время — только настоящее или прошедшее. Причастия с -ся — всегда действительные: строящийся дом.</p></div>`,
  easy:'Подставить «который»: читающий ученик = ученик, который читает (сам) → действительное; читаемая книга = книга, которую читают (над ней) → страдательное.',
  fix:'Схема «Сколько причастий у глагола» показывает, почему какие-то клетки пусты. Стоит пройти её для пар «читать — прочитать» и «идти — прийти».'
 },
 {id:'pr3',t:'Как образуются причастия',
  hint:'Настоящее время — от основы «они …» (чита-ют → чита-ющ-ий). Прошедшее — от основы инфинитива (чита-ть → чита-вш-ий, чита-нн-ый).',
  h:`<p>Причастия образуются от двух разных основ глагола.</p>
  <ul class="ul">
   <li><b>Причастия настоящего времени</b> — от основы настоящего времени. Её проще всего увидеть в форме 3-го лица множественного числа: <span class="ex">они чита-ют → чита-; они нес-ут → нес-; они вид-ят → вид-</span>.</li>
   <li><b>Причастия прошедшего времени</b> — от основы инфинитива (обычно она совпадает с основой прошедшего времени): <span class="ex">чита-ть, чита-л → чита-</span>. У некоторых глаголов основа прошедшего времени другая: <span class="ex">нести, нёс → нёс-ший</span>.</li>
  </ul>
  {{lab:build}}
  <h4>Суффиксы причастий</h4>
  <div class="tblw"><table class="bktbl wide"><thead><tr><th></th><th>Основа</th><th>Суффиксы</th><th>Примеры</th></tr></thead><tbody>
   <tr><td><b>Действительные настоящего</b></td><td>настоящего времени</td><td><b class="m">-ущ-/-ющ-</b> (I спр.), <b class="m">-ащ-/-ящ-</b> (II спр.)</td><td class="ex">несущий, читающий; дышащий, строящий</td></tr>
   <tr><td><b>Страдательные настоящего</b></td><td>настоящего времени</td><td><b class="m">-ем-/-ом-</b> (I спр.), <b class="m">-им-</b> (II спр.)</td><td class="ex">читаемый, несомый; видимый</td></tr>
   <tr><td><b>Действительные прошедшего</b></td><td>инфинитива</td><td><b class="m">-вш-</b> после гласной, <b class="m">-ш-</b> после согласной</td><td class="ex">читавший, видевший; нёсший, умерший</td></tr>
   <tr><td><b>Страдательные прошедшего</b></td><td>инфинитива</td><td><b class="m">-нн-</b>, <b class="m">-енн-</b> (<b class="m">-ённ-</b>), <b class="m">-т-</b></td><td class="ex">прочитанный, увиденный, спасённый; колотый, вымытый, взятый</td></tr>
  </tbody></table></div>
  <p>Суффикс <b class="m">-т-</b> встречается у глаголов на <b class="m">-оть, -уть, -ыть, -ереть</b>; у односложных глаголов (<span class="ex">бить, шить, мыть, греть, деть</span>) и образованных от них с приставками (<span class="ex">вымыть, согреть, одеть</span>); у глаголов на <b class="m">-ать/-ять</b>, у которых в форме «они …» на месте а/я появляется н или м (<span class="ex">взять — возьмут, мять — мнут, жать — жмут, начать — начнут</span>): <span class="ex">колоть → колотый, обуть → обутый, мыть → мытый, стереть → стёртый, бить → битый, взять → взятый</span>.</p>
  <p>Суффикс <b class="m">-енн-</b> присоединяется к основе без конечной гласной <b>и</b>/<b>е</b>: <span class="ex">засуши-ть → засуш-енн-ый, увиде-ть → увид-енн-ый</span>.</p>
  <p>Перед <b class="m">-енн-</b> согласный основы иногда меняется: <span class="ex">посадить → посаженный, украсить → украшенный, обидеть → обиженный, купить → купленный</span>.</p>
  <div class="bins bkey"><div class="h">Главное</div><p>Настоящее время — от основы «они …», прошедшее — от основы инфинитива. Затем суффикс: -ущ-/-ющ-, -ащ-/-ящ-, -ем-/-ом-, -им-, -вш-, -ш-, -нн-, -енн-, -т-.</p></div>`,
  lite:`<p>Причастие строится из глагола в два шага: взять <b>начало глагола</b> (основу) и добавить <b>суффикс</b>.</p>
  <p><b>Шаг 1. Взять начало глагола.</b></p>
  <ul class="ul"><li>Для <b>настоящего</b> времени — из формы «они …»: они <b class="m">чита</b>ют → <b class="m">чита</b>.</li>
  <li>Для <b>прошедшего</b> времени — из формы на «-ть»: <b class="m">чита</b>ть → <b class="m">чита</b>.</li></ul>
  <p><b>Шаг 2. Добавить суффикс.</b></p>
  <div class="tblw"><table class="bktbl"><tbody>
   <tr><td>сам делает, сейчас</td><td><b class="m">-ущ-, -ющ-, -ащ-, -ящ-</b></td><td class="ex">чита<b class="m">ющ</b>ий</td></tr>
   <tr><td>над ним делают, сейчас</td><td><b class="m">-ем-, -ом-, -им-</b></td><td class="ex">чита<b class="m">ем</b>ый</td></tr>
   <tr><td>сам делал, раньше</td><td><b class="m">-вш-, -ш-</b></td><td class="ex">чита<b class="m">вш</b>ий</td></tr>
   <tr><td>над ним сделали, раньше</td><td><b class="m">-нн-, -енн-, -т-</b></td><td class="ex">прочита<b class="m">нн</b>ый</td></tr>
  </tbody></table></div>
  <p>Суффикс <b class="m">-т-</b> бывает у глаголов на <b>-оть, -уть, -ыть, -ереть</b> и у односложных глаголов (бить, шить, мыть, греть) вместе с их приставочными: <span class="ex">колоть → колотый, обуть → обутый, мыть → мытый, стереть → стёртый, взять → взятый</span>. У остальных — <b class="m">-нн-</b> или <b class="m">-енн-</b>.</p>
  {{lab:build}}
  <div class="bins bkey"><div class="h">Запомнить</div><p>Сейчас — начало берём из «они …». Раньше — из формы на «-ть».</p></div>`,
  easy:'Записать два слова: «они …» и неопределённую форму. От первого строить причастия на -ущ-, -ющ-, -ащ-, -ящ-, -ем-, -им-; от второго — на -вш-, -ш-, -нн-, -енн-, -т-.',
  fix:'Конструктор выше показывает каждый шаг. Стоит собрать в нём все четыре причастия для «читать» и для «нести» — у второго основы разные.'
 },
 {id:'pr4',t:'Гласные в суффиксах причастий',
  hint:'Гласная суффикса настоящего времени — как в окончании «они …»: колеблют → колеблющий, клеят → клеящий. Перед -вш- — как перед -ть. Перед -нн-: -ать/-ять → а/я, иначе е.',
  h:`<h4>Причастия настоящего времени: решает спряжение</h4>
  <p>Гласная в суффиксе зависит от спряжения глагола:</p>
  <ul class="ul"><li><b>I спряжение</b> → <b class="m">-ущ-/-ющ-</b>, <b class="m">-ем-</b> (<b class="m">-ом-</b>): <span class="ex">колеблют → колеблющий, колеблемый; борются → борющийся</span>;</li>
  <li><b>II спряжение</b> → <b class="m">-ащ-/-ящ-</b>, <b class="m">-им-</b>: <span class="ex">клеят → клеящий; видят → видящий, видимый; гонят → гонящий, гонимый</span>.</li></ul>
  <p>Проще всего сверяться с формой 3-го лица множественного числа: гласная суффикса та же, что в окончании. <span class="ex">Они колебл-ют → колебл-ющ-ий; они кле-ят → кле-ящ-ий</span>.</p>
  {{lab:spr}}
  <p>Если окончание безударное, спряжение определяют по инфинитиву. Ко II спряжению относятся глаголы на <b class="m">-ить</b> (кроме <span class="ex">брить, стелить, зиждиться</span>) и одиннадцать исключений: <span class="ex">гнать, держать, дышать, слышать; смотреть, видеть, ненавидеть, обидеть, терпеть, вертеть, зависеть</span>. Остальные — I спряжение.</p>
  <p><b>Исключения:</b> <span class="ex">движимый</span> (от устаревшего «движить»), <span class="ex">брезжущий</span> (хотя «брезжить» на -ить, пишется <b class="m">у</b>).</p>
  <h4>Перед суффиксом -вш-</h4>
  <p>Сохраняется та же гласная, что перед <b class="m">-ть</b> в инфинитиве: <span class="ex">обидеть → обидевший, клеить → клеивший, посеять → посеявший, надеяться → надеявшийся</span>.</p>
  <h4>Перед суффиксом -нн-</h4>
  <p>Пишется <b class="m">-анн-</b>/<b class="m">-янн-</b>, если глагол оканчивается на <b class="m">-ать/-ять</b>: <span class="ex">написать → написанный, посеять → посеянный, настоять → настоянный</span>. Пишется <b class="m">-енн-</b>/<b class="m">-ённ-</b>, если глагол на <b class="m">-еть, -ить, -ти, -чь</b>: <span class="ex">увидеть → увиденный, приклеить → приклеенный, спасти → спасённый, сберечь → сбережённый</span>.</p>
  {{lab:pairs}}
  <p><b>Похожие глаголы.</b> Некоторые глаголы почти одинаковы, а причастия от них пишутся по-разному — смотрим на смысл: воду <b>выкачали</b> (выкачать) → <span class="ex">выкачанная вода</span>; бочку <b>выкатили</b> (выкатить) → <span class="ex">выкаченная бочка</span>.</p>
  <p><b>Примечание.</b> От разговорных форм <span class="ex">мерять, мучать</span> причастия пишутся с -енн-, как от литературных <span class="ex">мерить, мучить</span>: <span class="ex">меренный, мученный</span>.</p>
  <div class="bins bkey"><div class="h">Главное</div><p>Настоящее время — гласная как в «они …». Перед -вш- — как перед -ть. Перед -нн-: от -ать/-ять — а/я, от -еть/-ить/-ти/-чь — е.</p></div>`,
  lite:`<p>В этом уроке главный вопрос — какую гласную писать в суффиксе. Помогут три подсказки.</p>
  <ol class="ul"><li><b>Суффиксы настоящего времени</b> (-ущ-/-ющ-, -ащ-/-ящ-, -ем-, -им-). Сказать глагол в форме «они …» и послушать конец слова:
   <ul class="ul"><li>«они …<b>ут</b>» или «…<b>ют</b>» → пишем <b class="m">-ущ-/-ющ-</b> и <b class="m">-ем-</b> (реже <b class="m">-ом-</b>: несомый): они колебл<b class="m">ю</b>т → колебл<b class="m">ю</b>щий, колебл<b class="m">е</b>мый;</li>
   <li>«они …<b>ат</b>» или «…<b>ят</b>» → пишем <b class="m">-ащ-/-ящ-</b> и <b class="m">-им-</b>: они кле<b class="m">я</b>т → кле<b class="m">я</b>щий, они вид<b class="m">я</b>т → вид<b class="m">и</b>мый.</li></ul>
   Если окончание без ударения и его не слышно — посмотреть на форму на «-ть». Глаголы на <b>-ить</b> (кроме брить, стелить) и 11 исключений — <i>гнать, держать, дышать, слышать, смотреть, видеть, ненавидеть, обидеть, терпеть, вертеть, зависеть</i> — пишутся с <b class="m">-ащ-/-ящ-, -им-</b>. Все остальные — с <b class="m">-ущ-/-ющ-, -ем-</b>. Схема ниже показывает это по шагам.</li>
  <li><b>Перед -вш-</b> пишем ту же гласную, что перед «-ть»: обид<b class="m">е</b>ть → обид<b class="m">е</b>вший, посе<b class="m">я</b>ть → посе<b class="m">я</b>вший.</li>
  <li><b>Перед -нн-</b>: глагол на «-ать» или «-ять» → пишем <b class="m">а</b> или <b class="m">я</b> (написать → напис<b class="m">а</b>нный, посеять → посе<b class="m">я</b>нный). Все остальные глаголы → <b class="m">е</b> (увидеть → увид<b class="m">е</b>нный, построить → постро<b class="m">е</b>нный, спасти → спас<b class="m">ё</b>нный).</li></ol>
  {{lab:spr}}
  <p>Некоторые глаголы похожи, а причастия от них пишутся по-разному — смотрим на смысл: воду <b>выкачали</b> (выкачать) → <span class="ex">выкачанная вода</span>; бочку <b>выкатили</b> (выкатить) → <span class="ex">выкаченная бочка</span>.</p>
  <p>Суффикс <b class="m">-ом-</b> — у немногих глаголов I спряжения с основой на согласный: <span class="ex">несомый, ведомый, влекомый</span>; пишется под ударением, проверки не требует.</p>
  <div class="bins bkey"><div class="h">Запомнить</div><p>Слова-исключения: <b>движимый</b> — с буквой и, <b>брезжущий</b> — с буквой у.</p></div>`,
  easy:'Сначала сказать «они …» и найти гласную окончания — она же будет в суффиксе причастия.',
  fix:'Если не получается определить спряжение, пройти схему «Спряжение → суффикс»: она показывает каждый шаг для 15 глаголов.'
 },
 {id:'pr5',t:'Полные и краткие причастия. Склонение',
  hint:'Окончание полного причастия проверяется вопросом: (о каком?) о читающем. Краткая форма бывает только у страдательных причастий.',
  h:`<p><b>Полные причастия</b> изменяются по родам, числам и падежам, как прилагательные, и имеют те же окончания: <span class="ex">читающий, читающего, читающему…</span> Окончание проверяется вопросом; после <b>ж, ч, ш, щ</b> без ударения пишется <b class="m">е</b> (<span class="ex">о поющей птице, на скрипящем мосту</span>): <span class="ex">о (каком?) читающем мальчике</span>.</p>
  {{lab:decl}}
  <p><b>Краткие формы</b> есть только у страдательных причастий: <span class="ex">прочитан, прочитана, прочитано, прочитаны</span>. Они изменяются по родам и числам, но не по падежам. В предложении краткое причастие — сказуемое: <span class="ex">Книга прочитана</span>. Полное — определение: <span class="ex">Прочитанная книга лежит на столе</span>.</p>
  <p>В кратких страдательных причастиях пишется одна <b class="m">н</b>: <span class="ex">прочитана, решены</span> (подробно — в главе «Н и НН»).</p>
  <p>У действительных причастий краткой формы нет: нельзя сказать «ученик читающ».</p>
  <p><b>Краткое причастие или краткое прилагательное?</b> Краткое причастие образовано от глагола и сохраняет значение действия: к нему можно задать вопрос «кем? чем?» и подставить полную форму с суффиксом причастия: <span class="ex">дорога занесена (чем?) снегом — занесённая; дверь заперта — запертая</span>. Краткое прилагательное — это краткая форма полного прилагательного и называет свойство, а не действие над предметом: <span class="ex">берег виден (видный), обед готов (готовый), голос слышен (слышный), он силён (сильный), старик уныл (унылый)</span>. К нему нельзя поставить вопрос «кем? чем?» (нельзя сказать «берег виден кем-то» в значении действия), а полная форма — прилагательное, а не причастие.</p>
  <p><b>Полное причастие в сказуемом.</b> Обычно полное причастие — определение. Но со связкой <span class="ex">был, стал, оставался, казался</span> оно входит в сказуемое, как прилагательное: <span class="ex">Ружьё оставалось заряженным. Дом казался заброшенным.</span></p>
  <div class="bins"><div class="h">Морфологический разбор: полная и краткая форма</div><p>План разбора — в уроке 2. У страдательных причастий в непостоянных признаках указывается форма: полная или краткая. У краткого причастия падеж не указывается, а в предложении оно — сказуемое.</p>
  <p><b>Образец.</b> <span class="ex">Мы шли по тропинке, протоптанной в снегу.</span></p>
  <p>Протоптанной (по тропинке) — причастие, обозначает признак предмета по действию: по тропинке (какой?) протоптанной.<br>1. Н. ф. — протоптанный.<br>2. Пост. признаки: страд., прош. вр., сов. в.<br>3. Непост. признаки: полн. ф., ед. ч., ж. р., Д. п.<br>В предложении — определение (в составе причастного оборота).</p>
  <p><span class="ex">Тропинка протоптана.</span> Протоптана — причастие; н. ф. — протоптанный; страд., прош. вр., сов. в.; кратк. ф., ед. ч., ж. р.; в предложении — сказуемое.</p></div>
  <div class="bins bkey"><div class="h">Главное</div><p>Полное причастие склоняется, как прилагательное, и в предложении — определение. Краткое есть только у страдательных, не склоняется и в предложении — сказуемое.</p></div>`,
  lite:`<p>Причастие меняется так же, как прилагательное: по родам, числам и падежам — <span class="ex">читающий мальчик, читающая девочка, о читающих детях</span>.</p>
  <p><b>Как не ошибиться в окончании:</b> задать вопрос от существительного к причастию — он подскажет окончание: (каком?) → <b class="m">-ем/-ом</b>, (какой?) → <b class="m">-ей/-ой</b>, (каким?) → <b class="m">-им/-ым</b>. После <b>ж, ч, ш, щ</b> без ударения пишется <b class="m">е</b>:</p>
  <ul class="ul"><li>о (как<b class="m">ом</b>?) читающ<b class="m">ем</b> мальчике;</li>
  <li>у (как<b class="m">ой</b>?) поющ<b class="m">ей</b> птицы, с (как<b class="m">ой</b>?) прочитанн<b class="m">ой</b> книгой;</li>
  <li>к (как<b class="m">им</b>?) спящ<b class="m">им</b> детям.</li></ul>
  {{lab:decl}}
  <p><b>Краткие причастия</b> — короткие формы: <span class="ex">книга прочитана, задачи решены</span>. Они бывают только у страдательных причастий и пишутся с одной <b class="m">н</b>. В предложении краткое причастие — сказуемое (<span class="ex">Книга прочитана</span>), полное — определение (<span class="ex">Прочитанная книга лежит на столе</span>).</p>
  <div class="bins"><div class="h">Морфологический разбор: полная и краткая форма</div><p>План разбора — в уроке 2. У страдательных причастий в непостоянных признаках указывается форма: полная или краткая. У краткого причастия падеж не указывается, а в предложении оно — сказуемое.</p>
  <p><b>Образец.</b> <span class="ex">Мы шли по тропинке, протоптанной в снегу.</span></p>
  <p>Протоптанной (по тропинке) — причастие, обозначает признак предмета по действию: по тропинке (какой?) протоптанной.<br>1. Н. ф. — протоптанный.<br>2. Пост. признаки: страд., прош. вр., сов. в.<br>3. Непост. признаки: полн. ф., ед. ч., ж. р., Д. п.<br>В предложении — определение (в составе причастного оборота).</p>
  <p><span class="ex">Тропинка протоптана.</span> Протоптана — причастие; н. ф. — протоптанный; страд., прош. вр., сов. в.; кратк. ф., ед. ч., ж. р.; в предложении — сказуемое.</p></div>
  <div class="bins bkey"><div class="h">Запомнить</div><p>Окончание — по вопросу. Краткая форма — только у страдательных причастий, и в ней одна н.</p></div>`,
  easy:'Задать вопрос от существительного: окончание причастия будет таким же, как окончание вопроса (каком — читающем).',
  fix:'Таблица склонения выше показывает все окончания. Стоит пройти её для «читающий» и для «прочитанный».'

 {id:'pr6',t:'Правописание причастий',
  hint:'НЕ слитно с полным причастием без зависимых слов; раздельно — при зависимых словах, при противопоставлении и с краткой формой. Ненавидящий — всегда слитно.',
  h:`<h4>НЕ с причастиями</h4>
  <p><b>Слитно</b> пишется не с полными причастиями, у которых нет зависимых слов: <span class="ex">непрочитанная книга, неработающий лифт, незамеченная ошибка</span>. Слитно всегда, если без не слово не употребляется: <span class="ex">ненавидящий, негодующий, недоумевающий</span>.</p>
  <p><b>Раздельно</b>:</p>
  <ul class="ul"><li>при зависимых словах: <span class="ex">не прочитанная мною книга, лифт, не работающий с утра</span>;</li>
  <li>при противопоставлении с союзом «а»: <span class="ex">не прочитанная, а пролистанная книга</span>;</li>
  <li>с краткими причастиями: <span class="ex">книга не прочитана, ошибка не замечена</span>;</li>
  <li>при словах <span class="ex">вовсе, отнюдь, ничуть, далеко</span>: <span class="ex">вовсе не интересующийся</span>.</li></ul>
  {{lab:ne}}
  <h4>Н и НН</h4>
  <p>В полных страдательных причастиях прошедшего времени пишется <b class="m">нн</b> (<span class="ex">прочитанный, решённый</span>), в кратких — <b class="m">н</b> (<span class="ex">прочитана</span>). Как отличить причастие от отглагольного прилагательного (<span class="ex">жареный — зажаренный</span>), подробно разобрано в главе «Н и НН».</p>
  <div><button class="linkbtn" data-ch="nn">Глава «Н и НН» ›</button></div>
  <h4>Ё после шипящих</h4>
  <p>В суффиксах причастий и отглагольных прилагательных под ударением после шипящих пишется <b class="m">ё</b>: <span class="ex">решённый, привлечённый, сожжённый, испечённый</span>; так же — в прилагательных <span class="ex">тушёный, копчёный, жжёный</span> (почему в них одна н — в главе «Н и НН»). Без ударения пишется <b class="m">е</b>: <span class="ex">обеспеченный, увеличенный</span>. Не путать с существительными: <span class="ex">сильный ожог, поджог сарая</span> — в них <b class="m">о</b> (тема «О и Ё после шипящих»).</p>
  <p><b>Не путать существительное и глагол:</b> <span class="ex">поджог сарая, сильный ожог</span> — существительные, в них <b class="m">о</b>; <span class="ex">он поджёг сарай, обжёг руку</span> — глаголы прошедшего времени, в них <b class="m">ё</b>.</p>
  <div class="bins bnorm"><div class="h">Норма сегодня · Правила 2006</div><p>Правило о не с причастиями одинаково у Розенталя и в Правилах 2006 года. Не путать не с приставкой <b class="m">недо-</b>: <span class="ex">недосоленный суп, недооценённый талант</span> — это приставка со значением «меньше нормы», она пишется слитно всегда.</p></div>
  <div class="bins bkey"><div class="h">Главное</div><p>Полное без зависимых слов — слитно. Зависимые слова, противопоставление, краткая форма — раздельно. Ненавидящий и подобные — всегда слитно.</p></div>`,
  lite:`<p>Как писать <b>не</b> с причастием — слитно или раздельно? Сначала проверить: говорят ли это слово без «не»? <span class="ex">Ненавидящий, негодующий</span> — нет, поэтому пишутся <b>слитно всегда</b>. Для остальных — три вопроса по порядку.</p>
  <ol class="ul"><li>Причастие <b>краткое</b> (<span class="ex">книга не прочитана</span>)? → <b>раздельно</b>.</li>
  <li>У причастия есть <b>пояснение</b> — слово, которое к нему относится (<span class="ex">не прочитанная мною книга, лифт, не работающий с утра</span>)? Или есть противопоставление с <b>«а»</b> (<span class="ex">не прочитанная, а пролистанная</span>)? Или рядом слова <b>вовсе, ничуть, отнюдь, далеко</b>? → <b>раздельно</b>.</li>
  <li>Ничего этого нет → <b>слитно</b>: <span class="ex">непрочитанная книга, неработающий лифт</span>.</li></ol>
  {{lab:ne}}
  <p><b>Н и НН.</b> В полных страдательных причастиях — <b class="m">нн</b>: <span class="ex">прочитанная книга, решённая задача</span>. В кратких — одна <b class="m">н</b>: <span class="ex">книга прочитана, задача решена</span>.</p>
  <p><b>Ё или О после шипящих.</b> В суффиксе причастия под ударением — <b class="m">ё</b>: <span class="ex">решённый, сожжённый</span>; без ударения — <b class="m">е</b>: <span class="ex">обеспеченный</span>. В существительных <span class="ex">ожог, поджог</span> — <b class="m">о</b>, в глаголах <span class="ex">поджёг, обжёг</span> — <b class="m">ё</b>.</p>
  <div class="bins bkey"><div class="h">Запомнить</div><p>Под ударением после ж, ч, ш, щ в суффиксах причастий пишется <b>ё</b>: <span class="ex">решённый, привлечённый, сожжённый</span>.</p></div>`,
  easy:'Проверить три вещи по очереди: краткая форма? зависимое слово или «а»? Если ничего нет — слитно.',
  fix:'Схема «НЕ слитно или раздельно» проводит по шагам. Начать с пар «непрочитанная — не прочитанная мною».'
 },
 {id:'pr7',t:'Причастный оборот',
  deep:`<p><b>Оборот перед словом с оттенком причины.</b> Оборот перед определяемым словом иногда выделяется запятыми, если в нём есть добавочное значение причины: <span class="ex">Утомлённые долгой дорогой, путники быстро уснули</span> (= так как были утомлены). Обособляется и оборот, оторванный от определяемого слова другими членами предложения: <span class="ex">Укрытые снегом, спали за рекой поля</span> — оборот стоит перед словом «поля», но отделён от него сказуемым и обстоятельством. Подробно эти случаи разбираются в главе «Обособленные члены предложения». В обычных заданиях этой главы таких случаев нет: оборот перед словом — без запятых.</p>`,
  hint:'Оборот после определяемого слова — выделяется запятыми; перед ним — нет. Оборот при личном местоимении выделяется всегда.',
  h:`<p><b>Причастный оборот</b> — причастие вместе с зависимыми словами: <span class="ex">дети, [игравшие во дворе]</span>. В предложении весь оборот — одно определение. Слово, к которому относится оборот, называют <b>определяемым</b>.</p>
  <h4>Запятые</h4>
  <ul class="ul">
   <li>Оборот <b>после</b> определяемого слова выделяется запятыми: <span class="ex">Листья, опавшие за ночь, лежали на дорожке.</span></li>
   <li>Оборот <b>перед</b> определяемым словом запятыми не выделяется: <span class="ex">Опавшие за ночь листья лежали на дорожке.</span></li>
   <li>Оборот, относящийся к <b>личному местоимению</b>, выделяется всегда: <span class="ex">Уставшие после похода, мы легли спать. Мы, уставшие после похода, легли спать.</span></li>
  </ul>
  {{lab:commas}}
  <h4>Типичные ошибки</h4>
  <div class="tblw"><table class="bktbl"><thead><tr><th>Неверно</th><th>Верно</th></tr></thead><tbody>
   <tr><td>Написанное сочинение учеником…</td><td>Написанное учеником сочинение… / Сочинение, написанное учеником, …</td></tr>
   <tr><td>Ученики, сдавшего экзамен, …</td><td>Ученики, сдавшие экзамен, …</td></tr>
   <tr><td>Человек, прочитающий книгу, …</td><td>Человек, который прочитает книгу, …</td></tr>
   <tr><td>Письмо, получившее вчера, …</td><td>Письмо, полученное вчера, …</td></tr>
  </tbody></table></div>
  <p>Оборот нельзя разрывать определяемым словом; причастие согласуется с определяемым словом в роде, числе и падеже; залог причастия должен соответствовать смыслу.</p>
  <p><b>Однородные обороты.</b> Два оборота, относящиеся к одному слову, — однородные определения. Если они соединены одиночным союзом <b>и</b>, запятой между ними нет, а вся группа выделяется как один оборот: <span class="ex">Тропинка, протоптанная грибниками и петлявшая между соснами, вела к озеру.</span> Без союза между ними ставится запятая: <span class="ex">Лес, засыпанный снегом, притихший, казался спящим.</span> Оборот может быть однородным и с прилагательным: <span class="ex">жидкие, быстро летевшие облака</span> — запятая между однородными определениями.</p>
  <div class="bins bkey"><div class="h">Главное</div><p>После слова — запятые, перед словом — как правило, без запятых (редкие исключения — в «Тонкостях»; полностью — в главе «Обособленные члены предложения»). При местоимении — запятые всегда.</p></div>`,
  lite:`<p><b>Причастный оборот</b> — причастие вместе со словами, которые его поясняют: <span class="ex">опавшие за ночь</span>, <span class="ex">игравшие во дворе</span>.</p>
  <p><b>Где ставить запятые — три шага:</b></p>
  <ol class="ul"><li>Найти причастие и слова, которые к нему относятся. Это и есть оборот.</li>
  <li>Найти существительное, к которому относится оборот: листья (какие?) опавшие за ночь.</li>
  <li>Оборот стоит <b>после</b> этого слова — выделить его запятыми с двух сторон: <span class="ex">Листья, опавшие за ночь, лежали на дорожке.</span> Если оборот в конце предложения — одна запятая перед ним: <span class="ex">Мы смотрели на реку, покрытую льдом.</span> Оборот стоит <b>перед</b> словом — запятые не нужны: <span class="ex">Опавшие за ночь листья лежали на дорожке.</span></li></ol>
  <p><b>Особый случай:</b> оборот относится к словам <b>я, ты, мы, вы, он, она, оно, они</b> — запятые нужны всегда: <span class="ex">Уставшие после похода, мы легли спать.</span></p>
  {{lab:commas}}
  <p><b>Частые ошибки.</b> Нельзя разрывать оборот определяемым словом: неверно «Написанное сочинение учеником», верно «Написанное учеником сочинение». Причастие согласуется с определяемым словом: «ученики, сдав<b class="m">шие</b> экзамен». Будущего времени у причастий нет: «человек, который прочитает…».</p>
  <div class="bins bkey"><div class="h">Запомнить</div><p>Оборот после слова — запятые. Перед словом — как правило, без запятых. При я, мы, он и других таких словах — запятые всегда.</p></div>`,
  easy:'Найти слово, к которому относится оборот. Оборот справа от него — ставим запятые, слева — не ставим.',
  fix:'В схеме «Где запятые» оборот можно поставить перед словом и после него и сразу увидеть, как меняются знаки.'
 }
 ]
};

 {n:3,l:1,st:2,task:'Выписать причастия вместе с существительными, к которым они относятся. Поставить вопрос от существительного к причастию. Указать: 1) где стоит причастие — перед существительным или после него; 2) одиночное это причастие или при нём есть зависимые слова (если есть — выписать их). Часть предложения со словом «который» к зависимым словам не относится — её не выписывать.',
  obr:'На скамейке лежал оброненный кем-то шарф. → Шарф (какой?) оброненный — перед существительным, с зависимым словом (кем-то).',
  body:'1. Мелькающий свет запрыгал по грязным обоям и по потолку и прогнал потёмки. (А. П. Чехов, «Каштанка») 2. Фёдор Тимофеич, редко покидавший свой матрасик, тоже вошёл в спальню хозяина и стал тереться около его ног. (А. П. Чехов, «Каштанка») 3. Матушка отыскала мой паспорт, хранившийся в её шкатулке вместе с сорочкою, в которой меня крестили, и вручила его батюшке дрожащею рукою. (А. С. Пушкин, «Капитанская дочка») 4. Вокруг меня простирались печальные пустыни, пересечённые холмами и оврагами. (А. С. Пушкин, «Капитанская дочка») 5. Я углубился в виноградную аллею, ведущую в грот; мне было грустно. (М. Ю. Лермонтов, «Герой нашего времени») 6. Задок у одного дивана оселся вниз, наклеенное дерево местами отстало. (И. А. Гончаров, «Обломов») 7. С замиравшим сердцем воротился я наверх к Наташе. (Ф. М. Достоевский, «Униженные и оскорблённые») 8. Как сладко дремлет сад темно-зелёный, / Объятый негой ночи голубой! (Ф. И. Тютчев, «Как сладко дремлет сад темно-зелёный…») Пояснения: потёмки — темнота; Фёдор Тимофеич — кот; матрасик — здесь: подстилка кота; сорочка — рубашка; дрожащею — дрожащей (старая форма окончания); виноградная аллея — дорожка между рядами винограда; грот — пещера; задок — спинка; оселся — осел, опустился; наклеенное дерево — тонкие деревянные пластинки, которыми отделана мебель; воротился — вернулся; нега — сладкий покой, блаженство.'},
 {n:4,l:1,st:2,task:'Выписать причастия вместе с существительными, к которым они относятся. Указать у каждого причастия: 1) признаки глагола — вид, время, возвратность; 2) признаки прилагательного — число, род (в единственном числе), падеж. У краткого причастия падежа нет. Прилагательные не выписывать.',
  obr:'Девочка поливала распустившиеся тюльпаны. → (Тюльпаны) распустившиеся: сов. в., прош. вр., возвр.; мн. ч., В. п.',
  body:'1. Мы помогли заблудившемуся туристу найти тропу. 2. Над пристанью кружили чайки, потревоженные катером. 3. Малыш долго смотрел на улыбающуюся ему продавщицу. 4. Склеенная мамой чашка снова стоит на старой полке. 5. Ребята грелись у костра, гаснущего на ветру. 6. В заброшенном доме поселились совы. 7. Ворота парка закрыты на ночь. 8. Учёные наблюдают за просыпающимися после зимы медведями. 9. Сестра гордится золотой медалью, выигранной на соревнованиях.'},
 {n:5,l:1,st:2,task:'1) Распределить слова по трём столбикам: прилагательные, глаголы, причастия. Для каждого причастия записать замену «который…» с глаголом и выделить суффикс причастия (-ущ-/-ющ-, -ащ-/-ящ-, -вш-/-ш-, -нн-/-енн-). Столбики могут получиться разной длины. 2) В каждой паре найти причастие и прилагательное. Объяснить, чем они различаются: вопрос, значение, суффикс.',
  obr:'Красный — прилагательное; краснеет — глагол (что делает?); покрасневший — причастие (который покраснел), суффикс -вш-.',
  body:'1) Теплеет, стеклянный, высохший, тихий, созревший, потеплевший, звенит, застеклённый, спелый, затихает, тёплый, серебряный, затихающий, сверлит, рыжий, смолкнувший. 2) Висячий мост — висящая над дверью подкова; летучая мышь — летящая над водой чайка; сыпучий песок — сыплющийся с крыши снег.'},
 {n:6,l:1,st:3,task:'1) Выписать полные причастия вместе со словами, к которым они относятся; подчеркнуть их как определения (волнистой линией). 2) Выписать краткие причастия вместе с подлежащими (и со словами был, была, было, были, если они есть); подчеркнуть как сказуемые (двумя чертами). 3) Найти два кратких прилагательных в роли сказуемого и доказать, что это не причастия.',
  obr:'Найденная на чердаке шкатулка была заперта. → Шкатулка найденная — полное причастие, определение; шкатулка была заперта — краткое причастие, сказуемое (шкатулку заперли).',
  body:'1. Длинный подъезд этого дома с тремя стеклянными дверями был освещён дюжиной ярких фонарей. (А. П. Чехов, «Каштанка») 2. На перекладине этого деревянного, грубо сколоченного П висел колокол и был привязан пистолет; от языка колокола и от курка пистолета тянулись верёвочки. (А. П. Чехов, «Каштанка») 3. Все тропинки сада, покрывавшего отлогость против наших домов, были мне известны. (М. Ю. Лермонтов, «Герой нашего времени») 4. Высокая соболья шапка с золотыми кистями была надвинута на его сверкающие глаза. (А. С. Пушкин, «Капитанская дочка») 5. Занавес был не совсем задёрнут, и я мог бросить любопытный взгляд во внутренность комнаты. (М. Ю. Лермонтов, «Герой нашего времени») 6. Перед нею стоял кувшин воды, накрытый ломтем хлеба. (А. С. Пушкин, «Капитанская дочка») 7. Я слишком был счастлив, чтоб хранить в сердце чувство неприязненное. (А. С. Пушкин, «Капитанская дочка») Пояснения: П — здесь: цирковой снаряд в виде буквы П; курок — часть пистолета, на которую нажимают при выстреле; отлогость — пологий склон; соболья — из меха соболя; кисть — пучок нитей для украшения; занавес — штора на окне; внутренность комнаты — то, что внутри комнаты; неприязненный — недружелюбный, враждебный.'},
 {n:7,l:1,st:3,task:'Выписать из предложений все полные прилагательные и причастия в два столбика. Для каждого причастия доказать, что это причастие: заменить его словами «который…» с глаголом и назвать суффикс причастия (суффиксы причастий: -ущ-/-ющ-, -ащ-/-ящ-, -ем-/-им-, -вш-/-ш-, -нн-/-енн-, -т-). В одном предложении причастий нет.',
  obr:'Загорелые туристы разглядывали карту, начерченную от руки. → Прилагательное: загорелые (суффикс -л-, суффикса причастия нет). Причастие: начерченную — которую начертили, суффикс -енн-.',
  body:'1. Когда она совсем уже свыклась с новой жизнью и из тощей, костлявой дворняжки обратилась в сытого, выхоленного пса, однажды перед ученьем хозяин погладил её и сказал: — Пора нам, Тётка, делом заняться. (А. П. Чехов, «Каштанка») 2. Я увидела маленькую, худощавую старушку, сидевшую в огромных креслах. (Ф. М. Достоевский, «Неточка Незванова») 3. Лицо её, полное и румяное, выражало важность и спокойствие, а голубые глаза и лёгкая улыбка имели прелесть неизъяснимую. (А. С. Пушкин, «Капитанская дочка») 4. Поражённая видом окровавленной головы Юлая, оглушённая залпом, она казалась без памяти. (А. С. Пушкин, «Капитанская дочка») 5. Я поднял глаза: на крыше хаты моей стояла девушка в полосатом платье с распущенными косами, настоящая русалка. (М. Ю. Лермонтов, «Герой нашего времени») 6. Лишь высших гор до половины / Туманы покрывают скат, / Как бы воздушные руины / Волшебством созданных палат. (Ф. И. Тютчев, «Утро в горах») Пояснения: Тётка — новая кличка Каштанки; выхоленный пёс — холёный, с гладкой красивой шерстью; худощавый — худой; неизъяснимый — такой, что словами не объяснишь; Юлай — казак из крепости; залп — одновременный выстрел из многих ружей; хата — изба; скат — склон горы; руины — развалины; палаты — дворец, большой богатый дом.'},
 {n:8,l:1,st:3,task:'1) Заменить сочетание «который + глагол» причастием из слов для справок. Время причастия должно совпадать со временем глагола. Причастие вместе с зависимыми словами поставить перед существительным и согласовать с ним. В справках есть лишние причастия. 2) Указать число, род (в единственном числе) и падеж каждого полученного причастия. 3) В предложениях 2, 3, 4, 6 и 8 объяснить, почему не подошло второе причастие того же корня. Для этого сравнить время причастия и глагола, а также проверить: предмет, к которому относится причастие, сам совершает действие или действие совершает кто-то другой.',
  obr:'Мы любовались рекой, которая искрилась. → Мы любовались искрившейся рекой (ед. ч., ж. р., Т. п.); искрящейся не подходит: глагол «искрилась» — прошедшего времени.',
  body:'1. Мама укрыла пледом сына, который уснул. 2. Мы долго любовались звёздами, которые мерцали в небе. 3. На опушке мы увидели муравейник, который разорил медведь. 4. Дом, который построил прадед, стоит до сих пор. 5. Волонтёры накормили собак, которые замёрзли. 6. Девочка рассказала о книге, которую прочитала летом. 7. Мы подошли к реке, которая шумит за деревьями. 8. Брат гордится фотографией, которую напечатали в журнале. Слова для справок: уснувший, мерцающий, мерцавший, разоривший, разорённый, построивший, построенный, замёрзший, прочитавший, прочитанный, шумящий, напечатавший, напечатанный.'},
 {n:9,l:1,st:4,task:'Выписать причастия вместе с зависимыми словами и поставить вопрос от причастия к каждому зависимому слову. Указать у каждого причастия признаки глагола: вид, время, возвратность. У причастий из предложений 1–3 указать ещё признаки прилагательного: число, род (в единственном числе), падеж.',
  body:'1. Невозможно рассказать, какое действие произвела на меня эта простонародная песня про виселицу, распеваемая людьми, обречёнными виселице. (А. С. Пушкин, «Капитанская дочка») 2. Анна Власьевна, нетерпеливо ожидавшая её возвращения, осыпала её вопросами, на которые Марья Ивановна отвечала кое-как. (А. С. Пушкин, «Капитанская дочка») 3. Утомлённый долгой речью, я закрыл глаза и зевнул… (М. Ю. Лермонтов, «Герой нашего времени») 4. Лука Александрыч покачивался и инстинктивно, наученный опытом, старался держаться подальше от канавы. (А. П. Чехов, «Каштанка») 5. — Оттого, что вы заставляете её краснеть и меня также, — отвечала Александра Михайловна прерывающимся от волнения голосом. (Ф. М. Достоевский, «Неточка Незванова») 6. В окнах, уставленных резедой, бархатцами и ноготками, засуетились головы. (И. А. Гончаров, «Обломов») Пояснения: виселица — столб с перекладиной для казни через повешение; люди, обречённые виселице, — те, кого ждёт казнь; инстинктивно — само собой, по привычке; резеда, бархатцы, ноготки — садовые цветы; засуетились головы — в окнах замелькали люди.'},
 {n:10,l:1,st:4,task:'Ученик выписал из каждого предложения причастия, но ошибся. Найти ошибки: какие слова выписаны неверно и какие причастия пропущены. Объяснить каждую ошибку и записать верный ответ.',
  body:'1. Мы пошли на вал, возвышение, образованное природой и укреплённое частоколом. (А. С. Пушкин, «Капитанская дочка») Ученик выписал: образованное. 2. Любопытство привлекло ко мне некоторых из окружавших княжну; мало-помалу и все её покинули и присоединились к моему кружку. (М. Ю. Лермонтов, «Герой нашего времени») Ученик выписал: привлекло, присоединились. 3. Бунтующие деревни, при виде наших войск, приходили в повиновение; шайки разбойников везде бежали от нас, и всё предвещало скорое и благополучное окончание. (А. С. Пушкин, «Капитанская дочка») Ученик выписал: приходили, предвещало. 4. С полчаса гулял я по виноградным аллеям, по известчатым скалам и висящим между них кустарникам. (М. Ю. Лермонтов, «Герой нашего времени») Ученик выписал: виноградным, известчатым. 5. Потом отвели меня в тюрьму и оставили одного в тесной и тёмной конурке, с одними голыми стенами и с окошечком, загороженным железною решёткою. (А. С. Пушкин, «Капитанская дочка») Ученик выписал: тесной, тёмной, загороженным. 6. Поход был объявлен к завтрашнему дню. (А. С. Пушкин, «Капитанская дочка») Ученик выписал: завтрашнему. 7. Смотри, как запад разгорелся / Вечерним заревом лучей, / Восток померкнувший оделся / Холодной, сизой чешуёй! (Ф. И. Тютчев, «Смотри, как запад разгорелся…») Ученик выписал: разгорелся, оделся. Пояснения: вал — земляная насыпь вокруг крепости; частокол — забор из кольев; княжна — дочь князя; повиновение — покорность; известчатый — известковый, из известняка; между них — между ними; конурка — тесная каморка; зарево — красный свет заката на полнеба; чешуя — здесь: мелкие облака, похожие на рыбью чешую.'},
 {n:11,l:1,st:4,task:'Прочитать отрывок. 1) Выписать все причастия (полные и краткие) вместе со словами, к которым они относятся. Над каждым причастием указать вид и время. 2) Выписать краткие прилагательные. Объяснить, чем «покрыты» отличается от «тесны», хотя все эти слова — сказуемые. 3) Объяснить, почему «деревянным» — не причастие, хотя оно стоит рядом с причастием «выстроенным» и в нём тоже нн. 4) Объяснить, почему «остановилась» — глагол, а «скривившаяся» — причастие, хотя в обоих словах есть -ся.',
  body:'С одной стороны стояли три или четыре скирда сена, полузанесённые снегом; с другой скривившаяся мельница, с лубочными крыльями, лениво опущенными. <…> У ворот увидел я старую чугунную пушку; улицы были тесны и кривы; избы низки и большею частию покрыты соломою. Я велел ехать к коменданту, и через минуту кибитка остановилась перед деревянным домиком, выстроенным на высоком месте, близ деревянной же церкви. (А. С. Пушкин, «Капитанская дочка») Пояснения: скирд — большая высокая куча сена; лубочный — из луба, липовой коры; большею частию — большей частью; комендант — начальник крепости; кибитка — крытая повозка.'},
 {n:12,l:1,st:5,task:'Тонкость (см. «Тонкости» урока 1: переход причастий в прилагательные и существительные). В каждой паре предложений определить, чем является слово, повторяющееся в обоих предложениях (в паре 1 — слово того же корня): причастием, прилагательным или существительным. Доказать: есть ли значение действия, можно ли заменить слово на «который…», есть ли при нём определяемое существительное и зависимые слова. Помнить: причастие без существительного (урок 1: «перед глазами ехавших») называет того, кто совершает действие в этот момент; существительное называет человека по постоянному положению, занятию, роли.',
