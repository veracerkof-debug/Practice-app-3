 {n:73,l:6,st:4,task:'1) Списать, раскрывая скобки. Объяснить написание не. Подумать, какая приставка в слове «недовершённое»: недо- или не + до-. 2) Перестроить каждое сочетание с причастием так, чтобы написание не стало противоположным (слитное — раздельным или наоборот): убрать или добавить зависимые слова, заменить полную форму краткой или краткую полной. Объяснить, почему меняется написание. 3) Объяснить, почему написание не в словах «ненавидящий» и «невзлюбивший» не меняется ни при какой перестройке; составить с каждым предложение с зависимыми словами.',
  obr:'Рукопись, никем (не)изданная → не изданная (зависимое слово «никем»); неизданная рукопись (без зависимых слов — слитно); рукопись не издана (краткая форма — раздельно).',
  body:'1. Небольшой вал и засека, (не)хранимые решительно никем, показывали страшную беспечность. (Н. В. Гоголь, «Тарас Бульба») 2. Тогда было в ней что-то (не)оконченное, (не)довершённое, теперь это было произведение, которому художник дал последний удар кисти. (Н. В. Гоголь, «Тарас Бульба») 3. Наконец повёл он свой полк в засаду и скрылся с ним за лесом, который один был (не)выжжен ещё козаками. (Н. В. Гоголь, «Тарас Бульба») 4. Сам иноземный инженер подивился такой, никогда им (не)виданной тактике… (Н. В. Гоголь, «Тарас Бульба») Пояснения: засека — заграждение из поваленных деревьев; беспечность — беззаботность; козаки — казаки; иноземный — иностранный; тактика — способ вести бой.'},
 {n:74,l:6,st:4,task:'Найти и исправить ошибки в написании причастий. Объяснить каждое исправление. Четыре предложения написаны без ошибок: объяснить и их написание.',
  body:'1. Утром школьный двор был завален не убранными с осени листьями. 2. Ребята быстро расхватали неиспользованные в прошлый раз грабли. 3. Через час все дорожки были подметенны. 4. Только клумба у входа оставалась не прополотой. 5. Малыши из первого класса, вовсе не утомлённые, просили дать им ещё работу. 6. Старые ветки сложили в прицеп, присланый из парка. 7. Вечером мы пили чай с пирогами, испечонными нашими мамами. 8. Не покрашенная, а лишь побелённая стена сарая выглядела как новая. 9. Двор, преображённый за один день, было не узнать.'},
 {n:75,l:6,st:4,task:'1) Списать, раскрывая скобки. Распределить слова с не по трём столбикам: «не с причастием слитно», «не с причастием раздельно», «не с другими частями речи». Объяснить каждое написание. 2) Раскрыть скобки в сочетаниях и объяснить написание. Найти два сочетания, в которых не пишется слитно, хотя у причастия есть зависимое слово, и объяснить почему.',
  body:'1) 1. Здесь были все бурсаки, (не)вытерпевшие академических лоз и (не)вынесшие из школы ни одной буквы… (Н. В. Гоголь, «Тарас Бульба») 2. Покойница лежала на столе, жёлтая как воск, но ещё (не)обезображенная тлением. (А. С. Пушкин, «Гробовщик») 3. …и всю ночь стояла у огней, приглядываясь пристально во все концы, трезвая, (не)смыкавшая очей стража. (Н. В. Гоголь, «Тарас Бульба») 4. Но после несчастного вечера мысль, что честь его была замарана и (не)омыта по его собственной вине, эта мысль меня (не)покидала… (А. С. Пушкин, «Выстрел») 5. Это уже (не)был тот робкий исполнитель ветреных желаний вольного народа; это был неограниченный повелитель. (Н. В. Гоголь, «Тарас Бульба») 6. …пустыри, (не)заселённые места и леса, которых было тогда ещё вдоволь. (Н. В. Гоголь, «Тарас Бульба») 2) (Не)дооценённый современниками поэт; явно (не)доумевающие зрители; (не)сваренный, а совсем сырой рис; рукопись далеко (не)закончена; (не)дочитанная до конца книга. Пояснения: бурсак — ученик духовного училища (бурсы); академический — здесь: училищный; лозы — розги; тление — гниение; очи — глаза; стража — те, кто ночью охраняет лагерь; честь замарана — здесь: на ней пятно позора; ветреный — легкомысленный, переменчивый; пустырь — незастроенное место; вдоволь — много.'},
 {n:76,l:6,st:5,task:'1) Списать отрывки, вставляя пропущенные буквы и раскрывая скобки. 2) Объяснить написание не, н и нн, ё и е после шипящих в причастиях. 3) Объяснить, почему «(не)прибра..ые» пишется с не слитно, хотя стоит после определяемого слова и отделено запятыми. 4) Найти краткое прилагательное и краткое причастие, которые стоят рядом, и доказать, что это разные части речи.',
  body:'1. Длинные и чёрные, как уголь, волосы, (не)прибра..ые, растрёпа..ые, лезли из-под тёмного, наброш..нного на голову покрывала. … По длинным волосам, шее и полуобнаж..нной смуглой груди распознал он женщину. … Всё лицо было смугло, изнуре..о недугом… (Н. В. Гоголь, «Тарас Бульба») 2. Казалось, она была ещё молода, хотя в искаж..нных, измождё..ых чертах её нельзя было того видеть. (Н. В. Гоголь, «Тарас Бульба») Пояснения: недуг — болезнь; черты — черты лица (здесь: лицо худое и усталое от голода).'},
 {n:77,l:6,st:5,os:'сочинение',task:'Написать заметку для школьного сайта (7–9 предложений) на одну из тем: «Что мы нашли на чердаке старого дома», «Утро в походном лагере». Употребить: два причастия с не, которые пишутся слитно; два причастия с не, которые пишутся раздельно по разным причинам (зависимые слова, краткая форма или противопоставление); одно причастие с ё в суффиксе после шипящего и одно — с е без ударения; одно краткое причастие с одной н. Подчеркнуть эти причастия и объяснить их написание.',
  body:'Слова для справки: засушенные цветы, перевязанная бечёвкой пачка писем, поражённые находкой, нераспечатанный конверт, крышка не прибита.'},
// Урок 7
 {n:78,l:7,st:1,task:'1) Найти причастные обороты, заключить их в квадратные скобки и стрелкой показать определяемое слово. 2) Указать, где стоит оборот: перед определяемым словом или после него. 3) Отметить предложения, в которых причастие есть, но причастного оборота нет, и предложение, в котором причастия нет совсем.',obr:'На ветке сидела птица, [свившая здесь гнездо] → оборот «свившая здесь гнездо» стоит после определяемого слова «птица».',
  body:'1. Растаявший за ночь снег превратил двор в огромную лужу. 2. Мы долго разглядывали старую карту, выцветшую от времени. 3. На подоконнике грелся на солнце пушистый котёнок. 4. Ребята, побывавшие на экскурсии в обсерватории, наперебой рассказывали о планетах. 5. У крыльца лежал пёс с перевязанной лапой. 6. В витрине книжного магазина висел плакат, приглашающий на встречу с писателем. 7. Бабушка угостила нас вареньем из выращенной на даче смородины. 8. Все дорожки в парке уже расчищены. 9. Вечером мы гуляли по набережной, залитой огнями. 10. Шуршащие под ногами листья напоминали о скорой зиме.'},
 {n:79,l:7,st:2,task:'Списать, расставляя запятые. Объяснить каждую: оборот после определяемого слова, перед ним или при личном местоимении. Найти два предложения, в которых запятые при обороте не нужны, и одно предложение, где есть запятая по другому правилу.',obr:'Собака лаявшая за забором вдруг замолчала → Собака, лаявшая за забором, вдруг замолчала (оборот после определяемого слова — запятые с двух сторон).',
  body:'1. Тропинка петлявшая между соснами вывела нас к озеру. 2. Опоздавшие на автобус туристы пошли на станцию пешком. 3. Сторож дремал под навесом сколоченным из старых досок. 4. Застигнутые грозой мы забежали в ближайший подъезд. 5. Мальчик увидел в траве ящерицу гревшуюся на камне и позвал сестру. 6. Рисунки отобранные на конкурс украсили школьный коридор. 7. Дежурный принёс из библиотеки стопку выданных на неделю учебников. 8. Она погружённая в книгу не заметила как стемнело. 9. У калитки нас встретил дедушка приехавший на стареньком мотоцикле. 10. Ученики справившиеся с задачей и нашедшие в ней ловушку подняли руки.'},
 {n:80,l:7,st:2,task:'Списать, расставляя запятые при причастных оборотах (остальные знаки поставлены). Подчеркнуть оборот волнистой линией, стрелкой показать определяемое слово. Найти два предложения, в которых запятые при причастиях не нужны, и объяснить почему.',obr:'Ветер гнал по небу облака подкрашенные закатом → Ветер гнал по небу облака, подкрашенные закатом (оборот после слова «облака», в конце предложения — одна запятая).',
  body:'1. Пальто и узелок подброшенные снизу упали возле Егорушки. (А. П. Чехов, «Степь») 2. Зверь отседает — и в смертной тоске / Плачет помещик припавший к луке. (Н. А. Некрасов, «Псовая охота») 3. Уверенный в её привязанности никогда не мог он добиться её доверенности. (А. С. Пушкин, «Дубровский») 4. Иван Иваныч отворил калитку и вместе с Егорушкой увидел большой двор поросший бурьяном и репейником. (А. П. Чехов, «Степь») 5. Сквозь слёзы застилавшие глаза Егорушка не видел, как вышли дядя и о. Христофор. (А. П. Чехов, «Степь») 6. Ребятишки возились и визжали тут же, под ногами лошадей равнодушно жевавших сено. (А. И. Куприн, «Олеся») 7. …и от ворот с выражением исполненного долга бежала назад только что лаявшая рыжая собака. (А. П. Чехов, «Степь») 8. На раскалённом и точно подёрнутом серебристой пылью небе не показалось ни одного облачка. (А. И. Куприн, «Олеся») Пояснения: отседать — здесь: уходить от погони (охотничье слово; речь о звере, за которым гнались собаки); лука — выгнутый край седла; привязанность — любовь, преданность (речь о дочери героя); доверенность — здесь: доверие; калитка — небольшая дверь в заборе; репейник — колючий сорняк; о. — отец (так называют священника); точно — здесь: как будто.'},
 {n:81,l:7,st:3,task:'Списать, расставляя пропущенные запятые (пропущены только запятые при причастных оборотах). Выписать обороты в три столбика: а) после определяемого слова; б) перед определяемым словом; в) при личном местоимении. Рядом с каждым оборотом записать определяемое слово.',obr:'Разбуженные громом мы долго не могли уснуть → Разбуженные громом, мы долго не могли уснуть: в) оборот при личном местоимении «мы» — запятая нужна, хотя оборот стоит перед словом.',body:'1. Одни только грачи состарившиеся в степи и привыкшие к степным переполохам покойно носились над травой… (А. П. Чехов, «Степь») 2. Сонная, изморённая зноем поднимает она голову и глядит на встречных. (А. П. Чехов, «Степь») 3. Ах, странно так я создан небесами, / Таков мой рок, / Что хлеб полей возделанных рабами / Нейдёт мне впрок! (Н. А. Некрасов, «На родине») 4. Наконец достигнул он маленькой лощины со всех сторон окружённой лесом; ручеёк извивался молча около деревьев полуобнажённых осенью. (А. С. Пушкин, «Дубровский») 5. Сначала они только молча и бесцеремонно разглядывали беспомощную, пугливо озиравшуюся по сторонам девушку. (А. И. Куприн, «Олеся») 6. Глубоко оскорблённая она села под окошко… (А. С. Пушкин, «Дубровский») Пояснения: переполох — суматоха, тревога; покойно — спокойно; изморённая зноем — совсем без сил от жары (в предл. 2 речь о девушке, которая лежит на возу со снопами); рок — судьба; возделать — обработать землю под посев; рабы — здесь крепостные крестьяне; нейдёт впрок — не идёт на пользу; лощина — низина между холмами; бесцеремонно — грубо, не стесняясь.'},
 {n:82,l:7,st:3,task:'Найти в предложениях все причастия (в том числе краткие). Определить, что перед нами: одиночное причастие, причастный оборот (где он стоит — перед определяемым словом или после него) или краткое причастие. Объяснить, почему одни причастия и обороты выделены запятыми, а другие нет. Все знаки поставлены.',obr:'Над рекой поднимался густой туман, скрывавший берега → «скрывавший берега» — оборот после слова «туман»; выделен, в конце предложения — одна запятая.',
  body:'1. На рассвете она задремала, но тонкий сон её был встревожен печальными видениями, и лучи восходящего солнца уже разбудили её. (А. С. Пушкин, «Дубровский») 2. Такие неподвижные, кого-то поджидающие фигуры стоят на холмах, прячутся за курганами, выглядывают из бурьяна, и все они походят на людей и внушают подозрение. (А. П. Чехов, «Степь») 3. Взяли так наши солдаты сколько-то обессилевших, голодных немцев, покормили их, повели куда-то за собой. (М. М. Пришвин, «Августовские леса») 4. Минуты две было тихо, точно обоз уснул, и только слышалось, как вдали мало-помалу замирало лязганье ведра, привязанного к задку брички. (А. П. Чехов, «Степь») 5. Тотчас же на земле закипела свалка, и десятки тел смешались в одну общую кричащую массу. (А. И. Куприн, «Олеся») 6. Егорушка стал есть, хотя после леденцов и маковников, которые он каждый день ел у себя дома, не находил ничего хорошего в меду, наполовину смешанном с воском и с пчелиными крыльями. (А. П. Чехов, «Степь») Пояснения: фигуры — здесь: кусты и камни, которые ночью в степи похожи на людей; курган — древний земляной холм; в предл. 3 речь о пленных, которых солдаты нашли в лесу; обоз — ряд телег с грузом; задок — задняя часть повозки; свалка — здесь: драка многих людей; маковник — сладость с маком.'},
 {n:83,l:7,st:3,task:'1) В предложениях 1–8 заменить часть со словом «который» причастным оборотом; записать предложение, расставить запятые. Указать, какое причастие получилось: действительное или страдательное. В трёх предложениях замена невозможна: найти их и объяснить, что мешает. В предложении 8 три части со словом «который» — проверить каждую. Для этого подумать: оборот называет действие, которое совершает сам предмет (действительное причастие), или действие, которое совершают над ним (страдательное); есть ли у глагола нужное причастие? 2) В предложениях 9 и 10 сделать обратное: оборот заменить частью со словом «который».',obr:'Сад, который окружает дом, зарос сиренью → Сад, окружающий дом, зарос сиренью (действительное причастие: сад сам окружает дом).',
  body:'1. Мы поднялись на холм, который возвышался над деревней. 2. Открытку, которую подписали все гости, мы отправили бабушке. 3. Котёнка, которого взяли из приюта, мы назвали Пиратом. 4. Старушка, которой мы помогли перейти улицу, поблагодарила нас. 5. Ученики, которые поедут на олимпиаду, соберутся в субботу. 6. Упражнение, которое нам задали на дом, оказалось нетрудным. 7. Посёлок, в котором живёт бабушка, стоит у самой реки. 8. Кто же, наконец, этот неуловимый, таинственный Варламов, о котором так много говорят, которого презирает Соломон и который нужен даже красивой графине? (А. П. Чехов, «Степь») 9. Автобус, остановившийся у подъезда, привёз гостей из Самарканда. 10. Мальчик, решающий задачу у доски, объясняет каждый шаг.'},
 {n:84,l:7,st:3,task:'Переставить причастные обороты: если оборот стоит после определяемого слова — поставить его перед словом, если перед — после. Записать новые предложения с правильными знаками. Объяснить, почему в двух предложениях запятые при обороте остались. В предложениях 9 и 10 объяснить, что произошло с запятыми и почему.',obr:'Подхваченные ветром листья летели вдоль дороги → Листья, подхваченные ветром, летели вдоль дороги.',
  body:'1. Над крышами кружили голуби, вспугнутые громким хлопком. 2. Мы подошли к дому, простоявшему два века. 3. Растерявшиеся от неожиданности, мы не сразу ответили. 4. Ударивший ночью мороз затянул лужи льдом. 5. Брат рассказал мне о мореплавателях, обогнувших Африку. 6. Привезённые из похода камни мы сложили на полке. 7. Она, разомлевшая от жары, сразу уснула. 8. Ученики, дежурившие в столовой, получили благодарность. 9. Над рекой висел густой, пахнувший тиной туман. 10. Сад, одичавший без хозяев и обнесённый старым забором, тянулся до самого оврага.'},
 {n:85,l:7,st:3,task:'Объединить два предложения в одно, превратив второе в причастный оборот. Поставить оборот так, как указано в скобках. Расставить запятые.',obr:'На столе стояла ваза. Вазу слепил брат на занятиях кружка (после) → На столе стояла ваза, слепленная братом на занятиях кружка.',
  body:'1. На опушке стоял старый дуб. Дуб расколола молния (после). 2. Мы поблагодарили прохожего. Прохожий показал нам дорогу к музею (после). 3. Девочка прижимала к себе котёнка. Котёнка подобрали на улице (перед). 4. Мы шли по мосту. Мост перекинут через узкую речку (после). 5. Мы заблудились в лесу. Мы добрались до деревни только к вечеру (оборот при местоимении «мы», в начале предложения). 6. Ветер раскачивал сосны. Сосны выросли на крутом берегу (перед). 7. Мы долго разглядывали старинные часы. Эти часы изготовил тульский мастер двести лет назад (после). 8. Мы любовались закатом. Закат окрасил небо в розовый цвет (после).'},
 {n:86,l:7,st:4,task:'В заметке для школьной газеты восемь ошибок в причастных оборотах: в запятых, в порядке слов, в форме и выборе причастия. Найти и исправить их, объяснить каждое исправление. Два предложения написаны без ошибок.',
  body:'1. В субботу в нашей школе состоялся шахматный турнир, организованный учениками седьмых классов. 2. Собравшиеся в актовом зале, болельщики с волнением следили за ходом партий. 3. Участники, приехавшие из соседних школ быстро освоились в незнакомой обстановке. 4. Предложенные задачи судьями оказались непростыми. 5. Ребята, проигравшего в первом туре, не расстроились и поддерживали друзей. 6. Чемпионом стал Тимур Алиев, набравший больше всех очков. 7. Кубок, завоевавший Тимур, теперь стоит в витрине у входа. 8. Поглощённые борьбой мы совсем забыли про обед. 9. Шахматисты, выступящие на весенних соревнованиях, начнут тренироваться уже в январе. 10. Занятия проходят в кабинете оборудованном специально для кружка.'},
 {n:87,l:7,st:4,task:'1) Расставить запятые при причастных оборотах (остальные знаки поставлены). Выписать обороты вместе с определяемыми словами и знаками вокруг них, стрелкой показать определяемое слово. 2) В трёх предложениях рядом с оборотом стоит не одно слово, к которому он мог бы относиться: «один из подводчиков» (предл. 2), «Троекуров … за ним» (предл. 3), «мазница с дёгтем и кистью» (предл. 6). Доказать по роду, числу и падежу причастия, к какому слову относится оборот. 3) Найти однородные обороты и объяснить, почему между ними нет запятой.',obr:'',
  body:'1. Избалованный всем, что только окружало его он привык давать полную волю всем порывам пылкого своего нрава и всем затеям довольно ограниченного ума. (А. С. Пушкин, «Дубровский») 2. Один из подводчиков шедших далеко впереди рванулся с места, побежал в сторону и стал хлестать кнутом по земле. (А. П. Чехов, «Степь») 3. Троекуров вышел вслед за ним сопровождаемый всем судом. (А. С. Пушкин, «Дубровский») 4. Последние были теперь много ниже ростом и, когда вгляделся в них Егорушка, оказались обыкновенными мужиками державшими на плечах не пики, а железные вилы. (А. П. Чехов, «Степь») 5. В девять часов утра заблаговестили к обедне, и всё потянулось к новой каменной церкви построенной Кирилом Петровичем и ежегодно украшаемой его приношениями. (А. С. Пушкин, «Дубровский») 6. Почти в ту же минуту над головами беснующихся баб появилась мазница с дёгтем и кистью передаваемая из рук в руки. (А. И. Куприн, «Олеся») Пояснения: нрав — характер; подводчик — возчик, который везёт груз на телеге; в предл. 3 «за ним» — за старым Дубровским, которого уводят из суда; суд — здесь: судьи и чиновники; последние — здесь: «великаны», которых Егорушка увидел ночью в грозу; заблаговестить — зазвонить в колокол, созывая на службу; обедня — утренняя церковная служба; приношения — подарки, пожертвования; мазница — ведёрко для дёгтя; дёготь — чёрная густая смола (в предл. 6 толпа хочет вымазать девушку дёгтем).'},
 {n:88,l:7,st:4,task:'1) Списать, расставляя запятые при причастных оборотах (остальные знаки поставлены). 2) Выписать все причастия в три столбика: а) в составе причастного оборота; б) полные одиночные; в) краткие. 3) Указать, каким членом предложения является каждое краткое причастие; найти краткое причастие, которое вместе с глаголом является однородным сказуемым. 4) Найти два кратких прилагательных и доказать, что это не краткие причастия.',obr:'',
  body:'1. Кирила Петрович нахмурился; воспоминания возбуждаемые в нём погорелой усадьбою были ему неприятны. (А. С. Пушкин, «Дубровский») 2. Владимир Дубровский воспитывался в Кадетском корпусе и выпущен был корнетом в гвардию… (А. С. Пушкин, «Дубровский») 3. Густой, чёрный дым большими клубами шёл из-под длинных камышовых крыш приплюснутых к земле и лениво поднимался вверх. (А. П. Чехов, «Степь») 4. Конюшни полны были дорожных лошадей, дворы и сараи загромождены разными экипажами. (А. С. Пушкин, «Дубровский») 5. …с погашенными огнями, как чёрный гроб, застряла наша машина между деревьями. (М. М. Пришвин, «Августовские леса») 6. Свет от костра лежал на земле большим мигающим пятном… (А. П. Чехов, «Степь») Пояснения: погорелая усадьба — усадьба, где был пожар (речь об усадьбе Дубровских); Кадетский корпус — военное училище для мальчиков из дворянских семей; корнет — младший офицерский чин в коннице; гвардия — отборные войска; камышовые крыши — крыши из камыша; приплюснутый — плоский, низкий; дорожные лошади — лошади, на которых приехали гости; экипаж — повозка, карета; в предл. 5 речь об автомобиле, который ночью застрял в лесу на снежной дороге.'},
 {n:89,l:7,st:5,os:'работа с текстом',task:'1) Списать текст, расставляя запятые при причастных оборотах (остальные знаки поставлены). 2) Подчеркнуть обороты, стрелкой показать определяемые слова. 3) Найти однородные обороты и объяснить, почему между ними нет запятой. 4) Объяснить, почему после слова «деревне» стоит только одна запятая, хотя у неё в этом месте две задачи. 5) Выписать одиночное причастие и краткое причастие из последнего предложения; указать, каким членом предложения является краткое причастие.',
  body:'Владимир Андреевич приближался к той станции, с которой должен он был своротить на Кистенёвку. Сердце его исполнено было печальных предчувствий, он боялся уже не застать отца в живых, он воображал грустный образ жизни ожидающий его в деревне глушь, безлюдие, бедность и хлопоты по делам, в коих он не знал никакого толку. <…> Вскоре явился к Владимиру Андреевичу старый кучер Антон некогда водивший его по конюшне и смотревший за его маленькой лошадкою. <…> Владимир Андреевич отказался от предлагаемого завтрака и спешил отправиться. <…> Он ехал берегом широкого озера, из которого вытекала речка и вдали извивалась между холмами; на одном из них над густою зеленью рощи возвышалась зелёная кровля и бельведер огромного каменного дома, на другом пятиглавая церковь и старинная колокольня; около разбросаны были деревенские избы с их огородами и колодезями. (А. С. Пушкин, «Дубровский») Пояснения: станция — почтовая станция, где меняли лошадей; своротить — свернуть; в коих — в которых; не знать толку — ничего не понимать; лошадкою — старая форма (лошадкой); бельведер — башенка над крышей дома; пятиглавая — с пятью куполами; кровля — крыша.'},
 {n:90,l:7,st:5,os:'работа с текстом',task:'1) Отредактировать текст: заменить части со словом «который» причастными оборотами везде, где это возможно (не меньше пяти замен). Хотя бы один оборот поставить перед определяемым словом. Расставить запятые. Найти часть, которую заменить нельзя, и объяснить, что мешает (подумать: совершает ли сам предмет действие или его совершают над ним). 2) Продолжить текст двумя-тремя предложениями о скворцах, употребив причастный оборот при личном местоимении.',
  body:'Мы живём в доме, который возвели ещё до войны. Во дворе растёт старый тополь, который помнит ещё моего прадеда. Каждую весну на тополе поселяются скворцы, которые прилетают с юга в конце марта. Мальчишки, которые дружат с нами, соорудили для птиц домик. Домик, который они повесили на высокую ветку, мы разглядываем из нашего окна. По вечерам мы с сестрой смотрим на птиц, которые кормят птенцов. Я люблю этот тополь, о котором мне так много рассказывал дедушка.'},
// Урок 8. Повторение
 {n:91,l:8,st:1,task:'Выписать из текста причастия вместе со словами, к которым они относятся. Над каждым причастием указать: полное или краткое, действительное или страдательное, время. Найти в тексте краткое прилагательное и доказать, что это не причастие.',obr:'Подарок, завёрнутый в яркую бумагу, лежал в шкафу → завёрнутый (подарок) — полн., страд., прош. вр.',
  body:'Школьный музей открылся в прошлом году. Он невелик, но экспонатов в нём больше трёхсот. В просторном зале, увешанном старыми фотографиями, выставлены вещи, найденные ребятами во время походов. На отдельной витрине лежат пожелтевшие письма и полевая сумка, пробитая осколком. Рядом висит карта, начерченная одним из первых выпускников школы. Экскурсии для младших классов проводят старшеклассники, увлекающиеся историей родного края. К каждому предмету прикреплена табличка с надписью. Посетители, впервые попавшие в музей, всегда задерживаются у старого патефона.'},
 {n:92,l:8,st:2,task:'1) Определить вид и переходность глаголов и образовать от каждого все возможные причастия (у одного из глаголов есть все четыре причастия). 2) Выделить в причастиях суффиксы и объяснить выбор гласной.',obr:'Видеть (несов., перех.): вид-ящ-ий (видят, II спр. — исключение), виде-вш-ий (как перед -ть), вид-им-ый (II спр.), вид-енн-ый (глагол не на -ать/-ять → е; виденный много раз фильм).',
  body:'Дышать, выкрасить, таять, уронить, зависеть, бороться, вспахать, слышать.'},
 {n:93,l:8,st:3,task:'1) В предложениях 1–8 раскрыть скобки, объяснить слитное или раздельное написание не. 2) В предложениях 9–15 вставить пропущенные буквы суффикса (н, нн или другую букву) и объяснить написание.',obr:'Мы прошли по (не)скошенному лугу → нескошенному: полное причастие без зависимых слов — слитно.',
  body:'1. (Не)дописанное до конца письмо осталось в ящике стола. 2. Мы слушали рассказ с (не)ослабевающим интересом. 3. Окна на зиму ещё (не)утеплены. 4. Болельщики, (не)истовствующие на трибунах, заглушали свисток судьи. 5. Это была (не)выдуманная, а настоящая история. 6. Дети, ничуть (не)оробевшие перед грозой, продолжали игру. 7. Тайна так и осталась (не)разгаданной. 8. Из-за (не)выученного правила я ошибся в диктанте. 9. Ребята собрали рассыпа..ые по полу бусины. 10. Все пирожки съеде..ы. 11. Бабушка достала из сундука шаль, сотка..ую ещё прабабушкой. 12. Площадь перед театром выложе..а плиткой. 13. Мы ехали по асфальтирова..ому шоссе. 14. Все пуговицы на пальто уже приши..ы. 15. Тетради, сда..ые в пятницу, учитель вернёт в понедельник.'},
 {n:94,l:8,st:3,task:'Найти в предложениях причастия (их три; в одном предложении причастий нет) и выполнить их морфологический разбор по школьному плану. Записать разбор по пунктам, в столбик.',obr:'Город, укутанный снегом, затих.<br>Укутанный (город) — причастие, обозначает признак предмета по действию: город (какой?) укутанный.<br>1. Н. ф. — укутанный.<br>2. Пост. признаки: страд., прош. вр., сов. в.<br>3. Непост. признаки: полн. ф., ед. ч., м. р., И. п.<br>В предложении — определение (в составе причастного оборота).<br>У действительных причастий пункт «полная или краткая форма» не указывается; у кратких не указывается падеж.',
  body:'1. Над цветущей поляной кружились пёстрые бабочки. 2. Дорожки в саду посыпаны песком. 3. Старый деревянный мост скрипел под ногами. 4. Ребята читали письма, бережно передаваемые в семье из поколения в поколение.'},
 {n:95,l:8,st:3,task:'Списать, вставляя пропущенные буквы и раскрывая скобки (все запятые поставлены). Объяснить написание: какое правило действует в суффиксе, почему не пишется слитно или раздельно. Подчеркнуть причастные обороты.',obr:'Сарай, (не)достро..нный соседом, стоял без крыши → не достроенный: раздельно, есть зависимое слово «соседом»; достроить → -енн-, полное причастие — нн.',
  body:'1. Летом зной, зимой стужа и метели, осенью страшные ночи, когда видишь только тьму и не слышишь ничего, кроме беспутного, сердито во..щего ветра… (А. П. Чехов, «Степь») 2. Гости стали прощаться между собою, и каждый отправился в комнату, ему назнач..нную. (А. С. Пушкин, «Дубровский») 3. И схоронят в сырую могилу, / Как пройдёшь ты тяжёлый свой путь, / Бесполезно угасшую силу / И ничем (не)согре..ую грудь. (Н. А. Некрасов, «Тройка») 4. Этот дом назывался постоялым двором, хотя возле него никакого двора не было и стоял он посреди степи, ничем (не)огорож..нный. (А. П. Чехов, «Степь») 5. Скоро показался и хутор Болтвы, а ветряк всё ещё не уходил назад, не отставал, глядел на Егорушку своим лосн..щимся крылом и махал. (А. П. Чехов, «Степь») 6. Мы медленно пошли по тропинке, чуть розов..вшей на вечернем солнце. (А. И. Куприн, «Олеся») 7. Я не смею пасть к вашим ногам, благодарить небо за (не)понятную (не)заслуж..нную награду. (А. С. Пушкин, «Дубровский») Пояснения: в предл. 1 речь об одиноком тополе в степи; беспутный — здесь: дикий, буйный; схоронят — похоронят (в предл. 3 поэт говорит о тяжёлой судьбе крестьянки); постоялый двор — гостиница для путников; хутор — отдельная усадьба в степи; ветряк — ветряная мельница; своим лосн..щимся крылом — крылом, которое блестело на солнце.'},
 {n:96,l:8,st:3,task:'Выписать из предложений все слова, которые обозначают признак предмета и отвечают на вопрос «какой?» или «каков?» (кроме местоимений и числительных). Распределить их в два столбика: причастия и прилагательные. У причастий указать глагол, от которого они образованы. Объяснить, почему «загорелое» — не причастие, хотя похоже на него.',obr:'Каменный забор — прилагательное (образовано от существительного «камень», действия не называет); починенный забор — причастие (починить, суффикс -енн-).',
  body:'1. Лицо его с небольшой седой бородкой, простое, русское, загорелое лицо, было красно, мокро от росы… (А. П. Чехов, «Степь») 2. Большая белая собака, смоченная дождём, с клочьями шерсти на морде, похожими на папильотки, вошла в хлев и с любопытством уставилась на Егорушку. (А. П. Чехов, «Степь») 3. Одно крыло было старое, заплатанное, другое только недавно сделано из нового дерева и лоснилось на солнце. (А. П. Чехов, «Степь») 4. Вместе с тем с новой силой потянуло меня в лес, в одинокую покривившуюся хату. (А. И. Куприн, «Олеся») 5. Егорушка поднял голову и посоловевшими глазами поглядел вперёд себя; лиловая даль, бывшая до сих пор неподвижною, закачалась и вместе с небом понеслась куда-то ещё дальше… (А. П. Чехов, «Степь») Пояснения: в предл. 1 речь о купце Варламове; папильотки — бумажки, на которые накручивали волосы для завивки; хлев — сарай для скота; в предл. 3 речь о мельнице; в предл. 4 рассказчик только что выздоровел после болезни; посоловевшие глаза — сонные, вялые; вперёд себя — перед собой; неподвижною — старая форма (неподвижной).'},
 {n:115,l:8,st:3,task:'Списать пары, вставляя пропущенные буквы: сначала в окончании глагола (форма «они …»), затем в суффиксе причастия того же глагола. Над глаголом указать спряжение (I или II); если окончание безударное, определить спряжение по форме на -ть. Объяснить, почему в парах 1–13 гласная окончания подсказывает гласную суффикса, а в парах 14–16 — нет.',obr:'(они) сто..т — сто..щий → (они) стоят (II спр., стоять — окончание под ударением) — стоящий: -ящ-, как в окончании -ят.',body:'1. (они) бре..т — бре..щий 2. (они) хвал..т — хвал..щий 3. (они) пол..т — пол..щий 4. (они) колыш..тся — колыш..щийся 5. (они) смотр..т — смотр..щий 6. (они) клокоч..т — клокоч..щий 7. (они) тащ..т — тащ..щий 8. (они) плещ..тся — плещ..щийся 9. (они) топ..т — топ..щий 10. (они) вян..т — вян..щий 11. (они) производ..т — производ..мый 12. (они) исследу..т — исследу..мый 13. (они) кол..т — кол..щий 14. (они) ве..т — ве..вший 15. (они) зате..т — зате..вший 16. (они) завис..т — завис..вший'},
 {n:116,l:8,st:3,task:'(В формате ОГЭ/ЕГЭ, для 8–11 классов.) Укажите номера рядов, в которых в обоих словах пропущена одна и та же буква. Запишите ответ цифрами. Для проверки каждого слова определите спряжение глагола.',obr:'Ряд «(они) бор..тся, кол..щий»: борются (бороться, I спр.) — ю; колющий (колоть, I спр.) — ю → буквы совпадают, ряд записывается в ответ.',body:'1. (они) щипл..т, дремл..щий 2. (они) мир..тся, щебеч..щий 3. (они) точ..т, мч..щийся 4. (они) пиш..т, скач..щий 5. (вы) паш..те, люб..мый 6. (они) стон..т, вер..щий 7. (они) ре..т, ка..щийся 8. (они) маж..т, сид..щий'},
 {n:117,l:8,st:3,task:'(В формате ОГЭ/ЕГЭ, для 8–11 классов.) Укажите номера рядов, в которых в обоих словах пропущена одна и та же буква. Запишите ответ цифрами. Для каждого слова назовите правило: суффикс настоящего времени, гласная перед -вш- или перед -нн-.',obr:'Ряд «засе..нный, наде..вшийся»: засеянный (засеять: на -ять → я), надеявшийся (надеяться: перед -вш- та же гласная, что перед -ть, — я) → я — я, ряд записывается в ответ.',body:'1. обезвож..нный, увид..вший 2. просе..нный, посто..вший 3. выгул..нный, одол..вший 4. движ..мый, слыш..мый 5. выкраш..нный, раска..вшийся 6. обожа..мый, цен..мый 7. намаз..нный, раскле..нный 8. застро..нный, посвеж..вший'},
 {n:118,l:8,st:3,task:'(В формате ОГЭ/ЕГЭ, для 8–11 классов.) Раскройте скобки. Укажите номера предложений, в которых НЕ с причастием пишется СЛИТНО. Запишите ответ цифрами и объясните написание в каждом предложении.',obr:'«(Не)законченная работа» → незаконченная: полное причастие без зависимых слов — слитно; «работа, (не)законченная к сроку» → не законченная: есть зависимые слова — раздельно.',
  body:'1. …Через соседний (не)срубленный лес, / С пышно-румяного края небес / Солнце пронзалось стрелой лучезарной… (Н. А. Некрасов, «Саша») 2. Тоска громадная, (не)знающая границ. (А. П. Чехов, «Тоска») 3. После одной ночи, проведённой неизвестно где, он вернулся домой рано утром в сильно возбуждённом состоянии, красный и (не)причёсанный. (А. П. Чехов, «Палата № 6») 4. Барышня, (не)ожидавшая такого ласкового приёма, просияла… (А. П. Чехов, «Баран и барышня») 5. Посуда после ужина ещё (не)вытерта. 6. Это была (не)отменённая, а лишь перенесённая на осень поездка. 7. В (не)проветренном классе было душно. 8. На плите остывала (не)доваренная каша. Пояснения: пронзалось — здесь: проходило лучами насквозь; в предл. 1 речь о лесе, который стоит рядом с вырубкой; в предл. 2 речь о тоске старого извозчика, у которого умер сын.'},
 {n:119,l:8,st:3,task:'(В формате ОГЭ/ЕГЭ, для 8–11 классов.) Укажите все цифры, на месте которых пишется НН. Запишите ответ цифрами. Для каждого пропуска объясните выбор: полное или краткое страдательное причастие.',obr:'«Ворота, покраше(1)ые к празднику» → нн: полное страдательное причастие; «ворота покраше(2)ы» → н: краткое причастие. Ответ: 1.',body:'1. С этой целью они послали, как будто бы в дар монастырю, огромную свечу, начинё(1)ую порохом. (А. И. Куприн, «Олеся») 2. Вышли на небо светила ночные, / И над поверже(2)ым лесом луна / Остановилась, кругла и ясна… (Н. А. Некрасов, «Саша») 3. Тетради уже розда(3)ы ученикам. 4. Все фотографии, отсканирова(4)ые за выходные, мы сложили в одну папку. 5. Банка, заполне(5)ая вареньем, стояла на верхней полке. 6. Весь двор засыпа(6) жёлтыми листьями. 7. Пирог разреза(7) на восемь частей. 8. Мы долго гуляли по засаже(8)ой липами аллее. 9. На воротах и на санках были выжже(9)ы кресты. (И. А. Бунин, «Антоновские яблоки») 10. Статья отредактирова(10)а, но ещё не опубликова(11)а. 11. К началу похода все топоры оказались остро наточе(12)ыми. Пояснения: в предл. 1 речь о старинной легенде: враги хотели взорвать монастырь; светила ночные — луна и звёзды; повергнуть — здесь: свалить, срубить (в поэме вырубили лес).'},
 {n:120,l:8,st:3,task:'(В формате ОГЭ/ЕГЭ, для 8–11 классов.) Расставьте запятые при причастных оборотах (остальные знаки поставлены). Укажите номера предложений, в которых нужно поставить ОДНУ запятую. Запишите ответ цифрами и объясните каждую запятую.',obr:'«Мы вошли в дом построенный дедом.» → Мы вошли в дом, построенный дедом. Оборот стоит после слова, в конце предложения — одна запятая; предложение записывается в ответ.',
  body:'1. Я молчал удивлённый неожиданным оборотом речи. (А. И. Куприн, «Олеся») 2. Собаки чуявшие что-то необычайное окружили его и подняли лай… (А. П. Чехов, «Драма на охоте») 3. Иногда я возмущался против собственного бессилия и против привычки тянувшей меня каждый день к Олесе. (А. И. Куприн, «Олеся») 4. В темноте впереди вспыхнул огонёк, там было видно, как чья-то рука потянулась к этой дощечке прибитой на стволе дерева и потом сразу всё загамкало по-русски. (М. М. Пришвин, «Августовские леса») 5. Ярмола медленно вышедший из кухни принял у меня лошадь… (А. И. Куприн, «Олеся») 6. Озябшие на ветру мы вернулись домой раньше обычного. 7. Приглашённые на праздник гости собрались в саду. 8. Мы любовались старинным мостом перекинутым через овраг. Пояснения: чуять — чувствовать чутьём, по запаху; дощечка — здесь: указатель с надписью; загамкало — загалдело, все заговорили разом.'},
 {n:97,l:8,st:4,task:'Найти в предложениях причастия и выполнить их морфологический разбор по школьному плану (по пунктам, в столбик). Объяснить написание суффикса в первом причастии. Объяснить, почему у причастия во втором предложении время прошедшее, хотя речь идёт о будущем.',
  body:'1. Некоторые догадывались об истине и утверждали, что виновником сего ужасного бедствия был сам Дубровский, движимый злобой и отчаянием. (А. С. Пушкин, «Дубровский») 2. Никогда злодейство не будет совершено во имя ваше. (А. С. Пушкин, «Дубровский») 3. Она потянула за собою бурую траву, осоку, и Егорушка понёсся с необычайною быстротою за убегавшею далью. (А. П. Чехов, «Степь») Пояснения: сего — этого; бедствие — здесь: пожар в усадьбе; злодейство — преступление; во имя ваше — ради вас, от вашего имени (так Дубровский говорит Маше); она — степная даль, которая закачалась перед глазами сонного мальчика; осока — трава у воды.'},
 {n:98,l:8,st:4,task:'В письме десять ошибок: в суффиксах, в н и нн, в написании не, в запятых при причастном обороте, в употреблении причастий. Найти и исправить их, объяснить каждое исправление.',
  body:'Дорогая Аня! Вчера мы с классом были в заповеднике, раскинувшемся на берегу реки. Лесник, ждавший нас у ворот сразу повёл группу к озеру. Мы шли по аллее, обсаженная старыми дубами. Над озером кружили чайки, гоняимые ветром. У берега покачивались водяные лилии, нераспустившиеся ещё к нашему приходу. Нам показали бобровую плотину, сплетёную из веток и ила. Многие уголки этого леса до сих пор неисследованы. Потом мы разглядели в бинокль аистов, окольцевавших учёными прошлой осенью. Ещё мы узнали о журавлёнке, спасённом в прошлом году, и о фермере, засеевшем гречихой поле на опушке. Проголодавшиеся после долгой прогулки мы с удовольствием съели бутерброды в автобусе. Выданный нам на прощание, значок я привезу тебе. Твоя Катя.'},
 {n:99,l:8,st:4,task:'Комплексный анализ отрывка. 1) Выписать все причастия вместе с определяемыми словами; указать разряд (действительное или страдательное, время) и вид. 2) Выделить в причастиях суффиксы; объяснить, почему в словах «сжатая», «омытое», «обманутая» нет нн. 3) Доказать, что «рыжее», «полумёртвое» и «унылый» — прилагательные, а не причастия. 4) Объяснить запятые при причастных оборотах в первом предложении и найти в нём два однородных оборота, соединённых союзом «и».',
  body:'Сжатая рожь, бурьян, молочай, дикая конопля — всё, побуревшее от зноя, рыжее и полумёртвое, теперь омытое росою и обласканное солнцем, оживало, чтоб вновь зацвести. Над дорогой с весёлым криком носились старички, в траве перекликались суслики, где-то далеко влево плакали чибисы. Стадо куропаток, испуганное бричкой, вспорхнуло и со своим мягким «тррр» полетело к холмам. <…> Но прошло немного времени, роса испарилась, воздух застыл, и обманутая степь приняла свой унылый июльский вид. (А. П. Чехов, «Степь») Пояснения: жать рожь — срезать серпом колосья ржи; бурьян, молочай — сорные травы; старички — степные птицы; чибисы — болотные птицы; бричка — лёгкая повозка.'},
 {n:100,l:8,st:4,task:'1) Указать цифры, на месте которых должны стоять запятые. 2) Какие из этих запятых выделяют причастный оборот, а какие стоят по другим правилам (между частями сложного предложения, между однородными членами)? 3) Объяснить, почему на остальных местах запятые не нужны. 4) Выписать причастия, определить их разряд и вид.',obr:'',
  body:'1. Около семи часов вечера некоторые гости хотели ехать (1) но хозяин (2) развеселённый пуншем (3) приказал запереть ворота (4) и объявил (5) что до следующего утра никого со двора не выпустит. (А. С. Пушкин, «Дубровский») 2. С тех пор они каждый день бывали вместе (6) и Кирила Петрович (7) отроду не удостоивавший никого своим посещением (8) заезжал запросто в домишко своего старого товарища. (А. С. Пушкин, «Дубровский») 3. Егорушка нехотя глядел вперёд на лиловую даль (9) и ему уже начинало казаться (10) что мельница (11) машущая крыльями (12) приближается. (А. П. Чехов, «Степь») 4. Между тем перед глазами ехавших (13) расстилалась уже широкая (14) бесконечная равнина (15) перехваченная цепью холмов. (А. П. Чехов, «Степь») 5. Я приник губами к Олесиной руке (16) неподвижно лежавшей на одеяле (17) и стал покрывать её долгими (18) тихими поцелуями. (А. И. Куприн, «Олеся») Пояснения: пунш — горячий напиток; отроду — никогда в жизни; удостоивавший — старая форма (сейчас: удостаивавший); удостаивать кого-либо посещением — снисходить до того, чтобы приехать к нему в гости; товарищ — здесь: старый друг Андрей Гаврилович Дубровский; в предл. 5 рассказчик сидит у постели больной Олеси.'},
 {n:121,l:8,st:4,task:'(В формате ОГЭ/ЕГЭ, для 8–11 классов.) Прочитайте отрывок и выполните задания. 1) Укажите номера предложений, в которых есть причастный оборот, выделенный запятыми. 2) Выпишите из предложения 4 причастный оборот вместе с определяемым словом; объясните, почему он не выделен запятыми. 3) Укажите номер предложения, в котором причастный оборот выделен одной запятой, и объясните почему. 4) Из предложений 1–3 выпишите страдательное причастие; укажите его суффикс, время и вид. 5) Укажите номера предложений, в которых нет причастий. 6) Объясните запятые в предложении 1.',obr:'',
  body:'1. Между тем машинально я шёл всё дальше, лес редел понемногу, почва опускалась и становилась кочковатой. 2. След, оттиснутый на снегу моей ногой, быстро темнел и наливался водой. 3. Несколько раз я уже проваливался по колена. 4. Мне приходилось перепрыгивать с кочки на кочку; в покрывавшем их густом буром мху ноги тонули, точно в мягком ковре. 5. Кустарник скоро совсем окончился. <…> 6. Около печки что-то завозилось. 7. Я подошёл поближе и увидал старуху, сидевшую на полу. (А. И. Куприн, «Олеся») Пояснения: рассказчик заблудился в зимнем лесу на охоте, вышел к болоту и к одинокой избушке; кочковатый — с кочками; по колена — старая форма (по колено); их — кочки.'},
 {n:122,l:8,st:4,task:'(В формате ОГЭ/ЕГЭ, для 8–11 классов.) Укажите номера предложений, в которых допущена ошибка в построении предложения с причастным оборотом. Запишите ответ цифрами. Исправьте каждое ошибочное предложение и назовите ошибку: оборот разорван определяемым словом; причастие не согласовано с определяемым словом; выбран неверный залог (действительное вместо страдательного или наоборот); употреблена несуществующая форма причастия.',obr:'',body:'1. Участники олимпиады, справившиеся с заданиями раньше срока, могли покинуть аудиторию. 2. Обнаруженный клад археологами хранится теперь в городском музее. 3. Мы, посетившие эту выставку, советуем всем сходить на неё. 4. Среди экспонатов, привлёкших внимание гостей музея, был старинный глобус. 5. Жители домов, расположенного у самой реки, каждую весну боятся паводка. 6. Ребята, выступающие на завтрашнем концерте, волнуются уже сегодня. 7. Поделки, смастерившие учениками третьего класса, стоят в фойе театра. 8. Спортсмен, выигравший золотую медаль, поблагодарил тренера. 9. Пассажиры, опоздающие на поезд, могут сдать билеты в кассе. 10. Книги, заказанные в библиотеке, нужно забрать до пятницы.'},
 {n:123,l:8,st:4,task:'(В формате ОГЭ/ЕГЭ, для 8–11 классов.) Расставьте знаки препинания: укажите все цифры, на месте которых в предложениях должны стоять запятые. Запишите ответ цифрами. Объясните каждую запятую: выделяет причастный оборот, разделяет однородные члены или части сложного предложения.',obr:'',
  body:'1. Воробьи (1) стаями обсыпавшие придорожные ветлы (2) кричали так громко и возбуждённо (3) что ничего нельзя было расслышать за их криком. (А. И. Куприн, «Олеся») 2. Их глухие озёра (4) речки (5) мхи и доныне питают тот суеверный дух (6) почивающий на белорусах и литовцах (7) населяющих край. (М. М. Пришвин, «Августовские леса») 3. …Длинные окна (8) то полные мглы (9) / То озарённые беглым мерцаньем (10) / Тихо колеблются с робким бряцаньем. (Н. А. Некрасов, «Свадьба») 4. Я не мог более удерживать слёз (11) давно давивших мне горло (12) и жёгших глаза. (А. И. Куприн, «Олеся») 5. Им не забыть своих детей (13) / Погибших на кровавой ниве (14) / Как не поднять плакучей иве / Своих поникнувших (15) ветвей. (Н. А. Некрасов, «Внимая ужасам войны…») 6. Опустевший (16) после уроков (17) школьный двор (18) казался огромным. Пояснения: ветла — ива; в предл. 2 речь о глухих лесах на границе России; почивать на ком-либо — здесь: жить, сохраняться в людях; в предл. 3 речь об окнах старой церкви; бряцанье — звон, дребезжание; нива — поле; в предл. 5 поэт говорит о матерях погибших солдат.'},
 {n:101,l:8,st:5,os:'диктант',task:'Диктант. Записать под диктовку (читает учитель или родитель; слова «парусинковые» и «пестрядинная» до диктанта записать на доске). Подчеркнуть причастия волнистой линией, причастные обороты заключить в скобки. Объяснить запятые при оборотах и написание суффиксов причастий.',
  body:'Около полудня бричка свернула с дороги вправо, проехала немного шагом и остановилась. Егорушка услышал тихое, очень ласковое журчанье и почувствовал, что к его лицу прохладным бархатом прикоснулся какой-то другой воздух. Из холма, склеенного природой из громадных, уродливых камней, сквозь трубочку из болиголова, вставленную каким-то неведомым благодетелем, тонкой струйкой бежала вода. <…> Путники расположились у ручья отдыхать и кормить лошадей. Кузьмичов, о. Христофор и Егорушка сели в жидкой тени, бросаемой бричкою и распряжёнными лошадьми, на разостланном войлоке и стали закусывать. <…> Он никак не предполагал, что священники носят брюки, а на о. Христофоре были настоящие парусинковые брюки, засунутые в высокие сапоги, и кургузая пестрядинная курточка. (А. П. Чехов, «Степь») Пояснения: бричка — лёгкая повозка; болиголов — растение с толстым полым стеблем; благодетель — тот, кто делает добро; о. — отец (так называют священника); распрячь — снять с лошадей упряжь; войлок — плотный материал из шерсти; он — Егорушка (о. Христофор только что снял рясу — длинную одежду священника); парусинковые — из парусины, плотной ткани; кургузая — короткая и тесная; пестрядинная — из пестряди, грубой пёстрой ткани.'},

 if(s.k==='one'){const all=it.o||s.o,n=s.n||all.length;B.opts=shuffle([B.a,...shuffle(all.filter(x=>x!==B.a)).slice(0,n-1)])}

   return mFinal({k:'m',m:'hls',l,q,key,u:u.map(x=>({t:x.t,pu:x.pu,y:!!(key==='pr'?x.pr:key==='ob'?x.ob:x.ov),pr:x.pr})),sel:[]})},
  body:t=>`<div class="mst">${t.u.map((x,i)=>x.pu?`<span class="mpu">${x.t}</span>`:`<button class="mw sw ${mSelCls(t,i,x.y)}" data-ma="tog" data-i="${i}" ${t.res?'disabled':''}>${esc(x.t)}</button>`).join('')}</div>`,
  ready:t=>t.sel.length>0,
  act(t,d){if(d.ma!=='tog')return;if(t.key==='ov')t.sel=t.sel.includes(+d.i)?[]:[+d.i];else mTog(t.sel,+d.i)},
  grade(t){const ok=t.u.every((x,i)=>x.pu||x.y===t.sel.includes(i));const r=t.u.filter(x=>x.y).map(x=>x.t);
   return {ok,right:t.key==='pr'?r.map((w,i)=>w).join(', '):r.join(' '),

 // ── В. Расставить запятые (урок 7)
 cm:{t:'Расставить запятые',l:[7],d:'Нажимать на промежутки между словами, чтобы поставить или убрать запятую.',
  gen(c){const u=pick1(corpusSents(c.id,{commas:true,has:u=>u.some(x=>x.ob)}));
   const w=wkWords(u),need=[];let j=-1;u.forEach(x=>{if(x.t===',')need.push(j);else j++});
   const ov=w.findIndex(x=>x.ov),ob=w.findIndex(x=>x.ob),pron=ov>=0&&PRON.includes(w[ov].t.toLowerCase());
   const why=pron?'Оборот относится к личному местоимению — выделяется запятыми всегда.':ob>ov?'Оборот стоит после определяемого слова — выделяется запятыми.':'Оборот стоит перед определяемым словом — запятые не нужны.';
   return mFinal({k:'m',m:'cm',l:7,q:'Расставить запятые. Если запятые не нужны — сразу нажать «Проверить».',w:w.map(x=>({t:x.t,pu:x.pu})),need,sel:[],why})},
  body(t){let h='<div class="mst mcm">';t.w.forEach((x,i)=>{if(x.pu){h+=`<span class="mpu">${x.t}</span>`;return}
   if(i>0&&!t.w[i-1].pu){const g=i-1,on=t.sel.includes(g),y=t.need.includes(g);const cl=t.res?(on&&y?'ok':on?'bad':y?'miss':''):on?'on':'';
    h+=`<button class="gapb ${cl}" data-ma="gap" data-i="${g}" ${t.res?'disabled':''} aria-label="Запятая">${on||(t.res&&y)?',':'·'}</button>`}
   h+=`<span class="mword2">${esc(x.t)}</span>`});return h+'</div>'},
  ready:()=>true,
  act(t,d){if(d.ma==='gap')mTog(t.sel,+d.i)},

   const right=t.w.reduce((s,x,i)=>x.pu?s+x.t:(s?s+' ':'')+x.t+(t.need.includes(i)?',':''),'');return {ok,right,why:t.why}}},
 // ── Г. Подчеркнуть члены предложения (уроки 1, 5, 7)
 sx:{t:'Подчеркнуть члены предложения',l:[1,5,7],d:'Выбрать вид подчёркивания и нажимать на слова — как в тетради.',
  gen(c,les){const all=corpusSents(c.id,{mem:true});let pool=all,full=false,l;
   const v=[];if(les.includes(5))v.push(5);if(les.includes(1))v.push(1);if(les.includes(7))v.push(7);l=pick1(v);
   if(l===5)pool=all.filter(u=>u.some(x=>x.kr));                                   // краткое причастие — сказуемое
   else if(l===7){pool=all.filter(u=>u.some(x=>x.ob));full=Math.random()<.5}            // оборот — одно определение
   else{pool=all.filter(u=>u.some(x=>x.pr)&&!u.some(x=>x.ob||x.kr));full=true}       // полное причастие — определение
   const u=pick1(pool);
   return mFinal({k:'m',m:'sx',l,full,q:full?'Подчеркнуть все члены предложения. Причастный оборот — одно определение: подчеркнуть его целиком.':'Подчеркнуть грамматическую основу: подлежащее и сказуемое.',
    u:u.map(x=>({t:x.t,pu:x.pu,mem:x.mem})),mk:{},tool:'П'})},
  body(t){const tools=t.full?['П','С','О','Д','Б']:['П','С'];
   return `<div class="mpal">${tools.map(k=>`<button class="mtool ${t.tool===k?'on':''}" data-ma="tool" data-v="${k}" ${t.res?'disabled':''}><span class="${MEMC[k]}">${MEMB[k]}</span></button>`).join('')}<button class="mtool ${t.tool==='x'?'on':''}" data-ma="tool" data-v="x" ${t.res?'disabled':''}>стереть</button></div>
   <div class="mst msx">${t.u.map((x,i)=>{if(x.pu)return `<span class="mpu">${x.t}</span>`;const m=t.mk[i]||'',y=t.full?x.mem:(x.mem==='П'||x.mem==='С'?x.mem:'');
    const st=t.res?(m===y?'ok':'bad'):'';return `<button class="mw sw ${st}" data-ma="mark" data-i="${i}" ${t.res?'disabled':''}><span class="${m?MEMC[m]:''}">${esc(x.t)}</span>${t.res&&m!==y?`<small>${y?MEMB[y]:'не член основы'}</small>`:''}</button>`}).join('')}</div>`},
  ready:t=>Object.values(t.mk).some(Boolean),
  act(t,d){if(d.ma==='tool')t.tool=d.v;if(d.ma==='mark'){const i=+d.i;t.mk[i]=t.tool==='x'||t.mk[i]===t.tool?'':t.tool}},
  grade(t){const ok=t.u.every((x,i)=>x.pu||(t.mk[i]||'')===(t.full?x.mem:(x.mem==='П'||x.mem==='С'?x.mem:'')));
   const right=t.u.filter(x=>!x.pu&&(t.full?x.mem:(x.mem==='П'||x.mem==='С'))).map(x=>`${x.t} — ${MEMB[x.mem]}`).join('; ');
   return {ok,right,why:t.l===5?'Краткое причастие в предложении — сказуемое.':t.full?'Подлежащее — одна черта, сказуемое — две, определение — волнистая, дополнение — пунктир, обстоятельство — точка-тире.':'Подлежащее отвечает на вопрос «кто? что?», сказуемое — «что делает? каков?».'}}},
 // ── Д. Собрать причастие (урок 3)
 bw:{t:'Собрать причастие',l:[3],d:'Собрать причастие из основы, суффикса и окончания.',
  gen(c){const B=c.wk.build,v=pick1(Object.keys(B)),V=B[v],fi=pick1(V.f.map((f,i)=>f?i:-1).filter(i=>i>=0)),f=V.f[fi];
   const stems=[...new Set([V.pres[1],...V.inf[1].split(' / '),...V.f.filter(Boolean).map(x=>x[1])])];
   const ban=['нн','енн','ённ'].includes(f[2])?['нн','енн','ённ']:[f[2]]; // «виде+нн» = «вид+енн» — второй верный путь не даём
   return mFinal({k:'m',m:'bw',l:3,q:`Собрать ${['действительное причастие настоящего времени','страдательное причастие настоящего времени','действительное причастие прошедшего времени','страдательное причастие прошедшего времени'][fi]} от глагола «${v}».`,
    hint:`${V.pres[0]} · ${V.inf[0]}`,a:[f[1],f[2],f[3]],note:f[4]||'',rows:[shuffle(stems),shuffle([f[2],...sample(SUFS.filter(x=>!ban.includes(x)),3)]),shuffle(['ий','ый'])],sel:[null,null,null],fi})},
  body(t){const nm=['Основа','Суффикс','Окончание'];
   return `<div class="mbw"><div class="mbwp">${t.sel.map((x,i)=>`<span class="mseg ${x==null?'e':''} ${t.res?(x===t.a[i]?'ok':'bad'):''}">${x==null?'…':esc(x)}</span>`).join('<i>+</i>')}<b>= ${esc(t.sel.map(x=>x||'').join(''))||'…'}</b></div>
   ${S.easy&&!t.res?`<div class="bkhint">Опора: ${esc(t.hint)}</div>`:''}
   ${t.rows.map((r,i)=>`<div class="tl">${nm[i]}</div><div class="chips">${r.map(x=>`<button class="chipc" data-ma="pick" data-i="${i}" data-v="${esc(x)}" aria-pressed="${t.sel[i]===x}" ${t.res?'disabled':''}>${i===1?'-'+esc(x)+'-':esc(x)}</button>`).join('')}</div>`).join('')}</div>`},
  ready:t=>t.sel.every(x=>x!=null),
  act(t,d){if(d.ma==='pick')t.sel[+d.i]=d.v},
  grade(t){const yo=(x,a)=>x===a||(a.includes('ё')&&x===a.replace(/ё/g,'е')); // «нес+ш+ий» = «нёсший» без ё
   const ok=t.sel.every((x,i)=>i===0?yo(x,t.a[0]):x===t.a[i]);return {ok,right:`${t.a[0]}-${t.a[1]}-${t.a[2]} → ${t.a.join('')}`,
   why:(t.fi<2?'Настоящее время — от основы «они …».':'Прошедшее время — от основы инфинитива.')+(t.note?' Обратите внимание: '+t.note+'.':'')}}},
 // ── Е. Разобрать по составу (уроки 3, 4)
 mp:{t:'Морфемный разбор (2)',l:[3,4],d:'Нажимать между буквами, чтобы разделить слово на части, затем назвать каждую часть.',
  gen(c,les){const E=DICT.filter(e=>e.morph&&!MP_SKIP.includes(e.w)&&(c.wk.mpWords?c.wk.mpWords.includes(e.w):e.pos==='причастие')),e=pick1(E);

   h+=`<div class="mlet">${L.map((ch,i)=>`<span class="ml">${esc(ch)}</span>${i<L.length-1?`<button class="mcut ${t.b.includes(i)?'on':''}" data-ma="cut" data-i="${i}" ${t.res?'disabled':''} aria-label="Граница после ${esc(ch)}">${t.b.includes(i)?'|':''}</button>`:''}`).join('')}</div>`;
   h+=`<div class="tl">Части слова — выбрать вид выше и нажать на часть</div><div class="mword msegs">${segs.map(([s,e])=>{const x=t.w.slice(s,e+1),ty=t.ty[s+'-'+e];
    return `<button class="mp ${ty?'m-'+ty:''}" style="--mc:${ty?MT[ty][1]:'var(--l3)'}" data-ma="type" data-v="${s}-${e}" ${t.res?'disabled':''}><span class="mx">${esc(x)}</span></button>`}).join('')}</div>`;
   if(S.easy&&!t.res)h+=`<div class="bkhint">В этом слове ${t.a.length} ${t.a.length<5?'части':'частей'}.</div>`;
   return h},
  ready:t=>{const s=mSegs(t);return s.length>1&&s.every(([a,b])=>t.ty[a+'-'+b])},
  act(t,d){if(d.ma==='tool')t.tool=d.v;if(d.ma==='cut')mTog(t.b,+d.i);if(d.ma==='type')t.ty[d.v]=t.tool},

   const ok=s.length===exp.length&&s.every(([a,b],i)=>a===exp[i][0]&&b===exp[i][1]&&t.ty[a+'-'+b]===exp[i][2]);
   return {ok,right:t.a.map(([ty,x])=>`${x} — ${MT[ty][0]}`).join(', '),rightHTML:`<div class="mword">${t.a.map(([ty,x])=>`<span class="mp m-${ty}" style="--mc:${MT[ty][1]}"><span class="mx">${esc(x)}</span></span>`).join('')}</div>`,
    why:'Суффикс причастия показывает разряд: '+(t.a.find(m=>m[0]==='suf')||['',''])[1]+'.'}}},
 // ── Ж. Разложить по разрядам (урок 2)
 gr:{t:'Разложить по разрядам',l:[2],d:'Выбрать разряд и нажимать на причастия этого разряда.',

 // ── З. Пары: глагол — причастие (урок 3)
 pr:{t:'Соединить пары',l:[3],d:'Нажать на глагол, затем на причастие от него.',
  gen(c){const M=c.wk.matrix,vs=sample(Object.keys(M),4),pairs=vs.map(v=>[v,pick1(M[v][2].filter((x,i)=>x&&x!=='—'&&!(i===3&&M[v][0]==='несов.')))]); // редкие «читанный», «строенный» — не в пары

 // ── И. Четыре клетки (урок 2)
 mx:{t:'Четыре клетки',l:[2],d:'Выбрать причастие (или «нет такого») и нажать на клетку таблицы.',
  gen(c){const M=c.wk.matrix,PAIR={читать:'прочитать',прочитать:'читать',строить:'построить',построить:'строить',идти:'прийти',прийти:'идти'};

 // ── К. Буква и почему (урок 4)
 gw:{t:'Буква и «почему?»',l:[4],d:'Вставить букву и выбрать правило, по которому она пишется.',
  gen(c,les){const G=c.wk.gapWhy;

    const it=pick1(G.items.filter(x=>les.includes(x[4])))||pick1(G.items),[w,a,o,valid,l]=it,rs=shuffle([valid[0],...orthTraps(ORTHO_R[valid[0]].topic,valid,l)]);

const txGap=(c,x,les)=>{const R=x.or&&ORTHO_R[x.or.r[0]];return !!(R&&R.topic===c.id&&les.includes(R.l))};
const txPool=(c,les)=>corpusTexts(c.id).filter(T=>T.ss.some(u=>u.some(x=>txGap(c,x,les))));
// орфограммы общего корпуса для темы главы: [предложение, номер единицы]
function orthPool(c,les){const out=[];corpusSents(c.id,{has:u=>u.some(x=>x.or)}).forEach(u=>u.forEach((x,i)=>{const R=x.or&&ORTHO_R[x.or.r[0]];if(R&&R.topic===c.id&&les.includes(R.l))out.push([u,i])}));return out}
// ловушки «почему?»: сначала правила уже пройденных уроков темы, затем остальные
function orthTraps(topic,valid,l,n=3){const ks=Object.keys(ORTHO_R).filter(k=>ORTHO_R[k].topic===topic&&!valid.includes(k));

const orthOpts=o=>o.a==='н'||o.a==='нн'?['н','нн']:[o.a];

function gapWord(text,g,a,v,res,after=''){const ws=text.split(' '),full=g.replace('_',a).toLowerCase(),wi=ws.findIndex(w=>w.toLowerCase()===full);if(wi<0)return esc(text)+after;

 return ws.map((x,i)=>i===wi?x:esc(x)).join(' ')}

// гласная в «торты» на позиции 1 и т.п. — индексы букв от нуля
const VOW='аеёиоуыэюяАЕЁИОУЫЭЮЯ';
const BOX=[0,1,3,7,16];
const today=()=>Math.floor(Date.now()/864e5);
const cst=id=>S.cards[id]||{b:0,due:0,seen:0};
function deckStats(d){const c=DECKS[d].cards;let due=0,nw=0,learned=0;const bx=[0,0,0,0,0];
 c.forEach(x=>{const s=S.cards[x.id];if(!s){nw++;return}bx[s.b]++;if(s.due<=today())due++;if(s.b>=3)learned++});return {n:c.length,due,nw,learned,bx}}
let study=null;
function startStudy(d){
 const c=DECKS[d].cards;
 const due=c.filter(x=>S.cards[x.id]&&S.cards[x.id].due<=today());
 const nw=c.filter(x=>!S.cards[x.id]).slice(0,10);
 let q=[...due,...nw];
 if(!q.length) q=[...c].sort(()=>Math.random()-.5).slice(0,10);
 q.sort(()=>Math.random()-.5);
 study={d,q,i:0,shown:false,pick:null,right:0,total:q.length};
}
function grade(ok){
 const card=study.q[study.i];const s=cst(card.id);
 s.b=ok?Math.min(4,s.b+1):0; s.due=today()+(ok?BOX[s.b]:0); s.seen=(s.seen||0)+1; S.cards[card.id]=s; save();
 if(ok) study.right++; else study.q.push(card);
 study.i++; study.shown=false; study.pick=null; render();
}

 obosob:{t:'Обособление',d:'Выделение части предложения запятыми на письме и интонацией в речи. Причастный оборот обособляется, если стоит после определяемого слова или относится к личному местоимению.',ex:'Листья, опавшие за ночь, лежали на дорожке. Уставшие после похода, мы легли спать.',cat:'Синтаксис и пунктуация',f:'обособ[а-яё]*|выделя(?:ется|ются|ться) запят[а-яё]*',at:'pr7',see:['prich_ob','zapyat','opr_slovo','dobav']},
 obst:{t:'Обстоятельство',d:'Второстепенный член предложения, который показывает, как, где, когда или почему совершается действие. Часто выражается наречием.',ex:'Он отвечал обдуманно. Листья лежали на дорожке.',cat:'Синтаксис и пунктуация',f:'обстоятельств[а-яё]*',at:'',see:['narech','chlen','deepr']},
 odnokor:{t:'Однокоренные слова',d:'Слова с одним и тем же корнем и близким значением.',ex:'жарить, жареный, зажаренный, жаркое',cat:'Морфемика и словообразование',f:'однокоренн[а-яё]*',at:'',see:['koren','ishod']},
 okonch:{t:'Окончание',d:'Изменяемая часть слова, которая показывает его связь с другими словами. Окончание полного причастия проверяют вопросом от существительного.',ex:'о (каком?) читающем мальчике; с (какой?) прочитанной книгой',cat:'Морфемика и словообразование',f:'окончани[а-яё]*',at:'pr5',see:['osnova','nul','sklon']},
 opred:{t:'Определение',d:'Второстепенный член предложения, который обозначает признак предмета и отвечает на вопросы «какой? чей?». Полное причастие и причастный оборот в предложении — определение.',ex:'прочитанная книга; листья, опавшие за ночь',cat:'Синтаксис и пунктуация',f:'определени[а-яё]*',at:'pr1',see:['opr_slovo','prich_ob','chlen']},
 opr_slovo:{t:'Определяемое слово',d:'Слово, к которому относится определение или причастный оборот. С ним причастие согласуется, и от него задают вопрос «какой?».',ex:'Листья (какие?), опавшие за ночь, … — определяемое слово «листья»',cat:'Синтаксис и пунктуация',f:'определяем(?:ое|ого|ому|ым|ом|ые|ых|ыми)',at:'pr7',see:['opred','prich_ob','obosob']},
 orfogramma:{t:'Орфограмма',d:'Место в слове, где можно ошибиться и где написание выбирают по правилу.',ex:'н или нн в «жаре_ый»; гласная в «колебл_щий»',cat:'Орфография',f:'орфограмм[а-яё]*',at:'',see:['orfogr','pravop']},
 orfogr:{t:'Орфография',d:'Система правил написания слов и раздел науки о языке, который эти правила изучает.',ex:'правописание н и нн, не с причастиями, гласных в суффиксах',cat:'Орфография',f:'орфографи[а-яё]*',at:'',see:['orfogramma','pravop','punkt']},
 osnova:{t:'Основа',d:'Часть слова без окончания и постфикса. Если основа оканчивается на н, а суффикс тоже начинается с н, получается нн.',ex:'лимон + н → лимонный; чита-ть: основа инфинитива чита-',cat:'Морфемика и словообразование',f:'основ(?:а|ы|е|у|ой|ам|ами|ах)?',at:'pr3',see:['osn_nast','osn_inf','okonch','styk']},
 osn_inf:{t:'Основа инфинитива',d:'Часть инфинитива без -ть (-ти). От неё образуются причастия прошедшего времени.',ex:'чита-ть → чита-вший, чита-нный; увиде-ть → увиде-вший',cat:'Морфемика и словообразование',f:'основ[а-яё]* инфинитива',at:'pr3',see:['osn_nast','prosh','infin']},
 osn_nast:{t:'Основа настоящего времени',d:'Основа глагола, которую легко найти, отбросив окончание в форме «они …». От неё образуются причастия настоящего времени.',ex:'они чита-ют → чита-ющий; они нес-ут → нес-омый',cat:'Морфемика и словообразование',f:'основ[а-яё]* настоящего времени',at:'pr3',see:['osn_inf','nast','sprya']},
 otgl:{t:'Отглагольное прилагательное',d:'Прилагательное, образованное от глагола. В отличие от причастия, оно называет постоянный признак без действия и пишется с одной н.',ex:'жареная рыба (но: зажаренная на огне — причастие); варёный, кованый',cat:'Морфология',f:'отглагольн[а-яё]*',at:'nn2',see:['prich','otym','glag']},
 otym:{t:'Отымённое прилагательное',d:'Прилагательное, образованное от существительного. Сколько в нём писать н, зависит от суффикса.',ex:'кожа → кожаный, клюква → клюквенный, лимон → лимонный',cat:'Морфология',f:'отым[её]нн[а-яё]*',at:'nn1',see:['pril','suff','otgl','sush']},
 padezh:{t:'Падеж',d:'Форма имени, которая показывает его связь с другими словами в предложении. Падежей шесть: именительный, родительный, дательный, винительный, творительный, предложный.',ex:'читающего ученика (Р. п.), читающими детьми (Т. п.)',cat:'Морфология',f:'падеж(?:а|у|ом|е|и|ей|ам|ами|ах)?',at:'',see:['sklon','rod','chislo']},
 perekhod:{t:'Переход в другую часть речи',d:'Случай, когда слово теряет прежние признаки и начинает употребляться как слово другой части речи.',ex:'блестящий ответ (прилагательное); учащиеся, заведующий (существительные)',cat:'Морфология',f:'переход(?:а|ом|е)? в (?:прилагательн|существительн)[а-яё]*',at:'pr1',see:['prich','pril','sush']},
 perekh:{t:'Переходный глагол',d:'Глагол, который может управлять существительным в винительном падеже без предлога. Только от переходных глаголов образуются страдательные причастия.',ex:'читать (что?) книгу → читаемая книга',cat:'Морфология',f:'переходн[а-яё]*',at:'pr2',see:['neperekh','strad','upravl']},
 povtor:{t:'Повтор',d:'Сочетание из одного слова, взятого дважды, во второй раз — с приставкой пере-. Обозначает высокую степень качества; обе части пишутся с одной н.',ex:'глаженые-переглаженые брюки, штопаные-перештопаные носки',cat:'Морфемика и словообразование',f:'повтор(?:ы|ах|ов|ами)?',at:'nn3',see:['defis','otgl','pref']},
 podl:{t:'Подлежащее',d:'Главный член предложения, который называет, о ком или о чём говорится. Отвечает на вопросы «кто?» или «что?».',ex:'Задача решена. Мы легли спать.',cat:'Синтаксис и пунктуация',f:'подлежащ(?:ее|его|ему|им|ем|ие|их|ими)',at:'',see:['skaz','chlen','predl']},
 poln:{t:'Полная форма',d:'Основная форма прилагательного или причастия, которая изменяется по родам, числам и падежам и в предложении обычно бывает определением.',ex:'прочитанная книга, длинная дорога',cat:'Морфология',f:'полн[а-яё]* форм[а-яё]*|полн[а-яё]* и кратк[а-яё]* форм[а-яё]*',at:'pr5',see:['krat','opred','sklon']},
 postf:{t:'Постфикс',d:'Часть слова, которая стоит после окончания. В глаголах и причастиях это -ся (-сь); он делает слово возвратным.',ex:'строящий-ся, умывший-ся',cat:'Морфемика и словообразование',f:'постфикс[а-яё]*',at:'pr1',see:['vozvr','suff','okonch']},
 pravop:{t:'Правописание',d:'Написание слов по правилам орфографии; так называют и само правило.',ex:'правописание причастий, правописание н и нн',cat:'Орфография',f:'правописани[а-яё]*',at:'pr6',see:['orfogr','orfogramma']},
 predlog:{t:'Предлог',d:'Служебная часть речи, которая связывает существительное или местоимение с другими словами.',ex:'жаренная на масле; о читающем мальчике; с книгой',cat:'Морфология',f:'предлог(?:а|у|ом|е|и|ов|ами|ах)?',at:'',see:['sluzh','padezh','soyuz']},
 predl:{t:'Предложение',d:'Слово или несколько слов, которые выражают законченную мысль. В конце предложения ставится точка, вопросительный или восклицательный знак.',ex:'Книга прочитана. Листья лежали на дорожке.',cat:'Синтаксис и пунктуация',f:'предложени[а-яё]*',at:'',see:['chlen','podl','skaz']},
 priznak:{t:'Признак предмета',d:'Свойство предмета: цвет, качество, материал, принадлежность. Прилагательное называет постоянный признак, причастие — признак по действию.',ex:'синий (просто цвет) — синеющий (который синеет)',cat:'Морфология',f:'признак[а-яё]* предмет[а-яё]*',at:'pr1',see:['pril','prich','opred']},
 pril:{t:'Прилагательное',d:'Самостоятельная часть речи, которая обозначает признак предмета и отвечает на вопросы «какой? чей?». Изменяется по родам, числам и падежам.',ex:'кожаный, лимонный, длинный, красивый',cat:'Морфология',f:'прилагательн[а-яё]*',at:'',see:['otym','otgl','prich','krpril']},
 pref:{t:'Приставка',d:'Часть слова перед корнем, которая служит для образования новых слов. В слове от глагола любая приставка, кроме не-, указывает на причастие и две н.',ex:'за-жаренный, про-читанный; но: не-крашеный',cat:'Морфемика и словообразование',f:'приставк[а-яё]*|приставочн[а-яё]*',at:'nn2',see:['koren','suff','otgl']},
 prich:{t:'Причастие',d:'Особая форма глагола, которая обозначает признак предмета по действию и отвечает на вопросы «какой? что делающий? что сделавший?». Сочетает признаки глагола и прилагательного.',ex:'бегущий ручей (который бежит), прочитанная книга (которую прочитали)',cat:'Морфология',f:'причасти[а-яё]*',at:'pr1',see:['deepr','pril','glag','prich_ob']},
 prich_ob:{t:'Причастный оборот',d:'Причастие вместе с зависимыми словами. В предложении весь оборот — одно определение.',ex:'дети, игравшие во дворе; опавшие за ночь листья',cat:'Синтаксис и пунктуация',f:'причастн[а-яё]* оборот[а-яё]*',at:'pr7',see:['prich','dep','obosob','opr_slovo']},
 proizv:{t:'Производное слово',d:'Слово, образованное от другого слова с помощью приставки, суффикса или иным способом.',ex:'кожаный (от «кожа»), воспитанник (от «воспитанный»)',cat:'Морфемика и словообразование',f:'производн[а-яё]* слов[а-яё]*',at:'',see:['ishod','slovoobr']},
 ishod:{t:'Производящее слово',d:'Слово, от которого образовано другое слово; его называют также исходным. С него начинается проверка н и нн.',ex:'кожа → кожаный; неожиданный → неожиданно; гостиный → гостиная',cat:'Морфемика и словообразование',f:'исходн[а-яё]* слов[а-яё]*|производящ[а-яё]* слов[а-яё]*',at:'nn1',see:['proizv','slovoobr','odnokor']},
 protivop:{t:'Противопоставление',d:'Сочетание, в котором одно отрицается, а другое утверждается, обычно с союзом «а». При противопоставлении не с причастием пишется раздельно.',ex:'не прочитанная, а пролистанная книга',cat:'Синтаксис и пунктуация',f:'противопоставлени[а-яё]*',at:'pr6',see:['ne_prich','soyuz','razdelno']},
 prosh:{t:'Прошедшее время',d:'Время действия, которое было до момента речи. Причастия прошедшего времени образуются от основы инфинитива.',ex:'читавший, нёсший, прочитанный, взятый',cat:'Морфология',f:'прошедш[а-яё]* врем(?:я|ени|енем)',at:'pr2',see:['nast','osn_inf','bud']},
 punkt:{t:'Пунктуация',d:'Правила расстановки знаков препинания, а также раздел науки о языке, который их изучает.',ex:'запятые при причастном обороте',cat:'Синтаксис и пунктуация',f:'пунктуаци[а-яё]*',at:'',see:['znaki','zapyat','sintaksis']},
 morf_sostav:{t:'Разбор по составу',d:'Выделение в слове всех его частей: приставки, корня, суффикса, окончания, постфикса.',ex:'за-жар-енн-ый, вы-мыт-ый, строя-щ-ий-ся',cat:'Морфемика и словообразование',f:'разбор[а-яё]* (?:слова )?по составу|морфемн[а-яё]* разбор[а-яё]*',at:'',see:['morfema','koren','suff']},
 razgovor:{t:'Разговорная форма',d:'Форма слова, привычная в непринуждённой устной речи, но не соответствующая строгой литературной норме.',ex:'мерять, мучать (литературные: мерить, мучить)',cat:'Общие понятия',f:'разговорн[а-яё]*',at:'',see:['norma','lityaz']},
 razdelno:{t:'Раздельное написание',d:'Написание слов отдельно друг от друга, через пробел.',ex:'не прочитанная мною книга; книга не прочитана',cat:'Орфография',f:'раздельн(?:о|ое|ого|ому|ым|ом)',at:'pr6',see:['slitno','defis','ne_prich']},
 razryad:{t:'Разряд',d:'Группа слов одной части речи, объединённых общим признаком. Причастия делятся на четыре разряда по залогу и времени.',ex:'действительные настоящего времени: читающий; страдательные прошедшего: прочитанный',cat:'Морфология',f:'разряд(?:а|у|ом|е|ы|ов|ам|ами|ах)?',at:'pr2',see:['zalog','vremya','dejst','strad']},
 rod:{t:'Род',d:'Признак, по которому слова делятся на мужской, женский и средний род. У существительного род постоянный, а прилагательное и причастие меняют род вслед за существительным.',ex:'читающий мальчик, читающая девочка, читающее дитя',cat:'Морфология',f:'(?:мужск|женск|средн)[а-яё]* род(?:а|у|ом|е)?',at:'',see:['chislo','padezh','soglas']},
 samost:{t:'Самостоятельная часть речи',d:'Часть речи, слова которой называют предметы, признаки, действия или количество и бывают членами предложения.',ex:'существительное, прилагательное, глагол, наречие',cat:'Морфология',f:'самостоятельн[а-яё]* част[а-яё]* речи',at:'pr1',see:['chast_rechi','sluzh']},
 sintaksis:{t:'Синтаксис',d:'Раздел науки о языке, который изучает словосочетания и предложения.',ex:'причастный оборот и запятые при нём',cat:'Общие понятия',f:'синтаксис[а-яё]*',at:'',see:['predl','slovosoch','punkt']},
 skaz:{t:'Сказуемое',d:'Главный член предложения, который сообщает, что делает подлежащее, каково оно или что с ним происходит. Краткое причастие в предложении — сказуемое.',ex:'Задача решена. Дорога длинна. Ученики собрались.',cat:'Синтаксис и пунктуация',f:'сказуем[а-яё]*',at:'pr5',see:['podl','krprich','chlen']},
 sklon:{t:'Склонение',d:'Изменение слова по падежам и числам. Полное причастие склоняется так же, как прилагательное.',ex:'читающий, читающего, читающему, о читающем',cat:'Морфология',f:'склонени[а-яё]*|склоня(?:ется|ются)',at:'pr5',see:['padezh','okonch','poln']},
 slitno:{t:'Слитное написание',d:'Написание частей слова вместе, без пробела и дефиса.',ex:'непрочитанная книга, незваный, ненавидящий',cat:'Орфография',f:'слитн(?:о|ое|ого|ому|ым|ом)',at:'pr6',see:['razdelno','defis','ne_prich']},
 slovoobr:{t:'Словообразование',d:'Образование новых слов от уже существующих, а также раздел науки о языке, который это изучает.',ex:'дружина → дружинник; жарить → жареный',cat:'Морфемика и словообразование',f:'словообразовани[а-яё]*|словообразовательн[а-яё]*',at:'',see:['ishod','proizv','morfema']},
 slovosoch:{t:'Словосочетание',d:'Два или больше самостоятельных слова, связанных по смыслу и грамматически: одно из них главное, другое зависимое.',ex:'читаемая книга, мощённая булыжником, любующийся закатом',cat:'Синтаксис и пунктуация',f:'словосочетани[а-яё]*',at:'',see:['glavslovo','dep','soglas','upravl']},
 slozhn:{t:'Сложное слово',d:'Слово, в котором два корня или больше.',ex:'гладкокрашеный, домотканый, свежемороженый',cat:'Морфемика и словообразование',f:'сложн(?:ое|ого|ому|ым|ом|ые|ых|ыми) слов[а-яё]*',at:'nn3',see:['koren','slozhnosokr']},
 slozhnosokr:{t:'Сложносокращённое слово',d:'Слово, составленное из сокращённых частей нескольких слов.',ex:'юннат (юный натуралист), вуз, спецкор',cat:'Морфемика и словообразование',f:'сложносокращ[её]нн[а-яё]*',at:'nn1',see:['slozhn','styk']},
 sluzh:{t:'Служебная часть речи',d:'Часть речи, слова которой ничего не называют и не бывают членами предложения: они связывают слова или добавляют оттенки смысла.',ex:'предлоги, союзы, частицы',cat:'Морфология',f:'служебн[а-яё]* част[а-яё]* речи',at:'',see:['chast_rechi','predlog','soyuz','chastica']},
 sov:{t:'Совершенный вид',d:'Вид глагола, который обозначает законченное действие или его результат и отвечает на вопрос «что сделать?». Причастие от глагола совершенного вида пишется с нн даже без приставки.',ex:'бросить → брошенный, решить → решённый, купить → купленный',cat:'Морфология',f:'совершенн[а-яё]* вид(?:а|у|ом|е)?',at:'pr2',see:['nesov','vid','prich']},
 soglasn:{t:'Согласный звук',d:'Звук, при произнесении которого воздух встречает во рту преграду: губы, зубы или язык.',ex:'н, т, ш, ж; нёс-ший: после согласной суффикс -ш-',cat:'Общие понятия',f:'согласн(?:ый|ая|ое|ые|ого|ой|ому|ую|ым|ыми|ых|ом)',at:'',see:['glasn','shipyash','zvuk']},
 soglas:{t:'Согласование',d:'Связь, при которой зависимое слово ставится в том же роде, числе и падеже, что и главное. Так причастие и прилагательное связаны с существительным.',ex:'читающего ученика, читающей девочке, читающими детьми',cat:'Синтаксис и пунктуация',f:'согласовани[а-яё]*|согласу(?:ется|ются|ющ[а-яё]*)',at:'pr1',see:['upravl','rod','chislo','padezh']},
 soyuz:{t:'Союз',d:'Служебная часть речи, которая связывает однородные члены предложения или части сложного предложения.',ex:'и, а, но, потому что; не прочитанная, а пролистанная',cat:'Морфология',f:'союз(?:а|у|ом|е|ы|ов|ами|ах)?',at:'',see:['sluzh','protivop','chastica']},
 sprya:{t:'Спряжение',d:'Изменение глагола по лицам и числам; так же называют две группы глаголов — I и II спряжение — с разными личными окончаниями. От спряжения зависит гласная в суффиксе причастия настоящего времени.',ex:'I: колеблют → колеблющий; II: клеят → клеящий, видят → видимый',cat:'Морфология',f:'спряжени[а-яё]*',at:'pr4',see:['gl_iskl','osn_nast','litso','okonch']},
 strad:{t:'Страдательное причастие',d:'Причастие, которое называет признак предмета, на который направлено чужое действие. Образуется только от переходных глаголов.',ex:'читаемая учеником книга, построенный дом',cat:'Морфология',f:'страдательн[а-яё]*',at:'pr2',see:['dejst','zalog','perekh','krprich']},
 styk:{t:'Стык морфем',d:'Место, где встречаются две части слова. Если основа оканчивается на н, а суффикс начинается с н, на стыке пишется нн.',ex:'лимон + н → лимонный; дружина + ник → дружинник',cat:'Морфемика и словообразование',f:'стык(?:а|е|ом|и|ах)?',at:'nn1',see:['osnova','suff','morfema']},
 suff:{t:'Суффикс',d:'Часть слова после корня, которая служит для образования новых слов или форм. В прилагательных и причастиях от суффикса зависит, сколько писать н.',ex:'кож-ан-ый, клюкв-енн-ый, марин-ова-нный, чита-ющ-ий',cat:'Морфемика и словообразование',f:'суффикс[а-яё]*',at:'nn1',see:['pref','koren','suff_prich']},
 suff_prich:{t:'Суффиксы причастий',d:'Суффиксы, с помощью которых причастия образуются от глагола: -ущ-/-ющ-, -ащ-/-ящ-, -ем-/-ом-, -им-, -вш-, -ш-, -нн-, -енн-, -т-.',ex:'несущий, видимый, читавший, нёсший, прочитанный, взятый',cat:'Морфемика и словообразование',f:'суффикс[а-яё]* причасти[а-яё]*',at:'pr3',see:['suff','sprya','osn_nast','osn_inf']},
 sush:{t:'Существительное',d:'Самостоятельная часть речи, которая обозначает предмет и отвечает на вопросы «кто? что?». Имеет род, изменяется по числам и падежам.',ex:'кожа, лимон, дружинник, мороженое',cat:'Морфология',f:'существительн[а-яё]*',at:'nn6',see:['pril','rod','padezh']},
 udar:{t:'Ударение',d:'Выделение одного слога в слове голосом: он звучит сильнее и дольше остальных. На выбор н или нн в прилагательных ударение не влияет.',ex:'ржано́й, торфяно́й — одна н, как и безударные кожаный, глиняный',cat:'Общие понятия',f:'ударени[а-яё]*|ударн(?:ый|ая|ое|ые|ого|ой|ом|ых|ым)',at:'',see:['bezud','glasn','shipyash']},
 upravl:{t:'Управление',d:'Связь, при которой главное слово требует, чтобы зависимое стояло в определённом падеже. Причастие управляет так же, как глагол, от которого оно образовано.',ex:'читающий (что?) книгу; любующийся (чем?) закатом',cat:'Синтаксис и пунктуация',f:'управлени[а-яё]*',at:'pr1',see:['soglas','perekh','padezh']},
 ustar:{t:'Устаревшее слово',d:'Слово или форма, которые вышли из живого употребления, но иногда сохраняются в образованных от них словах.',ex:'«движить» → движимый',cat:'Общие понятия',f:'устаревш[а-яё]*',at:'',see:['norma','iskl']},
 ustoich:{t:'Устойчивое сочетание',d:'Сочетание слов с цельным значением, которое не составляют каждый раз заново, а берут из языка готовым.',ex:'названый брат, посажёный отец, писаная красавица, Прощёное воскресенье',cat:'Общие понятия',f:'устойчив[а-яё]* сочетани[а-яё]*',at:'nn3',see:['znach','otgl']},
 forma:{t:'Форма слова',d:'Вариант одного и того же слова, который отличается окончанием (иногда суффиксом) и выражает грамматическое значение.',ex:'читающий, читающего, читающими — формы одного причастия',cat:'Морфология',f:'форм[а-яё]* слов(?:а|о)',at:'',see:['okonch','sklon','gram_priznak']},
 chastica:{t:'Частица',d:'Служебная часть речи, которая добавляет слову или предложению оттенок значения: отрицание, вопрос, усиление. Не — отрицательная частица.',ex:'книга не прочитана; вовсе не интересующийся',cat:'Морфология',f:'частиц(?:а|ы|е|у|ей|ами|ам|ах)?',at:'',see:['sluzh','ne_prich','soyuz']},
 chast_rechi:{t:'Часть речи',d:'Большая группа слов с общим значением, общими вопросами и грамматическими признаками. Части речи бывают самостоятельные и служебные.',ex:'существительное, прилагательное, глагол, наречие; предлог, союз, частица',cat:'Морфология',f:'част(?:ь|и|ей|ям|ями|ях) речи',at:'pr1',see:['samost','sluzh','gram_priznak']},
 cheredov:{t:'Чередование',d:'Замена одного звука другим в одной и той же части слова в разных словах или формах.',ex:'бросить — брошенный (с/ш), купить — купленный (п/пл)',cat:'Морфемика и словообразование',f:'чередовани[а-яё]*',at:'',see:['koren','osnova']},
 chislo:{t:'Число',d:'Признак, который показывает, один предмет или несколько. Число бывает единственное и множественное.',ex:'читающий — читающие; книга — книги',cat:'Морфология',f:'(?:единственн|множественн)[а-яё]* числ(?:о|а|у|ом|е)',at:'',see:['rod','padezh','soglas']},
 chlen:{t:'Член предложения',d:'Слово или сочетание слов, которое выполняет в предложении определённую роль. Главные члены — подлежащее и сказуемое, второстепенные — определение, дополнение и обстоятельство.',ex:'Прочитанная (опр.) книга (подл.) лежит (сказ.) на столе (обст.).',cat:'Синтаксис и пунктуация',f:'член[а-яё]* предложени[а-яё]*',at:'',see:['podl','skaz','opred','dop']},
 shipyash:{t:'Шипящие',d:'Согласные ж, ш, ч, щ. После них в суффиксах причастий и отглагольных прилагательных под ударением пишется ё.',ex:'решённый, сожжённый, испечённый, тушёный, копчёный',cat:'Орфография',f:'шипящ(?:ие|их|им|ими)',at:'pr6',see:['soglasn','udar','suff']},
 norma:{t:'Языковая норма',d:'Принятое в литературном языке правило произношения, написания или употребления слова. Нормы записаны в словарях и справочниках, например в Правилах 2006 года.',ex:'правильно: тот, кто прочитает; ошибка: «прочитающий»',cat:'Общие понятия',f:'языков[а-яё]* норм[а-яё]*|литературн[а-яё]* норм[а-яё]*',at:'',see:['lityaz','orfogr','razgovor']}
};

const CYR='а-яёА-ЯЁ';
const GL=Object.entries(GLOSS).map(([id,g])=>({id,...g,re:g.f?new RegExp('(^|[^'+CYR+'])('+g.f+')(?![' + CYR + '])','i'):null}));

const GLA=[...GL].sort((a,b)=>a.t.localeCompare(b.t,'ru'));
const LES={};Object.values(CHAPTERS).forEach(ch=>ch.lessons.forEach((l,i)=>{LES[l.id]={ch:ch.id,i,t:l.t,n:i+1}}));
const lesName=id=>{const L=LES[id];if(!L)return '';const m=chById(L.ch);return `${m?m.t:''} · урок ${L.n}`};
const strip=h=>String(h).replace(/<[^>]+>/g,' ').replace(/\[\[\w+\|([^\]]+)\]\]/g,'$1').replace(/\{\{[^}]+\}\}/g,' ');
// где встречается каждый термин
const TUSE={};GL.forEach(g=>{TUSE[g.id]=[];if(!g.re)return;Object.values(CHAPTERS).forEach(ch=>ch.lessons.forEach(l=>{
 const txt=strip(l.h+' '+(l.deep||''));if(g.re.test(txt)||new RegExp('\\[\\['+g.id+'\\|').test(l.h))TUSE[g.id].push(l.id)}))});
// разделы уроков (h4) для оглавления
const secs=l=>[...String(l.h).matchAll(/<h4>([^<]+)<\/h4>/g)].map((m,k)=>({id:l.id+'-s'+k,t:m[1].trim()}));
