  body:'1. Я был так поражён этим невида..ым зрелищем, что совершенно онемел и не отвечал ни одного слова на вопросы отца и матери. (С. Т. Аксаков, «Детские годы Багрова-внука») 2. Нечёса..ые волосы, закинутые кверху, открывали невысокий и чрезвычайно чистый лоб. (Л. Н. Толстой, «Альберт») 3. Когда мы выехали на десятину, которую жали человек с десять, говор прекратился, но зато шарканье серпов по соломе усилилось и наполняло всё поле необыкновенными и неслыха..ыми мною звуками. (С. Т. Аксаков, «Детские годы Багрова-внука») 4. Она подошла к Пьеру тихими, медле..ыми шагами. (Л. Н. Толстой, «Война и мир») 5. Я хозяин дворца и сада, я принял тебя как дорогого гостя и зва..ого, накормил, напоил и спать уложил, а ты эдак-то заплатил за моё добро? (С. Т. Аксаков, «Детские годы Багрова-внука») 6. Неприятель побеждён, и завтра погоним его из свяще..ой земли русской, — сказал Кутузов, крестясь; и вдруг всхлипнул от наступивших слёз. (Л. Н. Толстой, «Война и мир») 7. Испуга..ые неожида..ым плеском, местные лягушки все попрятались в воду. (В. М. Гаршин, «Лягушка-путешественница») 8. Кидали им туда тесто непечё..ое, как собакам, да в кувшине воду спускали. (Л. Н. Толстой, «Кавказский пленник») 9. И наконец пришёл этот жела..ый день и час! (С. Т. Аксаков, «Детские годы Багрова-внука») 10. То вспоминался ему награждё..ый Лазарев и Денисов, наказа..ый и непрощё..ый. (Л. Н. Толстой, «Война и мир») Пояснения: десятина — участок поля (старая мера площади); жать — срезать колосья серпом; эдак-то — вот так; день и час (в 9-м предложении) — день, когда на реке тронулся лёд; Лазарев, Денисов — герои романа: одного наградили, другого наказали.'},
 {n:16,l:2,st:3,task:'Вставить н или нн. Выписать слова с пропусками в два столбика: 1) прилагательные, образованные от существительных; 2) слова, образованные от глаголов. В первом столбике обозначить суффикс (или объяснить исключение), во втором — назвать примету или написать «примет нет».',
  obr:'На полке стояли стекля..ая банка и выреза..ая из липы ложка. → 1) стеклянная — от существительного стекло, исключение; 2) вырезанная — от глагола вырезать: приставка вы-, зависимое слово (из липы).',
  body:'1. Небольшой круглый стол был убран роскошно: посредине стояло прекрасное дерево с цветами и плодами; гранё..ый хрусталь, серебро и золото ослепили мои глаза. (С. Т. Аксаков, «Детские годы Багрова-внука») 2. Казаки сидели за ужином в маза..ых сенях кордона, на земля..ом полу, вокруг низкого татарского столика, когда речь зашла о череде в секрет. (Л. Н. Толстой, «Казаки») 3. На большие столы без скатертей поставили по нескольку деревя..ых краше..ых и золочё..ых мисок с жидкою пшё..ою кашицею; больные уселись на лавки; им раздали по ломтю чёрного хлеба. (В. М. Гаршин, «Красный цветок») 4. Через две минуты сани заскрипели по доскам сметё..ого подъезда станцио..ого дома, и Игнашка повернул ко мне своё засыпа..ое снегом, дышащее морозом, весёлое лицо. (Л. Н. Толстой, «Метель») 5. У нас с сестрицей были прекрасные с крышечками берестовые бурачки, испещрё..ые вытисне..ыми на них узорами. (С. Т. Аксаков, «Детские годы Багрова-внука») 6. Она нагнула голову и исподлобья смотрела сияющими мокрыми глазами на маленькую, худенькую и жалкую в своей штопа..ой кофточке и ночном чепчике, всю дрожавшую от волнения Долли. (Л. Н. Толстой, «Анна Каренина») 7. Гробница была пуста, только в середине пола была вделана око..ая рама со стёклами, и сквозь эти стёкла зияла тёмная пустота подземелья. (В. Г. Короленко, «Дети подземелья») 8. Из-под тулупа поднялся старик в ночной шапке и лоснящемся, рва..ом бешмете. (Л. Н. Толстой, «Хаджи-Мурат») 9. Я даже слышал сквозь запертую и завеше..ую дверь сначала выразительный и явственный шёпот, а потом и жаркий разговор вполголоса, причём иногда вырывались и громкие слова. (С. Т. Аксаков, «Детские годы Багрова-внука») Пояснения: сени — помещение между жилой частью избы и крыльцом; кордон — сторожевой пост; череда в секрет — очередь идти в ночной дозор; бурачок — коробочка из бересты; испещрить — покрыть мелким пёстрым узором; вытиснить — выдавить узор на поверхности; станция (в 4-м предложении) — почтовая станция, где путники меняли лошадей; Игнашка — ямщик; гробница — подземный склеп в старой часовне; бешмет — кафтан у народов Кавказа.'},
 {n:46,l:2,st:3,task:'Вставить н или нн. Выписать слова с пропусками и разобрать их по составу (окончание, основа, корень, приставка, суффиксы). Рядом записать глагол, от которого образовано слово, и его вид. По разбору объяснить, почему пишется одна н или две. Ответить: что в составе слов из 5-го и 6-го предложений решает, сколько н писать?',
  obr:'Мальчишка был в лата..ой куртке → лат-а-н-ой: окончание -ой, основа латан-, корень лат-, суффиксы -а-, -н-; латать — несов. в. Приставки, суффикса -ова- и зависимых слов нет — одна н.',
  body:'1. Я был любимец, фаворит, как многие называли меня, и, следовательно, балова..ое дитя. (С. Т. Аксаков, «Детские годы Багрова-внука») 2. Несколько воробьёв вспорхнули с насиже..ых мест на хорах и вылетели в большую прореху в крыше. (В. Г. Короленко, «Дети подземелья») 3. Вслед за тем сам хорунжий, в новой черкеске с офицерскими погонами на плечах, в чище..ых сапогах — редкость у казаков, — с улыбкой на лице, раскачиваясь, вошёл в комнату и поздравил с приездом. (Л. Н. Толстой, «Казаки») 4. Только одна могила, огороже..ая частоколом, каждую весну зеленела свежим дёрном, пестрела цветами. (В. Г. Короленко, «Дети подземелья») 5. Кто-то стучал в углу топором, готовя гробик из старых досок, сорва..ых с крыши часовни. (В. Г. Короленко, «Дети подземелья») 6. Очевидно, это была копа..ая канава. (Л. Н. Толстой, «Хозяин и работник») 7. Подошёл он ближе; видит — ульи стоят плетё..ые из соломы, и пчёлы летают, гудят. (Л. Н. Толстой, «Кавказский пленник») Пояснения: фаворит — любимец; хоры — верхняя галерея в церкви (здесь — в старой часовне); прореха — дыра; хорунжий — младший офицерский чин у казаков; черкеска — длинный кафтан; частокол — забор из кольев; дёрн — верхний слой земли с травой.'},
 {n:17,l:2,st:4,task:'Выписать слова с пропусками, вставляя н или нн. В каждом пункте сравнить однокоренные слова: почему их написание совпадает или различается? Назвать примету (или исключение), которая решает дело. В пунктах 6 и 7 объяснить, почему пишутся две н, хотя на первый взгляд приметы нет или она «отменена».',
  body:'1. Больше чем когда-нибудь Борис решился служить впредь не по той писа..ой в уставе, а по этой неписа..ой субординации. (Л. Н. Толстой, «Война и мир») 2. Хотя по нескоше..ому было мало надежды найти столько же, сколько по скоше..ому, Левин обещал Степану Аркадьичу сойтись с ним и пошёл со своим спутником дальше по прокоше..ым и непрокоше..ым полосам. (Л. Н. Толстой, «Анна Каренина») 3. Бабушка вообще очень любила грибы, а грузди в особенности; она любила кушать их жаре..ые в сметане, отварные в рассоле, а всего более солё..ые. (С. Т. Аксаков, «Детские годы Багрова-внука») 4. Белё..ые стены хаты сияли на солнце. — Стены, белё..ые известью к празднику, сияли на солнце. 5. Солдаты почётного караула шли чека..ым шагом. — На монетном дворе нам показали только что отчекане..ую памятную монету. 6. Было тихо, веяло спокойствием и глубоким миром броше..ого кладбища. (В. Г. Короленко, «Дети подземелья») 7. Наверху же, на хорах, уже стояли приведённые прежде — с одной стороны с бритыми полуголовами каторжные, обнаруживавшие своё присутствие позвякиванием цепей, с другой — небритые и незакова..ые подследственные. (Л. Н. Толстой, «Воскресение») Пояснения: субординация — правила подчинения младших по службе старшим; Левин и Степан Аркадьич охотятся на болотную дичь в лугах; полосы — участки луга; грузди — грибы; отварные — сваренные; известь — белое вещество для побелки; каторжные — осуждённые на каторгу; подследственные — те, чьё дело ещё расследуют; хоры — верхняя галерея.'},
 {n:18,l:2,st:4,task:'1) Преобразовать словосочетания. Если в слове одна н — добавить зависимое слово или приставку так, чтобы получилось причастие. Если две н — убрать приставку и зависимые слова, где это возможно, и записать отглагольное прилагательное. Отметить слова, у которых написание после преобразования не изменилось или преобразование невозможно, и объяснить почему. 2) С тремя полученными причастиями составить предложения, в которых причастный оборот стоит после определяемого слова; расставить знаки препинания.',
  obr:'Квашеная капуста → квашенная в бочке капуста (зависимое слово) или заквашенная капуста (приставка) — написание изменилось.',
  body:'Строганые доски, накрахмаленный воротник, клеёная фанера, катаные валенки, обиженный ребёнок, зашифрованное письмо, нехоженая тропа, нечаянная встреча, провяленная на солнце рыба, хвалёный рецепт, толчёные орехи, калёные семечки.'},
 {n:47,l:2,st:4,task:'Выписать слова с пропусками, вставляя н или нн, и составить таблицу из трёх граф: слово; от какого слова образовано (существительное или глагол); объяснение — все приметы причастия, которые есть в слове (их может быть несколько), или суффикс прилагательного (-ан-, -ян-, -ин-, -енн-, основа на н), или «примет нет». Ответить: 1) в каком слове не- стоит перед другой приставкой и влияет ли оно на написание? 2) какое слово в 1-м предложении образовано от глагола, но вопроса о н или нн в нём нет? Почему?',
  obr:'В углу лежали разрисова..ые мелом доски. → разрисованные | разрисовать (глагол) | приставка раз-, суффикс -ова-, зависимое слово (мелом).',
  body:'1. Они въехали в усыпа..ый щебнем и убра..ый цветником двор, на котором два работника обкладывали взрыхлё..ую цветочную клумбу необдела..ыми ноздреватыми камнями, и остановились в крытом подъезде. (Л. Н. Толстой, «Анна Каренина») 2. Старик этот был одет в заплата..ый озям, суко..ые штаны и разноше..ые, заплата..ые бродни. (Л. Н. Толстой, «Воскресение») 3. Они чинно едят траву, выгибая свои лебеди..ые стриже..ые шейки, и, как будто у них тоже есть хвосты, помахивают своими веничками. (Л. Н. Толстой, «Холстомер») 4. Тёплая ванна и пузырь со льдом, положе..ый на голову, произвели своё действие. (В. М. Гаршин, «Красный цветок») 5. Я оговариваюсь, потому что настоящий отрывок, выхваче..ый из средины полных и подробных рассказов, может показаться несколько неестестве..ым и преувеличе..ым. (С. Т. Аксаков, «Детские годы Багрова-внука») Пояснения: озям — длинный крестьянский кафтан; бродни — высокие сапоги; они (в 3-м предложении) — годовалые кобылки-стригунки; веничками — короткими хвостиками; средина — середина.'},
 {n:19,l:2,st:4,task:'Найти и исправить ошибки в написании н и нн. Объяснить каждое исправление и доказать, что остальные слова с н или нн написаны верно.',
  body:'После ремонта наш стадион не узнать. Обновлённые трибуны с нарисоваными гербами города видны издалека, вокруг поля появились новые прорезиненые дорожки. В субботу здесь прошёл первый матч сезона. Купленые заранее билеты разошлись за неделю, и организованый пропуск зрителей начался ещё в полдень. Ветераны клуба, приглашённые на открытие, сидели в первом ряду, а на перилах расселись незваные гости — воробьи. В буфете продавали бутерброды с варёной и копчённой колбасой. До свистка оставались последние минуты; трибуны болели с невиданым азартом, а тренер ходил вдоль скамейки с деланным спокойствием. После игры победителям вручили позолоченные кубки, а судья унёс заполненный капитанами протокол.'},
 {n:20,l:2,st:5,task:'Тонкость (см. «Тонкости» урока). Выписать слова с пропусками вместе с определяемыми или зависимыми словами, вставляя н или нн. Ответить на вопросы: 1) Ранить бывает глаголом совершенного вида («вчера осколок ранил солдата»). Почему же в 1-м, 3-м и 6-м предложениях пишется одна н? 2) Когда в этом слове пишутся две н? 3) Обещать и казнить тоже бывают глаголами обоих видов. Почему в 7-м и 8-м предложениях две н, хотя приставки и зависимых слов нет? 4) Можно ли переносить написание слова раненый на другие глаголы обоих видов?',
  body:'1. На дне её, ухватясь обеими руками за края, лежал ране..ый. (Л. Н. Толстой, «Рубка леса») 2. Долохов, ране..ый в руку, пешком, с десятком солдат своей роты (он был уже офицер), и его полковой командир, верхом, представляли из себя остатки всего полка. (Л. Н. Толстой, «Война и мир») 3. С батареи свезли пленных, в том числе ране..ого французского генерала, которого окружили офицеры. (Л. Н. Толстой, «Война и мир») 4. С князем Андреем везли присоединившегося к ним в Москве майора его полка Тимохина с красным носиком, ране..ого в ногу в том же Бородинском сражении. (Л. Н. Толстой, «Война и мир») 5. Навстречу ему поднимался поезд телег с ране..ыми во вчерашнем деле. (Л. Н. Толстой, «Война и мир») 6. Ране..ые, обвязанные тряпками, бледные, с поджатыми губами и нахмуре..ыми бровями, держась за грядки, прыгали и толкались в телегах. (Л. Н. Толстой, «Война и мир») 7. Обеща..ый подарок дедушка привёз только к Новому году. 8. В музее висит портрет казнё..ого декабриста. Пояснения: её (в 1-м предложении) — повозки; Долохов, Тимохин, князь Андрей — герои романа; батарея — позиция с пушками; в деле — в бою; грядки — боковые края телеги; декабристы — участники восстания 1825 года.'},
 {n:48,l:2,st:5,task:'Выписать слова с пропусками вместе с определяемыми или зависимыми словами, вставляя н или нн. Для каждого слова назвать все приметы, которые в нём есть (их может быть несколько), или объяснить, почему пишется одна н. Ответить на вопросы: 1) В каком предложении одно зависимое слово относится сразу к двум причастиям? 2) В каком предложении зависимое слово стоит при слове-исключении и почему оно не влияет на написание? 3) Почему в 4-м предложении не с причастием пишется раздельно (вспомнить правило главы «Причастие»)? 4) Почему в 5-м предложении две н в слове без приставки? 5) Чем слово с одной н в 6-м предложении отличается от двух других слов на -анный в этом предложении?',
  body:'1. Успокое..ая Александра Ивановна ушла к гостям, а я принялся подробно рассказывать матери всё виде..ое и слыша..ое мной. (С. Т. Аксаков, «Детские годы Багрова-внука») 2. Князь Андрей чувствовал себя взволнова..ым, раздражё..ым и вместе с тем сдержанно спокойным, каким бывает человек при наступлении давно жела..ой минуты. (Л. Н. Толстой, «Война и мир») 3. В моей груди, навстречу его угрозам, подымалось едва осозна..ое оскорблё..ое чувство покинутого ребёнка и какая-то жгучая любовь к тем, кто меня пригрел там, в старой часовне. (В. Г. Короленко, «Дети подземелья») 4. К тому же картина, вызва..ая из глубины душевных воспоминаний и не облечё..ая в слово, решительно теряет единство, цельность и оригинальность представления; другие, может быть, этого и не заметят, да я-то знаю очень хорошо. (С. Т. Аксаков, «Детские годы Багрова-внука») 5. Он чувствовал себя пристыже..ым, униже..ым, виноватым и лишё..ым возможности смыть своё унижение. (Л. Н. Толстой, «Анна Каренина») 6. В его обвязанном шарфе, в его валя..ых сапогах, в его заспа..ом лице ему послышался голос другой жизни, призывавшей его, — жизни трудов, лишений, деятельности. (Л. Н. Толстой, «Казаки») Пояснения: Александра Ивановна — гостья в доме; облечь в слово — выразить словами; пристыдить — заставить устыдиться; валять — делать войлок из шерсти.'},
// Урок 3
 {n:49,l:3,st:1,task:'Распределить сочетания по пяти группам: 1) сложное прилагательное, во второй части нет ни приставки, ни суффикса -ова-; 2) сложное прилагательное, во второй части есть приставка или -ова-; 3) повтор с пере-; 4) прилагательное с приставкой; 5) прилагательное с не-. В сложных словах отделить чертой первую часть, в остальных выделить приставку. Для каждой группы записать, сколько н пишется и почему. Сделать вывод: от чего зависит число н в сложном прилагательном.',
  obr:'Малосолёные огурцы → мало|солёные: солить — приставки и -ова- нет → группа 1, одна н. Свежевыкрашенные перила → свеже|выкрашенные: выкрасить — приставка вы- → группа 2, две н.',
  body:'Свежемороженая клубника, запущенный сад, нечищеные ботинки, свежесваренный суп, стираный-перестираный халат, цельнокроеный рукав, рассеянный взгляд, малоизученная болезнь, неметёный пол, свежемаринованные грибы, глаженая-переглаженая скатерть, выдержанный сыр, засушенные цветы, нештопаные носки. Пояснения: цельнокроеный — скроенный из одного куска ткани, без шва; мариновать — заливать маринадом.'},
 {n:23,l:3,st:2,task:'Вставить пропущенные буквы. Распределить слова с пропусками на две группы: 1) повторы, которые обозначают высокую степень признака; 2) отдельные слова с приставкой. Объяснить, почему приставка пере- в повторе не даёт двух н, а в отдельном слове приставка требует нн.',
  obr:'Штопаные-перештопаные варежки → повтор: одна н в обеих частях. Заштопанные варежки → отдельное слово с приставкой за- → две н.',
  body:'1. По хоже..ым-перехоже..ым тропинкам мы вышли к озеру. 2. Эту тайгу, исхоже..ую ещё в юности, дед знал как свои пять пальцев. 3. В сарае у деда стоял чине..ый-перечине..ый велосипед. 4. Мастер вернул нам почине..ый зонт уже на следующий день. 5. Грузовик свернул на езже..ую-переезже..ую лесную дорогу. 6. Колея, изъезже..ая тракторами, превратилась в канаву. 7. Рыбаки сушили на берегу лата..ые-перелата..ые сети. 8. Мама отыскала в шкафу залата..ые на локтях джинсы. 9. В её сундуках я нашёл пропасть всякого старушечьего хлама, но, перебрав все поношенные чепцы и перештопа..ые чулки, я не нашёл ни денег, ни драгоценных вещей… (А. П. Чехов, «Драма на охоте») Пояснения: пропасть — здесь: очень много; чепец — женский домашний головной убор.'},
 {n:22,l:3,st:2,task:'Заменить описательные обороты сложными прилагательными с первой частью мало-, свеже-, гладко- или домо-. Записать полученные сочетания, отделить чертой первую часть и объяснить, сколько н пишется во второй части. Найти оборот, из которого получается прилагательное совсем без н, и объяснить почему.',
  obr:'Платье, которое мало носили → мало|ношеное платье: носить — без приставки → одна н. Пирожки, которые только что испекли → свеже|испечённые пирожки: испечь — приставка ис- → две н.',
  body:'1. Лес, по которому мало ходят. 2. Рубашка, которую только что выгладили. 3. Скатерть, которую ткали дома. 4. Ель, которую только что срубили. 5. Цветы, которые только что срезали. 6. Пол, который только что вымыли. 7. Картофель, который только что выкопали. 8. Стены, которые гладко красили. 9. Остров, который мало исследовали. 10. Рыба, которую только что выловили.'},
 {n:21,l:3,st:2,task:'Вставить пропущенные буквы. Определить, что перед нами: 1) слово или сочетание с особым значением (одна н, хотя глагол совершенного вида); 2) прилагательное с одной н по общему правилу (глагол несовершенного вида, примет причастия нет); 3) причастие (две н). Доказать: у причастия найти зависимое слово или примету; для слов первой группы объяснить значение своими словами.',
  obr:'Названые сёстры с детства делились всем. → Названые — особое значение: не родные, а принятые как сёстры; одна н. Река, названная в честь первооткрывателя, течёт на север. → Названная — причастие, есть зависимое слово (в честь первооткрывателя); две н.',
  body:'1. На свадьбе посажё..ым отцом невесты был её крёстный. 2. Яблони, посаже..ые дедом, в этом году впервые дали урожай. 3. Смышлё..ый щенок быстро понял, где стоит его миска. 4. В Проще..ое воскресенье принято просить друг у друга прощения. 5. Проще..ый банком долг больше не нужно возвращать. 6. Младшая дочь купца была писа..ая красавица. 7. В гостиной висел портрет прадеда, писа..ый маслом. 8. Ну ладно, уж ладно, верче..ая, — слабо отбивалась от неё старуха. (А. И. Куприн, «Олеся») 9. Монетка, верче..ая в пальцах фокусника, вдруг исчезла. Пояснения: крёстный — тот, кто держал ребёнка при крещении.'},
 {n:50,l:3,st:2,task:'1) Вставить пропущенные буквы. Над каждым словом с пропуском указать, есть ли приставка (кроме не-), и объяснить выбор н или нн. 2) К каждому слову с одной н, у которого в списке нет пары, подобрать однокоренное слово с приставкой и записать сочетание.',
  obr:'Тёсаные брёвна (приставки нет → н) — обтёсанные брёвна (приставка об- → нн) — нетёсаные брёвна (не- приметой не считается → н).',
  body:'1. Смолё..ый канат. 2. Просмолё..ая лодка. 3. Вощё..ая бумага. 4. Плавле..ый сыр. 5. Расплавле..ый металл. 6. Пиле..ые дрова. 7. Калё..ые семечки. 8. Раскалё..ая сковорода. 9. Кручё..ый мяч. 10. Жжё..ый сахар. 11. Обожжё..ая глина. 12. Неструга..ые доски. 13. Выструга..ая из липы ложка. 14. Нелущё..ый рис. Пояснения: вощить — натирать воском; калить — сильно нагревать; лущить — очищать от шелухи.'},
 {n:24,l:3,st:3,task:'Выписать слова с пропусками вместе с определяемыми словами, вставляя буквы. Над каждым словом указать приставку, если она есть. Подчеркнуть прилагательные с нн и доказать, что это прилагательные, хотя в них две н: называют постоянный признак, зависимых слов при них нет. Объяснить, почему в словах с не- одна н.',
  obr:'И мальчики, приходившие к Ане в гости, обыкновенно в рваных сапогах и в поноше..ых брюках, тоже должны были выслушивать наставления. (А. П. Чехов, «Анна на шее») → Брюках поношенных: приставка по-; слово называет признак (старые, заношенные брюки), зависимых слов нет — прилагательное, но с приставкой, поэтому нн.',
  body:'1. При отчая..ом лае собаки коляска выехала со двора и пошла колыхаться по засохшим кочкам немощё..ого переулка. (И. А. Гончаров, «Обломов») 2. Каждый раз, когда я приходил, Олеся встречала меня с своим привычным сдержа..ым достоинством. (А. И. Куприн, «Олеся») 3. Утончё..ый вкус не удовольствовался бы этими тяжёлыми, неграциозными стульями красного дерева, шаткими этажерками. (И. А. Гончаров, «Обломов») 4. Подушки белели, как снег, и горой возвышались чуть не до потолка; одеяла шёлковые, стёга..ые. (И. А. Гончаров, «Обломов») 5. Мужчины с поднятыми воротниками пальто и дамы с бледными, заспа..ыми лицами, когда позвонили к чаю, стали спускаться вниз. (А. П. Чехов, «Ариадна») 6. Не хотите ли вы, лучше я велю вам мочё..ой морошки с сахаром подать? (Н. С. Лесков, «Очарованный странник») 7. Всё теперь заслонилось в его глазах счастьем: контора, тележка отца, замшевые перчатки, замасле..ые счёты — вся деловая жизнь. (И. А. Гончаров, «Обломов») Пояснения: удовольствоваться — остаться довольным; этажерка — лёгкая открытая полка-стойка; морошка — северная ягода; счёты — прибор для подсчёта с костяшками на прутьях.'},
 {n:51,l:3,st:3,task:'Вставить пропущенные буквы. Указать, от какого глагола образовано слово с пропуском и какого вида этот глагол. Найти слова из закрытого списка (раненый, контуженый, крещёный) и объяснить, почему в них одна н. Объяснить, почему от других глаголов, которые тоже бывают и совершенного, и несовершенного вида, пишется нн.',
  obr:'Раненый боец → ранить: слово из закрытого списка (раненый, контуженый, крещёный), приставки и зависимых слов нет → одна н. Атакованный город → атаковать тоже бывает обоих видов, но слова нет в списке → общее правило: нн (к тому же суффикс -ова-).',
  body:'1. Зришь сам не знаешь куда, и вдруг пред тобой отколь ни возьмётся обозначается монастырь или храм, и вспомнишь крещё..ую землю и заплачешь. (Н. С. Лесков, «Очарованный странник») 2. Нешто мы некрещё..ые или злодеи какие? (А. П. Чехов, «Злоумышленник») 3. Младенца, окрещё..ого в сельской церкви, назвали Иваном. 4. Контуже..ый лётчик долго не слышал ни звука. 5. Сапёр, контуже..ый в первом же бою, через месяц вернулся в полк. 6. В учебнике истории рассказывалось о казнё..ом короле Карле Первом. 7. Рождё..ый в деревне, он всю жизнь любил простор. 8. На обочине ржавел броше..ый трактор. 9. Крещё..ые бабушкой внуки дружно ходили с ней в церковь на праздники. 10. Решё..ая задача лежала на столе учителя. Пояснения: зришь — смотришь; отколь ни возьмётся — откуда ни возьмись; обозначается — показывается; нешто — разве; контузить — оглушить ударом или взрывом.'},
 {n:52,l:3,st:3,task:'Прочитать предложения. Выписать все прилагательные и причастия, в которых перед окончанием стоит н или нн после гласной (глиняный, длинный, сделанный), и распределить их в четыре столбика: 1) образованы от существительных; 2) одна н — образованы от глагола, примет причастия нет; 3) нн — с приставкой (кроме не-), в том числе сложные слова с приставкой во второй части; 4) н входит в корень. Существительные не выписывать. Каждое слово объяснить.',
  obr:'Девочка достала из ящика гусиное перо, обёрнутое бумагой. → Гусиное — от существительного гусь, суффикс -ин- (столбик 1). Обёрнутое — суффикс -т-, н нет — не выписывается.',
  body:'1. Затем я вступал с Ярмолой в запутанный, необычайно сложный отвлечённый спор. (А. И. Куприн, «Олеся») 2. И я знал почему-то, что в этом спокойном круге с нечёткими краями притаилась безмолвная, однообразная, таинственная и грозная жизнь, ещё более жуткая и угнетающая, чем бешеный хаос моих сновидений. (А. И. Куприн, «Олеся») 3. Затем на лошадей надели серые полотняные попоны с красными каймами, красными кругами около глаз и красными вензелями внизу у задних ног. (А. И. Куприн, «Изумруд») 4. В кухне возле самой печи за засаленным столом сидели Журкин и его жена. (А. П. Чехов, «Барыня») 5. Ниже его горела тем же огнём церковная глава, и лоснился на солнце свежевыкрашенный зелёный купол, а за сверкающим крестом широко расстилалась прозрачная, далёкая синева. (А. П. Чехов, «Драма на охоте») 6. Пашка отродясь не ел жареного мяса и, испробовав его теперь, нашёл, что оно очень вкусно. (А. П. Чехов, «Беглец») 7. В одном из углов стояло маленькое корытце, в котором она увидела мочёный горох и размокшие ржаные корки. (А. П. Чехов, «Каштанка») Пояснения: Ярмола — лесник, слуга рассказчика; попона — покрывало для лошади; вензель — узор из начальных букв имени; глава (церковная) — купол церкви; лосниться — блестеть.'},
 {n:25,l:3,st:3,task:'Заполнить таблицу для каждого глагола: 1) отглагольное прилагательное с существительным; 2) то же прилагательное с не-; 3) сложное прилагательное из списка (если подходящего нет — прочерк); 4) причастие с зависимым словом; 5) причастие с приставкой. В каждом слове обозначить причину выбора н или нн. С двумя словами одного глагола составить предложения. Сложные прилагательные для третьего столбика: домотканый, свежевыбеленный, свежескошенный.',
  obr:'Красить: крашеный забор — некрашеный забор — гладкокрашеный пол — забор, крашенный в два слоя, — покрашенный забор.',
  body:'Ткать, белить, косить, мостить.'},
 {n:53,l:3,st:4,task:'Найти и исправить ошибки в написании н и нн. В тексте семь ошибок. Каждое исправление объяснить правилом. Объяснить и верные написания слов с н или нн.',
  body:'Летом мы ездили с классом в небольшой приволжский город. В краеведческом музее экскурсовод показала нам домотканные полотенца с вышивкой и портрет купеческой дочери, писанной красавицы. Рядом висел портрет её названного брата: в детстве их растили вместе. Потом мы долго бродили по узким улочкам и вышли к собору со свежевыкрашеными куполами. На площади шла ярмарка: продавали подержанные книги, лоскутные одеяла, малосолёные огурцы и смышлённых щенков. Мой друг купил старую карту в потёртом, латанном-перелатанном футляре и был уверен, что она приведёт его к малоизученым пещерам за рекой.'},
 {n:54,l:3,st:4,task:'1) Выписать слова с пропусками вместе с определяемыми словами, вставляя буквы, и объяснить написание. 2) Каждое слово преобразовать тремя способами: а) добавить зависимое слово; б) заменить однокоренным словом с приставкой; в) если возможно, образовать сложное прилагательное с первой частью гладко- или свеже- либо прибавить не- (если нельзя — прочерк). Записать новые сочетания. 3) Объяснить, в каком случае число н не меняется, хотя у слова появилась новая часть.',
  body:'1. Просыпается он в большой комнате с краше..ыми стенами. (А. П. Чехов, «Горе») 2. Ей показалось, что от цветника с тощим, стриже..ым тополем пробиралась к дому какая-то тёмная фигура. (А. П. Чехов, «В потёмках») 3. В кладовой к потолку привешены были окорока, чтоб не портили мыши, сыры, головы сахару, провесная рыба, мешки с сушё..ыми грибами… (И. А. Гончаров, «Обломов») 4. В чашке были печё..ые яйца, ржавые лепёшки на сале, куски чёрного хлеба и ещё что-то… (А. П. Чехов, «Агафья») 5. Зоолог и дьякон сели на скамью около столика, а Самойленко опустился в плетё..ое кресло с широкой, покатой спинкой. (А. П. Чехов, «Дуэль») Пояснения: провесная рыба — провяленная на воздухе; ржавые — здесь: рыжевато-бурые; дьякон — священнослужитель.'},
 {n:55,l:3,st:4,task:'Выписать слова с пропусками вместе с определяемыми словами, вставляя буквы. Распределить их в четыре столбика: 1) прилагательные от существительных; 2) причастия (указать примету: приставка с зависимым словом, совершенный вид); 3) прилагательные с приставкой — слова без зависимых слов, которые называют постоянный признак; 4) сложные прилагательные. Найти причастие, в котором нет ни приставки, ни зависимого слова, и объяснить, почему в нём нн.',
  body:'1. Тут и полуразруше..ые, поросшие мхом гроты, фонтаны, прудики, предназначе..ые для золотой рыбы и ручных карпов, горы, беседки, дорогие оранжереи… (А. П. Чехов, «Драма на охоте») 2. Если бы этот городишко вдруг провалился или сгорел, то телеграмму об этом прочли бы в России с такою же скукой, как объявление о продаже подержа..ой мебели. (А. П. Чехов, «Дуэль») 3. На другой записке тем же самым излома..ым почерком с длинными хвостами и закорючками было написано: «А кто-то в субботу не уедет». (А. П. Чехов, «Дуэль») 4. У них нет этого вот, как у нас, чтоб в шкафах лежала по годам куча старого, изноше..ого платья или набрался целый угол корок хлеба за зиму… (И. А. Гончаров, «Обломов») 5. Ветви сирени, посаже..ые дружеской рукой, дремлют над могилой да безмятежно пахнет полынь. (И. А. Гончаров, «Обломов») 6. Это был не купле..ый, а свой собстве..ый крыжовник, собра..ый в первый раз… (А. П. Чехов, «Крыжовник») 7. Он глядел на мальчика жалкими, растеря..ыми глазами, а его рука, показывавшая прямо в землю, ходила во все стороны. (А. И. Куприн, «Белый пудель») 8. Надворных построек — невысоких, но домовитых — множество, и все они точно слиты из тёмных дубовых брёвен под соломе..ыми крышами. (И. А. Бунин, «Антоновские яблоки») 9. Солнце сверкает сбоку, и дорога, уката..ая после дождей телегами, замаслилась и блестит, как рельсы. (И. А. Бунин, «Антоновские яблоки») Пояснения: грот — пещера; оранжерея — теплица для растений; надворные постройки — сараи, амбары и т. п. во дворе.'},
 {n:56,l:3,st:5,task:'Лингвистическая задача. Вставить пропущенные буквы. Затем опровергнуть четыре неверных «правила», которые составил ученик: для каждого найти среди слов 1–12 все примеры, которые ему противоречат, и сформулировать верное правило. А) «Если у слова есть приставка, всегда пишется нн». Б) «От глаголов совершенного вида всегда нн». В) «В сложных прилагательных всегда одна н». Г) «Если слово называет постоянный признак и зависимых слов нет, это прилагательное — одна н». Найти и такие слова, которые не противоречат ни одному «правилу».',
  body:'1. Нечёса..ые волосы. 2. Растрёпа..ые ветром волосы. 3. Ноше..ый-переноше..ый пиджак. 4. Назва..ый брат. 5. Посажё..ый отец. 6. Контуже..ый солдат. 7. Свежезаваре..ый чай. 8. Гладкоокраше..ые стены. 9. Подержа..ый ноутбук. 10. Заброше..ый дом. 11. Свежемороже..ая малина. 12. Варё..ая картошка.'},
// Урок 4
 {n:26,l:4,st:1,task:'Образовать от полных форм краткие формы женского рода и множественного числа. Сначала определить, что перед нами: прилагательное (называет качество) или причастие (на действие указывает зависимое слово). Записать, сколько н в краткой форме и почему.',
  obr:'Бездонная пропасть → пропасть бездонна, пропасти бездонны (прилагательное: дно → бездонный, как в полной форме — нн). Дорога, проложенная через лес → дорога проложена через лес, дороги проложены (причастие, есть зависимое слово: одна н).',
  body:'1. Туманная даль. 2. Картина, написанная маслом. 3. Юная гимнастка. 4. Площадь, украшенная флагами. 5. Бесценная находка. 6. Откровенная беседа. 7. Книга, изданная в прошлом веке. 8. Естественная улыбка. 9. Тропинка, протоптанная ребятами. 10. Мужественная девушка. 11. Станция, построенная к Олимпиаде. 12. Сдержанная речь. 13. Статья, переведённая с английского.'},
 {n:27,l:4,st:1,task:'Определить, кратким причастием или кратким прилагательным является каждое слово с н или нн. Доказать: для причастия найти зависимое слово (кем? чем? где? когда?) или назвать действие; для прилагательного подобрать полную форму и найти однородное прилагательное. Найти два предложения с краткой формой мужского рода и объяснить, почему в них одна н, хотя одно из этих слов — прилагательное.',
  obr:'Тетрадь проверена учителем. → Проверена (кем?) учителем — краткое причастие. Ночь тиха и безлунна. → Безлунна — краткое прилагательное (безлунная ночь), однородное — тиха.',
  body:'1. Все билеты на спектакль уже проданы. 2. Доводы докладчика убедительны и обоснованны. 3. Требования к участникам обоснованы правилами конкурса. 4. Окрестности города живописны и пустынны. 5. Спортивная площадка огорожена сеткой. 6. Девочка с детства болезненна и худа. 7. Гости приглашены к семи часам. 8. Движения фигуристки легки и непринуждённы. 9. Город основан в двенадцатом веке. 10. Мальчик воспитан и вежлив. 11. Посылка отправлена утром. 12. Птицы распуганы выстрелом.'},
 {n:28,l:4,st:2,task:'Вставить н или нн. Над каждым словом с пропуском написать: кр. прич. или кр. прил. Объяснить выбор.',
  obr:'Сочинение провере..о учителем. → Проверено (кем?) учителем — краткое причастие, одна н. Девочка весела и непосредстве..а. → Непосредственна — краткое прилагательное (непосредственная девочка), однородное — весела: две н.',
  body:'1. Задание выполне..о без единой ошибки. 2. Сестра умна, начита..а и остроумна. 3. Выставка оформле..а учениками художественной школы. 4. Наши планы на лето неизме..ы. 5. Вопросы к экзамену разосла..ы заранее. 6. Решения капитана всегда взвеше..ы и разумны. 7. Мука взвеше..а и разложена по пакетам. 8. Мосты через Неву разведе..ы на ночь. 9. Дороги к посёлку расчище..ы от снега. 10. Стихи этого поэта нежны и проникнове..ы. 11. Окна заклее..ы на зиму. 12. Брат честен, трудолюбив и самоотверже...'},
 {n:29,l:4,st:2,task:'С каждым словом составить два предложения по подсказкам: в первом слово должно быть кратким причастием (одна н), во втором — кратким прилагательным (две н). Подсказка указывает подлежащее и то, что должно стоять рядом. Записать предложения, обозначить нужное число н и объяснить.',
  obr:'Обдуман(н)ы: а) планы (когда? заранее); б) ответы (каковы? точны и …). → а) Планы обдуманы заранее. б) Ответы точны и обдуманны.',
  body:'1. Организован(н)ы: а) соревнования (кем? советом школы); б) ученики (каковы? дисциплинированны и …). 2. Выдержан(н)ы: а) сыры (сколько времени и где? полгода в погребе); б) ответы на трудные вопросы (каковы? спокойны и …). 3. Одарён(н)а: а) победительница (чем? подарками от спонсоров); б) девочка (какова? музыкально …). 4. Образован(н)а: а) новая область (когда? в прошлом году); б) соседка (какова? умна и …). 5. Ограничен(н)ы: а) сроки (чем? приказом); б) его знания (каковы? = скудны).'},
 {n:30,l:4,st:3,task:'Вставить пропущенные буквы. Подчеркнуть слово, от которого зависит выбор (дополнение, придаточную часть), если оно есть, и объяснить написание. Найти предложение, где одна н пишется при любом значении слова, и объяснить почему.',
  obr:'Мы увере..ы в победе. → Уверены: есть дополнение (в чём?) в победе — значение «убеждены», одна н. Её движения увере..ы и точны. → Уверенны: дополнения нет, слово называет качество (уверенные движения), нн.',
  body:'1. Дядечка купил, я в этом увере..а. (А. П. Чехов, «Вишнёвый сад») 2. Но нет в нём чего-то главного, лошадиного, и во время прикидки чувствуется через вожжи, что его руки неувере..ы и неточны. (А. И. Куприн, «Изумруд») 3. Надо понимать, видите ли, что он когда-то, во времена оны, всей душой был преда.. цивилизации, служил ей, постиг её насквозь… (А. П. Чехов, «Дуэль») 4. Собаки этой породы умны, послушны и бесконечно преда..ы. 5. Мы преда..ы своей мечте и не отступим. 6. Теперь вся Барцелона убежде..а в том, что его жена ведьма! (А. П. Чехов, «Грешник из Толедо») 7. Я хочу, чтоб ты и в глазах света была чиста и безукоризне..а, какова ты в самом деле… (И. А. Гончаров, «Обломов») 8. Скажите ему, что я глубоко оскорбле..а его невежливым поступком! (А. П. Чехов, «Барыня») 9. Вы, знающий, что она в вас по уши влюбле..а, всё ездите и ездите… (А. П. Чехов, «Драма на охоте») Пояснения: прикидка — пробный забег рысака; во времена оны — в давние времена; без укоризны — так, что не в чем упрекнуть; Барцелона — так у Чехова названа Барселона.'},
 {n:57,l:4,st:3,task:'Вставить пропущенные буквы. Над каждым словом с пропуском написать: кр. прич. или кр. прил. Доказать: у причастия найти зависимое слово или назвать действие; у прилагательного — подобрать полную форму и найти однородные прилагательные.',
  obr:'Окна были отворе..ы настежь. → Отворены — кр. прич.: окна отворили (действие), зависимое слово настежь; одна н.',
  body:'1. Изба Игната, его сарай, хлев и колодец были окруже..ы высокими сугробами. (А. П. Чехов, «Белолобый») 2. Она так настойчива, непрекло..а! (И. А. Гончаров, «Обломов») 3. Лестница, полы и косяки — всё громадное, прямое и яркое — были выкраше..ы в великолепную жёлтую краску и издавали вкусный запах постного масла. (А. П. Чехов, «Беглец») 4. Пусть Ариадна Григорьевна, как вы говорите, поэтична и возвыше..а, но это не значит, что она должна быть вне законов природы. (А. П. Чехов, «Ариадна») 5. Всё небо усыпа..о весело мигающими звёздами, и Млечный Путь вырисовывается так ясно, как будто его перед праздником помыли и потёрли снегом… (А. П. Чехов, «Ванька») 6. Мужчины в домашнем быту легкомысле..ы, живут умом, а не сердцем, не понимают многого, но женщина всё понимает. (А. П. Чехов, «Дуэль») 7. Два окна, выходившие из дежурной комнаты, были ярко освеще..ы. (А. П. Чехов, «Винт») 8. Платов показывает государю собачку, а там на самом сугибе сдела..а русская надпись: «Иван Москвин во граде Туле». (Н. С. Лесков, «Левша») Пояснения: во 2-м предложении речь о человеке, которого нельзя переубедить; сугиб — сгиб (слово Лескова); во граде — в городе.'},
 {n:58,l:4,st:3,task:'Выписать из предложений все краткие формы с н или нн в суффиксе вместе с подлежащим и распределить их в два столбика: 1) краткие причастия; 2) краткие прилагательные. Для каждого слова записать полную форму и доказательство. Указать краткую форму мужского рода, в которой выбирать н или нн не нужно, и объяснить почему. Затем найти полные прилагательные и причастия с н или нн и объяснить их написание по урокам 1–3.',
  obr:'Двери заперты, окна завешены. → Окна завешены — кр. прич.: окна завесили (действие); полная форма завешенные — нн, краткая — н. Заперты — суффикс -т-, не выписывается.',
  body:'1. Войдёшь в залу и не налюбуешься, как симметрически рассажены гости, как смирно и глубокомысленно сидят — за картами. (И. А. Гончаров, «Обломов») 2. Волосы её были не причёсаны, разбросаны по плечам, лицо заспанное, смуглое от сумерек… (А. П. Чехов, «Володя») 3. Но с какой стати она должна быть откровенна со мной? (А. П. Чехов, «Ариадна») 4. Как ни неожиданна и ни экстраординарна была встреча с сумасшедшим, но, тем не менее, скоро она была забыта… (А. П. Чехов, «Драма на охоте») 5. Все его мысли, как бы благородны, возвышенны или безразличны они ни были, имеют всегда одну и ту же точку общего схода. (А. П. Чехов, «Дуэль») 6. Мой роман в заголовке назван «уголовным»… (А. П. Чехов, «Драма на охоте») Пояснения: симметрически — ровно, в одинаковом порядке; экстраординарный — необычайный; мой роман — рассказчик говорит о своей повести.'},
 {n:59,l:4,st:3,task:'Найти в каждом предложении полное прилагательное или причастие с нн и перестроить предложение или его часть так, чтобы это слово стало кратким и было сказуемым (в 1-м, 2-м и 3-м предложениях — вместе с соседним однородным прилагательным). Записать, сколько н в краткой форме, и объяснить. Сравнить: почему в одних кратких формах нн сохраняется, а в других остаётся одна н?',
  obr:'Улицы, засыпанные снегом, опустели. → Улицы засыпаны снегом — кр. прич. (чем?), одна н. Цветы на столе искусственные. → Цветы искусственны — кр. прил. (искусство → -енн-), нн, как в полной форме.',
  body:'1. У него бодрый, здоровый вид, роскошные седые бакены, благовоспитанные манеры и громкий приятный голос. (А. П. Чехов, «Палата № 6») 2. Она шла гордая, самоуверенная, в первый раз чувствуя себя не девочкой, а дамой… (А. П. Чехов, «Анна на шее») 3. Бывают, знаешь, зверьки, не больше крысы, на вид красивенькие, но в высочайшей степени, скажу я тебе, подлые и безнравственные. (А. П. Чехов, «Дуэль») 4. Иона вздрагивает и сквозь ресницы, облепленные снегом, видит военного в шинели с капюшоном. (А. П. Чехов, «Тоска») 5. Серое тусклое утро, и облака, бежавшие на запад, чтобы догнать грозовую тучу, и горы, опоясанные туманом, и мокрые деревья — всё показалось дьякону некрасивым и сердитым. (А. П. Чехов, «Дуэль») 6. Наконец, уже совсем в темноте, вваливается ватага охотников в усадьбу какого-нибудь почти незнакомого холостяка-помещика и наполняет шумом весь двор усадьбы, которая озаряется фонарями, свечами и лампами, вынесенными навстречу гостям из дому… (И. А. Бунин, «Антоновские яблоки») Пояснения: бакены (бакенбарды) — полоски волос от висков по щекам; Иона — извозчик; ватага — толпа.'},
 {n:60,l:4,st:4,task:'Найти и исправить ошибки в написании н и нн. В тексте шесть ошибок. Каждое исправление объяснить; объяснить и верные написания кратких форм.',
  body:'Школьная спартакиада подготовленна советом старшеклассников. Расписание соревнований вывешено в холле ещё в понедельник. Утро выдалось безветреное, но прохладное. Беговые дорожки стадиона ровны и гладки, трибуны заполненны болельщиками. Выступления наших гимнасток были вдохновенны и безупречны. Зато прыгуны в длину оказались невнимательны и дважды заступили за планку. Итоги финала были объявленны судьёй только к вечеру и оказались неожиданными для всех. Победителям вручили грамоты, подписаные директором, и кубок, изготовленный руками выпускников. Все участники были награждены памятными значками, а праздник получился по-настоящему торжественым.'},
 {n:61,l:4,st:4,task:'Вставить пропущенные буквы в парах предложений. В каждой паре объяснить, почему слово пишется по-разному: найти зависимое слово, указывающее на действие, или однородные прилагательные, указывающие на качество. Для двух пар (по выбору) составить свою пару предложений с другим словом.',
  body:'1. а) Комната освеще..а настольной лампой. б) Лицо девушки одухотворе..о и прекрасно. 2. а) В следующие за тем дни он убедился, что его учительница барышня милая, серьёзная и аккуратная, но что она очень необразова..а и учить взрослых не умеет… (А. П. Чехов, «Дорогие уроки») б) Комиссия образова..а приказом директора. 3. а) Вещи уже собра..ы в дорогу. б) Перед стартом пловцы молчаливы и собра..ы. 4. а) Сроки сдачи проекта определе..ы ещё в сентябре. б) Ответы свидетеля уклончивы и неопределё..ы. 5. а) Чаши весов уравновеше..ы гирями. б) Старшая сестра спокойна и уравновеше..а.'},
 {n:62,l:4,st:4,task:'1) Вставить пропущенные буквы и объяснить написание по правилам уроков 1–4. 2) Выписать краткие формы с н или нн в суффиксе вместе с подлежащим и указать, причастие это или прилагательное. 3) В первом предложении расставить пропущенные запятые и объяснить их.',
  body:'1. Гримасы его странны и болезне..ы, но тонкие черты положе..ые на его лицо глубоким искренним страданием разумны и интеллигентны, и в глазах тёплый, здоровый блеск. (А. П. Чехов, «Палата № 6») 2. Эти слова, простые и обыкнове..ые, были сказа..ы простым человеческим языком, но Огнев в сильном смущении отвернулся от Веры, поднялся и вслед за смущением почувствовал испуг. (А. П. Чехов, «Верочка») 3. Сосредоточе..ые, неподвижные, с лицами, окраше..ыми в зелёный цвет от абажуров, они напоминали сказочных гномов или, чего боже избави, фальшивых монетчиков… (А. П. Чехов, «Винт») 4. Просто всё как будто каким-нибудь волшебством здесь переменилось: всё подновле..о, словно изба, к празднику убра..ая, а флигеля, где Груша жила, и следа нет: срыт, и на его месте новая постройка поставле..а. (Н. С. Лесков, «Очарованный странник») Пояснения: чего боже избави — не дай бог; монетчик — тот, кто чеканит фальшивые монеты; подновить — обновить, привести в порядок; флигель — небольшая постройка рядом с главным домом.'},
 {n:63,l:4,st:5,task:'Тонкость (см. «Тонкости» урока 4: «Глаза заплаканы, платье поношено»). Вставить пропущенные буквы. 1) Сравнить предложения 1 и 5: в обоих краткая форма стоит в ряду однородных членов. Почему в 1-м — одна н, а в 5-м — две? 2) К кратким формам из предложений 1 и 2 подобрать полные и объяснить, почему в полной форме нн. 3) Объяснить, почему однородное прилагательное и вопрос «каков?» здесь не помогают решить, сколько н писать, и что помогает. 4) Составить предложения с полной и краткой формой слова заплаканный.',
  obr:'Глаза покраснели и заплака..ы. → Заплаканы: глаза стали такими от слёз — состояние, полученное в результате действия, поэтому одна н, как у краткого причастия (полная форма — заплаканные, нн).',
  body:'1. Платье её, в отношении к нарядной шали и парадному чепцу, казалось старо и поноше..о. (И. А. Гончаров, «Обломов») 2. Лица заплака..ы, но это не мешает им улыбаться. (А. П. Чехов, «Детвора») 3. Девочка подняла на маму заплака..ые глаза. 4. В шкафу висело поноше..ое пальто. 5. Манеры гостьи просты и изыска..ы. 6. Отношения между нашими школами давно дружестве..ы. Пояснения: в отношении к — по сравнению с; чепец — женский головной убор.'},
 {n:64,l:4,st:5,os:'диктант',task:'Выборочно-распределительный диктант. Текст читает учитель или родитель. Записать только прилагательные и причастия с н или нн после гласной в суффиксе, вместе с определяемыми словами (краткие формы — с подлежащим), в два столбика: 1) краткие формы; 2) полные формы. Объяснить написание каждого слова. Затем: 1) объяснить, почему «не убранная» пишется раздельно и с нн; 2) от двух полных причастий (по выбору) образовать краткие формы женского рода и составить с ними предложения.',
  body:'Коридорные часы сипло пробили два пополудни, а в номерке ещё не было убрано. Скомканное одеяло, разбросанные подушки, книги, платье, большой грязный таз, наполненный мыльными помоями, в которых плавали окурки, сор на полу — всё, казалось, было свалено в одну кучу, нарочно перемешано, скомкано… (А. П. Чехов, «Анюта») По стенам, около картин, лепилась в виде фестонов паутина, напитанная пылью; зеркала, вместо того чтоб отражать предметы, могли бы служить скорее скрижалями для записывания на них по пыли каких-нибудь заметок на память. На диване лежало забытое полотенце; на столе редкое утро не стояла не убранная от вчерашнего ужина тарелка с солонкой и с обглоданной косточкой да не валялись хлебные крошки. Если б не эта тарелка, да не прислонённая к постели только что выкуренная трубка, или не сам хозяин, лежащий на ней, то можно было бы подумать, что тут никто не живёт — так всё запылилось, полиняло и вообще лишено было живых следов человеческого присутствия. (И. А. Гончаров, «Обломов») Пояснения: номерок — маленькая комната в меблированных комнатах; помои — грязная вода; фестоны — зубчатые или волнистые узоры по краю; скрижали — здесь: доски для записей.'},
// Урок 5
 {n:31,l:5,st:1,task:'От данных слов образовать сначала прилагательное (или причастие), а от него — наречие на -о. Записать цепочкой, в прилагательном обозначить суффикс. Объяснить, почему в наречии столько же н, сколько в прилагательном. С тремя наречиями составить словосочетания «глагол + наречие».',
  obr:'Восторг → восторж-енн-ый → восторженно: смотрел восторженно (в прилагательном суффикс -енн-, поэтому и в наречии две н).',
  body:'Церемония (с приставкой бес-), жизнь (с приставкой без-), чин, закон, туман, путать, отчаяться, насторожиться, возбудить, обидеть.'},
 {n:65,l:5,st:1,task:'Выписать из предложений наречия, в которых пишется н или нн, и рядом — прилагательное, от которого образовано каждое наречие. Распределить наречия в два столбика: с одной н и с двумя. Краткие причастия (они бывают сказуемыми и тоже оканчиваются на -о, -а, -ы) не выписывать. В одном предложении наречия на правило нет.',
  obr:'Дождь шёл постоянно, и дорога была размыта. → Постоянно (постоянный): две н. Размыта — краткое причастие (сказуемое), не выписывается.',
  body:'1. Младший брат сонно потёр глаза и снова уткнулся в подушку. 2. Команда мужественно отыгрывалась до последней минуты матча. 3. Девушка ветрено пообещала прийти и тут же забыла об этом. 4. Экскурсовод рассказывал вдохновенно, и никто его не перебивал. 5. Малыш озадаченно разглядывал новую игрушку. 6. Решение задачи было найдено мгновенно. 7. Из кухни пряно пахло гвоздикой и корицей. 8. Бабушка неизменно встречала нас пирогами. 9. Окна в классе вымыты, парты расставлены, всё подготовлено к первому сентября. 10. Альпинисты напряжённо всматривались в облака над перевалом. 11. Щёки девочки румяно светились с мороза. 12. Мы искренне обрадовались, когда друг вернулся из больницы. 13. Площадь украшена флагами, на ней торжественно звучит оркестр. 14. Кот самоуверенно разлёгся посреди кухни.'},
 {n:32,l:5,st:2,task:'Вставить пропущенные буквы. Над каждым словом с пропуском указать: наречие (отвечает на вопрос «как?», относится к глаголу) или краткое причастие (сказуемое; к нему можно задать вопрос «что сделано?», часто есть зависимое слово «кем? чем?»). Объяснить написание. Найти пары однокоренных слов, которые пишутся по-разному, и объяснить разницу.',
  obr:'Всё имущество растеря..о при переезде. — Малыш растеря..о оглядывался. → Растеряно — кр. прич.: имущество (что сделано?) растеряно, одна н. Растерянно — наречие: оглядывался (как?) растерянно, от растерянный, две н.',
  body:'1. Внимание всего класса сосредоточе..о на опыте с магнитом. 2. Туристы шли организова..о, никто не отставал. 3. Котёнок испуга..о выглянул из-под дивана. 4. Всё население посёлка взволнова..о известием о наводнении. 5. Горло раздраже..о дымом от костра. 6. Шахматист сосредоточе..о смотрел на доску. 7. Облако дыма постепенно рассея..о ветром. 8. Соревнование организова..о школьным спортклубом. 9. Сосед раздражё..о хлопнул дверью. 10. Стадо испуга..о грозой и сбилось в кучу. 11. Ученик рассея..о слушал объяснение и смотрел в окно. 12. Капитан взволнова..о поблагодарил болельщиков.'},
 {n:74,l:5,st:2,task:'Заменить сочетания «глагол + с + существительное» сочетаниями «глагол + наречие» с тем же значением и записать их. Указать прилагательное, от которого образовано каждое наречие, и объяснить, сколько в нём н. Внимание: не все наречия здесь пишутся с нн — распределить их на группы: две н; одна н; н на стыке нет.',
  obr:'Ответил с обидой → ответил обиженно (обиженный: от глагола совершенного вида обидеть — две н).',
  body:'Говорил с убеждением, спорил с ожесточением, вздохнул с облегчением, переспросил с недоумением, ответил с упрёком, взглянул с сочувствием, держался с надменностью, оглянулся с тревогой, поклонился с почтением, посмотрел с подозрением, ждал с нетерпением.'},
 {n:33,l:5,st:3,task:'Выписать слова с пропусками, вставляя буквы. Над каждым наречием указать прилагательное, от которого оно образовано. В двух предложениях есть краткие причастия — найти их и объяснить, почему в них одна н.',
  obr:'Женщина озабоче..о и молча раскладывала карты. (М. Горький, «Мои университеты») → Озабоченно (озабоченный): раскладывала как? — наречие, две н.',
  body:'1. Смотрел я умилё..о и в первый раз от роду принял я тогда в душу первое семя слова Божия осмысле..о. (Ф. М. Достоевский, «Братья Карамазовы») 2. Я люблю, люблю восторже..о, беше..о, безумно! (Ф. М. Достоевский, «Бедные люди») 3. Вчерашний дождь перестал совсем, но было мокро, сыро и ветре..о. (Ф. М. Достоевский, «Бесы») 4. Иные шли медле..о и степе..о, другие — торопливо застёгивая на ходу полушубки. (М. Горький, «Мать») 5. Он неловко присел на край дивана и говорил, смущё..о пожимая плечами: — Случай подвернулся! (М. Горький, «Мать») 6. Кто б ни был ты, увере..о / В калитку деревенскую / Стучись! (Н. А. Некрасов, «Кому на Руси жить хорошо») 7. От нас через стол, шагах в пяти, обедали два господина и оживлё..о разговаривали. (Ф. М. Достоевский, «Подросток») 8. Небесный свод, горящий славой звёздной, / Таинстве..о глядит из глубины, — / И мы плывём, пылающею бездной / Со всех сторон окруже..ы. (Ф. И. Тютчев, «Как океан объемлет шар земной…») 9. Всё, что я читал, было насыще..о идеями христианства, гуманизма, воплями о сострадании к людям, — об этом же красноречиво и пламе..о говорили лучшие люди, которых я знал в ту пору. (М. Горький, «Мои университеты») Пояснения: умилиться — растрогаться; осмыслить — понять, обдумать; в предложении 4 — шли неторопливо, с достоинством; свод — здесь: небо; гуманизм — человеколюбие.'},
 {n:66,l:5,st:3,task:'Вставить пропущенные буквы. Распределить сочетания в два столбика: наречия с одной н и наречия с двумя. В скобках записать прилагательное, от которого образовано наречие, и объяснить, почему в нём одна или две н.',
  obr:'Багря..о пылал закат → багряно (багряный: н входит в корень, суффикса -н- нет — одна н).',
  body:'Пря..о пахло корицей; рья..о взялся за уборку; мудрё..о выражался; жема..о поджала губы; рва..о дышал после бега; неслыха..о повезло; единстве..о верное решение; румя..о светились яблоки в листве; солё..о было на губах после купания; деревя..о звучал голос; самоотверже..о спасал людей; огне..о сверкнули глаза; стеснё..о дышал в душной комнате. Пояснения: мудрить — хитрить, слишком усложнять; самоотвержение — готовность пожертвовать собой ради других; стеснить — сжать, сдавить.'},
 {n:71,l:5,st:3,task:'Перестроить предложения. В пунктах 1, 3, 5, 6, 8 вместо краткого причастия употребить наречие при глаголе, данном в скобках; в пунктах 2, 4, 7 — наоборот: вместо наречия употребить краткое причастие с зависимым словом из скобок. Записать оба предложения, вставляя пропущенные буквы, и объяснить, почему написание меняется.',
  obr:'Публика озадаче..а вопросом. (переглянулась) → Публика озадачена вопросом (кр. прич., одна н). — Публика озадаченно переглянулась (наречие, как в слове озадаченный, — две н).',
  body:'1. Малышка обрадова..а подарком. (засмеялась) 2. Зрители разочарова..о вздохнули. (… концовкой фильма) 3. Девочка увлече..а рисованием. (рисовала) 4. Жители возмущё..о обсуждали шум стройки. (… шумом стройки) 5. Гостья смуще..а комплиментом. (улыбнулась) 6. Собака встревоже..а шорохом. (залаяла) 7. Сестра обиже..о молчала. (… замечанием) 8. Мама огорче..а плохой отметкой сына. (покачала головой)'},
 {n:68,l:5,st:3,task:'Разобрать наречия по составу: выделить приставку, корень, суффиксы (окончания у наречия нет). Объяснить, откуда в каждом слове одна или две н, и распределить слова по группам: а) основа на н + суффикс -н-; б) суффикс -енн-, -онн-; в) слово-исключение; г) отглагольное прилагательное с суффиксом -н- (одна н) или причастие с суффиксом -нн-, -ённ- (две н); д) н входит в корень.',
  obr:'Ценно (ценно для науки) → цен-н-о: корень цен- оканчивается на н, к нему прибавлен суффикс -н-, затем -о; две н — группа а.',
  body:'Сонно (сонно зевал), законно (поступил законно), письменно, традиционно, учёно, напряжённо, нечаянно, юно.'},
 {n:67,l:5,st:4,task:'Выписать слова с пропусками, вставляя буквы. Распределить их в два столбика: 1) наречия на -о с н или нн (с прилагательным, от которого они образованы); 2) краткие причастия — вместе с подлежащим, если оно есть. Доказать, что слова второго столбика — причастия: задать вопрос «что сделано?» или найти зависимое слово «кем? чем?». Остальные слова с пропусками объяснить по правилам уроков 1–4.',
  obr:'Рукопись была исправле..а, и автор удовлетворё..о кивнул. → Исправлена — кр. прич. (рукопись что сделана? исправлена): одна н. Удовлетворённо — наречие (кивнул как?), от удовлетворённый: две н.',
  body:'1. Всё это сдела..о, одето, раскраше..о и размеще..о умело и искус..о, и кажется, что всё живёт и шумит. (М. Горький, «Сказки об Италии») 2. Оно было писа..о тёмным и запута..ым слогом. (А. С. Пушкин, «История Пугачёва») 3. Немедле..о доставле..о было калмыкам вспоможение юртами, скотом, одеждою и хлебом. (А. С. Пушкин, «История Пугачёва») 4. Всё скоро уложе..о было у нас, / И утром, ни с кем не прощаясь, / Мы тронулись в путь. (Н. А. Некрасов, «Русские женщины») 5. Этой нитью всё связа..о, всё оплете..о, незримой крепостью её и держится на веки вечные государево царство. (М. Горький, «Мои университеты») 6. У Грушницкого растрёпа..ая причёска и отчая..ый вид; он, кажется, в самом деле огорчён, особе..о самолюбие его оскорбле..о; но ведь есть же люди, в которых даже отчаяние забавно!.. (М. Ю. Лермонтов, «Герой нашего времени») Пояснения: оно — здесь: письмо, воззвание; слог — манера письма; вспоможение — помощь; юрта — переносное жилище кочевников; калмыки — кочевой народ.'},
 {n:69,l:5,st:4,task:'Выписать слова с пропусками, вставляя буквы. У каждого слова на -о, -а, -ы указать, чем оно является: наречием, кратким причастием или кратким прилагательным. Доказать: задать вопрос, найти зависимое слово, определить значение (действие или состояние после действия — или постоянное качество). Внимание: однородный ряд с прилагательным — ещё не доказательство, решает значение (см. предложение 1). Остальные слова с пропусками объяснить.',
  body:'1. Конница Кара была утомле..а и малочисле..а. (А. С. Пушкин, «История Пугачёва») 2. Сумрачно и скучно в узкой галерее, тесно завале..ой шерстью, овчинами, пенькой, канатом, валя..ым сапогом, шорным товаром. От панели её отделяют колонны из кирпича; неуклюже толстые, они обглода..ы временем, обрызга..ы грязью улицы. Все кирпичи и щели между ними, наверное, мысле..о пересчита..ы тысячи раз и навсегда легли в памяти тяжкой сетью своих уродливых узоров. (М. Горький, «В людях») 3. Я вам открове..о скажу: планы наши расстрое..ы внезапной болезнью отца. 4. Таких людей не любят: они дерзнове..ы и неуживчивы. (М. Горький, «Проходимец») 5. Читая Вашу статью, я болел душою не только за себя, но и за тех моих товарищей, которые неви..о пригвожде..ы к позорному столбу общественного мнения. (М. Горький, «Несвоевременные мысли») 6. Душа невольно смуще..а, / И в колесе недоумений / Вертится нехотя она. (Ф. И. Тютчев, «Как нас ни угнетай разлука…») 7. Зина была как-то торжестве..о молчалива. (Ф. М. Достоевский, «Дядюшкин сон») Пояснения: конница Кара — конный отряд генерала Кара; пенька — волокно конопли для верёвок; шорный товар — упряжь для лошадей; панель — здесь: тротуар; пригвоздить к позорному столбу — подвергнуть всеобщему осуждению; дерзновение — смелость, отвага; колесо недоумений — круговорот сомнений.'},
 {n:70,l:5,st:4,task:'В заметке для школьного сайта допущено шесть ошибок в написании н и нн. Найти и исправить их, объяснить каждую. Доказать, что остальные слова с н и нн написаны верно.',
  body:'Городской марафон начался шумно: заиграл оркестр, и сотни бегунов одновремено сорвались с места. Трасса была тщательно размеченна, вдоль неё стояли волонтёры. Первые километры Миша бежал ровно и сосредоточено, даже поглядывал по сторонам. Потом подул ветер, стало ветренно и холодно. Миша тревожно оглянулся: друзья отстали. Пить хотелось нестерпимо, но пункт с водой был недалеко: его поставили у моста. Последние метры Миша пробежал отчаянно, из последних сил. Медаль, вручёная ему на финише, оказалась непривычно тяжёлой. «Ты её заслужено получил, — сказал тренер. — Всё было продумано правильно: и темп, и питьё».'},
 {n:72,l:5,st:5,task:'(Тонкость.) Сравнить наречия в каждой паре, вставить пропущенные буквы и объяснить, почему написание различается или совпадает. Для каждого наречия назвать прилагательное и указать, отчего в нём одна или две н.',
  body:'1. Пута..о объяснял — запута..о объяснял. 2. Стекля..о блестели глаза — рья..о спорил. 3. Учё..о рассуждал — зауче..о повторял. 4. Нечая..о задел — нежда..о пришла весна. 5. Искус..о вышитая скатерть — искусстве..о созданное озеро. 6. Невида..о богатый урожай — незва..о явился в гости.'},
 {n:73,l:5,st:5,task:'Прочитать отрывки. 1) Выписать слова с пропусками, вставляя буквы, в три столбика: полные прилагательные; краткие прилагательные и причастия; наречия. 2) Объяснить написание каждого наречия и каждой краткой формы. 3) В отрывке 1 найти наречие, которое относится не к глаголу, и указать, к какому слову оно относится. 4) В отрывке 1 есть слово на -о, которое легко принять за наречие. Доказать, что это краткое прилагательное (найти подлежащее). 5) Объяснить написание слова «драгоце..ых»: от какого слова оно образовано и где проходит граница основы и суффикса.',
  body:'1. Это была образная. Были сумерки. Лампады ярко сверкали своими огнями на золотых ризах и драгоце..ых каменьях образов. Из-под блестящих окладов тускло выглядывали лики святых. Всё здесь так не походило на другие комнаты, так было таинстве..о и угрюмо, что была пораже..а и какой-то испуг овладел моим сердцем. К тому же я была так болезне..о настрое..а! (Ф. М. Достоевский, «Неточка Незванова») 2. Исправник смире..о положил в карман свою бумагу и молча принялся за гуся с капустой. Между тем слуги успели уж несколько раз обойти гостей, наливая каждому его рюмку. Несколько бутылок горского и цымлянского громко были уже откупоре..ы и приняты благоскло..о под именем шампанского. (А. С. Пушкин, «Дубровский») Пояснения: образная — комната с иконами (образами); лампада — небольшой светильник перед иконой; риза, оклад — металлическое покрытие иконы; лики — лица на иконах; исправник — начальник уездной полиции; горское, цымлянское — сорта вина; смирить — сделать покорным; откупорить — открыть (бутылку).'},
// Урок 6
 {n:34,l:6,st:1,task:'Вставить пропущенные буквы в существительных. В скобках указать слово, от которого образовано существительное, и сколько н в этом слове. Затем записать слова в два столбика: с одной н и с двумя.',
  obr:'Нефтя..ик → нефтяник (нефтяной: одна н).',
  body:'Избра..ик, Масле..ица, изгна..ик, копчё..ости, родстве..ик, ряже..ые (на Святки), утопле..ик, торфя..ик, свяще..ик, пря..ик, варе..ики.'},
 {n:75,l:6,st:1,task:'Образовать существительные: 1) с суффиксом -ник или -ниц(а) — от существительных (значение нового слова указано в скобках); 2) с суффиксом -ость — от прилагательных. Обозначить суффикс и объяснить, сколько н в каждом слове. В части 2 найти два слова с одной н.',
  obr:'1) Именины → именин-ник: основа именин- оканчивается на н, к ней прибавлен суффикс -ник — две н. 2) Отчуждённый → отчуждённ-ость: две н, как в прилагательном.',
  body:'1) Звон → … (башня с колоколами); сон → … (книга, в которой толкуют сны); лимон → … (растение); калина → … (заросли калины). 2) Смышлёный, ветреный, ограниченный, уединённый, искренний, непреклонный, раскованный.'},
 {n:83,l:6,st:2,task:'Заменить описания одним существительным с н или нн. Записать существительные, обозначить в них суффикс и объяснить, сколько н. Найти четыре слова с суффиксом -ник, в которых одна н, потому что основа оканчивается не на н (слова с суффиксом -ян- не считать).',
  obr:'Заросли рябины → рябин-ник (основа рябин- на н + суффикс -ник: две н).',
  body:'1. Заросли малины. 2. Заросли черники. 3. Заросли осины. 4. Заросли брусники. 5. Житель пустыни, который ушёл туда, чтобы жить в уединении. 6. Тот, кто мыслит одинаково с кем-либо. 7. Тот, кто живёт в одно время с кем-либо. 8. Состояние, когда человек долго не может уснуть. 9. Военный, который охраняет границу. 10. Работник, добывающий нефть. 11. Мастер, который выделывает кожу. 12. Войско на лошадях.'},
 {n:35,l:6,st:2,task:'Вставить пропущенные буквы и распределить существительные в два столбика: с одной н и с двумя. Рядом с каждым словом в скобках записать слово, от которого оно образовано.',
  obr:'Лимо..ик → лимонник (лимон: основа на н + суффикс -ник — две н).',
  body:'Дровя..ик, листве..ица, дружи..ик, соле..ья, письме..ость, бесце..ость, овся..ка, покло..ик, учё..ость, бездо..ость, мороже..щик, избалова..ость. Пояснения: письме..ость — от слова «письмо» в значении «система знаков, которой пользуется народ».'},
 {n:36,l:6,st:3,task:'Выписать слова с пропусками, вставляя буквы. Над каждым существительным указать слово, от которого оно образовано, и сколько н в этом слове. Остальные слова с пропусками объяснить по правилам уроков 1–5.',
  obr:'Ребята набрали полную корзину в мали..ике. → Малиннике: малина (основа на н) + -ник — две н.',
  body:'1. Это был день неожида..остей, день развязок прежнего и завязок нового, резких разъяснений и ещё пущей пута..ицы. (Ф. М. Достоевский, «Бесы») 2. Дядья считали, что это прида..ое должно быть поделено между ними. (М. Горький, «Детство») 3. Двор — маленький, тесный и сорный, от ворот идут построе..ые из горбушин сарайчики, дровя..ики и погреба, потом они загибаются, заканчиваясь баней. (М. Горький, «Детство») 4. Его движения были столь быстры и непредвидимы, что не было средства его преследовать; к тому же ко..ица была слишком изнуре..а. (А. С. Пушкин, «История Пугачёва») 5. Расстилаем на снегу одеяла, укладываем на них ране..ых, все, кто может, наваливаемся на что-то горячее, медное впереди машины — ни с места. (М. М. Пришвин, «Августовские леса») 6. Посадская вдова: / Как божия посла..ица, / Старушка появляется / В холерные года… (Н. А. Некрасов, «Кому на Руси жить хорошо») 7. Всё это — праздная фантазия легкомысле..ых путешестве..иков. (Ф. М. Достоевский, «Крокодил») Пояснения: пущий — ещё больший; горбушина — горбыль, крайняя доска с корой от распила бревна; непредвидимы — непредсказуемы; изнурить — сильно утомить; посадская — жительница посада, торговой части города; холерные года — годы эпидемии холеры; праздная — пустая; в предложении 5 речь о войне: машина санитарного отряда застряла в снегу.'},
 {n:77,l:6,st:3,task:'Выписать слова с пропусками, вставляя буквы, в два столбика: существительные; прилагательные и причастия. У существительных указать слово, от которого они образованы. Объяснить: 1) почему слово с пропуском в предложении 4 — не существительное; 2) почему в словах «помощница», «благодетельница» (предложение 6) одна н.',
  obr:'Ряже..ые ходили по домам и пели колядки. → Ряженые — существительное (ряженый: одна н).',
  body:'1. Накануне праздника гости начали съезжаться, иные останавливались в господском доме и во флигелях, другие у приказчика, третьи у свяще..ика, четвёртые у зажиточных крестьян. (А. С. Пушкин, «Дубровский») 2. Там, и единстве..о только там, он мог бы приносить настоящую, несомне..ую пользу своим соотечестве..икам. (Ф. М. Достоевский, «Дядюшкин сон») 3. Масле..ые и копчё..ые кочегары-белорусы считались на пароходе низшими людьми. (М. Горький, «В людях») 4. Гости..ый двор и остальные дома, церкви и монастыри были разграбле..ы. (А. С. Пушкин, «История Пугачёва») 5. Пришли на площадь стра..ики: / Товару много всякого / И видимо-невидимо / Народу! (Н. А. Некрасов, «Кому на Руси жить хорошо») 6. Бедная воспита..ица была не что иное, как слепая помощница разбойника, убийцы старой её благодетельницы!.. (А. С. Пушкин, «Пиковая дама») Пояснения: флигель — боковая пристройка или отдельный дом при усадьбе; приказчик — управляющий имением; в предложении 4: … двор — торговые ряды, гость — здесь: купец; кочегар — рабочий, который топит котлы парохода; благодетельница — та, кто делает добро.'},
 {n:78,l:6,st:3,task:'Разобрать существительные по составу по школьному плану (окончание, основа, приставка, корень, суффиксы). Указать, от какого слова образовано каждое существительное, и объяснить, откуда в нём одна или две н.',
  obr:'Ряженые → ряж-ен-ые: окончание -ые, основа ряжен-, корень ряж-, суффикс -ен-; от ряженый — одна н.',
  body:'Дружинник, звонница, бессонница, лиственница, пряник, избранник, овсянка, поклонник.'},
 {n:84,l:6,st:3,task:'Написать небольшую заметку для школьной газеты (4–5 предложений) на одну из тем: «Встреча с путешественником», «Поход за грибами». Употребить не меньше шести существительных с н или нн из разных групп: от прилагательных с одной н; от прилагательных и причастий с двумя н; основа на н + суффикс -ник, -ниц(а). Подчеркнуть эти существительные и над каждым указать слово, от которого оно образовано.',
  obr:'Вечером путешественник показал нам свои находки. → Путешественник (путешествие → путешеств-енн-ик: две н).',
  body:'Слова для выбора: единомышленник, современник, родственник, звонница, осинник, черничник, бессонница, лиственница, вареники, пряники, ряженые, смышлёность.'},
 {n:79,l:6,st:4,task:'Вставить пропущенные буквы. Определить, какой частью речи является каждое слово с пропуском (существительное, полное прилагательное, полное причастие, краткая форма, наречие), и объяснить, почему в однокоренных словах пишется разное число н (или одинаковое).',
  body:'1) 1. Ране..ых доставили в госпиталь на вертолёте. — Ране..ые осколками бойцы ждали помощи. 2. Ряже..ые ходили по дворам с песнями. — Наряже..ая ёлка стояла в углу. 3. Прида..ое невесты везли на трёх подводах. — Батальон, прида..ый полку, занял высоту. 4. Он вёл жизнь самую рассея..ую; торчал на всех балах, объедался на всех дипломатических обедах, и на всяком зва..ом вечере был так же неизбежим, как резановское мороже..ое. (А. С. Пушкин, «Египетские ночи») 2) Вставить буквы в словах каждого гнезда: а) собра..ость, собра..ый ученик, отвечал собра..о, вещи собра..ы; б) образова..ость, образова..ая девушка, девушка образова..а и умна, комиссия образова..а в мае; в) ограниче..ость, ограниче..ые возможности, время ограниче..о правилами. Пояснения: придать — здесь: временно присоединить к другой части войск; неизбежим — здесь: неизбежен; резановское — из известной кондитерской Резанова.'},
 {n:80,l:6,st:4,task:'В заметке ученика шесть ошибок в написании н и нн. Найти и исправить их, объяснить каждую. Доказать, что остальные слова с н и нн написаны верно.',
  body:'В субботу наш класс ездил в краеведческий музей. В первом зале выставлены оловяные солдатики и подносы, расписанные вручную. Экскурсовод рассказала, как в нашем городе праздновали Масленницу: пекли блины, водили хороводы. В следующем зале хранятся доспехи дружиников и копья, найденные при раскопках. Мы узнали, что первые жители города были искусными кузнецами и кожевниками. На стенде висят письма наших земляков-путешествеников. После экскурсии мы зашли в кафе и заказали варенники. Всё было продуманно учителем: и маршрут, и время.'},
 {n:81,l:6,st:4,task:'Прочитать отрывок. 1) Выписать слова с пропусками, вставляя буквы, и распределить по группам: существительные; прилагательные, образованные от существительных; причастия и прилагательные, образованные от глаголов. Объяснить написание каждого слова. 2) Объяснить, сколько н в слове «почте..ой» и почему, если в нём нет ни приставки, ни зависимых слов. 3) В отрывке есть существительное с суффиксом -ник, в котором одна н. Найти его и сравнить с существительным «поклонник». 4) Найти два причастных оборота и объяснить, почему они выделены запятыми.',
  body:'Они прошли ряд великолепных комнат, наполне..ых учтивыми официантами. Несколько генералов и тайных советников играли в вист; молодые люди сидели, развалясь на штоф..ых диванах, ели мороже..ое и курили трубки. В гости..ой за дли..ым столом, около которого теснилось человек двадцать игроков, сидел хозяин и метал банк. Он был человек лет шестидесяти, самой почте..ой наружности; голова покрыта была серебря..ой сединою; полное и свежее лицо изображало добродушие; глаза блистали, оживлё..ые всегдашнею улыбкою. (А. С. Пушкин, «Пиковая дама») Пояснения: штоф — плотная шёлковая ткань для мебели; вист — карточная игра; метать банк — сдавать карты в азартной игре; тайный советник — высокий чин в старой России; всегдашний — постоянный.'},
 {n:82,l:6,st:5,task:'(Тонкость.) В этих словах число н нельзя объяснить только по слову, от которого образовано существительное. Вставить пропущенные буквы и, пользуясь пояснениями, объяснить написание. Указать слова, которые приходится запоминать.',
  body:'1. Сущий муче..ик четырнадцатого класса, огражде..ый своим чином токмо от побоев, и то не всегда (ссылаюсь на совесть моих читателей). (А. С. Пушкин, «Станционный смотритель») 2. Много ли останется истинных труже..иков, как вы думаете? (Ф. М. Достоевский, «Дневник писателя») 3. Так мерил пристав следстве..ый / Побои на подравшихся / На рынке мужиках: / «Под правым глазом ссадина / Величиной с двугриве..ый, / В средине лба пробоина / В целковый. (Н. А. Некрасов, «Кому на Руси жить хорошо») 4. Знайте, что каждый человек содержит в себе дурака и моше..ика: дурак — его чувство, а моше..ик — ум. (М. Горький, «Проходимец») 5. Он говорит, что спас мне жизнь, потому что прикрыл обман Акулины Памфиловны, которая сказала злодеям, будто бы я её племя..ица. (А. С. Пушкин, «Капитанская дочка») 6. Девушки гадали на суже..ого. — Улица, суже..ая из-за ремонта, стояла в пробках. 7. За бесприда..ицу никто не сватался. Пояснения: четырнадцатый класс — самый низкий чин; станционный смотритель — служащий почтовой станции; токмо — только; пристав в предложении 3 — чиновник, который ведёт следствие; монета в 3-м предложении — в двадцать копеек, то есть в две гривны (гривна — десять копеек), целковый — рубль; в пункте 6 первое слово — о женихе, которого девушке «судила» (предназначила) судьба; в пункте 7 — о девушке, у которой нет приданого.'},
// Урок 7. Повторение
 {n:85,l:7,st:1,task:'Слова записаны верно. Распределить их по группам в зависимости от того, каким правилом объясняется одна или две н: А) суффиксы -ан-, -ян-, -ин- (одна н); Б) суффиксы -енн-, -онн- (две н); В) основа на н + суффикс -н-, -ник или -ниц(а) (две н); Г) слово-исключение; Д) отглагольное прилагательное без примет причастия (одна н); Е) причастие: есть приставка, зависимое слово, суффикс -ова- или совершенный вид (две н); Ж) краткое причастие (одна н); З) наречие или существительное, в котором столько н, сколько в прилагательном, от которого оно образовано. В каждой группе должно оказаться не меньше двух слов.',
  obr:'Конопляный → А (суффикс -ян-).',
  body:'Клюквенный, лимонный, оловянный, лебединый, полотняный, станционный, сезонный, ветреный, тканый, вымощенный, брошенный, балованный, вяленый, засушенный, (работа) окончена, (вещи) уложены, (ответил) откровенно, (смотрел) сонно, дружинник, избранник.'},
 {n:37,l:7,st:2,task:'Переписать текст, вставляя пропущенные буквы. Над каждым словом с пропуском указать номер урока, по правилу которого оно пишется.',
  obr:'Ю..ый помощник садовника… → юный (урок 1: н входит в корень, суффикса -н- нет — одна н).',
  body:'После дождя городской сад казался умытым. На дорожках, посыпа..ых гравием, блестели лужи, а скамейки, недавно выкраше..ые в синий цвет, были усыпа..ы мокрыми листьями. На ветке клёна сидела взъероше..ая ворона. Старый садовник неторопливо подрезал куст шиповника, посаже..ого ещё его дедом. Из летнего кафе пахло ваниль..ой выпечкой. У фонтана, облицова..ого серым гранитом, играл уличный музыкант; мелодия звучала нежно и чуть отрешё..о. Сад жил своей неторопливой, размере..ой жизнью.'},
 {n:86,l:7,st:3,task:'Выборочный диктант. Учитель (или родитель) читает предложения, ученик записывает только прилагательные, причастия и наречия, в которых н или нн пишется после гласной в суффиксе или на стыке основы на н и суффикса, распределяя их в два столбика: с одной н и с двумя. Затем открыть текст, проверить и объяснить каждое слово.',
  obr:'Цветы глядят с тоской влюблённой… → Две н: влюблённой (причастие от влюбить — сов. вид).',
  body:'1. Роняя с пылью благовонной / Плодов румяных семена. (А. А. Фет, «Цветы») 2. Последний сноп свезён с нагих полей, / По стоптанным гуляет жнивьям стадо… (А. А. Фет, «Псовая охота») 3. Все роды поэзии (ибо о смиренной прозе я ещё и не помышлял) были мною разобраны, оценены, и я непременно решился на эпическую поэму, почерпнутую из отечественной истории. (А. С. Пушкин, «История села Горюхина») 4. Казённое имущество было разграблено; офицеры перебиты, кроме одного, пощажённого по просьбе работников; колодники присоединены к шайке мятежников. (А. С. Пушкин, «История Пугачёва») 5. Он всегда смотрит в пол, и его единственный глаз бегает по полу так тревожно, точно ищет нечто потерянное, очень ценное. (М. Горький, «В людях») 6. По крашеному полу были разбросаны разноцветные лоскутки, клочья бумаги, изломанные аптечные коробки, склянки от духов и блестела большая медная булавка. (М. Горький, «В людях») Пояснения: «с пылью благо…ной» — с душистой пыльцой (благо- «хорошо» + вонь — старое слово «запах»); сноп — связка сжатых колосьев; жнивьё — поле после жатвы; смирить — сделать покорным; эпическая поэма — большое повествование в стихах; колодник — арестант.'},
 {n:87,l:7,st:3,task:'Распределительный диктант. Учитель (или родитель) читает предложения, ученик записывает только слова, которые в тексте даны с пропусками, вставляя буквы, и сразу распределяет их в пять столбиков: 1) прилагательные, образованные от существительных; 2) полные причастия и отглагольные прилагательные; 3) краткие причастия и прилагательные; 4) наречия; 5) существительные. Затем проверить по тексту и объяснить написание.',
  obr:'Улица была вымоще..а камнем. → 3 столбик: вымощена — краткое причастие, одна н.',
  body:'1. Гляжу: могилка прибра..а, / На деревя..ом крестике / Складная золочё..ая / Икона. (Н. А. Некрасов, «Кому на Руси жить хорошо») 2. Всё было пусто; стулья, столы, сундуки были перелома..ы; посуда перебита; всё растаска..о. (А. С. Пушкин, «Капитанская дочка») 3. Я прибегнул к утешению всех скорбящих и, впервые вкусив сладость молитвы, излия..ой из чистого, но растерза..ого сердца, спокойно заснул, не заботясь о том, что со мною будет. (А. С. Пушкин, «Капитанская дочка») 4. Обнажё..ые плотины, каналы без набережной, деревя..ые мосты повсюду являли недавнюю победу человеческой воли над супротивлением стихий. (А. С. Пушкин, «Арап Петра Великого») 5. Но в дуновении мороза / Между погибшими одна, / Лишь ты одна, царица роза, / Благоуха..а и пышна. (А. А. Фет, «Осенняя роза») 6. Письмо сие, вместе с другими драгоце..ыми бумагами, доставле..о было родстве..иками и наследниками Фонвизина князю Вяземскому, занимавшемуся биографией автора «Недоросля». (А. С. Пушкин, «История Пугачёва») 7. Мятежники защищались отчая..о, но принужде..ы были уступить силе правильного оружия — и бежали во все стороны. (А. С. Пушкин, «История Пугачёва») Пояснения: складная икона — раскладывающаяся из нескольких частей; излить (молитву) — высказать от всего сердца; терзать — мучить; плотина — насыпь, которая задерживает воду; супротивление — сопротивление; благоухание — сильный приятный запах; сие — это; Д. И. Фонвизин — писатель, автор комедии «Недоросль»; правильное оружие — здесь: регулярное войско.'},
 {n:38,l:7,st:4,task:'В десяти предложениях есть ошибки в написании н и нн, четыре предложения написаны верно. Найти и исправить ошибки, объяснить каждую и указать номер урока, по правилу которого пишется слово. Доказать, что в верных предложениях ошибок нет.',
  body:'1. Мы перешли речку по деревяному мостику. 2. На полдник дали булочку и стакан клюквеного киселя. 3. Через лес вела узкая нехоженная тропинка. 4. Брат снял с полки зачитанную до дыр книгу. 5. На ужин сварили молодую картошку и подали её с варённой кукурузой. 6. Учительница проверила тетради: все задания выполненны аккуратно. 7. Ответы ученицы продуманны и точны. 8. Гости разговаривали оживлено и весело. 9. Чемоданы уложены: завтра едем на море. 10. Мой дед в молодости был нефтянником. 11. Командир похвалил раненного бойца. 12. Мы нечаянно разбили вазу. 13. С тех пор он стал мне названным братом. 14. В магазине продавались свежемороженные овощи.'},
 {n:88,l:7,st:4,task:'Переписать, вставляя пропущенные буквы и расставляя недостающие запятые при причастных оборотах (остальные знаки поставлены). Выписать причастные обороты вместе с определяемыми словами. Найти однородные обороты. Объяснить, почему в предложении 3 при причастии нет запятых.',
