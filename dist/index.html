<title>Учебник русского языка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Одна колонка ≤72ch, схемы в тексте; цвет только по смыслу. Токены по образцу учебника Melete. */
:root{
  --bg:#F3F2EE; --cell:#FFFFFF; --ink:#161514; --l2:#87847E; --l3:#B3AFA7;
  --sep:rgba(60,55,45,.15); --fill:rgba(120,115,105,.12); --fill2:rgba(120,115,105,.2);
  --tint:#9C7242; --tint-text:#765A38; --on-tint:#FFFFFF; --red:#A75750;
  --T:#5E8A55; --S:#5B7FA6; --D:#A75750; --V:#7A6A9E; --A:#4E8079;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1C1C1E; --ink:#FFFFFF; --l2:#8D8D93; --l3:#5A5A5E;
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --tint:#BC9361; --tint-text:#BC9361; --on-tint:#1A0E00; --red:#C47D74;
  --T:#7FAE74; --S:#7FA0C6; --D:#C47D74; --V:#9C8CC0; --A:#6FA59D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --ink:#FFFFFF; --l2:#8D8D93; --l3:#5A5A5E;
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --tint:#BC9361; --tint-text:#BC9361; --on-tint:#1A0E00; --red:#C47D74;
  --T:#7FAE74; --S:#7FA0C6; --D:#C47D74; --V:#9C8CC0; --A:#6FA59D; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;margin:0;
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--cell)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
.kick{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tint-text)}
.sub{color:var(--l2);font-size:14px}
h2{font-size:27px;line-height:1.15;letter-spacing:-.3px;text-wrap:balance;margin:2px 0 0}
h3{font-size:19px;margin:22px 0 4px;text-wrap:balance}
h4{font-size:14px;color:var(--l2);font-weight:600;margin:14px 0 2px}
p{margin:0}
.bktext{max-width:72ch;display:flex;flex-direction:column;gap:10px;min-width:0}

/* Герой оглавления */
.bhero{border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--tint) 16%,var(--cell)),var(--cell));border:1px solid var(--sep)}
.bhero .row{display:flex;gap:12px;align-items:center}
.bhero .row svg{flex:0 0 auto}
.bhero h1{font-size:27px;line-height:1.1;margin:0;letter-spacing:-.3px}
.bsearch{width:100%;min-height:44px;border-radius:12px;border:0;background:var(--fill);padding:0 14px;font:inherit;color:var(--ink)}
.bsearch::placeholder{color:var(--l2)}
.sres{display:flex;flex-direction:column;gap:4px}
.sres button{all:unset;cursor:pointer;display:flex;flex-direction:column;padding:10px 12px;border-radius:12px;background:var(--cell);border:1px solid var(--sep)}
.sres button small{color:var(--l2);font-size:13px}

/* Переключатель режимов */
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:3px}
.seg{flex-wrap:wrap}
.seg button{flex:1 1 auto;padding:0 8px;border:0;background:transparent;min-height:40px;border-radius:10px;font-weight:600;font-size:15px;color:var(--l2)}
.seg button[aria-pressed="true"]{background:var(--cell);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Части и карточки глав */
.bpart{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bpart>header{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.num{width:22px;height:22px;border-radius:11px;display:grid;place-items:center;font-size:12px;color:var(--on-tint);background:var(--pc)}
.bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bcard{all:unset;cursor:pointer;position:relative;overflow:hidden;background:var(--cell);border:1px solid var(--sep);border-radius:16px;
  min-height:96px;padding:14px 12px 12px;display:flex;flex-direction:column;gap:2px}
.bcard::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--pc)}
.bcard .n{font-size:13px;font-weight:700;color:var(--pc)}
.bcard .t{font-size:17px;font-weight:700;line-height:1.2}
.bcard .s{font-size:13px;color:var(--l2);line-height:1.35}
.bcard.soon{opacity:.62}
.bcard .badge{margin-top:auto;align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:8px;background:color-mix(in srgb,var(--T) 18%,var(--cell));color:var(--T)}
.bcard .badge.wait{background:var(--fill);color:var(--l2)}

/* Путь */
.bpath{all:unset;cursor:pointer;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--sep);
  background:linear-gradient(135deg,color-mix(in srgb,var(--T) 18%,var(--cell)),color-mix(in srgb,var(--S) 14%,var(--cell)))}
.bpath .t{font-size:19px;font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--T);border-radius:3px}

/* Глава */
.bkhbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--cell);border-bottom:1px solid var(--sep);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bkhbar .in{max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.back{all:unset;cursor:pointer;color:var(--tint-text);font-weight:600;min-height:40px;display:flex;align-items:center}
.bkhbar .where{font-size:13px;color:var(--l2);text-align:right}
.bklnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.bklnav::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:0;min-height:40px;border-radius:20px;padding:0 14px;background:var(--fill);font-size:14px;font-weight:600;white-space:nowrap}
.pill.done{background:color-mix(in srgb,var(--T) 18%,var(--cell));color:var(--T)}
.bkles{display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:1px solid var(--sep);scroll-margin-top:70px}
.bkles:first-of-type{border-top:0}
.bklh{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.bklh .kick{flex:0 0 auto}
.bklh .t{font-size:19px;font-weight:700;line-height:1.25}
.ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
b.m{color:var(--tint-text)}
.ex{font-style:italic}

/* Вставки */
.bins{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.bins>.h{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.bkey{background:color-mix(in srgb,var(--tint) 13%,var(--cell))}
.bkey>.h{color:var(--tint-text)}
.bnorm{background:color-mix(in srgb,var(--S) 11%,var(--cell));border-left:3px solid var(--S);border-radius:4px 14px 14px 4px}
.bnorm>.h{color:var(--S)}
.btip{background:var(--fill)}
.btip>.h{color:var(--l2)}

/* Таблица */
.tblw{overflow-x:auto;border:1px solid var(--sep);border-radius:14px;background:var(--cell)}
.bktbl{border-collapse:collapse;width:100%;font-size:15px}
.bktbl.wide{min-width:460px}
.chaint td{padding:8px 8px}.chaint td:first-child{width:34%;font-size:13px!important}.chaint td:last-child{width:46px}
.bktbl th,.bktbl td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--sep);vertical-align:top}
.bktbl th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--l2);font-weight:700}
.bktbl tr:last-child td{border-bottom:0}
.tagN,.tagNN{display:inline-block;min-width:34px;text-align:center;font-weight:800;border-radius:8px;padding:0 6px}
.tagN{background:color-mix(in srgb,var(--S) 16%,var(--cell));color:var(--S)}
.tagNN{background:color-mix(in srgb,var(--tint) 18%,var(--cell));color:var(--tint-text)}

/* Термин */
/* Термин: обычный цвет текста + пунктир цвета акцента — заметно, что можно нажать, но текст не пестрит */
.bterm{color:inherit;text-decoration:underline dotted color-mix(in srgb,var(--tint) 75%,transparent);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:pointer;background:none;border:0;padding:0;font:inherit;border-radius:3px}
.bterm:hover,.bterm:focus-visible{color:var(--tint-text);text-decoration-style:solid;background:color-mix(in srgb,var(--tint) 10%,transparent)}

/* Схема */
.blab{background:var(--cell);border:1px solid var(--sep);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;container-type:inline-size}
.blab .cap{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipc{border:0;min-height:42px;border-radius:12px;background:var(--fill);padding:0 12px;font-size:15px}
.chipc[aria-pressed="true"]{background:var(--tint);color:var(--on-tint)}
.tree{display:flex;flex-direction:column;gap:8px}
.step{border-radius:14px;padding:10px 12px;background:var(--fill);display:flex;flex-direction:column;gap:8px}
.step .q{font-weight:700}
.step .opts{display:flex;flex-direction:column;gap:6px}
.opt{border:1px solid var(--sep);background:var(--cell);text-align:left;border-radius:12px;padding:9px 12px;min-height:44px;font-size:15px}
.opt.on{border:2px solid var(--tint);padding:8px 11px;background:color-mix(in srgb,var(--tint) 10%,var(--cell))}
.opt[disabled]:not(.on){opacity:.5;cursor:default}
.result{border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--T) 14%,var(--cell))}
.result .big{font-size:28px;font-weight:800;color:var(--T);min-width:56px;text-align:center}
.bkhint{font-size:13px;color:var(--l2)}
.linkbtn{all:unset;cursor:pointer;color:var(--tint-text);font-weight:600;font-size:14px}

/* Упражнения */
.bklex{border-radius:16px;padding:12px;background:color-mix(in srgb,var(--tint) 6%,var(--cell));border:1px solid var(--sep);
  display:flex;flex-direction:column;gap:10px}
.bklex>.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bklex>.top b{font-size:17px}
.items{display:flex;flex-direction:column;gap:6px}
.item{background:var(--cell);border:1px solid var(--sep);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.item .line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.item .w{font-size:18px}
.slot{display:inline-block;min-width:30px;border-bottom:2px solid var(--l3);text-align:center;font-weight:800;color:var(--l2)}
.slot.ok{color:var(--T);border-color:var(--T)}
.slot.bad{color:var(--red);border-color:var(--red)}
.ans{display:flex;gap:6px}
.ans button{min-width:52px;min-height:40px;border-radius:10px;border:0;background:var(--fill);font-weight:700;font-size:16px}
.ans button.ok{background:color-mix(in srgb,var(--T) 22%,var(--cell));color:var(--T)}
.ans button.bad{background:color-mix(in srgb,var(--red) 18%,var(--cell));color:var(--red)}
.why{font-size:14px;color:var(--l2)}
.why b.badt{color:var(--red)}
.why b.okt{color:var(--T)}
.score{font-size:14px;color:var(--l2);display:flex;justify-content:space-between;align-items:center;gap:8px}
details.bkhelp{border-radius:12px;background:var(--fill)}
details.bkhelp summary{list-style:none;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;cursor:pointer;font-weight:600}
details.bkhelp summary::-webkit-details-marker{display:none}
details.bkhelp summary::before{content:"›";display:inline-block;transition:transform .15s;font-size:18px;color:var(--l2)}
details.bkhelp[open] summary::before{transform:rotate(90deg)}
details.bkhelp.fix summary{color:var(--red)}
details.bkhelp.deep summary{color:var(--S)}
details.bkhelp .body{padding:0 14px 12px;display:flex;flex-direction:column;gap:6px}
.bkldone{min-height:44px;border-radius:14px;border:0;background:var(--tint);color:var(--on-tint);font-weight:700;font-size:16px}
.bkldone.is{background:color-mix(in srgb,var(--T) 20%,var(--cell));color:var(--T)}
.bsrc{border-top:1px solid var(--sep);padding-top:10px;font-size:12.5px;color:var(--l2);max-width:72ch}
.bpn{display:flex;justify-content:space-between;gap:8px}
.bpn button{all:unset;cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--tint-text);font-weight:600}
.bpn button[disabled]{visibility:hidden}

/* Карточки */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.deck{all:unset;cursor:pointer;background:var(--cell);border:1px solid var(--sep);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.deck::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--pc)}
.deck .t{font-size:17px;font-weight:700}
.deck .facts{display:flex;gap:14px;font-size:13px;color:var(--l2);font-variant-numeric:tabular-nums}
.deck .facts b{color:var(--ink);font-size:17px;display:block}
.study{display:flex;flex-direction:column;gap:12px;max-width:560px;width:100%;margin:0 auto}
.card{background:var(--cell);border:1px solid var(--sep);border-radius:20px;padding:22px 18px;min-height:260px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.card .ty{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--l2)}
.card .qq{font-size:22px;line-height:1.3;font-weight:700;text-wrap:balance}
.card .aa{font-size:17px;border-top:1px solid var(--sep);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.card .word{font-size:30px;font-weight:700;letter-spacing:.5px;text-align:center}
.vow{border:0;background:var(--fill);border-radius:6px;font-size:30px;font-weight:700;padding:0 1px;min-height:46px;margin:0 1px;line-height:1}
.sword{display:flex;justify-content:center;align-items:center;flex-wrap:nowrap}
.vow.ok{background:color-mix(in srgb,var(--T) 25%,var(--cell));color:var(--T)}
.vow.bad{background:color-mix(in srgb,var(--red) 20%,var(--cell));color:var(--red)}
.cons{font-size:30px;font-weight:700}
.big2{display:flex;gap:8px}
.big2 button{flex:1;min-height:48px;border-radius:14px;border:0;font-weight:700;font-size:16px}
.again{background:color-mix(in srgb,var(--red) 16%,var(--cell));color:var(--red)}
.good{background:color-mix(in srgb,var(--T) 20%,var(--cell));color:var(--T)}
.main{background:var(--tint);color:var(--on-tint)}
.ghost{background:var(--fill)}
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--l2);font-variant-numeric:tabular-nums}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:12px;color:var(--l2);text-align:center}
.boxes div{background:var(--fill);border-radius:10px;padding:6px 2px}
.boxes b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--l2)}


.tl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--l2);margin-top:4px}
.seg button[role=tab]{font-size:15px}
.prac{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.pbtn{all:unset;cursor:pointer;background:var(--cell);border:1px solid var(--sep);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.pbtn b{color:var(--tint-text);font-size:16px}.pbtn span{font-size:13px;color:var(--l2)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cols>div{background:var(--fill);border-radius:14px;padding:8px;min-height:90px;display:flex;flex-direction:column;gap:6px}
.colh{text-align:center}
.wchip{border:1px solid var(--sep);background:var(--cell);border-radius:10px;min-height:40px;font-size:15px;padding:4px 8px;text-align:left}
.wchip.ok{border-color:var(--T);color:var(--T)} .wchip.bad{border-color:var(--red);color:var(--red);text-decoration:line-through}
.wfreel{display:flex;flex-direction:column;gap:6px}
.wfree{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:17px;border-bottom:1px solid var(--sep);padding-bottom:6px}
.errl{display:flex;flex-direction:column;gap:6px}
.errl .opt{font-size:18px}
.opt.eok{border:2px solid var(--T);color:var(--T)} .opt.ebad{border:2px solid var(--red);color:var(--red)}
.clex{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--sep);scroll-margin-top:70px}
.clex .clh{display:flex;gap:10px;align-items:baseline}
.okm{font-size:13px;color:var(--T);font-weight:600}
.clex .task{font-weight:600}
.clex .cbody{font-size:17px;line-height:1.7;background:var(--cell);border:1px solid var(--sep);border-radius:14px;padding:12px 14px}
.clex .pill{align-self:flex-start}
.bkldone[disabled],.main[disabled]{opacity:.45;cursor:default}


.chhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.easy{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--sep);background:var(--cell);border-radius:20px;min-height:40px;padding:0 12px 0 8px;font-weight:600;font-size:14px;margin-top:4px}
.easy .sw{width:34px;height:20px;border-radius:10px;background:var(--fill2);position:relative;transition:background .15s}
.easy .sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:8px;background:var(--cell);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.easy[aria-pressed="true"]{border-color:var(--T);color:var(--T)}
.easy[aria-pressed="true"] .sw{background:var(--T)} .easy[aria-pressed="true"] .sw i{left:16px}
.stars{color:var(--tint);letter-spacing:1px;font-size:13px;margin-right:4px}.stars span{color:var(--l3)}
.obr{background:color-mix(in srgb,var(--T) 10%,var(--cell));border-radius:12px;padding:8px 12px;font-size:15px}
.obr b{color:var(--T)}
.wchip.on{border-color:var(--tint);background:color-mix(in srgb,var(--tint) 10%,var(--cell))}


.cluster{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
@container (max-width:520px){.cluster{grid-template-columns:1fr}.core{order:-1}}
.side{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.side.vb{background:color-mix(in srgb,var(--S) 11%,var(--cell));border:1px solid color-mix(in srgb,var(--S) 30%,var(--cell))}
.side.aj{background:color-mix(in srgb,var(--T) 11%,var(--cell));border:1px solid color-mix(in srgb,var(--T) 30%,var(--cell))}
.side .sh{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.side.vb .sh{color:var(--S)} .side.aj .sh{color:var(--T)}
.pf{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-top:1px solid var(--sep);padding-top:4px}
.pf span{color:var(--l2)} .pf b{text-align:right}
.core{display:flex;flex-direction:column;align-items:center;gap:6px}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:10px;
 background:conic-gradient(var(--S) 0 50%,var(--T) 50% 100%);}
.ring span{background:var(--cell);border-radius:50%;width:130px;height:130px;display:grid;place-items:center;font-weight:700;font-size:14px;padding:4px;overflow-wrap:anywhere}
.mfacts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--l2)} .mfacts b{color:var(--ink)}

.fb.sf{border-color:var(--tint);background:color-mix(in srgb,var(--tint) 10%,var(--cell))} .fb.sf b{color:var(--tint-text)}
.fb.res{border-color:var(--T);background:color-mix(in srgb,var(--T) 12%,var(--cell))} .fb.res b{color:var(--T)}
.ar{font-style:normal;color:var(--l2);font-weight:700}
.steps2{display:flex;flex-direction:column;gap:6px}

/* Шторка */

  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));

.clex .cln{font-weight:800;font-size:17px;color:var(--ink)}
.clex .clh{flex-wrap:wrap}
.cllink{margin-left:auto;border:0;background:transparent;color:var(--l2);font-size:13px;min-height:32px;padding:0 6px;border-radius:8px}
.cllink:hover{background:var(--fill);color:var(--ink)}
.clex.clhl{background:color-mix(in srgb,var(--tint) 14%,transparent);border-radius:14px;box-shadow:0 0 0 8px color-mix(in srgb,var(--tint) 14%,transparent)}
.clex{transition:background .6s,box-shadow .6s}
.clbook{font-size:13.5px;color:var(--l2);border-left:3px solid var(--l3);padding:4px 0 4px 10px}

.clbook span{display:block;font-size:12.5px}
.clset{background:color-mix(in srgb,var(--tint) 12%,var(--cell));border:1px solid color-mix(in srgb,var(--tint) 35%,transparent);border-radius:18px;
  padding:16px;display:flex;flex-direction:column;gap:6px;scroll-margin-top:70px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2)}

/* Тесты */
.chok{color:var(--T);font-weight:700;text-transform:none;letter-spacing:0;font-size:12.5px;white-space:nowrap}

.tsinfo{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}

.tsdone{display:flex;flex-direction:column;gap:2px;border-radius:16px;padding:14px;background:color-mix(in srgb,var(--T) 14%,var(--cell));border:1px solid color-mix(in srgb,var(--T) 35%,transparent)}

.tsopt.on .tsbox{background:var(--tint);border-color:var(--tint)}
.tsform input{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--sep);background:var(--cell);padding:0 14px;font:inherit;font-size:20px;color:var(--ink)}

.tssort{display:flex;flex-direction:column;gap:8px}

.tsw{font-weight:700;font-size:18px}
.tssr .seg button{font-size:14px;min-height:38px}
.tsnav{display:flex;justify-content:space-between;gap:8px}
.tsnav button{min-height:48px;border-radius:14px;border:0;padding:0 18px;font-weight:700;font-size:16px}
.tsnav .bkldone{flex:1;max-width:320px;margin-left:auto}
.tsquit{align-self:center;color:var(--l2)}
.tsres{display:flex;align-items:center;gap:16px;border-radius:18px;padding:16px;flex-wrap:wrap;
  background:color-mix(in srgb,var(--T) 12%,var(--cell));border:1px solid color-mix(in srgb,var(--T) 35%,transparent)}
.tsres.bad{background:color-mix(in srgb,var(--red) 9%,var(--cell));border-color:color-mix(in srgb,var(--red) 30%,transparent)}

.tsgrade{font-size:56px;font-weight:800;line-height:1;color:var(--T);min-width:56px;text-align:center}
.tsres.bad .tsgrade{color:var(--red)}
.tsrs{display:flex;flex-direction:column;gap:2px}.tsrs b{font-size:19px}.tsrs span{color:var(--l2);font-size:14px}
.tsm{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--sep)}
.tsm .q{font-weight:600}
.tsa{display:flex;flex-direction:column;gap:2px;font-size:15px}
.tsa .tsn{color:var(--red)}.tsa .tsy{color:var(--T);font-weight:600}
.tsm .why{font-size:14px;color:var(--l2)}
.tsm .linkbtn{align-self:flex-start}
.pbtn.tsp b{color:var(--T)}

/* Механики тренажёра */
.mcard{min-height:0;justify-content:flex-start}
.mwl{display:flex;flex-wrap:wrap;gap:8px}
.mw{border:1.5px solid var(--sep);background:var(--cell);border-radius:12px;min-height:44px;padding:6px 12px;font-size:17px;font-weight:600;color:var(--ink);
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.2}
.mw small{font-size:11px;font-weight:600;color:var(--l2)}

.mw.ok{border-color:var(--T);background:color-mix(in srgb,var(--T) 14%,var(--cell));color:var(--T)}
.mw.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--cell));color:var(--red)}

.mst{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;font-size:18px;line-height:1.5}

.mpu{font-size:18px;font-weight:700;margin-left:-2px}
.mword2{font-size:18px;padding:0 1px}
.mcm{gap:2px 0}
.gapb{min-width:26px;height:40px;border:0;border-radius:8px;background:transparent;color:var(--l3);font-size:22px;font-weight:800;padding:0;line-height:1}
.gapb:hover{background:var(--fill)}
.gapb.on{color:var(--tint-text);background:color-mix(in srgb,var(--tint) 14%,transparent)}
.gapb.ok{color:var(--T);background:color-mix(in srgb,var(--T) 14%,transparent)}
.gapb.bad{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.gapb.miss{color:var(--T);outline:2px dashed var(--T);outline-offset:-4px}
.mpal{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-radius:14px;background:var(--fill)}
.mtool{border:1.5px solid transparent;background:var(--cell);border-radius:10px;min-height:40px;padding:0 10px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.mtool.on{border-color:var(--tint);box-shadow:0 0 0 2px color-mix(in srgb,var(--tint) 25%,transparent)}
.mtool .lg{display:inline-block;width:14px;height:12px}
/* школьные подчёркивания: подлежащее — черта, сказуемое — две, определение — волнистая, дополнение — пунктир, обстоятельство — точка-тире */
.uP,.uS,.uO,.uD,.uB{text-decoration-color:var(--ink);text-underline-offset:5px;text-decoration-thickness:2px}
.uP{text-decoration-line:underline;text-decoration-style:solid}
.uS{text-decoration-line:underline;text-decoration-style:double;text-decoration-thickness:1.5px}
.uO{text-decoration-line:underline;text-decoration-style:wavy;text-decoration-thickness:1.5px}
.uD{text-decoration-line:underline;text-decoration-style:dashed}
.uB{padding-bottom:5px;background:repeating-linear-gradient(to right,var(--ink) 0 9px,transparent 9px 12px,var(--ink) 12px 14px,transparent 14px 17px) left bottom/100% 2px no-repeat}
.msx .mw small{color:var(--red)}
.mbw{display:flex;flex-direction:column;gap:6px}
.mbwp{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;font-size:22px;font-weight:700;padding:10px;background:var(--fill);border-radius:14px}
.mbwp i{font-style:normal;color:var(--l2)}
.mbwp b{width:100%;text-align:center;font-size:24px}
.mseg{min-width:44px;text-align:center;border-bottom:2px solid var(--l3);padding:0 4px}
.mseg.e{color:var(--l3)}.mseg.ok{color:var(--T);border-color:var(--T)}.mseg.bad{color:var(--red);border-color:var(--red)}
.mlet{display:flex;justify-content:center;align-items:stretch;flex-wrap:wrap;font-size:28px;font-weight:700;padding:6px 0}
.ml{display:inline-grid;place-items:center;min-width:18px}
.mcut{width:16px;min-height:46px;border:0;padding:0;background:transparent;border-radius:6px;color:var(--tint);font-size:28px;font-weight:300;line-height:1}
.mcut:hover{background:var(--fill)}
.mcut.on{background:color-mix(in srgb,var(--tint) 16%,transparent)}
.msegs{font-size:26px;padding:22px 8px 14px;gap:4px}
.msegs .mp{border:0;background:transparent;padding:0 2px;cursor:pointer;font:inherit;color:inherit}
.mpairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mpairs>div{display:flex;flex-direction:column;gap:6px}
.mpairs .mw{flex-direction:row;gap:8px;justify-content:flex-start;font-size:16px}
.mpairs .mw i{font-style:normal;flex:0 0 22px;height:22px;border-radius:11px;background:var(--tint);color:var(--on-tint);font-size:13px;display:grid;place-items:center}
.mpairs .mw.pn{border-color:color-mix(in srgb,var(--tint) 55%,transparent)}
.mxg{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:stretch}
.mxg .mh{font-size:12px;font-weight:700;color:var(--l2);text-transform:uppercase;letter-spacing:.04em;align-self:end;text-align:center}
.mxg .mh.mr{align-self:center;text-align:left}
.mxc{min-height:56px;border:1.5px dashed var(--l3);border-radius:12px;background:var(--cell);font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;overflow-wrap:anywhere}
.mxc.f{border-style:solid;border-color:var(--tint)}
.mxc.ok{border:2px solid var(--T);color:var(--T)}.mxc.bad{border:2px solid var(--red);color:var(--red)}
.mxc small{font-size:12px;color:var(--T)}
.ans button.on{border:2px solid var(--tint);background:color-mix(in srgb,var(--tint) 12%,var(--cell))}
.mtool.g-дн,.mw.g-дн{--gc:var(--S)}.mtool.g-дп,.mw.g-дп{--gc:var(--T)}.mtool.g-сн,.mw.g-сн{--gc:var(--A)}.mtool.g-сп,.mw.g-сп{--gc:var(--V)}
.mtool[class*="g-"]{border-left:5px solid var(--gc)}
.mw[class*="g-"]:not(.ok):not(.bad){border-color:var(--gc);background:color-mix(in srgb,var(--gc) 12%,var(--cell))}
/* текст с пропусками */
.mgt{display:flex;flex-direction:column;gap:10px;font-size:18px;line-height:2.1}
.mgt p{margin:0}
.gtw{white-space:nowrap}

.gtopt{display:inline-flex;gap:3px;margin:0 6px 0 4px;vertical-align:middle}
.gtopt button{min-width:44px;min-height:44px;border:1.5px solid var(--sep);border-radius:9px;background:var(--cell);font-size:15px;font-weight:700;line-height:1;padding:0 6px}
.gtopt button.on{border-color:var(--tint);background:color-mix(in srgb,var(--tint) 14%,var(--cell))}
.gtopt button.ok{border-color:var(--T);color:var(--T);background:color-mix(in srgb,var(--T) 12%,var(--cell))}
.gtopt button.bad{border-color:var(--red);color:var(--red)}
.mgs{font-size:19px;gap:4px 6px}
/* найти орфограмму */
.mfo{gap:4px;justify-content:center}
.mfl{min-width:34px;min-height:46px;padding:0 4px;font-size:24px;font-weight:700}
.mfs{display:inline-block;width:14px}
.clos{display:inline-block;font-size:12px;line-height:1.5;padding:1px 8px;border-radius:999px;background:var(--fill);color:var(--l2);margin-left:8px;white-space:nowrap}
.clgl{display:block;font-size:13px;color:var(--l2);line-height:1.45;margin-top:8px;padding-top:6px;border-top:1px dashed var(--sep)}

/* Навигация */
.xref{all:unset;cursor:pointer;color:var(--tint-text);font-weight:600;border-bottom:1.5px solid color-mix(in srgb,var(--tint) 45%,transparent)}

.bterm:hover{text-decoration-style:solid}
.flash{background:color-mix(in srgb,var(--tint) 25%,transparent)!important;border-radius:6px;transition:background 1.8s}
h4[id],.bkles{scroll-margin-top:72px}
.bkhbar .tools{display:flex;align-items:center;gap:6px}
.ibtn{border:0;background:var(--fill);border-radius:10px;min-height:36px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink)}
.sheet{max-height:86vh;overflow-y:auto;overscroll-behavior:contain}

.gex{font-style:italic;color:var(--l2);border-left:3px solid var(--fill2);padding-left:10px}
.slab{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--l2);margin-top:4px}
.chipc.sm{min-height:36px;font-size:14px;border-radius:10px}
.chipc.see{background:color-mix(in srgb,var(--tint) 12%,var(--cell));color:var(--tint-text);font-weight:600}
.big2 .ghost{flex:1;min-height:44px;border-radius:14px;border:0}

.otl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}

.otl .on{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--cell);font-size:13px;font-weight:700;color:var(--tint-text)}

.otl .ok{margin-left:auto;color:var(--T)}

/* Оглавление */
.bcont{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:3px;padding:16px 48px 16px 16px;border-radius:18px;background:var(--cell);border:1px solid var(--sep);border-left:5px solid var(--pc)}
.bcont .t{font-size:19px;font-weight:700;line-height:1.2}
.bcont .s{font-size:14px;color:var(--l2)}

function corpusUnits(s){

  return {t:m[1].replace(/_/g,' '),or:op?{g:op[1],a:op[2],r:op[3].split('|')}:null,mem:tg.find(x=>MEMB[x])||'',ob:tg.includes('о'),ov:tg.includes('ов'),pr:(tg.find(x=>x.startsWith('п:'))||'').slice(2),kr:tg.includes('к'),

// спрашивает задание (['прич','прил']), commas — задание про знаки, has(u) — в предложении есть то, что проверяет задание}

function corpusTexts(ch,need={}){return (typeof CORPUS_T==='undefined'?[]:CORPUS_T).map(t=>({a:t.a,w:t.w,g:t.g,ss:corpusFilter(ch,t.s,{})})).filter((t,i)=>t.ss.length===CORPUS_T[i].s.length&&(!need.has||need.has(t.ss)))}
function corpusFilter(ch,list,need={}){
 return list.map(s=>({s,u:corpusUnits(s),f:corpusFlags(s)})).filter(({u,f})=>{
  if(u.some(x=>x.mark&&!x.why))return false;                                          // знак без причины — не даём никогда
  if(!u.every(x=>!x.or||orthKnown(ch,x.or.r)))return false;                            // орфограмма неизученной темы — предложение рано давать
  const ff=[...f,...u.filter(x=>x.why).map(x=>x.why)];                                 // причины знаков — как пометки предложения
  if(!ff.every(x=>FLAG_TOPIC[x]&&tKnown(ch,FLAG_TOPIC[x])))return false;             // сложные, однородные, обращения, знаки — только после своей темы
  if(u.some(x=>x.ob)&&!tKnown(ch,'prichastie'))return false;                           // причастный оборот — после «Причастия»
  if(need.mem&&!tKnown(ch,'prostoe'))return false;                                    // члены предложения — после «Простого предложения»
  if(need.pos&&!need.pos.every(p=>tKnown(ch,POS_TOPIC[p])))return false;            // спрашиваем только об изученных частях речи
  return !need.has||need.has(u);

  hint:'Найти существительное и его основу. Основа на н + суффикс -н- — две н (туман → туманный, старина → старинный). Суффиксы -ан-, -ян-, -ин- — одна н; -онн-, -енн- — две. Исключения: стеклянный, оловянный, деревянный; ветреный (но безветренный).',
  h:`<p>Написание н или нн всегда зависит от того, как образовано слово. Поэтому первый шаг — найти исходное слово. Этот урок посвящён прилагательным, образованным от существительных: <span class="ex">кожа → кожаный, клюква → клюквенный, лимон → лимонный</span>. Такие прилагательные называют [[otym|отымёнными]]. В них всё решает [[suff|суффикс]] и то, чем кончается основа существительного.</p>
  <h4>Одна н</h4>
  <p>Одна <b class="m">н</b> пишется в суффиксах <b class="m">-ан-</b>, <b class="m">-ян-</b>, <b class="m">-ин-</b>: <span class="ex">кожаный, песчаный, ржаной; глиняный, серебряный, торфяной, дровяной; гусиный, лебединый, змеиный, соловьиный</span>. Ударение на написание не влияет: <span class="ex">ржаной, торфяной, дровяной</span> пишутся с одной н, как и безударные.</p>
  <p>Одна <b class="m">н</b> и в суффиксе <b class="m">-н-</b>, если основа существительного не кончается на н: <span class="ex">мёд → медный, звезда → звёздный, лес → лесной</span>.</p>
  <h4>Две н</h4>
  <ol class="ul">
   <li>В суффиксах <b class="m">-онн-</b>, <b class="m">-енн-</b>: <span class="ex">революционный, ревизионный, дискуссионный; клюквенный, соломенный, производственный, утренний</span>.</li>
   <li>На стыке основы, которая оканчивается на <b class="m">н</b>, и суффикса <b class="m">-н-</b>: <span class="ex">лимон + н → лимонный, сон → сонный, длина → длинный, осень → осенний, камень → каменный</span>. Сюда же прилагательные от существительных на <b class="m">-мя</b>: <span class="ex">имя (имен-) → именной, время → временный, племя → племенной, семя → семенной; безымянный</span> (без + имя: две н, как в <span class="ex">именной</span>).</li>
  </ol>
  <h4>Не путать: суффикс -ин- и основа на н</h4>
  <p>Перед н в обоих случаях стоит <b class="m">и</b>, поэтому слова легко спутать. Решает исходное существительное. <span class="ex">Гусь → гусиный, лебедь → лебединый</span>: у существительного нет н, н пришла с суффиксом <b class="m">-ин-</b> — одна н. <span class="ex">Старина → старинный, машина → машинный, дружина → дружинный, длина → длинный</span>: основа существительного уже кончается на н, к ней добавлен суффикс <b class="m">-н-</b> — две н.</p>
  {{lab:morph}}
  {{table}}
  <h4>Исключения</h4>
  <p>С двумя <b class="m">н</b>, хотя суффикс -ян-: <b>стеклянный, оловянный, деревянный</b>. С одной <b class="m">н</b>, хотя по правилу ждёшь суффикс -енн-: <b>ветреный</b> (день, человек).</p>
  <p>Исключение касается только самого слова <b>ветреный</b>. С двумя н пишутся <span class="ex">безветренный</span> (приставка без-) и <span class="ex">обветренный, заветренный</span>: они образованы от глаголов <span class="ex">обветрить, заветрить</span> и пишутся по правилу урока 2 — у них есть приставка.</p>
  <h4>Слова без суффикса -н-</h4>
  <p>В словах <span class="ex">юный, синий, зелёный, багряный, пряный, пьяный, румяный, рьяный, свиной</span> буква н не принадлежит суффиксу -н-: она входит в корень или в старый суффикс, который сейчас не выделяется. Поэтому пишется одна н.</p>
  <p>Но <b>юннат</b> (юный натуралист) пишется с двумя н: это сложносокращённое слово, на стыке частей <span class="ex">юн-</span> и <span class="ex">нат-</span> встречаются две н.</p>

 },
 {id:'nn2',t:'Причастия и прилагательные от глаголов',
  hint:'Проверить приметы причастия: приставка (кроме не-), зависимое слово, суффикс -ова-/-ева-, совершенный вид. Есть хотя бы одна — две н. Запомнить: раненый, контуженый, крещёный — одна н (закрытый список); кованый, жёваный — одна н (-ов-, -ев- в корне).',
  h:`<p>Если слово образовано от глагола, это либо [[prich|причастие]], либо [[otgl|отглагольное прилагательное]]. Причастие называет признак по действию: <span class="ex">зажаренная на огне рыба</span>. Отглагольное прилагательное называет постоянный признак, без действия: <span class="ex">жареная рыба</span>. В полном причастии пишется две <b class="m">н</b>, в отглагольном прилагательном без приставки — одна (исключения ниже; прилагательные с приставкой — в уроке 3).</p>
  <h4>Четыре приметы причастия</h4>
  <p>Две <b class="m">н</b> пишутся, если есть хотя бы одна из примет:</p>
  <ol class="ul">
   <li>[[pref|Приставка]], кроме <b class="m">не-</b>: <span class="ex">зажаренный, прочитанный, вымощенный, подстриженный</span>.</li>
   <li>[[dep|Зависимое слово]]: <span class="ex">жаренная на масле картошка, мощённая булыжником дорога, крашенный маляром пол</span>.</li>
   <li>Суффикс <b class="m">-ова-</b>, <b class="m">-ева-</b> (<b class="m">-ёва-</b>): <span class="ex">балованный, маринованный, рискованный, тренированный</span>.</li>
   <li>Образовано от глагола [[sov|совершенного вида]], даже без приставки: <span class="ex">брошенный (бросить), решённый (решить), купленный, лишённый, пленённый, данный</span>.</li>
  </ol>
  <p>Если ни одной приметы нет, это отглагольное прилагательное, и пишется одна <b class="m">н</b>: <span class="ex">жареный, варёный, солёный, стриженый, крашеный, вяленый, мощёный, тканый, плетёный, ломаный, путаный, рваный, стираный</span>. Так же пишется <span class="ex">масленый</span> (от <span class="ex">маслить</span>): <span class="ex">масленые руки</span> — но <span class="ex">масляная краска</span> (из масла, урок 1).</p>
  {{lab:tree}}
  <h4>Приставка не-</h4>
  <p>Приставка <b class="m">не-</b> приметой не считается: <span class="ex">незваный, некрашеный, нехоженый, некошеный, непрошеный, неезженый, непуганый, неписаный закон</span>. Но если появляется зависимое слово, это причастие, и не пишется раздельно: <span class="ex">не крашенный маляром пол</span>.</p>
  <h4>-ов-, -ев- в корне</h4>
  <p>В словах <span class="ex">кованый, жёваный</span> сочетания -ов-, -ев- входят в корень (<span class="ex">ковать, жевать</span>), это не суффикс -ова-. Поэтому одна н. С приставкой — две: <span class="ex">подкованный, изжёванный</span>.</p>
  <h4>Раненый, контуженый, крещёный</h4>
  <p>Три слова нужно запомнить: <span class="ex">раненый боец, контуженый солдат, крещёный (и некрещёный) младенец</span> — одна <b class="m">н</b>, если нет приставки и зависимых слов. Глаголы <span class="ex">ранить, контузить, крестить</span> двувидовые (отвечают и на «что делать?», и на «что сделать?»), поэтому примета «совершенный вид» здесь не срабатывает. С зависимым словом или приставкой — две н: <span class="ex">раненный осколком боец, тяжело раненный, израненный, окрещённый</span>.</p>
  <p>Это закрытый список. От других двувидовых глаголов слова пишутся по общему правилу, с двумя н: <span class="ex">обещанный подарок, казнённый преступник, рождённый в деревне</span>.</p>
  <h4>Исключения: две н без примет</h4>
  <p><span class="ex">Желанный, жеманный, медленный, нечаянный, священный, чеканный (шаг), чванный, деланный (смех), окаянный; невиданный, негаданный, неожиданный, неслыханный, нежданный</span>.</p>
  <div class="bins bnorm"><div class="h">Норма сегодня · Правила 2006</div><p>Основное правило в справочнике Розенталя и в Правилах 2006 года одинаково; списки исключений в разных пособиях немного различаются. Сочетание с приставкой не- пишется слитно: <span class="ex">некошеная трава, незваные гости</span>. В некоторых старых пособиях встречается раздельное «не кошеная», «не званые» — это расходится с Правилами 2006. Раздельно — только при противопоставлении: <span class="ex">трава не кошеная, а примятая</span>.</p></div>
  <div class="bins bkey"><div class="h">Главное</div><p>Приставка (кроме не-), зависимое слово, -ова-/-ева-, совершенный вид — хотя бы одна примета даёт две н. Нет ни одной — одна н, кроме слов-исключений. Раненый, контуженый, крещёный — одна н: эти три слова нужно запомнить.</p></div>`,
  lite:`<p>Слово сделано от глагола: <span class="ex">жарить → жареный</span>. Тогда нужно поискать четыре приметы. Если есть хоть одна — пишем <b>две н</b>.</p>
  <ol class="ul">
   <li><b>Приставка</b>: <span class="ex">за</span>жаренный. (Приставка <b>не-</b> не считается: некрашеный.)</li>
   <li><b>Слово рядом, которое к нему относится</b>: жаренный <span class="ex">на масле</span>.</li>
   <li><b>-ова-, -ева-</b>: марин<span class="ex">ова</span>нный. (В словах кованый, жёваный -ов-, -ев- — часть корня: ковать, жевать. Там одна н.)</li>
   <li><b>Сделано из «что сделать?»</b>: решить → решённый.</li>
  </ol>
  <p>Нет ни одной приметы — <b>одна н</b>: <span class="ex">жареная картошка, варёный рис</span>.</p>
  {{lab:tree}}
  <div class="bins bkey"><div class="h">Запомнить</div><p>С двумя н без примет: желанный, медленный, нечаянный, неслыханный, невиданный, неожиданный, священный, чеканный.</p><p>С одной н — три слова, их нужно запомнить: раненый, контуженый, крещёный. Если есть приставка или слово рядом — две н: раненный в руку. Другие похожие слова пишутся по приметам: обещанный, казнённый — две н.</p></div>`,
  deep:`<p><b>Двувидовые глаголы на -овать</b> (<span class="ex">атаковать, организовать, использовать</span>) дают две н по суффиксу -ова-: <span class="ex">атакованный, организованный</span>.</p>
  <p><b>Тяжело раненный и тяжелораненый.</b> <span class="ex">Тяжело раненный в бою солдат</span> — причастие с зависимыми словами: раздельно, две н. <span class="ex">Тяжелораненый боец, тяжелораненые</span> — сложное слово: слитно, одна н (урок 3).</p>
  <p><b>Редкие исключения.</b> В устойчивых выражениях <span class="ex">виданное ли дело, слыханное ли дело</span> — две н; <span class="ex">недреманное око</span> — две н. В обычных заданиях эти слова не встречаются.</p>
  <p><b>Пары с одним корнем</b> помогают увидеть правило: <span class="ex">кошеный луг — скошенный луг — кошенный утром луг; гружёная баржа — нагружённая баржа; стриженый мальчик — подстриженный газон</span>.</p>`,
  easy:'Проверять приметы по одной, сверху вниз, и остановиться на первой найденной. Схема выше делает то же самое. Перед четвёртой приметой проверить, не из списка ли слово: раненый, контуженый, крещёный.',
  fix:'Если путаются «жареный» и «жаренный», задать к слову вопрос: «жаренный (на чём?) на масле». Вопрос задаётся — есть зависимое слово, пишется две н.'
 },
 {id:'nn3',t:'Трудные случаи',
  hint:'Одна н: слова с особым значением (названый брат, посажёный отец), повторы с пере- (стираное-перестираное), сложные слова без приставки и -ова- во второй части (гладкокрашеный, но гладкоокрашенный). В остальных случаях приставка (кроме не-) даёт нн и у прилагательных: подержанные книги.',
  h:`<p>Основное правило покрывает почти все слова. Остаются случаи, где приметы обманывают.</p>
  <h4>Приставка — две н, даже у прилагательных</h4>
  <p>Если есть приставка (кроме не-), в полной форме пишется нн, даже когда слово стало прилагательным и действия уже не называет: <span class="ex">выдержанный характер, подержанные книги, поношенное платье, ускоренный шаг, рассеянный взгляд, изысканный вкус</span>. Исключения — повторы с пере- и слова с особым значением (названый, посажёный; см. ниже). Краткие формы таких слов разобраны в уроке 4.</p>
  <h4>Одна н при совершенном виде: особое значение</h4>
  <p>Несколько слов образованы от глаголов совершенного вида, но пишутся с одной н, потому что получили особое значение и стали прилагательными. Если значение обычное, это причастие — две н.</p>
  <div class="tblw"><table class="bktbl"><thead><tr><th>Одна н (особое значение)</th><th>Две н (причастие)</th></tr></thead><tbody>
   <tr><td class="ex">названый брат (побратим, не родной)</td><td class="ex">мальчик, названный в честь деда</td></tr>
   <tr><td class="ex">посажёный отец (заменяет отца на свадьбе)</td><td class="ex">посаженное у дома дерево</td></tr>
   <tr><td class="ex">Прощёное воскресенье (праздник)</td><td class="ex">прощённый долг</td></tr>
  </tbody></table></div>
  <h4>Запомнить</h4>
  <p><span class="ex">Смышлёный</span> (сообразительный) — одна н.</p>
  <p>Не путать с ними сочетание <span class="ex">писаная красавица</span>: здесь одна н по общему правилу (писать — несовершенный вид, примет нет). С зависимым словом — <span class="ex">писанный маслом портрет</span>, с приставкой — <span class="ex">написанное письмо</span>.</p>
  <h4>Повторы</h4>
  <p>В сочетаниях вида <span class="ex">глаженые-переглаженые брюки, стираное-перестираное бельё, штопаные-перештопаные носки, латаная-перелатаная куртка, ношеный-переношеный костюм</span> во второй части пишется одна н, хотя есть приставка пере-: всё сочетание обозначает высокую степень качества.</p>
  <h4>Сложные слова</h4>
  <p>Отглагольное прилагательное сохраняет одну н и в составе сложного слова, если вторая часть образована от бесприставочного глагола несовершенного вида: <span class="ex">гладкокрашеный, домотканый, малоезженый, малохоженый, малоношеный, малосолёный, свежемороженый</span>. Если во второй части есть приставка или суффикс -ова-, пишется нн: <span class="ex">гладкоокрашенный, свежезамороженный, свежевыкрашенный, малоисследованный</span>.</p>
  <p>С одной н пишутся и сложные слова <span class="ex">тяжелораненый, легкораненый</span>: вторая часть — от глагола <span class="ex">ранить</span> (урок 2: раненый). Ср. раздельно: <span class="ex">тяжело раненный в бою</span> — две н.</p>
  {{lab:chain}}
  <div class="bins bkey"><div class="h">Главное</div><p>Приставка (кроме не-) даёт нн даже у прилагательных — кроме повторов с пере- и слов с особым значением (названый, посажёный). Одна н: названый брат, посажёный отец, Прощёное воскресенье, смышлёный; повторы; сложные слова без приставки и без -ова- во второй части.</p></div>`,
  lite:`<p>Это урок о редких случаях. Их немного, и их проще запомнить списком.</p>
  <ul class="ul">
   <li><b>Одна н в словах с особым значением:</b> <span class="ex">названый брат, посажёный отец, Прощёное воскресенье, смышлёный мальчик</span>. Но с обычным значением — две: <span class="ex">названный в честь деда</span>.</li>
   <li><b>Повторы — одна н в обеих частях:</b> <span class="ex">глаженые-переглаженые, стираное-перестираное</span>.</li>
   <li><b>Сложные слова — одна н, если во второй части нет приставки и суффикса -ова-:</b> <span class="ex">гладкокрашеный, свежемороженый, домотканый</span>. Есть приставка или -ова- — две: <span class="ex">гладкоокрашенный, свежезамороженный, малоисследованный</span>.</li>
   <li><b>С приставкой — две н и у прилагательных:</b> <span class="ex">выдержанное вино, подержанные книги</span>. Кроме повторов (стираное-перестираное) и слов с особым значением (названый брат). Краткие формы — по уроку 4.</li>
  </ul>
  {{lab:chain}}`,
  deep:`<p><b>Будучи раненным.</b> В ряде пособий рекомендуется после деепричастия <span class="ex">будучи</span> пишется две н: <span class="ex">Будучи раненным, солдат оставался в строю</span>. Слово здесь выступает как причастие: называет состояние, вызванное действием. Это тонкость: в обычных заданиях её нет.</p>
  <p><b>Конченый человек</b> (разговорное, «пропащий») — тоже одна н при совершенном виде, как <span class="ex">названый брат</span>; но <span class="ex">дело кончено</span>, <span class="ex">законченная работа</span>.</p>
  <p><b>Краткие формы прилагательных с приставкой</b> часто совпадают с причастиями: <span class="ex">заплаканные глаза — глаза заплаканы</span>. Подробно — в уроке 4.</p>`,
  easy:'Сначала проверить, не относится ли слово к особым случаям: особое значение (названый брат), повтор с пере-, сложное слово без приставки во второй части. Если нет — решать по приметам урока 2.',
  fix:'Таблица «Одно слово — пять форм» показывает, как меняется написание от прилагательного к причастию. Стоит пройти её для двух-трёх глаголов.'
 },
 {id:'nn4',t:'Краткие формы',
  hint:'Решает значение. Действие (можно спросить «кем? чем?») или состояние после события (она взволнована) — краткое причастие, одна н. Постоянное качество, черта (девочка воспитанна и умна) — краткое прилагательное, как в полной форме.',
  h:`<p>В [[krat|краткой форме]] правило другое. Сначала нужно понять, причастие перед нами или прилагательное. Решает значение слова в предложении.</p>
  <p><b>Краткое причастие</b> пишется с одной <b class="m">н</b>. Оно называет действие и его результат: <span class="ex">задача решена, письма написаны, ошибка исправлена, дни сочтены</span>. К нему обычно можно поставить вопрос «кем? чем?»: <span class="ex">решена (кем?) учеником</span>. Краткое причастие называет и состояние, в которое человек пришёл от какого-то события: <span class="ex">она взволнована (известием), огорчена, удивлена, обрадована</span>.</p>
  <p><b>Краткое прилагательное</b> называет постоянное качество, черту и сохраняет столько <b class="m">н</b>, сколько в полной форме: <span class="ex">девушка воспитанна (воспитанная), ответы продуманны, ночь туманна, дорога длинна</span>. Его можно заменить прилагательным-синонимом: <span class="ex">воспитанна = вежлива, продуманны = точны</span>.</p>
  <p>Слово «очень» помогает не всегда: оно подходит и к состоянию. <span class="ex">Она очень взволнована</span> — состояние, одна н; <span class="ex">её речь взволнованна</span> (полна волнения) — качество речи, две н.</p>
  {{lab:short}}
  <div class="tblw"><table class="bktbl"><thead><tr><th>Причастие: одна н</th><th>Прилагательное: как в полной форме</th></tr></thead><tbody>
   <tr><td>Девочка воспита<b class="m">н</b>а бабушкой.</td><td>Девочка воспита<b class="m">нн</b>а и умна.</td></tr>
   <tr><td>Тучи рассея<b class="m">н</b>ы ветром.</td><td>Студентка рассея<b class="m">нн</b>а и молчалива.</td></tr>
   <tr><td>Девушка взволнова<b class="m">н</b>а известием.</td><td>Её речь взволнова<b class="m">нн</b>а.</td></tr>
   <tr><td>Ресурсы изыска<b class="m">н</b>ы экономистами.</td><td>Манеры барышни изыска<b class="m">нн</b>ы.</td></tr>
   <tr><td>Масштабы работ ограниче<b class="m">н</b>ы средствами.</td><td>Его возможности ограниче<b class="m">нн</b>ы (= малы).</td></tr>
  </tbody></table></div>
  <h4>Мужской род</h4>
  <p>В краткой форме мужского рода пишется одна <b class="m">н</b> и у причастий, и у прилагательных: <span class="ex">мальчик воспитан, взволнован; день ветрен; путь длинен, вечер туманен</span>. Разграничивать здесь ничего не нужно; для проверки удобнее женский род и множественное число.</p>
  <h4>Краткие отымённые прилагательные</h4>
  <p>Как в полной форме: <span class="ex">длинный → длинна; туманный → туманна; ветреный → ветрена; юный → юна</span>.</p>
  <h4>Есть дополнение — одна н</h4>
  <p>Несколько слов-прилагательных с дополнением пишутся с одной н, без дополнения — с двумя:</p>
  <div class="tblw"><table class="bktbl"><tbody>
   <tr><td>Мы преда<b class="m">н</b>ы Родине (преданы кому?).</td><td>Старые друзья всегда преда<b class="m">нн</b>ы.</td></tr>
   <tr><td>Спортсмены увере<b class="m">н</b>ы в победе (уверены в чём?).</td><td>Движения гимнастов легки и увере<b class="m">нн</b>ы.</td></tr>
  </tbody></table></div>
  <div class="bins bkey"><div class="h">Главное</div><p>Краткое причастие (действие, состояние) — одна н. Краткое прилагательное (постоянное качество) — как в полной форме.</p></div>`,
  lite:`<p>Короткие слова вроде <span class="ex">решена, воспитанна</span> проверяются по смыслу.</p>
  <ul class="ul"><li>Это <b>действие</b> (можно спросить «кем? чем?») или <b>состояние</b> после какого-то события — пишем <b>одну н</b>: <span class="ex">задача решена (кем?) учеником; она взволнована (чем?) письмом</span>.</li>
  <li>Это <b>черта, качество</b>, которое есть всегда, — пишем как в полном слове: <span class="ex">девочка воспитанна и умна (воспитанная — две н)</span>.</li></ul>
  <p>Осторожно со словом «очень»: <span class="ex">она очень взволнована</span> — это состояние, одна н.</p>
  {{lab:short}}
  <div class="tblw"><table class="bktbl"><tbody>
   <tr><td>Девочка воспита<b class="m">н</b>а бабушкой.</td><td>Девочка воспита<b class="m">нн</b>а и умна.</td></tr>
   <tr><td>Девушка взволнова<b class="m">н</b>а.</td><td>Её речь взволнова<b class="m">нн</b>а.</td></tr>
   <tr><td>Задача реше<b class="m">н</b>а.</td><td>Дорога дли<b class="m">нн</b>а.</td></tr>
  </tbody></table></div>`,
  deep:`<p><b>Глаза заплаканы, платье поношено.</b> Полные формы <span class="ex">заплаканные, поношенное</span> — прилагательные с приставкой (урок 3). В краткой форме эти слова называют состояние, полученное в результате действия (глаза стали такими от слёз, платье — от носки), поэтому пишется одна н, как у кратких причастий. Если краткое слово называет качество, — две н: <span class="ex">манеры изысканны, девочка начитанна</span>.</p>
  <p><b>Намерен и намеренный.</b> <span class="ex">Сестра намерена уехать</span> (имеет намерение; при слове есть неопределённая форма) — одна н. <span class="ex">Его грубость намеренна</span> (нарочита) — две н, как в <span class="ex">намеренная грубость</span>. Это тонкость.</p>
`,
  easy:'Спросить «кем? чем?» или подумать, не состояние ли это после события. Да — одна н. Если это черта, качество — поставить полную форму и взять столько же н.',
  fix:'Поставить рядом полную форму и подобрать синоним: «девушка образованна» = «девушка знающая, умная» — качество, две н. «Девочка воспитана бабушкой» — действие (кем?), одна н.'
 },

  hint:'Вспомнить прилагательное, от которого образовано наречие, и проверить, сколько н там. Краткое причастие на -о (всё обдумано заранее) — одна н.',
  h:`<p>В наречиях на <b class="m">-о</b> и <b class="m">-е</b> пишется столько <b class="m">н</b>, сколько в прилагательном (или бывшем причастии), от которого они образованы: <span class="ex">неожиданно (неожиданный), растерянно (растерянный), взволнованно (взволнованный), искренне (искренний), временно (временный); ветрено (ветреный), путано (путаный), бешено (бешеный), румяно (румяный)</span>.</p>
  <p>Так же пишутся слова на -о, которые называют состояние природы или человека в безличном предложении: <span class="ex">На улице ветрено</span> (ветреный — одна н). <span class="ex">В лесу туманно</span> (туманный — две н).</p>

const CLASSIC=[
// Урок 1
 {n:1,l:1,st:1,task:'Прочитать словосочетания. 1) Выписать прилагательные, образованные от существительных. Рядом записать существительное, от которого образовано прилагательное, и обозначить суффикс. 2) Распределить выписанные прилагательные на два столбика: с одной н и с двумя н. 3) Найти два прилагательных, которые не образованы от существительных, и объяснить, почему в них одна н. 4) Объяснить, почему в словах медный и книжная одна н, хотя в них тоже есть суффикс -н-.',obr:'Соловьиная трель; осенний лес. → Соловьиная ← соловей, суффикс -ин- — одна н. Осенний ← осень: основа на н (осен-) + суффикс -н- — две н.',body:'Овсяное печенье, журавлиный клин, пустынный пляж, лекционный зал, клятвенное обещание, ледяная горка, медный провод, юный шахматист, жестяная банка, ураганный ветер, чугунная ограда, пчелиный рой, зелёный светофор, книжная полка, мужественный поступок.'},
 {n:2,l:1,st:1,task:'Образовать от существительных прилагательные. Записать их в два столбика: с одной н и с двумя н. Обозначить суффикс; если одна из двух н принадлежит основе существительного, подчеркнуть её. Если от слова можно образовать несколько прилагательных, взять то, в суффиксе которого есть н. С четырьмя прилагательными (два из одного столбика, два из другого) составить словосочетания.',obr:'Гусь, лимон. → Гус-ин-ый — одна н (суффикс -ин-); лимон-н-ый — две н (первая н — из основы лимон-, вторая — суффикс): гусиное перо, лимонный сок.',body:'Глубина, орёл, сезон, мышь, коллекция, старина, голубь, окно, смола, торжество, трава, экскурсия, картон, комар, стекло.'},
 {n:3,l:1,st:2,task:'Выписать прилагательные с пропусками вместе с существительными, к которым они относятся, вставляя буквы. Обозначить суффикс; если одна из двух н принадлежит основе существительного, подчеркнуть её. Рядом в скобках записать существительное, от которого образовано прилагательное.',obr:'Дедушка подарил мне шерстя..ые варежки. → Шерстяные варежки (шерсть): суффикс -ян-, одна н.',body:'1. Илья Муромец — самый известный были..ый богатырь. 2. Во дворе музея-усадьбы сохранилась ба..ая печь. 3. Лыжники прошли по равни..ой трассе двадцать километров. 4. Мама сварила на завтрак тыкве..ую кашу с изюмом. 5. Под старой елью мы нашли муравьи..ую тропу и долго наблюдали за её жителями. 6. Бабушка подарила внучке льня..ую скатерть с вышивкой. 7. Мой брат стал миллио..ым посетителем зоопарка и получил приз. 8. Из вольера донёсся льви..ый рык, и малыши испуганно прижались к родителям. 9. Музей получил це..ый подарок — письмо Пушкина. 10. Экра..ая версия романа понравилась не всем читателям. 11. На реке когда-то работала водя..ая мельница. 12. Ко..ая полиция следила за порядком на площади во время праздника.'},
 {n:5,l:1,st:2,task:'Выписать прилагательные с пропусками вместе с существительными, к которым они относятся, вставляя буквы. Обозначить суффикс; если одна из двух н принадлежит основе существительного, подчеркнуть её. Указать в скобках существительное, от которого образовано прилагательное.',obr:'Над крыльцом висел жестя..ой фонарь. → Жестяной фонарь (жесть): суффикс -ян-, одна н.',body:'1. Высокий земля..ой вал окружал город; где вал был ниже, там высовывалась каме..ая стена или дом, служивший батареей, или, наконец, дубовый частокол. (Н. В. Гоголь, «Тарас Бульба») 2. Солнце пекло; из полутёмных сеней постоялого дворика несло запахом тёплого ржа..ого хлеба. (И. С. Тургенев, «Отцы и дети») 3. Я спустился в долину; узкая песча..ая дорожка вилась по ней и вела в город. (И. С. Тургенев, «Первая любовь») 4. Молнии не прекращались ни на мгновение; была, что называется в народе, воробьи..ая ночь. (И. С. Тургенев, «Первая любовь») 5. Лебеди..ой грудью вздымался белый парус под резвыми вымпелами. (И. С. Тургенев, «Стихотворения в прозе») 6. Хороши также летние тума..ые дни, хотя охотники их и не любят. (И. С. Тургенев, «Записки охотника») 7. Скоро появилась сама Одинцова в простом утре..ем платье. (И. С. Тургенев, «Отцы и дети») 8. Его мысли заняты были одним: он никак не мог позабыть вероломства Солохи и со..ый не переставал бранить её. (Н. В. Гоголь, «Вечера на хуторе близ Диканьки») 9. Особенно боятся его почтмейстеры, непременные заседатели и станцио..ые смотрители. (И. С. Тургенев, «Записки охотника») Пояснения: вал — высокая насыпь вокруг крепости; батарея — здесь: место, где стоят пушки; частокол — забор из вбитых в землю кольев; постоялый двор (дворик) — гостиница с двором для лошадей и повозок; сени — помещение между крыльцом и жилыми комнатами; ночь (в предложении 4) — так в народе называют летнюю ночь с непрерывными зарницами и грозой; вымпел — узкий длинный флажок на мачте; вероломство — измена; бранить — ругать; почтмейстер — начальник почтовой конторы; непременный заседатель — чиновник уездного суда; смотритель — здесь: начальник почтовой станции, где меняли лошадей.'},
 {n:6,l:1,st:2,task:'Вставить пропущенные буквы. Распределить словосочетания по пяти столбикам: 1) суффиксы -ан-, -ян-, -ин- (одна н); 2) суффикса -н- нет, н входит в корень (одна н); 3) суффиксы -онн-, -енн- (две н); 4) основа на н + суффикс -н- (две н); 5) исключения. Обозначить суффикс.',
  obr:'Гуси..ое перо, лимо..ый сок. → Гусиное — 1-й столбик (гус-ин-ое); лимонный — 4-й столбик (лимон- + -н-).',
  body:'Воробьи..ое гнездо, авиацио..ый завод, багря..ый клён, бето..ая плита, соля..ая пещера, отечестве..ая история, стекля..ая банка, рья..ый болельщик, лу..ый свет, торфя..ое болото, информацио..ый стенд, сте..ая газета, сви..ая отбивная, тигри..ый рык, письме..ый стол, пламе..ая речь, деревя..ая ложка, конопля..ое поле, величестве..ый собор, бессо..ая ночь.'},
 {n:4,l:1,st:3,task:'Образовать от каждой пары существительных прилагательные и записать парами. Обозначить суффикс; если одна из двух н принадлежит основе существительного, подчеркнуть её. 1) Объяснить, почему в каждой паре прилагательные звучат на конце похоже, а пишутся по-разному. 2) Сделать вывод: можно ли по сочетанию «ин», «ан» на конце слова решить, сколько н писать? 3) С двумя парами составить предложения, в каждом из которых есть оба прилагательных пары.',obr:'Гусь — длина. → Гус-ин-ый: суффикс -ин-, одна н. Длин-н-ый: первая н — из основы длин(а), вторая — суффикс -н-, две н.',body:'1. Сокол — картина. 2. Лось — машина. 3. Зверь — пружина. 4. Оса — лавина. 5. Петух — камин. 6. Кровь — диван. 7. Утка — витрина. 8. Смола — орган (музыкальный инструмент).'},
 {n:44,l:1,st:3,task:'1) Выписать из предложений все прилагательные, образованные от существительных с помощью суффиксов, в которых есть н (их восемь; помнить, что холодный — от холод). Рядом записать исходное существительное. 2) Разобрать по составу прилагательные ледяными, огненные, оловянных по плану: окончание (изменить слово) → основа → корень (подобрать однокоренные слова) → приставка → суффикс. 3) Объяснить, почему в каждом выписанном прилагательном одна н или две н.',obr:'Бабушка сварила куриный бульон. → Куриный (курица). Окончание -ый (куриная, куриного); основа курин-; корень кур- (курица, куры); приставки нет; суффикс -ин-. Образовано суффиксальным способом. Суффикс -ин- — одна н.',body:'1. Как бессильный старец, держал он в холодных объятиях своих далёкое, тёмное небо, обсыпая ледяными поцелуями огненные звёзды, которые тускло реяли среди тёплого ночного воздуха, как бы предчувствуя скорое появление блистательного царя ночи. (Н. В. Гоголь, «Вечера на хуторе близ Диканьки») 2. Прежде, бывало, я мог согнуть и разогнуть в одной руке медный пятак и лошадиную подкову; а теперь мешков с углём не подыму. (Н. В. Гоголь, «Вечера на хуторе близ Диканьки») 3. По выходе отца своего она долго ещё принаряживалась и жеманилась перед небольшим в оловянных рамках зеркалом и не могла налюбоваться собою. (Н. В. Гоголь, «Вечера на хуторе близ Диканьки») Пояснения: он (в предложении 1) — пруд; я (в предложении 2) — кузнец, который несёт мешки; реять — здесь: мерцать, плавно колыхаться; царь ночи — месяц; пятак — монета в пять копеек; жеманиться — вести себя притворно, кокетничать.'},
 {n:7,l:1,st:3,task:'Выписать прилагательные с пропусками вместе с определяемыми словами, вставляя буквы. Обозначить суффикс и объяснить написание: суффикс; основа на н; исключение; суффикса -н- нет. Затем выписать отдельно: а) исключения и слова без суффикса -н-; б) два слова, в которых легко ошибиться, приняв часть основы за суффикс.',obr:'Весь день был ветре..ым. → Ветреным — исключение: ожидается суффикс -енн-, а пишется одна н.',body:'1. Вместо мрачных ставней глядели весёлые стекля..ые окна и двери. (Н. В. Гоголь, «Вечера на хуторе близ Диканьки») 2. Однажды я вошёл к ней и увидел её сидящей на соломе..ом стуле, с головой, прижатой к острому краю стола. (И. С. Тургенев, «Первая любовь») 3. Серебря..ый туман пал на окрестность. (Н. В. Гоголь, «Вечера на хуторе близ Диканьки») 4. Дверь растворилась — и весёлый, свежий, румя..ый появился Николай Петрович. (И. С. Тургенев, «Отцы и дети») 5. Когда невыносимый полуде..ый зной заставил нас искать убежища, он свёл нас на свою пасеку, в самую глушь леса. (И. С. Тургенев, «Записки охотника») 6. Несколько мужиков, по обыкновению, зевали, сидя на лавках перед воротами в своих овчи..ых тулупах. (Н. В. Гоголь, «Мёртвые души») 7. Голос его поразил церковные деревя..ые стены, давно молчаливые и оглохлые. (Н. В. Гоголь, «Вий») Пояснения: ставни — створки для закрывания окон снаружи; к ней — к Зинаиде, героине повести; окрестность — местность вокруг; убежище — укрытие; он (в предложении 5) — старик-слуга, о котором идёт речь в рассказе; пасека — место, где стоят ульи с пчёлами; тулуп — длинная шуба из овечьих шкур; оглохлые — глухие, давно не слышавшие звуков.'},
 {n:8,l:1,st:4,task:'Выбрать из скобок слово, которое подходит по смыслу, и вставить пропущенные буквы. Объяснить выбор: что значит слово, от какого слова оно образовано и почему в нём одна или две н. В одном предложении нужно выбрать между прилагательными с разными суффиксами (-ян- и -ист-): объяснить и эту разницу.',body:'1. Разнообразнейшие чувства, лёгкие, быстрые, как тени облаков в солнечный (ветре..ый, ветря..ой) день, перебегали то и дело по её глазам и губам. (И. С. Тургенев, «Первая любовь») 2. За воротами находились две (ветре..ые, ветря..ые) мельницы. (Н. В. Гоголь, «Вий») 3. В кабинете над диваном висел портрет хозяина в уланском мундире, писанный (масля..ыми, масле..ыми) красками. (И. С. Тургенев, «Записки охотника») 4. И (ветре..ая, ветря..ая) красавица уже шутила со своими подругами. (Н. В. Гоголь, «Вечера на хуторе близ Диканьки») 5. Надо (серебря..ых, серебристых) тополей побольше здесь сажать, да ёлок, да, пожалуй, липок, подбавивши чернозёму. (И. С. Тургенев, «Отцы и дети») 6. После блинов у малыша были (масля..ые, масле..ые) щёки и пальцы. 7. Ночь выдалась тихая, (ветре..ая, безветре..ая), и дым из труб поднимался прямо вверх. 8. В детском саду карантин: у троих малышей (ветре..ая, ветря..ая) оспа. 9. Мастер заменил в машине (масля..ый, масле..ый) фильтр. 10. На холмах за городом построили (ветре..ые, ветря..ые) электростанции. Пояснения: уланский мундир — форма улана, кавалериста; красавица (в предложении 4) — Оксана, героиня повести; подбавить — добавить.'},
 {n:9,l:1,st:4,task:'Найти и исправить ошибки в написании н и нн. Ошибки есть не во всех предложениях. Объяснить каждое исправление. Доказать, что в остальных предложениях прилагательные написаны верно.',
  body:'1. Вечер выдался тихий, безветреный, и над озером повис туман. 2. В гардеробе висела чья-то кожаная куртка с капюшоном. 3. На стариной карте острова не было ни одной дороги. 4. Рыбаки развели костёр на песчаном берегу. 5. Из окна поезда были видны бескрайние ржаные поля. 6. Малыш размазал по столу клюквеное варенье. 7. Традиционый турнир по шахматам прошёл в школьной библиотеке. 8. Соседи сложили поленья в дровяной сарай. 9. Утреняя зарядка заняла у меня десять минут. 10. Юнный пианист сыграл без единой ошибки. 11. Длинный коридор вёл в спортзал. 12. Сонный котёнок свернулся клубком на подоконнике. 13. На уроке труда мы делали торфяные горшочки для рассады. 14. Брат с гордостью показал серебряную медаль за олимпиаду.'},
 {n:41,l:1,st:4,task:'Прочитать отрывок. 1) Выписать прилагательные, образованные от существительных, в которых есть н или нн в суффиксе или на стыке основы и суффикса. Указать исходное существительное, обозначить суффикс и распределить слова по группам: а) одна н; б) две н: основа на н + суффикс -н-; в) две н: суффикс -онн-, -енн-; г) исключение. 2) Найти в отрывке слово с нн, которое образовано не от существительного. Определить, какая это часть речи и почему правило этого урока к нему не относится. 3) Объяснить, почему в словах мучными и колокольный одна н, а в слове длинные — две, хотя во всех трёх есть суффикс -н-.',body:'Бричка между тем поворотила в более пустынные улицы; скоро потянулись одни длинные деревянные заборы, предвещавшие конец города. Вот уже и мостовая кончилась, и шлагбаум, и город назади, и ничего нет, и опять в дороге. И опять по обеим сторонам столбового пути пошли вновь писать версты, станционные смотрители, колодцы, обозы, серые деревни с самоварами, бабами и бойким бородатым хозяином, бегущим из постоялого двора с овсом в руке, пешеход в протёртых лаптях, плетущийся за восемьсот вёрст, городишки, выстроенные живьём, с деревянными лавчонками, мучными бочками, лаптями, калачами и прочей мелюзгой, рябые шлагбаумы, чинимые мосты <…>, зелёные, жёлтые и свежеразрытые чёрные полосы, мелькающие по степям, затянутая вдали песня, сосновые верхушки в тумане, пропадающий далече колокольный звон, вороны как мухи и горизонт без конца… (Н. В. Гоголь, «Мёртвые души») Пояснения: бричка — лёгкая дорожная повозка; шлагбаум — подъёмная перекладина на въезде в город; назади — позади; столбовой путь — большая дорога с верстовыми столбами; «пошли писать версты» — замелькали вёрсты (верста — старинная мера длины, около километра); смотритель — здесь: начальник почтовой станции, где проезжающие меняли лошадей; постоялый двор — гостиница с двором для лошадей; выстроенные живьём — построенные наспех; калач — круглый белый хлеб с ручкой-дужкой; мелюзга — здесь: всякая мелочь; чинимые — которые чинят; далече — далеко.'},
 {n:42,l:1,st:5,task:'Лингвистическая задача. 1) Во всех словах первой группы пишется две н, но по разным причинам. Разделить слова на две подгруппы: а) суффикс -енн-; б) основа на н + суффикс -н-. Доказать свой выбор: подобрать форму существительного, в которой видна (или не видна) н основы. Объяснить, почему в словах временный и лиственный на слух одинаковое «-енн-», а причины разные. 2) Во всех словах второй группы одна н или н нет совсем. Указать исходное существительное и суффикс каждого прилагательного, объяснить, почему нет двух н, и показать на примерах словосочетаний, чем слова в парах различаются по значению. 3) Объяснить, почему глиняный пишется с одной н, хотя в слове глина есть сочетание «ин», а машинный — с двумя.',body:'Первая группа: временный, лиственный, коленный, бесценный, хозяйственный, семенной, государственный.<br>Вторая группа: водяной — водный; земляной — земной; ледяной — ледовый.<br>Третья пара: глиняный — машинный.'},
 {n:43,l:1,st:5,os:'диктант',task:'Диктант. Текст читает учитель или родитель. Записать под диктовку. Затем: 1) подчеркнуть прилагательные, образованные от существительных, в которых есть н или нн в суффиксе или на стыке основы и суффикса (их восемь); обозначить суффикс и объяснить, почему одна н или две; 2) выписать прилагательные с суффиксами -ист-, -ов-, -чат- и объяснить, почему их нельзя путать с прилагательными на -ян-, -ан-; 3) найти два причастия с нн и объяснить, почему в них две н (по главе «Причастие»).',
  body:'Точно: под самым обрывом таится источник; дубовый куст жадно раскинул над водою свои лапчатые сучья; большие серебристые пузыри, колыхаясь, поднимаются со дна, покрытого мелким, бархатным мхом. <…> Ветер внезапно налетел и промчался; воздух дрогнул кругом: уж не гром ли? Вы выходите из оврага… что за свинцовая полоса на небосклоне? <…> Трава, кусты, всё вдруг потемнело… Скорей! вон, кажется, виднеется сенной сарай… скорее!.. Вы добежали, вошли… <…> Кое-где сквозь соломенную крышу закапала вода на душистое сено… Но вот солнце опять заиграло. Гроза прошла; вы выходите. Боже мой, как весело сверкает всё кругом, как воздух свеж и жидок, как пахнет земляникой и грибами!.. (И. С. Тургенев, «Записки охотника») …Осенью вальдшнепы часто держатся в старинных липовых садах. Таких садов у нас в Орловской губернии довольно много. <…> Лет через пятьдесят, много семьдесят, эти усадьбы, «дворянские гнёзда», понемногу исчезали с лица земли, дома сгнивали или продавались на своз, каменные службы превращались в груды развалин, яблони вымирали и шли на дрова, заборы и плетни истреблялись. Одни липы по-прежнему росли себе на славу и теперь, окружённые распаханными полями, гласят нашему ветреному племени о «прежде почивших отцах и братиях». Прекрасное дерево — такая старая липа… Её щадит даже безжалостный топор русского мужика. Лист на ней мелкий, могучие сучья широко раскинулись во все стороны, вечная тень под ними. (И. С. Тургенев, «Записки охотника») Пояснения: точно — в самом деле (рассказчик спустился в овраг, чтобы найти родник); вальдшнеп — лесная птица; на своз — чтобы разобрать и увезти; службы — хозяйственные постройки при доме; плетень — изгородь из прутьев; гласить — говорить, напоминать; «племя» здесь — нынешнее поколение, потомки; «прежде почившие отцы и братия» — умершие предки.'},
 {n:10,l:1,st:5,os:'сочинение',task:'Написать сочинение-миниатюру «В краеведческом музее» (6–8 предложений): описать один зал музея и предметы в нём. Условия: 1) употребить не меньше девяти прилагательных, образованных от существительных: не меньше двух с суффиксами -ан-, -ян-, -ин-; не меньше двух с суффиксами -онн-, -енн-; не меньше двух, в которых основа оканчивается на н (камень → каменный); одно из исключений; 2) употребить пару слов, которые легко спутать: масляный — масленый, ветреный — ветряной или серебряный — серебристый (оба слова пары); 3) прилагательные должны стоять в разных падежах. Подчеркнуть прилагательные, обозначить суффикс и объяснить написание н или нн.',body:'Опорные слова (можно взять другие): глина, береста, олово, стекло, дерево, лён, кожа, сукно, камень, серебро, утро, ремесло, коллекция, экскурсия, витрина, прялка, самовар, сундук, карта.'},
// Урок 2
 {n:11,l:2,st:1,task:'Прочитать словосочетания. Выписать слова с н или нн, образованные от глаголов, и распределить их по пяти столбикам: 1) есть приставка (кроме не-); 2) есть зависимое слово; 3) есть суффикс -ова- (-ева-, -ирова-); 4) образовано от глагола совершенного вида; 5) примет нет. Приметы проверять по порядку, как в схеме урока: слово записывается в столбик первой найденной приметы. Подчеркнуть примету. Слова, образованные от существительных, не выписывать. Ответить: какая ещё примета есть у всех слов первого столбика?',
  obr:'Нарезанный хлеб → 1-й столбик: на- (приставка). Глиняный кувшин — от существительного (глина), не выписывается.',
  body:'Подметённая дорожка, солёные огурцы, тренированный спортсмен, тушённое на слабом огне мясо, стёганое одеяло, песчаный берег, купленный билет, квашеная капуста, газированная вода, тканный вручную ковёр, пущенная стрела, нечищеная картошка, кожаный ремень, маринованные грибы, копчённая на ольховых щепках рыба, отглаженная рубашка, утренняя газета, данное слово, варёное яйцо, кручёный мяч, застеклённая веранда, длинный коридор.'},
 {n:45,l:2,st:1,task:'Прочитать текст. Выписать все прилагательные и причастия с н или нн в суффиксе и распределить их в две группы: А) образованные от существительных; Б) образованные от глаголов. В группе Б у слов с нн назвать примету, у слов с одной н написать «примет нет». Слова с суффиксом -т- (вышитый, литой) не выписывать.',
  obr:'У двери стоял деревянный сундук, а на нём — сложенное вчетверо одеяло. → А) деревянный (дерево; исключение). Б) сложенное (сложить: приставка с-, зависимое слово вчетверо).',
  body:'Летом наш класс ездил в усадьбу позапрошлого века, где теперь музей. В прихожей стояли берестяные туеса и плетёные короба, а на стене висела расписанная яркими цветами прялка. В кабинете хозяина под стеклом лежали письма, обнаруженные в архиве, и простреленная дробью охотничья шляпа. Рядом висел дублёный тулуп кучера и лежала данная роду царём грамота. Экскурсовод показала нам карту имения, начерченную от руки. Больше всего ребятам понравилась кухня: на полках стояли банки с мочёными яблоками и сушёными грибами, оловянные кружки и мешок с ячменной крупой. В последней комнате показывали рисованный фильм о жизни усадьбы. Домой мы возвращались по осеннему лесу, освещённому закатом. Пояснения: туес — коробка с крышкой из берёзовой коры; прялка — приспособление для прядения ниток; тулуп — длинная шуба из овчины; кучер — тот, кто правит лошадьми; ячмень — хлебный злак.'},
 {n:12,l:2,st:2,task:'Вставить н или нн. Записать в скобках глагол, от которого образовано слово, указать его вид и объяснить выбор буквы.',
  obr:'Броше..ый камень → брошенный (бросить, сов. в.): глагол совершенного вида — две н. Лома..ая линия → ломаная (ломать, несов. в.): примет нет — одна н.',
  body:'Реше..ая задача, кипячё..ая вода, проще..ый долг, фасова..ый сахар, рубле..ые котлеты, вяле..ая дыня, плавле..ый сырок, пленё..ый офицер, топлё..ое молоко, дрессирова..ый медведь, жёва..ая бумага, краде..ый велосипед, сея..ая мука, фарширова..ый перец, гружё..ая баржа, точё..ые ножки стола.'},
 {n:13,l:2,st:2,task:'Вставить н или нн. Распределить словосочетания в три столбика: 1) две н только из-за суффикса -ова- (-ева-, -ирова-), других примет нет; 2) две н, потому что есть приставка (кроме не-) или зависимое слово (если при этом есть и -ова-, слово всё равно записать сюда); 3) одна н. Для каждого слова, в котором перед н стоит -ов- (-ёв-), записать глагол в форме «я …ю» и показать, суффикс это или часть корня.',
  obr:'Пломбирова..ый зуб → пломбированный: пломбировать — я пломбирую; -ирова- — суффикс (корень пломб-), других примет нет — 1-й столбик.',
  body:'Кова..ая ограда, клёва..ое воробьями яблоко, рискова..ый трюк, избалова..ая кошка, нешлифова..ый камень, неглаже..ая юбка, консервирова..ый горошек, непуга..ые птицы, полирова..ый стол, непаха..ое поле, нераспакова..ые чемоданы, тка..ый половик, асфальтирова..ая площадка, мороже..ая рыба, ноше..ый старшим братом свитер, организова..ый отдых, мощё..ая улица, зашнурова..ые ботинки.'},
 {n:14,l:2,st:2,task:'Выписать слова с пропусками вместе с определяемыми словами, вставляя н или нн. Рядом указать примету, по которой выбрана буква, или написать «примет нет».',
  obr:'На подоконнике сохли выстира..ые салфетки и штопа..ые варежки. → Выстиранные салфетки (приставка вы-), штопаные варежки (примет нет).',
  body:'1. Через полчаса в камине закипало уже в горшке какое-то варево, а в ожидании, пока оно поспеет, Валек поставил на трёхногий столик сковороду, на которой дымились куски жаре..ого мяса. (В. Г. Короленко, «Дети подземелья») 2. Старуха мать, засучив сильные загорелые руки, раскладывала виноград, сушё..ую рыбу, каймак и хлеб на низеньком круглом татарском столике. (Л. Н. Толстой, «Казаки») 3. Больные один за другим выходили из дверей, у которых стоял сторож и давал каждому из них толстый белый, вяза..ый из бумаги колпак с красным крестом на лбу. (В. М. Гаршин, «Красный цветок») 4. Кругом стола было несколько некраше..ых, но от долгого употребления залакирова..ых табуретов. (Л. Н. Толстой, «Детство») 5. Сидевший в официантской пудре..ый старик слуга тихим движением встал и шёпотом доложил: «Пожалуйте». (Л. Н. Толстой, «Война и мир») 6. Мать, расстрое..ая душевно, потому что очень любила покойного дедушку, и очень утомлё..ая, пролежала почти целый день, не занимаясь нами. (С. Т. Аксаков, «Детские годы Багрова-внука») 7. Только дома были почти все деревянные и улицы немощё..ые. (Л. Н. Толстой, «Воскресение») 8. Хозяин был красавец лет двадцати пяти, свежий, холё..ый, расчёса..ый. (Л. Н. Толстой, «Холстомер») 9. Отец встретил его мрачным и удивлё..ым взглядом, но Тыбурций выдержал этот взгляд спокойно. (В. Г. Короленко, «Дети подземелья») Пояснения: Валек, Тыбурций — герои повести; каймак — густые сливки; бумага (в 3-м предложении) — хлопковая пряжа; официантская — комната для прислуги; холить — заботливо ухаживать.'},
 {n:15,l:2,st:3,task:'Выписать слова с пропусками вместе с определяемыми словами, вставляя н или нн. Подчеркнуть слова, в которых две н пишутся без всяких примет (слова-исключения); для остальных слов назвать примету или написать «примет нет». Ответить на вопросы: 1) Изменилось бы написание слова в 3-м предложении, если убрать слово «мною»? 2) Почему в 10-м предложении слово с не- пишется с двумя н, а во 2-м и 8-м — с одной?',
  obr:'Пришла нежда..ая весть. Никто не просил его непроше..ых советов. → Нежданная — исключение: примет нет, но две н. Непрошеных — не- приметой не считается, других примет нет — одна н.',
