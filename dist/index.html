  body:'1. Комендант, раненный в голову, стоял в кучке злодеев, которые требовали от него ключей. (А. С. Пушкин, «Капитанская дочка») Санитары осторожно перенесли раненых в палатку. 2. Я развернул её и прочёл следующие строки… (А. С. Пушкин, «Капитанская дочка») Мальчик, следующий за отцом по узкой тропе, нёс удочки. 3. Верёвка, натянутая между двумя столбами, служила нам сушилкой. После ссоры у друзей долго были натянутые отношения. 4. Свет, рассеянный облаками, был мягким и ровным. Рассеянный Петя опять забыл дома дневник. 5. Конь, сдержанный крепкой рукой всадника, остановился у самого обрыва. Сдержанный Миша никогда не спорит громко. 6. Наши нападающие забили три гола. Собаку, нападающую на прохожих, нельзя выводить без намордника. Пояснения: комендант — начальник крепости; злодеи — здесь: мятежники; развернул её — развернул записку; нападающий (в футболе) — игрок, чьё дело — забивать голы.'},
 {n:13,l:1,st:5,os:'сочинение',task:'Продолжить текст «Зимний вечер в городе», начатый фразой А. П. Чехова (5–6 предложений). Условия: 1) не меньше пяти причастий — одиночных и с зависимыми словами; причастия с зависимыми словами ставить перед существительным (запятые при них — в уроке 7); 2) причастия стоят в разных падежах и относятся не только к подлежащему; 3) хотя бы одно краткое причастие в роли сказуемого; 4) хотя бы одна пара «прилагательное — причастие» одного корня (белый — белеющий). Подчеркнуть полные причастия волнистой линией и стрелкой показать определяемое слово, краткие — двумя чертами. По желанию: над каждым причастием указать вид и время.',
  body:'Начало: «Шёл крупный, пушистый снег и красил в белое мостовую, лошадиные спины, шапки извозчиков, и чем больше темнел воздух, тем белее становились предметы». (А. П. Чехов, «Каштанка») Пояснения: извозчик — человек, который за плату возил пассажиров на лошади; мостовая — улица, вымощенная камнем.'},
// Урок 2
 {n:14,l:2,st:1,task:'1) Найти три слова, которые не являются причастиями, и объяснить почему. 2) Над каждым причастием поставить букву Д (действительное) или С (страдательное). Проверить себя вопросом: предмет сам совершает действие или действие совершают над ним? Помнить: причастия с -ся всегда действительные. 3) Распределить причастия на два столбика: настоящего и прошедшего времени.',
  obr:'Тикающие часы — Д (часы тикают сами), наст. вр.; остановленные часы — С (часы остановили), прош. вр. Певучий голос — не причастие: прилагательное, суффикс -уч- не является суффиксом причастия.',
  body:'Гудящий пароход, отправленная посылка, плакучая ива, охраняемый заповедник, шелестящие страницы, забитый гол, моющиеся обои, изучаемый язык, вспыхнувшая спичка, стоячая вода, дремлющий кот, колючий куст, проветренный класс, выращиваемые овощи, приближающаяся гроза, лопнувшая струна, опустевший двор, закрывающийся магазин, ремонтирующийся стадион, переводимый текст.'},
 {n:15,l:2,st:2,task:'Выписать причастия вместе со словами, к которым они относятся. Определить, действительное причастие или страдательное, настоящего или прошедшего времени. Доказать, заменив причастие словами «который…». В одном предложении причастия нет — объяснить, почему похожие слова в нём не причастия.',
  obr:'Мы читали письмо, присланное из лагеря. → Письмо присланное — страд., прош. вр.: письмо, которое прислали.',
  body:'1. Дежурящие сегодня ученики остаются после уроков. 2. Белка устроила гнездо в дупле старого дуба, расколотого молнией. 3. По вспаханному полю важно расхаживали грачи. 4. Груз, перевозимый на барже, весит двести тонн. 5. Мы с интересом наблюдали за мастером, вырезающим из липы ложку. 6. Запоздалые прохожие спешили к метро. 7. Дети слушали рассказ лётчика, побывавшего в Арктике. 8. Музей основан в начале прошлого века. 9. Поднимающееся над лесом солнце окрасило облака в розовый цвет.'},
 {n:16,l:2,st:2,task:'Выписать причастия вместе со словами, к которым они относятся, и распределить их по четырём столбикам: действительные настоящего времени, действительные прошедшего времени, страдательные настоящего времени, страдательные прошедшего времени. Краткие причастия тоже записать в нужный столбик. Прилагательные не выписывать.',
  obr:'Мы смотрели на чаек, кружащих над водой, и на лодку, вытащенную на берег. → Действ. наст.: чаек кружащих (чайки кружат сами). Страд. прош.: лодку вытащенную (лодку вытащили).',
  body:'1. Это крикнул Иван Иваныч, и крик его был не болтливый и убедительный, как обыкновенно, а какой-то дикий, пронзительный и неестественный, похожий на скрип отворяемых ворот. (А. П. Чехов, «Каштанка») 2. Оставаться ей в крепости, подвластной Пугачёву и управляемой Швабриным, было невозможно. (А. С. Пушкин, «Капитанская дочка») 3. Мы приближились к городку, где, по словам бородатого коменданта, находился сильный отряд, идущий на соединение к самозванцу. (А. С. Пушкин, «Капитанская дочка») 4. Я обернулся к площади и увидел Максима Максимыча, бегущего что было мочи… (М. Ю. Лермонтов, «Герой нашего времени») 5. В это время из-за высоты, находившейся в полверсте от крепости, показались новые конные толпы, и вскоре степь усеялась множеством людей, вооружённых копьями и сайдаками. (А. С. Пушкин, «Капитанская дочка») 6. Смотри, как роща зеленеет, / Палящим солнцем облита, / А в ней — какою негой веет / От каждой ветки и листа! (Ф. И. Тютчев, «Смотри, как роща зеленеет…») 7. Она молча подала мне свою руку, ещё дрожавшую от волнения и испуга. (Ф. М. Достоевский, «Белые ночи») 8. Марья Ивановна принята была моими родителями с тем искренним радушием, которое отличало людей старого века. (А. С. Пушкин, «Капитанская дочка») Пояснения: Иван Иваныч — гусь; подвластный кому-то — такой, который во власти этого человека; приближились — приблизились; самозванец — здесь: Пугачёв (он назвал себя царём); что было мочи — изо всех сил; полверсты — около полукилометра; сайдак — колчан для лука и стрел; нега — сладкий покой, блаженство; радушие — приветливость.'},
 {n:17,l:2,st:3,task:'1) Определить разряд каждого причастия: действительное или страдательное, настоящего или прошедшего времени. 2) Опираясь на правило «страдательные причастия образуются только от переходных глаголов», объяснить, почему причастия с -ся всегда действительные (проверить: можно ли при глаголе с -ся поставить дополнение в винительном падеже без предлога?). 3) Объяснить, почему в группе 4 нет ни одного страдательного причастия. 4) Найти ошибку в рассуждении ученика.',
  obr:'Защищающий крепость отряд — действ., наст. (отряд защищает крепость сам); защищаемая крепость — страд., наст. (крепость защищают); защищающаяся крепость — действ., наст. (причастие с -ся).',
  body:'1. Обсуждаемый проект — обсуждающийся проект — ребята, обсуждающие проект. 2. Мама, умывшая малыша, — умывшийся малыш — умытый малыш. 3. Включённый фонарь — сторож, включивший фонарь, — включившийся фонарь. 4. Гуляющие дети — дети, гулявшие во дворе. Рассуждение ученика: «Обсуждающийся проект — страдательное причастие, потому что проект обсуждают ребята».'},
 {n:18,l:2,st:3,task:'Определить вид и переходность каждого глагола. Составить для него таблицу из четырёх клеток: действ. наст., действ. прош., страд. наст., страд. прош. Вписать в клетки причастия из слов для справок; если клетка пустая, поставить прочерк и объяснить почему. Подсчитать, сколько причастий у каждого глагола. В справках есть два лишних причастия: найти их и объяснить, от какого глагола они образованы и почему не подходят.',
  obr:'Прочитать (сов. в., перех.): действ. наст. — прочерк (совершенный вид); действ. прош. — прочитавший; страд. наст. — прочерк (совершенный вид); страд. прош. — прочитанный. Всего два.',
  body:'Глаголы: носить, решить, сиять, писать, вернуться, приготовить. Слова для справок: сиявший, решённый, пишущий, носимый (ветром), вернувшийся, решающий, сияющий, приготовленный, носивший, писавший, приготовляемый, решивший, ношенный (кем-то), приготовивший, писанный (маслом), носящий.'},
 {n:19,l:2,st:3,task:'Восстановить авторский текст: выбрать из скобок причастие, которое употребил писатель, и записать предложение. Объяснить выбор: предмет сам совершает действие или действие совершают над ним; если в предложении названо, кто совершает действие, указать это слово; если при причастии есть дополнение, указать его. Определить разряд выбранного причастия.',
  obr:'Я наткнулся на пень, (скрывавший / скрытый) в высокой траве. → Скрытый: пень сам ничего не скрывает, его скрыла трава — страд., прош. вр.',
  body:'1. Она с (нахмурившими / нахмуренными) бровями глядела на всех гостей. (И. А. Гончаров, «Обломов») 2. Поднялся ропот, и я услышал явственно слово: молокосос, (произнёсшее / произнесённое) кем-то вполголоса. (А. С. Пушкин, «Капитанская дочка») 3. Но дым, (наполнивший / наполненный) комнату, помешал моему противнику найти шашку, лежавшую возле него. (М. Ю. Лермонтов, «Герой нашего времени») 4. Как камень, (бросивший / брошенный) в гладкий источник, я встревожил их спокойствие и, как камень, едва сам не пошёл ко дну! (М. Ю. Лермонтов, «Герой нашего времени») 5. Училась она очень охотно и была довольна своими успехами; беганье с (высунувшим / высунутым) языком на корде, прыганье в обруч и езда верхом на старом Фёдоре Тимофеиче доставляли ей величайшее наслаждение. (А. П. Чехов, «Каштанка») 6. Не могу выразить сладостного чувства, (овладевшего / овладенного) мною в эту минуту. (А. С. Пушкин, «Капитанская дочка») 7. Река воздушная полней / Течёт меж небом и землёю, / Грудь дышит легче и вольней, / (Освободившая / Освобождённая) от зною. (Ф. И. Тютчев, «Летний вечер») Пояснения: ропот — недовольный глухой говор; явственно — ясно, отчётливо; молокосос — презрительно о слишком молодом человеке; шашка — сабля; источник — родник; корда — длинная верёвка, на которой гоняют животное по кругу; Фёдор Тимофеич — кот; сладостный — очень приятный; меж — между; от зною — от зноя, сильной жары (старая форма).'},
 {n:20,l:2,st:3,task:'Перестроить словосочетания по образцу: действительное причастие заменить страдательным, а страдательное — действительным. Нужное причастие выбрать из слов для справок (там есть и лишние). Указать разряд причастия до и после замены. Два словосочетания перестроить нельзя: найти их и объяснить почему.',
  obr:'Ребята, кормящие птиц → птицы, кормимые ребятами (действ., наст. → страд., наст.).',
  body:'1. Ребята, посадившие аллею. 2. Картина, написанная художником. 3. Волонтёры, спасающие животных. 4. Песня, исполняемая хором. 5. Пожарные, потушившие огонь. 6. Мальчик, боящийся темноты. 7. Мост, соединяющий берега. 8. Письмо, полученное сестрой. 9. Ласточки, летающие над рекой. 10. Часы, починенные мастером. Слова для справок: посаженная, посадившая, написавший, спасаемые, спасённые, исполняющий, потушенный, соединяемые, получившая, починивший, починенный.'},
 {n:21,l:2,st:4,task:'1) Выписать все причастия (полные и краткие) и указать их постоянные признаки по плану морфологического разбора: а) действительное или страдательное; б) время; в) вид. 2) Выполнить морфологический разбор причастия предлагаемой (предложение 2) по плану (урок 2). 3) Найти среди причастий прошедшего времени причастие несовершенного вида. Какого вида все причастия настоящего времени и почему?',
  obr:'Мы шли по тропинке, протоптанной в снегу. → Протоптанной — пост. признаки: страд., прош. вр., сов. в.',
  body:'1. Толпа, осаждавшая нас, отбежала с проклятиями. (А. С. Пушкин, «Капитанская дочка») 2. Я рад был отказаться от предлагаемой чести, но делать было нечего. (А. С. Пушкин, «Капитанская дочка») 3. Стану продолжать свой журнал, прерванный столькими странными событиями. (М. Ю. Лермонтов, «Герой нашего времени») 4. Чародейкою Зимою / Околдован, лес стоит — / И под снежной бахромою, / Неподвижною, немою, / Чудной жизнью он блестит. (Ф. И. Тютчев, «Чародейкою Зимою…») 5. Вдруг на яркой полосе, пересекающей пол, промелькнула тень. (М. Ю. Лермонтов, «Герой нашего времени») 6. Я легко мог оправдаться: наездничество не только никогда не было запрещено, но ещё всеми силами было ободряемо. (А. С. Пушкин, «Капитанская дочка») Пояснения: осада — окружение врагами крепости или дома; проклятия — злые ругательства; журнал — здесь: дневник; чародейка — колдунья; бахрома — кайма из свисающих нитей (здесь: снег на ветвях); неподвижною, немою — неподвижной, немой (старая форма окончания); наездничество — здесь: вылазки верхом из города во время осады; начальство его хвалило и поддерживало.'},
 {n:22,l:2,st:4,task:'Заменить каждое полное причастие частью предложения со словом «который». Краткие формы не заменять. Если часть со словом «который» нельзя поставить на место причастия, изменить порядок слов: поставить её сразу после определяемого слова. Определить разряд причастия. Сделать вывод: в каком падеже стоит слово «который» после замены действительного причастия и после замены страдательного.',
  obr:'Мы вошли в рощу, пронизанную солнцем. → …в рощу, которую пронизало солнце (страд., прош.). Нас встретил лесник, живущий у опушки. → …лесник, который живёт у опушки (действ., наст.). В рассказе о прошлом причастие настоящего времени можно заменить и глаголом прошедшего времени: лесник, который жил у опушки.',
  body:'1. Мне страх хотелось вытянуть из него какую-нибудь историйку — желание, свойственное всем путешествующим и записывающим людям. (М. Ю. Лермонтов, «Герой нашего времени») 2. Капитан вскоре явился, сопровождаемый кривым старичком. (А. С. Пушкин, «Капитанская дочка») 3. Я удостоверился, что Пугачёв и он были одно и то же лицо, и понял тогда причину пощады, мне оказанной. (А. С. Пушкин, «Капитанская дочка») 4. Я после узнал, что правительство им платит и кормит их с условием, чтоб они принимали путешественников, застигнутых бурею. (М. Ю. Лермонтов, «Герой нашего времени») 5. «Вот наша жизнь, — промолвила ты мне, — / Не светлый дым, блестящий при луне, / А эта тень, бегущая от дыма…» (Ф. И. Тютчев, «Как дымный столп светлеет в вышине!..») 6. Тётка, отлично изучившая во время уроков его лицо и интонацию, догадалась, что он был взволнован, озабочен и, кажется, сердит. (А. П. Чехов, «Каштанка») Пояснения: страх хотелось — очень хотелось; историйка — небольшая история; кривой — здесь: одноглазый; удостовериться — убедиться; он — здесь: вожатый, которого герой встретил в буран; пощада — помилование; им — здесь: жителям горного селения, у которых остановились путники; промолвить — сказать; Тётка — собака; интонация — оттенки голоса.'},
 {n:23,l:2,st:4,task:'Найти ошибки в употреблении причастий и исправить их. Объяснить, что нарушено: а) употреблена форма, которой нет в языке (причастие будущего времени или причастие настоящего времени от глагола совершенного вида); б) причастие не соответствует тому, кто совершает действие (нужно страдательное вместо действительного или наоборот). Помнить: в некоторых предложениях ошибок нет.',
  body:'1. Участник, наберущий больше всех очков, получит главный приз. 2. Картина, нарисовавшая известным художником, висит в музее. 3. Туристы, вернувшиеся из похода, долго рассказывали о своих приключениях. 4. Посетители, купящие билеты заранее, пройдут без очереди. 5. Новость, сообщившая по радио, всех обрадовала. 6. Ветер, дувший всю ночь, к утру стих. 7. Концерт завершит ансамбль, выступящий последним. 8. Мы осмотрели мост, строящий через реку. 9. Спасатели нашли потерявшегося в лесу грибника. 10. Учебник, издавший в этом году, уже есть в библиотеке.'},
 {n:24,l:2,st:4,task:'Выписать из предложений причастия (полные и краткие) вместе со словами, к которым они относятся, и определить разряд: действительное или страдательное, настоящего или прошедшего времени. Не путать причастия с прилагательными и с глаголами (в том числе с -ся): проверять вопросом и заменой «который…».',
  body:'1. Но между тем странное чувство отравляло мою радость: мысль о злодее, обрызганном кровию стольких невинных жертв, и о казни, его ожидающей, тревожила меня поневоле… (А. С. Пушкин, «Капитанская дочка») 2. Тот, кто будет ранен, полетит непременно вниз и разобьётся вдребезги; пулю доктор вынет. (М. Ю. Лермонтов, «Герой нашего времени») 3. Схвачен был башкирец с возмутительными листами. (А. С. Пушкин, «Капитанская дочка») 4. Из отворённой двери вышел какой-то человек, принадлежащий к разряду заказчиков. (А. П. Чехов, «Каштанка») 5. Он взвёл опять курок, прицелился в фуражку, висевшую над окном; выстрел раздался — дым наполнил комнату. (М. Ю. Лермонтов, «Герой нашего времени») 6. Пётр Степанович улыбнулся искривлённою улыбкой. (Ф. М. Достоевский, «Бесы») 7. Зеленеющие нивы / Зеленее под грозой. (Ф. И. Тютчев, «Неохотно и несмело…») Пояснения: злодей — здесь: Пугачёв; кровию — кровью; башкирец — башкир; возмутительные листы — листовки с призывом к бунту; разряд заказчиков — те, кто заказывает работу (хозяин Каштанки был столяром); курок — часть пистолета, которую отводят назад (взводят) перед выстрелом; искривлённою — искривлённой (старая форма окончания); нивы — поля, засеянные хлебом.'},
 {n:25,l:2,st:5,os:'работа с текстом',task:'Прочитать отрывок (собака Тётка попала с хозяином в цирк). 1) Выписать причастия вместе с определяемыми и зависимыми словами и распределить их по четырём столбикам: действ. наст., действ. прош., страд. наст., страд. прош. Над каждым причастием указать вид. 2) Мини-исследование: объяснить, почему в описании комнаты почти все причастия страдательные, прошедшего времени, совершенного вида. Назван ли в тексте тот, кто совершил эти действия? Почему одно причастие — действительное настоящего времени? Объяснить и по смыслу, и по признакам глагола (вид, переходность). 3) Найти в первом предложении прилагательное, которое по смыслу близко к причастию «наполненную» (этого слова в тексте нет: «комнату, наполненную чудовищами»), и доказать, что это не причастие. 4) Выполнить морфологический разбор причастий торчащими и вбитой по плану (урок 2).',
  body:'Ей показалось, что она увидела громадную, плохо освещённую комнату, полную чудовищ; из-за перегородок и решёток, которые тянулись по обе стороны комнаты, выглядывали страшные рожи: лошадиные, рогатые, длинноухие, и какая-то одна толстая, громадная рожа с хвостом вместо носа и с двумя длинными обглоданными костями, торчащими изо рта. Кот сипло замяукал под лапами Тётки, но в это время шуба распахнулась, хозяин сказал «гоп!», и Фёдор Тимофеич с Тёткою прыгнули на пол. Они уже были в маленькой комнате с серыми дощатыми стенами; тут, кроме небольшого столика с зеркалом, табурета и тряпья, развешанного по углам, не было никакой другой мебели, и, вместо лампы или свечи, горел яркий веерообразный огонёк, приделанный к трубочке, вбитой в стену. (А. П. Чехов, «Каштанка») Пояснения: рожа — здесь: морда зверя; Фёдор Тимофеич — кот; шуба — здесь: шуба хозяина, под которой сидели кот и собака; дощатый — из досок; тряпьё — старые тряпки, лоскуты; веерообразный — похожий на веер.'},
 {n:26,l:2,st:5,os:'сочинение',task:'Написать сочинение-миниатюру «Город готовится к празднику» (5–6 предложений). Условия: 1) употребить причастия всех четырёх разрядов (каждого — не меньше одного); причастия образовать самостоятельно от разных глаголов; 2) одно из причастий — краткое страдательное в роли сказуемого; 3) причастия с зависимыми словами ставить перед существительным (запятые при них — в уроке 7). Над каждым причастием указать разряд. По желанию: употребить причастие с -ся и указать у всех причастий вид.',
  body:'Опорные слова (можно использовать, можно заменить своими): площадь, гирлянды, воздушные шары, сцена, оркестр, гости, фонари, витрины, флаги, ёлка, суета.'},
// Урок 3
 {n:27,l:3,st:1,task:'1) Записать глаголы в неопределённой форме и в форме «они …» (3-е лицо мн. ч.). Отделить основу чёрточкой. Указать, у каких глаголов основы совпадают. 2) Разобрать причастия: отделить чёрточками основу и суффикс. Указать, от какой основы образовано каждое: настоящего времени (записать форму «они …»), инфинитива (записать неопределённую форму) или прошедшего времени, если она у глагола другая (как у нести — нёс).',
  obr:'1) Читать: чита-ть — они чита-ют (основы совпадают). 2) Мечтающий: мечта-ющ-ий — от основы настоящего времени (они мечта-ют).',
  body:'1) Рисовать, писать, давать, колоть, прятать, видеть, нести, брать. 2) Кипящий, танцующий, гулявший, выросший, засушенный, связанный, согретый, строивший, хранимый.'},
 {n:28,l:3,st:1,task:'Выписать причастия вместе с существительными, к которым они относятся. Выделить в причастии суффикс и указать, от какой основы оно образовано: настоящего времени (записать форму «они …»), инфинитива (записать неопределённую форму) или прошедшего времени, если она отличается от основы инфинитива. В двух предложениях причастий нет.',
  obr:'Плачущий малыш успокоился на руках у мамы. → Плачущий малыш: плач-ущ-ий — от основы настоящего времени (они плач-ут).',
  body:'1. Из кухни доносился запах подгоревшей каши. 2. Мама долго искала ключи, положенные кем-то на подоконник. 3. Шумящий за стеной пылесос мешал мне читать. 4. После грозы мы вернулись в притихший лес. 5. Сестра показала мне аппликацию, вырезанную ею в первом классе. 6. Горячий хлеб и холодное молоко — лучший завтрак на рыбалке. 7. Над стадионом кружил вертолёт, снимающий матч для телевидения. 8. Учитель раздал нам исправленные за выходные тетради. 9. Нас встретил дедушка с ведром, полным только что набранной малины. 10. В тишине было слышно, как тикают часы.'},
 {n:29,l:3,st:2,task:'1) От глаголов каждой пары образовать причастия: от глагола несовершенного вида — действительные настоящего и прошедшего времени и страдательное настоящего времени; от глагола совершенного вида — действительное и страдательное прошедшего времени. Выделить суффиксы. Объяснить, почему у глаголов совершенного вида нет причастий настоящего времени. 2) От глаголов второй строки образовать причастия тех же разрядов (смотря по виду глагола). Если какого-то причастия нет, объяснить почему.',
  obr:'1) Решать — решить: реша-ющ-ий, реша-вш-ий, реша-ем-ый; реши-вш-ий, реш-ённ-ый. 2) Плавать (несов. в.): плава-ющ-ий, плава-вш-ий; страдательного нет — глагол непереходный (плавать что? — нельзя).',
  body:'1) Посылать — послать; открывать — открыть; спасать — спасти. 2) Дремать, пить, уснуть, умываться, приготовить.'},
 {n:30,l:3,st:2,task:'Выписать причастия вместе с определяемыми словами и распределить в два столбика: 1) образованные от основы настоящего времени; 2) образованные от основы инфинитива (или прошедшего времени). Выделить суффиксы. Рядом в скобках записать глагол: для первого столбика — в форме «они …», для второго — в неопределённой форме (если основа прошедшего времени другая — записать и её).',
  obr:'Мы проходили мимо избы, давно покинутой хозяевами. → 2-й столбик: избы покинутой — покину-т-ой (покинуть).',
  body:'1. Мы сидели неподвижно, подавленные жаром. (И. С. Тургенев, «Записки охотника») 2. Надобно прибавить, что от высыхающей тины и рыбы, погибшей в камышах, пахло очень дурно. (С. Т. Аксаков, «Детские годы Багрова-внука») 3. Широкая река огибала её уходящим от меня полукругом… (И. С. Тургенев, «Записки охотника») 4. Он сделал это так неловко, что задел образок моего ангела, висевший на дубовой спинке кровати, и что убитая муха упала мне прямо на голову. (Л. Н. Толстой, «Детство») 5. На коленях у Авенира лежала тетрадка стихотворений Кольцова, тщательно переписанных; он с улыбкой постучал по ней рукой. (И. С. Тургенев, «Записки охотника») 6. Я притерпелся к упрёкам и выносил их, как выносил внезапно налетевший дождь или солнечный зной. (В. Г. Короленко, «Дети подземелья») 7. Все мальчики засмеялись и опять приумолкли на мгновенье, как это часто случается с людьми, разговаривающими на открытом воздухе. (И. С. Тургенев, «Записки охотника») Пояснения: надобно — нужно; её (в 3-м предложении) — равнину; он (в 4-м предложении) — учитель Карл Иваныч, который бил мух хлопушкой; образок моего ангела — маленькая икона святого, в честь которого назван мальчик; Авенир — герой рассказа, Кольцов — поэт; притерпеться — привыкнуть терпеть.'},
 {n:31,l:3,st:2,task:'1) Образовать от глаголов страдательные причастия прошедшего времени и распределить их по суффиксам: -нн-, -енн- (-ённ-), -т-. Объяснить, почему в третьей группе суффикс -т-. 2) Образовать от глаголов действительные причастия прошедшего времени. Подчеркнуть те, в которых суффикс -ш-, и объяснить, почему не -вш-. Сравнить причастия от глаголов отдохнуть и привыкнуть: почему у них разные суффиксы, хотя оба глагола на -нуть?',
  obr:'1) Сшить → сшитый (-т-: односложный глагол шить с приставкой). 2) Заползти → заползший: основа прошедшего времени заполз- оканчивается на согласный, поэтому -ш-.',
  body:'1) Прополоть, нарисовать, разлить, натереть, раздуть, выкрасить, сжать, развязать, заморозить, отнять, привезти, сыграть. 2) Испечь, стеречь, помочь, вылезти, привыкнуть, отдохнуть, крикнуть, улететь, оглянуться, простить.'},
 {n:32,l:3,st:3,task:'Выписать причастия вместе с определяемыми словами. Записать неопределённую форму глагола, выделить суффикс причастия и распределить причастия в два столбика: 1) в основе чередуются согласные (указать чередование); 2) чередования нет. Ответить: перед каким суффиксом появляются чередования?',
  obr:'Мы вошли в комнату, обставленную старой мебелью. → 1-й столбик: комнату обставленную — обстави-ть, обставл-енн-ую: в — вл.',
  body:'1. Его некрасивое лицо, оживлённое быстрой ездой, горело смелой удалью и твёрдой решимостью. (И. С. Тургенев, «Записки охотника») 2. У Сони была большая кукла, с ярко раскрашенным лицом и роскошными льняными волосами, подарок покойной матери. (В. Г. Короленко, «Дети подземелья») 3. Мы скоро доехали до ссечек, а там добрались и до конторы, высокой избы, одиноко стоявшей над небольшим оврагом, на скорую руку перехваченным плотиной и превращённым в пруд. (И. С. Тургенев, «Записки охотника») 4. В окна, обращённые на лес, ударяла почти полная луна. (Л. Н. Толстой, «Детство») 5. Касьян присел на толстый конец срубленной берёзы. (И. С. Тургенев, «Записки охотника») 6. Приготовленная заранее кормилица, ещё не кормившая братца, … была уже тут; она поцеловала у нас ручки. (С. Т. Аксаков, «Детские годы Багрова-внука») 7. Кучер мой остановился в недоумении у полусгнившего и засорённого колодца. (И. С. Тургенев, «Записки охотника») Пояснения: Соня — маленькая сестра рассказчика; льняные волосы — светлые, цвета льна; ссечки — вырубки в лесу; плотина — насыпь поперёк реки или оврага, которая задерживает воду; братец — новорождённый брат рассказчика.'},
 {n:33,l:3,st:3,task:'Заменить части предложений со словом «который» причастиями с зависимыми словами. Причастие ставить перед определяемым словом (знаки при причастии после определяемого слова — урок 7). Выделить суффикс и указать, от какой основы образовано причастие. Время причастия — то же, что у глагола в заменяемой части; если действие совершают над предметом, нужно страдательное причастие. В двух предложениях замена невозможна — объяснить почему.',
  obr:'Ученик, который опоздал на урок, извинился. → Опоздавший на урок ученик извинился: опозда-вш-ий — от основы инфинитива (опоздать).',
  body:'1. На столе лежало письмо, которое принёс почтальон. 2. Мы зашли в кафе, которое открылось на прошлой неделе. 3. Пассажиры, которые ждут электричку, прячутся от дождя под навесом. 4. Дедушка, которому в субботу исполнится восемьдесят лет, всё ещё катается на лыжах. 5. Брат не выпускает из рук телефон, который ему отдал дядя. 6. Мы долго любовались горами, которые окутал туман. 7. Все говорят о фильме, который обсуждают в каждом классе. 8. Вода, которую пьют жители города, проходит несколько ступеней очистки. 9. Над рекой кружили чайки, которые громко кричали. 10. Весной мы высадили в грунт рассаду, которая окрепла на подоконнике.'},
 {n:34,l:3,st:3,task:'Образовать от глагола в скобках причастие указанного разряда и поставить его в той форме, которой требует определяемое слово. Записать причастие вместе с определяемым словом, выделить суффикс, указать число, род (в единственном числе) и падеж.',
  obr:'Мы свернули на дорогу, (вымостить — страд., прош.) булыжником. → на дорогу вымощенную: вымощ-енн-ую (ед. ч., ж. р., В. п. — как «на дорогу»).',
  body:'1. Я быстро отдёрнул (занести — страд., прош.) ногу и, сквозь едва прозрачный сумрак ночи, увидел далеко под собою огромную равнину. (И. С. Тургенев, «Записки охотника») 2. (Расти — действ., наст.) под берегом развесистая молодая берёза почти касалась её стены своими ветвями. (С. Т. Аксаков, «Детские годы Багрова-внука») 3. Его добродушное смуглое лицо, кое-где (отметить — страд., прош.) рябинами, мне понравилось с первого взгляда. (И. С. Тургенев, «Записки охотника») 4. И ещё не успел отодрать колючек, (зацепиться — действ., прош.) ему за черкеску, как собака его, (побежать — действ., прош.) вперёд, подняла уже двух фазанов. (Л. Н. Толстой, «Казаки») 5. Я добрался до сеновала и лёг на только что (скосить — страд., прош.), но уже почти высохшую траву. (И. С. Тургенев, «Записки охотника») 6. Косые лучи мягко золотили зелёную мураву старого кладбища, играли на (покоситься — действ., прош.) крестах, переливались в (уцелеть — действ., прош.) окнах часовни. (В. Г. Короленко, «Дети подземелья») 7. То был не весёлый, (смеяться — действ., наст.) трепет весны, не мягкое шушуканье, не долгий говор лета, не робкое и холодное лепетанье поздней осени, а едва слышная, дремотная болтовня. (И. С. Тургенев, «Записки охотника») Пояснения: её стены (во 2-м предложении) — стены спальни, окна которой выходили к реке; не успел (в 4-м предложении) — речь об Оленине, герое повести, который перелез через колючую ограду; черкеска — длинная верхняя мужская одежда у кавказских горцев и казаков; рябины — здесь следы оспы на коже; мурава — густая низкая трава; часовня — маленькая церковь; трепет весны — здесь шум листьев весной.'},
 {n:35,l:3,st:4,task:'Выписать из предложений все полные прилагательные и причастия (местоимения и числительные не выписывать) и распределить их в два столбика: 1) прилагательные; 2) причастия. У причастий выделить суффикс и указать глагол, от которого они образованы. Выбрать в первом столбике четыре слова, которые больше всего похожи на причастия, и доказать, что это прилагательные.',
  body:'1. Её голос звенел и дрожал, как надтреснутый стеклянный колокольчик, вспыхивал и замирал… (И. С. Тургенев, «Записки охотника») 2. Он сидел на кожаных, старинных, каких-то диковинных креслах, везде по краям унизанных медными шишечками… (С. Т. Аксаков, «Детские годы Багрова-внука») 3. На Авенире был ветхий бухарский халат; зелёный шейный платок бросал мертвенный оттенок на его страшно исхудавшее лицо. (И. С. Тургенев, «Записки охотника») 4. Посредине комнаты, на столе, стоял гроб, вокруг него нагоревшие свечи в высоких серебряных подсвечниках; в дальнем углу сидел дьячок и тихим однообразным голосом читал псалтырь. (Л. Н. Толстой, «Детство») 5. Она состояла из нескольких сосновых срубов, соединённых заборами; перед главной избой тянулся навес, подпёртый тоненькими столбиками. (И. С. Тургенев, «Записки охотника») Пояснения: он (во 2-м предложении) — дедушка рассказчика; диковинный — необычный, странный; шишечки — маленькие выпуклые украшения; бухарский — из Бухары; мертвенный — безжизненно-бледный; дьячок — служитель в церкви; псалтырь — церковная книга; она (в 5-м предложении) — усадьба; сруб — бревенчатая постройка; навес — крыша на столбах.'},
 {n:36,l:3,st:4,task:'Выписать из предложений страдательные причастия (в одном предложении их нет). Указать, от какого глагола образовано каждое и какого вида этот глагол. Образовать от того же глагола все возможные действительные причастия. Объяснить, почему от одного глагола получилось два действительных причастия, а от других — одно.',
  body:'1. Она вынула из-под платка корнет, сделанный из красной бумаги, в котором были две карамельки и одна винная ягода, и дрожащей рукой подала его мне. (Л. Н. Толстой, «Детство») 2. Светлый кружок от фонаря скоро исчез в его глазах, поглощённый густым мраком беззвёздной и безлунной ночи. (И. С. Тургенев, «Записки охотника») 3. Сквозь густые кусты орешника, перепутанные цепкой травой, спускаетесь вы на дно оврага. (И. С. Тургенев, «Записки охотника») 4. Он прочёл это на стенах, на обвалившейся штукатурке, на кусках кирпича и изразцов, находимых им в саду… (В. М. Гаршин, «Красный цветок») 5. Николай Еремеич подошёл к стене и, сколько я мог заметить, начал разбирать бумаги, вручённые купцом. (И. С. Тургенев, «Записки охотника») 6. Огромная старая сова, обеспокоенная нашей вознёй, вылетела из тёмного угла, мелькнула на фоне голубого неба в пролёте и шарахнулась вон. (В. Г. Короленко, «Дети подземелья») 7. Небольшая ночная птица, неслышно и низко мчавшаяся на своих мягких крыльях, почти наткнулась на меня и пугливо нырнула в сторону. (И. С. Тургенев, «Записки охотника») Пояснения: она (в 1-м предложении) — старая няня Наталья Савишна; корнет — бумажный кулёк; винная ягода — сушёный инжир; его (во 2-м предложении) — слуги Перфишки, который остался стоять у плетня; он (в 4-м предложении) — больной, герой рассказа; это — историю старого дома; изразцы — плитки для облицовки печей; Николай Еремеич — конторщик; пролёт — здесь пролом в стене.'},
 {n:37,l:3,st:4,task:'Найти и исправить ошибки в образовании причастий (их шесть). Объяснить каждую ошибку. Верно образованные причастия выписать отдельно и указать, от какой основы они образованы.',
  body:'В субботу наш класс ездил в краеведческий музей. Встретивший нас у входа экскурсовод сразу повёл всех в зал древностей. Между витринами носились громко смеющие малыши из другой школы. Мы долго рассматривали глиняный кувшин, откопанный в соседнем селе. Тихая девочка, прячующаяся за колонной, срисовывала в блокнот старинный меч. Искающим выход посетителям смотритель молча показывал на стрелку. В последнем зале висела стенгазета, пишемая самими школьниками. Учительница пообещала, что каждый, ответящий на все вопросы викторины, получит значок. Уже из окна автобуса мы заметили охранника, машующего нам с крыльца чьим-то рюкзаком, вынесенным из гардероба.'},
 {n:38,l:3,st:5,os:'работа с текстом',task:'Прочитать отрывок. 1) Выписать причастия вместе с определяемыми словами, выделить суффиксы и указать, от какой основы образовано каждое причастие. Объяснить, чем засыпающим отличается от засыпают. 2) От глаголов-сказуемых темнеет, лепечут, скользит, замирает, потускнели образовать все возможные действительные причастия. Объяснить, почему от одного глагола получилось только одно причастие. 3) Выполнить морфологический разбор причастий засыпающим и влетевший.',
  body:'Солнце село, но в лесу ещё светло; воздух чист и прозрачен; птицы болтливо лепечут; молодая трава блестит весёлым блеском изумруда… Вы ждёте. Внутренность леса постепенно темнеет; алый свет вечерней зари медленно скользит по корням и стволам деревьев, поднимается всё выше и выше, переходит от нижних, почти ещё голых, веток к неподвижным, засыпающим верхушкам… Вот и самые верхушки потускнели; румяное небо синеет. Лесной запах усиливается, слегка повеяло тёплой сыростью; влетевший ветер около вас замирает. Птицы засыпают — не все вдруг — по породам; вот затихли зяблики, через несколько мгновений малиновки, за ними овсянки. В лесу всё темней да темней. Деревья сливаются в большие чернеющие массы; на синем небе робко выступают первые звёздочки. (И. С. Тургенев, «Записки охотника») Пояснения: изумруд — зелёный драгоценный камень; зяблики, малиновки, овсянки — лесные птицы.'},
 {n:39,l:3,st:5,os:'сочинение',task:'Написать текст-описание «Перед грозой» (5–7 предложений). Употребить причастия, образованные от глаголов приближаться, раскачивать, сверкнуть, затянуть, поднять, нависать. Над каждым причастием указать, от какой основы оно образовано, и выделить суффикс. Причастие с зависимыми словами ставить перед определяемым словом (знаки при причастии после определяемого слова — урок 7). По желанию: употребить ещё два-три причастия от своих глаголов, в том числе одно с суффиксом -ш-.',
  body:'Опорные слова: тучи, небо, ветер, деревья, молния, пыль, птицы, первые капли.'},
// Урок 4
 {n:40,l:4,st:1,task:'1) Поставить глаголы в форму «они …». Определить спряжение: по ударному окончанию, а если окончание безударное — по неопределённой форме. Образовать действительные причастия настоящего времени, выделить суффикс. Если причастие образовать нельзя, объяснить почему. 2) Вставить пропущенные буквы перед суффиксом -вш-. Рядом записать неопределённую форму глагола.',
  obr:'1) Рычать — они рычат (II спр.) → рыч-ащ-ий. 2) Посе..вший → посеявший (посеять: перед -ть — я).',
  body:'1) Пищать, трещать, петь, стучать, гладить, ползти, молчать, прыгать, звенеть, жевать, хмуриться, уронить. 2) Сме..вшийся, зате..вший, раста..вший, забол..вший, вылеч..вший, вспот..вший, разгляд..вший, прослуш..вший.'},
 {n:41,l:4,st:1,task:'Выписать причастия и поставить в них ударение. Подчеркнуть гласную в суффиксе причастия настоящего времени или гласную перед суффиксом -вш-, -нн-. Распределить причастия на две группы: 1) эта гласная под ударением — её слышно; 2) гласная без ударения — для неё нужно правило (назвать его). Причастия, в которых такой гласной нет (суффиксы -ш-, -т-), выписать отдельно.',
  obr:'Свистящий чайник → 1-я группа: свистя́щий (я под ударением). Кашляющий старик → 2-я группа: ка́шляющий, гласная без ударения; они кашляют (I спр.) → -ющ-.',
  body:'1. По пустой улице медленно ползла уборочная машина, сгребающая снег к обочинам. 2. Дворник, терпеливо скалывающий лёд со ступенек, приветливо кивнул нам. 3. На остановке ждал пассажиров автобус, занесённый метелью по самые окна. 4. Мигающий жёлтый светофор отражался в застывших лужах. 5. Из распахнувшейся двери пекарни пахло свежим хлебом. 6. Девочка несла домой пакет с булочками, заказанными к завтраку. 7. Над крышами кружились голуби, вспугнутые шумом мотора. 8. Мы шагали к школе по хрустящей под ботинками тропинке. 9. Продрогший у ворот дежурный учитель торопил опаздывающих ребят. 10. Над входом висел плакат, оформленный старшеклассниками.'},
 {n:42,l:4,st:2,task:'Вставить пропущенные буквы в суффиксах причастий настоящего времени. Записать в скобках неопределённую форму глагола и указать спряжение. Подчеркнуть глаголы-исключения.',
  obr:'Бабушка, сол..щая огурцы, … → солящая (солить: на -ить, II спр. → -ящ-).',
  body:'1. Колебл..щийся огонёк свечи отбрасывал на стену причудливые тени. 2. Мы с интересом слушали лектора, рассказыва..щего о древних курганах. 3. Стро..щийся стадион откроют к весне. 4. Малыш, верт..щий в руках погремушку, никак не мог уснуть. 5. Держ..щие флаг школы ребята первыми вышли на сцену. 6. Туристы шли по тропинке, стел..щейся вдоль реки. 7. Звук, слыш..щийся из-за стены, напоминал стук дятла. 8. Стихотворение, заучива..мое к празднику, оказалось очень длинным. 9. Гон..мые ветром облака быстро плыли над городом. 10. Наш кот, ненавид..щий воду, спрятался под диван ещё до начала купания. 11. Внезапные, надрыва..щие грудь рыданья не дали ей докончить речи — она повалилась лицом на траву и горько, горько заплакала… (И. С. Тургенев, «Записки охотника») 12. Снова птицы летят издалека / К берегам, расторга..щим лёд, / Солнце тёплое ходит высоко / И душистого ландыша ждёт. (А. А. Фет, «Весенние мысли»)'},
 {n:43,l:4,st:2,task:'Выписать причастия вместе с определяемыми словами, вставляя пропущенные буквы. Рядом записать глагол в форме «они …». Если окончание безударное, записать и неопределённую форму и по ней определить спряжение. В двух причастиях пропущена гласная перед -вш-: объяснить и её.',
  obr:'Пароход, гуд..щий у пристани, … → пароход гудящий: они гудят (окончание ударное, II спр.) → -ящ-. Мальчик, кашл..щий в кулак, … → мальчик кашляющий: они кашляют — окончание безударное; кашлять — не на -ить и не исключение → I спр. → -ющ-.',
  body:'1. Он шёл на это дело не то чтобы спокойно, а самоуверенно, бесповоротно, как идёт человек, повину..щийся чувству долга. (И. С. Тургенев, «Записки охотника») 2. Нянька сказала мне, что там видят иногда покойного моего дедушку Зубина, сид..щего за столом и разбира..щего бумаги. (С. Т. Аксаков, «Детские годы Багрова-внука») 3. Лежень с замира..щим сердцем сел на стул: он отроду и не касался фортепьян. (И. С. Тургенев, «Записки охотника») 4. Как ни ужасны были турки, том..вшиеся под землёю, но все они отзывались старою сказкой. (В. Г. Короленко, «Дети подземелья») 5. С людьми же, сто..щими на низших ступенях общества, он обходится ещё страннее: вовсе на них не глядит… (И. С. Тургенев, «Записки охотника») 6. Вслед за приездом матери повалили толпы возвраща..щегося народа. (С. Т. Аксаков, «Детские годы Багрова-внука») 7. Звёзды ласково мигали лучами, проник..вшими до самого его сердца. (В. М. Гаршин, «Красный цветок») Пояснения: там (во 2-м предложении) — в тёмных комнатах дома; Лежень — француз, учитель музыки; фортепьяны — фортепиано; турки (в 4-м предложении) — пленники из старинных рассказов о подземельях замка; отзываться сказкой — напоминать сказку; повалить толпой (в 6-м предложении) — идти густой толпой; его (в 7-м предложении) — больного, героя рассказа.'},
 {n:44,l:4,st:2,task:'1) Вставить пропущенные буквы перед суффиксом -нн- (-енн-). Записать неопределённую форму глагола. 2) Образовать от глаголов страдательные причастия прошедшего времени. Объяснить выбор гласной перед -нн-.',
  obr:'1) Окраш..нный забор → окрашенный (окрасить: на -ить → е). 2) Нарезать → нарезанный (на -ать → а).',
  body:'1) Просе..нная мука, просмотр..нный фильм, накле..нная марка, разве..нный ветром дым, услыш..нная новость, выглаж..нная рубашка, обла..нный собаками почтальон, потер..нный ключ, назнач..нная встреча, запут..нные нитки, засол..нные грибы. 2) Смазать, вспахать, обвязать, измерить, осмеять, подмести, остричь, расчесать.'},
 {n:45,l:4,st:3,task:'1) Распределить глаголы на две группы: I и II спряжение. Образовать от каждого действительное причастие настоящего времени, выделить суффикс. Подчеркнуть глаголы-исключения. Если причастие образовать нельзя, объяснить почему. 2) Образовать от глаголов страдательные причастия настоящего времени. Объяснить выбор суффикса -ем- или -им-. Если причастие не употребляется, указать это.',
  obr:'Ценить — они ценят (II спр.: на -ить) → цен-ящ-ий; цен-им-ый.',
  body:'1) Хвалить, сиять, терпеть, кружить, веять, смотреть, вертеть, лаять, зависеть, обидеть, колоть, хлопотать. 2) Уважать, кормить, покупать, видеть, перевозить, посещать, изучать, ждать.'},
 {n:46,l:4,st:3,task:'1) Вставить пропущенные буквы. Определить по смыслу, от какого глагола образовано причастие, записать этот глагол в неопределённой форме и объяснить выбор гласной. 2) Составить два предложения с причастиями, образованными от глаголов закатить и закачать.',
  obr:'Шары, накач..нные насосом, … → накачанные: накачать (качать насосом) — на -ать → а.',
  body:'1) 1. Обвеш..нный продавцом покупатель вернулся и вызвал администратора. — Обвеш..нная гирляндами ёлка сияла в витрине магазина. 2. Платок, вывеш..нный на верёвке, высох за час. — Варенье, перемеш..нное ложкой, стало однородным. 3. Скач..нный из интернета файл не открывался. — Дети долго бегали за бочкой, скач..нной с телеги. 4. Мы долго отмывали щенка, вывал..нного в грязи. — Волонтёры убрали мусор, вывал..нный кем-то в овраг. 2) Закатить, закачать.'},
 {n:47,l:4,st:3,task:'Выписать причастия вместе с определяемыми словами, вставляя пропущенные буквы, и распределить их в три столбика: 1) с суффиксами настоящего времени; 2) с суффиксом -вш-; 3) с суффиксом -нн- (-енн-). Подчеркнуть вставленную гласную и объяснить её написание. Причастие, в котором этой орфограммы нет, выписать отдельно.',
  obr:'Птицы, прилет..вшие с юга, … → 2-й столбик: прилетевшие — прилететь: перед -ть е, значит, и перед -вш- е.',
  body:'1. На стенах, окле..нных зелёными обоями с розовыми разводами, висели три огромные картины, пис..нные масляными красками. (И. С. Тургенев, «Записки охотника») 2. Около задних ног его лошади пёстрым, волну..щимся клубком бежали сомкнутые гончие. (Л. Н. Толстой, «Детство») 3. Мне стало грустно; сквозь невесёлую, хотя свежую улыбку увяда..щей природы, казалось, прокрадывался унылый страх недалёкой зимы. (И. С. Тургенев, «Записки охотника») 4. Валек зажёг лучину, и мы отправились с ним в тёмный коридор, примык..вший к подземелью. (В. Г. Короленко, «Дети подземелья») 5. Посреди леса, на расчищ..нной и разработ..нной поляне, возвышалась одинокая усадьба Хоря. (И. С. Тургенев, «Записки охотника») 6. Я стал ходить по всему дому, провожа..мый иногда Евсеичем. (С. Т. Аксаков, «Детские годы Багрова-внука») 7. Тёплый сильный ветер, проход..вший сквозь ветви, не приносил прохлады, а только однообразно гнул вершины рассып..нных по садам грушевых, персиковых и тутовых деревьев. (Л. Н. Толстой, «Казаки») Пояснения: его (во 2-м предложении) — доезжачего (старшего псаря) Турки; гончие — охотничьи собаки; Валек — друг рассказчика; лучина — тонкая щепка, которую жгли для света; Хорь — крестьянин, герой рассказа; Евсеич — дядька (слуга), который присматривал за мальчиком; тутовое дерево — шелковица.'},
 {n:103,l:4,st:3,task:'Вставить пропущенные буквы. Записать в скобках глагол, от которого образовано причастие: для причастий настоящего времени — в форме «они …» и в неопределённой форме, для остальных — в неопределённой форме. Слова в каждой паре похожи, но различаются одним признаком: найти его и объяснить, почему пропущенные гласные разные. Подчеркнуть пару, в которой одну гласную подсказывает ударение.',
  obr:'Ре..щий флаг — ро..щиеся пчёлы → реющий (они реют; реять — не на -ить, I спр. → -ющ-) — роящиеся (они роятся; роиться — на -ить, II спр. → -ящ-). Признак — спряжение.',
  body:'1. Наде..щийся на чудо малыш — наде..вшийся на скидку покупатель. 2. Засе..нное рожью поле — подкле..нная скотчем страница. 3. Пиш..щая ручка — пищ..щий комар. 4. Грохоч..щий гром — мороч..щий голову хитрец. 5. Услыш..вший шорох заяц — замет..вший хозяина щенок. 6. Отча..вшийся путник — отчал..вший от пристани катер. 7. Вычерп..нная вёдрами вода — вылеч..нный зуб. 8. Ненавид..мый всеми злодей — обожа..мый всеми артист. 9. Тепл..щийся огонёк — тле..щие угли. 10. Ка..щийся грешник — кат..щийся с горки мяч. 11. Исчерч..нный мелом асфальт — исчёрк..нная тетрадь.'},
 {n:104,l:4,st:3,task:'Вставить пропущенные буквы: сначала в окончании глагола (форма «они …»), потом в суффиксе причастия от того же глагола. Если окончание безударное, определить спряжение по неопределённой форме (записать её). Объяснить, почему гласная окончания и гласная суффикса связаны. В каждом ряду последний глагол — совершенного вида: вставить букву в окончании, объяснить, почему на месте знака вопроса нельзя образовать причастие настоящего времени, и образовать от этого глагола действительное причастие прошедшего времени.',
  obr:'Они маж..т — маж..щий → они мажут (мазать — не на -ить, I спр.) — мажущий: в окончании у, значит, и в суффиксе -ущ-.',
  body:'1. Они шепч..тся — шепч..щиеся; они нянч..т — нянч..щая; они полощ..т — полощ..щий; они чист..т — чист..щий; они высуш..т — ? 2. Они паш..т — паш..щий; они жал..т — жал..щая; они леле..т — леле..щий, леле..мый; они трат..т — трат..щий; они обид..тся — ? 3. Они сыпл..тся — сыпл..щийся; они терп..т — терп..щий; они слав..т — слав..щий, слав..мый; они щекоч..т — щекоч..щий; они прогон..т — ?'},
 {n:48,l:4,st:4,os:'работа с текстом',task:'Прочитать отрывок. 1) Выписать причастия вместе с определяемыми словами (их семь). 2) Для каждого причастия определить, под ударением ли гласная перед суффиксом. Если без ударения — объяснить её написание правилом. 3) Доказать, что запоздалый и хлопчатая — не причастия. 4) От глаголов-сказуемых изменялись, таяли, лепились, путались образовать действительные причастия настоящего времени и объяснить выбор гласной в суффиксе.',
  body:'По ясному небу едва-едва неслись высокие и редкие облака, изжелта-белые, как весенний запоздалый снег, плоские и продолговатые, как опустившиеся паруса. Их узорчатые края, пушистые и лёгкие, как хлопчатая бумага, медленно, но видимо изменялись с каждым мгновением; они таяли, эти облака, и от них не падало тени. Мы долго бродили с Касьяном по ссечкам. Молодые отпрыски, ещё не успевшие вытянуться выше аршина, окружали своими тонкими, гладкими стебельками почерневшие, низкие пни; круглые губчатые наросты с серыми каймами, те самые наросты, из которых вываривают трут, лепились к этим пням; земляника пускала по ним свои розовые усики; грибы тут же тесно сидели семьями. Ноги беспрестанно путались и цеплялись в длинной траве, пресыщенной горячим солнцем; всюду рябило в глазах от резкого металлического сверкания молодых, красноватых листьев на деревцах; … кое-где, возле заброшенных дорожек, на которых следы колёс обозначались полосами красной мелкой травки, возвышались кучки дров, потемневших от ветра и дождя, сложенные саженями… (И. С. Тургенев, «Записки охотника») Пояснения: изжелта-белые — белые с желтизной; ссечки — вырубки в лесу; отпрыски — молодые побеги; аршин — старинная мера длины (около 70 см); трут — сухой гриб для разжигания огня; трава, пресыщенная солнцем, — трава, в которой солнца уже слишком много; сажень — старинная мера (около 2 м).'},
 {n:49,l:4,st:4,task:'Найти ошибки в суффиксах причастий и исправить их (ошибок шесть). Объяснить каждое исправление. Выписать и объяснить также верно написанные причастия.',
  body:'В воскресенье мы с папой ходили в лес. Стелящаяся между соснами тропинка привела нас к ручью. Повеевший с реки ветерок принёс запах мяты. На берегу мы заметили ёжика, тащущего на спине огромное яблоко. Тяжело дышущий после подъёма папа присел отдохнуть на пень. Первым увидивший лося Миша замер от восторга. Потом мы вышли к осинке, обглоденной зайцами. Отовсюду слышался стук дятла, долбящего кору. Уносимые ветром листья кружились у нас над головой. Домой мы вернулись усталые, но счастливые.'},
 {n:50,l:4,st:4,task:'1) Объяснить, почему в каждой паре причастий гласные в суффиксе (или перед суффиксом) разные, хотя глаголы похожи или совпадают. 2) Составить предложения с тремя причастиями из этих пар (на выбор).',
  body:'1. Реющий — роящийся. 2. Дышащий — пышущий. 3. Бреющий — кроящий. 4. Мелющий — белящий. 5. Зависящий — зависающий. 6. Тающий — таявший. Пояснения: реющий флаг — флаг, который плавно колышется на ветру; пышущий жаром — очень горячий (о печи), пышущий здоровьем — очень здоровый.'},
 {n:105,l:4,st:4,task:'1) Вставить пропущенные буквы. Записать в скобках неопределённую форму глагола, от которого образовано причастие (для причастий настоящего времени — и форму «они …»), и объяснить выбор гласной. Подчеркнуть причастия, в которых пропущенная гласная стоит под ударением. 2) Выполнить морфологический разбор причастия настоящего времени из 5-го предложения.',
  body:'1. Необыкновенное разнообразие ягодных деревьев и других древесных пород, живописно перемеш..нных, поражало своей красотой. (С. Т. Аксаков, «Детские годы Багрова-внука») 2. Они втроём накинулись на больного, и началась долгая борьба, утомительная для напад..вших и мучительная для защищ..вшегося человека, трат..вшего остаток истощ..нных сил. (В. М. Гаршин, «Красный цветок») 3. Зоркие глаза казака… следили в вечернем дыму мирного аула за движ..щимися фигурами издалека видн..вшихся чеченок в синих и красных одеждах. (Л. Н. Толстой, «Казаки») 4. Старик воткнул иголку в лохмотья и равнодушно, с тусклым взглядом, уселся на один из деревянных обрубков, заменявших в подземелье стулья. (В. Г. Короленко, «Дети подземелья») 5. Солнце садится, и ветер утихнул летучий, / Нет и следа тех огнями прониз..нных туч; / Вот на окраине дрогнул живой и нежгучий, / Всю эту степь озаривший и гасн..щий луч. (А. А. Фет, «Солнце садится, и ветер утихнул летучий…») 6. На востоке звёзды становились реже и, казалось, расплывались в усилив..вшемся свете. (Л. Н. Толстой, «Казаки») Пояснения: древесные породы — виды деревьев; они (во 2-м предложении) — сторожа больницы; аул — горное селение; чеченки — жительницы Чечни; старик (в 4-м предложении) — один из бездомных обитателей подземелья; обрубок — короткий кусок бревна; нежгучий — мягкий, не жгучий.'},
 {n:51,l:4,st:5,os:'диктант',task:'Выборочно-распределительный диктант. Текст читает учитель или родитель. Записать только причастия вместе с определяемыми словами в три столбика: 1) с суффиксами настоящего времени; 2) с суффиксом -вш-; 3) страдательные прошедшего времени (с суффиксами -нн-, -енн-, -т-). Обозначить суффиксы и объяснить выбор гласной. Затем выполнить морфологический разбор причастий синевшей и погоняемый.',
  body:'Я кивнул ему головой и пошёл восвояси вдоль задымившейся реки. Не успел я отойти двух вёрст, как уже полились кругом меня по широкому мокрому лугу, и спереди, по зазеленевшимся холмам, от лесу до лесу, и сзади по длинной пыльной дороге, по сверкающим, обагрённым кустам, и по реке, стыдливо синевшей из-под редеющего тумана, — полились сперва алые, потом красные, золотые потоки молодого, горячего света… Всё зашевелилось, проснулось, запело, зашумело, заговорило. Всюду лучистыми алмазами зарделись крупные капли росы; мне навстречу, чистые и ясные, словно тоже обмытые утренней прохладой, принеслись звуки колокола, и вдруг мимо меня, погоняемый знакомыми мальчиками, промчался отдохнувший табун… (И. С. Тургенев, «Записки охотника») Пояснения: ему — мальчику Павлу; восвояси — к себе домой; верста — старинная мера длины (около километра); от лесу до лесу — от леса до леса; обагрённые кусты — кусты, на которые лёг красный свет зари; зардеться — засиять красным.'},
 {n:52,l:4,st:5,task:'1) Выписать причастия вместе с определяемыми словами, вставляя пропущенные буквы. Обозначить суффиксы и объяснить выбор гласной. Слово с пропуском, которое окажется прилагательным, выписать отдельно и объяснить, почему оно пишется так. Причастия, в которых пропуска нет, тоже выписать и обозначить суффиксы. 2) Выполнить морфологический разбор причастия несомая.',
  body:'1. Лёгкий пар подымался от быстро тек..щих и местами завёртыва..щихся струй его. (С. Т. Аксаков, «Детские годы Багрова-внука») 2. К вечеру эти облака исчезают; последние из них, черноватые и неопределённые, как дым, ложатся розовыми клубами напротив заход..щего солнца; на месте, где оно закатилось так же спокойно, как спокойно взошло на небо, алое сиянье стоит недолгое время над потемн..вшей землёй, и, тихо мигая, как бережно несомая свечка, затеплится на нём вечерняя звезда. (И. С. Тургенев, «Записки охотника») 3. Собаки даже дремали; лошади, сколько я мог различить, при чуть брезж..щем, слабо ль..щемся свете звёзд, тоже лежали, понурив головы… (И. С. Тургенев, «Записки охотника») 4. Иные, ещё обросшие листьями внизу, словно с упрёком и отчаянием поднимали кверху свои безжизн..нные, облом..нные ветви… (И. С. Тургенев, «Записки охотника») Пояснения: его (в 1-м предложении) — реки Ик; иные (в 4-м предложении) — другие старые деревья в роще, дубы и ясени.'},
// Урок 5
 {n:53,l:5,st:1,task:'Выписать причастия в два столбика: полные — вместе с существительным, к которому они относятся, краткие — вместе с подлежащим. От существительного к полному причастию поставить вопрос. Найти два кратких прилагательных, которые легко принять за краткие причастия, и объяснить, чем они отличаются.',
  obr:'Над лугом кружили потревоженные шмели. → Полное: шмели (какие?) потревоженные. Тетрадь проверена. → Краткое: тетрадь проверена.',
  body:'1. Подобранного во дворе котёнка мы назвали Пушком. 2. Шторы на окнах уже задёрнуты. 3. В музее мы долго стояли у картины, созданной три века назад. 4. Дедушка рад: огород вскопан, грядки политы. 5. Мимо станции с грохотом промчался поезд, идущий на юг. 6. Под окном зацвела посаженная прошлой весной сирень. 7. Сочинение сдано вовремя, и учитель доволен. 8. Мы помахали ребятам, отплывающим на лодке к острову. 9. Калитка почему-то привязана верёвкой. 10. На скамейке сидел мальчик с забинтованной рукой.'},
 {n:54,l:5,st:1,task:'1) Вставить пропущенные окончания причастий, поставив вопрос от существительного к причастию. 2) В склонении словосочетания «цветущий сад» допущены две ошибки. Найти и исправить их, объяснить исправление.',
  obr:'1) О звенящ.. ручье → о (каком?) звенящем ручье.',
  body:'1) На тающ.. льду, к спешащ.. прохожим, за пожелтевш.. листвой, о потерянн.. ключе, у сломанн.. калитки, с плачущ.. малышом, в наступивш.. тишине, перед запотевш.. окном, для отстающ.. учеников, по заледеневш.. озеру, о переведённ.. книгах, над шумящ.. морем. 2) И. п. цветущий сад, Р. п. цветущего сада, Д. п. цветущему саду, В. п. цветущий сад, Т. п. цветущем садом, П. п. о цветущим саде.'},
 {n:55,l:5,st:2,task:'1) От страдательных причастий образовать краткие формы мужского, женского, среднего рода и множественного числа. 2) Выписать причастия, от которых краткую форму образовать нельзя, и объяснить почему. 3) Перестроить предложения так, чтобы полное причастие стало кратким и было сказуемым. Если перестроить нельзя, объяснить почему.',
  obr:'1) Освобождённый — освобождён, освобождена, освобождено, освобождены. 3) Нарезанный хлеб лежит на тарелке. → Хлеб нарезан.',
  body:'1) и 2) Приглашённый, сияющий, посеянный, улетевший, начатый, принесённый, проснувшийся, выпитый, решённый, задремавший, увезённый. 3) 1. Отремонтированный спортзал примет учеников в понедельник. 2. Стенгазета, выпущенная нашим классом, висит в коридоре. 3. Солнце отражалось в вымытых к празднику окнах. 4. Корзину со срезанными в лесу грибами поставили на крыльцо. 5. Ребята, победившие в эстафете, получили грамоты. 6. На подоконнике стоит подаренный учителю кактус.'},
 {n:56,l:5,st:2,task:'Списать, вставляя пропущенные окончания причастий. Поставить вопрос от определяемого слова к причастию и указать падеж. В последнем предложении пропущено окончание краткого причастия: объяснить, по чему выбрано оно.',
  obr:'На скрипящ.. крыльце → на (каком?) скрипящем крыльце — П. п.',
  body:'1. Мы пошли к Сильвио и нашли его на дворе, сажающ.. пулю на пулю в туза, приклеенного к воротам. (А. С. Пушкин, «Выстрел») 2. В самом деле, тотчас после обеда явились землемер Шмит в усах и шпорах, и сын капитан-исправника, мальчик лет шестнадцати, недавно поступивш.. в уланы. (А. С. Пушкин, «Метель») 3. Свернувш..ся и почерневш.. от мороза листья шуршат под сапогами в берёзовой аллее, вырубленн.. уже наполовину. (И. А. Бунин, «Антоновские яблоки») 4. Но неизвестно будущее, и стоит оно пред человеком подобно осеннему туману, поднявш..ся из болот. (Н. В. Гоголь, «Тарас Бульба») 5. Он торопливо, мелкими, путающ..ся шажками перебежал через мост… (А. И. Куприн, «Белый пудель») 6. Сильвио встал и вынул из картона красную шапку с золотою кистью, с галуном…; он её надел; она была прострелен.. на вершок ото лба. (А. С. Пушкин, «Выстрел») Пояснения: туз — игральная карта; землемер — тот, кто измеряет землю; капитан-исправник — начальник уездной полиции; уланы — лёгкая конница; пред — перед; галун — золотая тесьма; вершок — старинная мера длины, около 4,5 см.'},
 {n:57,l:5,st:2,task:'Списать текст, вставляя пропущенные окончания причастий. Над полными причастиями надписать вопрос и падеж, над краткими — род и число.',
  obr:'К спящ.. котёнку → к (какому?) спящему котёнку — Д. п.; окна заклеен.. → заклеены — мн. ч.',
  body:'Вечером мы возвращались из библиотеки по тихому бульвару. Под ногами хрустел только что выпавш.. снег. Скамейки были завален.. им до самых спинок, а горка во дворе уже залит.. водой. В окнах, увешанн.. гирляндами, мерцали огоньки. У освещённ.. витрины толпились дети, разглядывавш.. игрушечную железную дорогу. По рельсам катился крошечный поезд, тянущ.. за собой пять вагонов. Мы шли за соседской таксой, обнюхивавш.. каждый сугроб, и свернули в переулок, ведущ.. к дому. Дверь подъезда оказалась заперт.., и брат долго искал ключ, спрятанн.. где-то в кармане. Перед сном я всё думал о маленьком вокзале, сиявш.. фонариками.'},
 {n:58,l:5,st:3,task:'Найти причастия и выписать их в два столбика: полные — вместе с определяемым словом (указать падеж и отметить, стоит причастие перед этим словом или после него), краткие — вместе с подлежащим. Указать, каким членом предложения является каждое причастие. Доказать, что слова «видны» и «готова» — не причастия.',
  obr:'Ребята, пришедшие из похода, были утомлены. → Полное: ребята (какие?) пришедшие — И. п., после слова; определение. Краткое: ребята утомлены; сказуемое.',
  body:'1. Он прямо подъехал к нечистому, запачканному домишке, у которого небольшие окошки едва были видны, закопчённые неизвестно чем; труба заткнута была тряпкою… (Н. В. Гоголь, «Тарас Бульба») 2. Тесная квартирка сапожника была наполнена гостями, большею частию немцами-ремесленниками, с их жёнами и подмастерьями. (А. С. Пушкин, «Гробовщик») 3. Таким образом вражда старинная и глубоко укоренившаяся, казалось, готова была прекратиться от пугливости куцой кобылки. (А. С. Пушкин, «Барышня-крестьянка») 4. В шалаше устроены постели, стоит одноствольное ружьё, позеленевший самовар, в уголке — посуда. Около шалаша валяются рогожи, ящики, всякие истрёпанные пожитки, вырыта земляная печка. (И. А. Бунин, «Антоновские яблоки») Пояснения: нечистый — грязный; домишко — маленький бедный дом; большею частию — в основном; подмастерье — помощник мастера; вражда — здесь: давняя ссора двух соседей; куцый — с коротким хвостом; шалаш — здесь: жильё сторожей и работников в осеннем саду; рогожа — грубая ткань из лыка; пожитки — вещи, домашний скарб.'},
 {n:59,l:5,st:3,task:'Выполнить морфологический разбор причастий «услышавший», «сменяемые» и «сохранена» по плану. Объяснить, почему у одного из них в разборе не указан падеж, у другого — полная или краткая форма, а у третьего — род.',
  obr:'Ветер гнал по дороге листья, сброшенные клёнами. → Сброшенные (листья) — причастие, обозначает признак предмета по действию: листья (какие?) сброшенные. 1. Н. ф. — сброшенный. 2. Пост. признаки: страд., прош. вр., сов. в. 3. Непост. признаки: полн. ф., мн. ч., В. п. В предложении — определение (в составе причастного оборота).',
  body:'1. Арто, услышавший сзади себя разговор, повернулся и подбежал к людям. (А. И. Куприн, «Белый пудель») 2. Товарищи меня обожали, а полковые командиры, поминутно сменяемые, смотрели на меня, как на необходимое зло. (А. С. Пушкин, «Выстрел») 3. Таким образом тайна была сохранена более, чем полудюжиною заговорщиков. (А. С. Пушкин, «Метель») Пояснения: Арто — кличка пуделя; поминутно — то и дело; полудюжина — шесть; заговорщик — участник тайного замысла.'},
 {n:60,l:5,st:3,task:'Распределить по трём столбикам слова, входящие в сказуемые: краткие причастия, краткие прилагательные, глаголы (глагол-связку был, была, были не выписывать). Доказать, что слова первого столбика — причастия: назвать глагол, от которого образовано каждое, и суффикс. Объяснить, почему причастия «набелённая», «затянутая» и «предстоящей» не входят ни в один столбик.',obr:'Задание выполнено, ребята веселы и шумят. → Кр. причастие: выполнено (выполнить, суффикс -ен-); кр. прилагательное: веселы (весёлый); глагол: шумят.',body:'1. Стол был накрыт, завтрак готов, и мисс Жаксон, уже набелённая и затянутая в рюмочку, нарезывала тоненькие тартинки. (А. С. Пушкин, «Барышня-крестьянка») 2. …шла широкая беговая дорожка из жёлтого песка, который был немного влажен и плотен и потому приятно пружинился под ногами… (А. И. Куприн, «Изумруд») 3. Сии размышления были прерваны нечаянно тремя франмасонскими ударами в дверь. (А. С. Пушкин, «Гробовщик») 4. Иногда он забирался и в улицу аристократов, в нынешнем старом Киеве, где жили малороссийские и польские дворяне и где домы были выстроены с некоторою прихотливостию. (Н. В. Гоголь, «Тарас Бульба») 5. Он был серьёзен и сосредоточенно зол, глаза его блестели мстительно. (М. Горький, «Проходимец») 6. Только что очень сытно пообедали, раскраснелись и возбуждены шумными разговорами о предстоящей охоте… (И. А. Бунин, «Антоновские яблоки») Пояснения: набелённая — с белилами на лице; затянутая в рюмочку — с туго затянутой талией; тартинка — маленький бутерброд; беговая дорожка — здесь: дорожка для бегов рысаков на ипподроме; сии — эти; франмасонские удары — три условных стука, как у членов тайного общества; он (в предл. 4) — Андрий, младший сын Тараса Бульбы, ученик киевской бурсы; аристократы — знатные люди; малороссийские — украинские (старое название); домы — старая форма (дома); прихотливость — затейливость; мстительно — с желанием отомстить; в шестом предложении речь идёт о гостях-охотниках, собравшихся в усадьбе.'},
 {n:61,l:5,st:4,task:'Найти и исправить ошибки в формах причастий. Каждое исправление объяснить: задать вопрос от определяемого слова или назвать правило. Четыре предложения написаны без ошибок.',
  body:'1. Утром мы вышли к реке, окутанной туманом. 2. По тропинке, петляющим между соснами, отряд добрался до поляны. 3. Над догорающем костром кружились искры. 4. Палатки были установленны за десять минут. 5. После обеда все тарелки вымыто и убрано в ящик. 6. Мы долго любовались звёздами, мерцающих над лесом. 7. Прибежавшие с речки мальчишки хвастались тремя окунями. 8. Вожатые, придущие завтра, привезут новые удочки. 9. Младшим ребятам, слушавшим нас с огромным интересом, мы рассказали о походе. 10. Ложку, уроненный в траву, пришлось искать в темноте. 11. Задача, предложенная учителем, оказалась трудной.'},
 {n:62,l:5,st:4,task:'Списать, вставляя пропущенные буквы в суффиксах и окончаниях причастий. Объяснить выбор гласной в суффиксе (по форме «они …» или по неопределённой форме). Над полными причастиями указать падеж, над кратким — род и число. Отметить, какие причастия стоят перед определяемым словом, а какие — после него.',
  obr:'К ребёнку, громко плач..щ.. → плачут, I спр. → -ущ-: (к ребёнку какому?) плачущему — Д. п.',
  body:'1. Сзади тяжело грохотал по песку дворник, яростно рыч..вш.. какие-то ругательства. (А. И. Куприн, «Белый пудель») 2. Тонкий, словно стон..щ.. визг вдруг коснулся его слуха. (А. И. Куприн, «Белый пудель») 3. Он увидел невдалеке деревушку, состо..щ.. из четырёх или пяти дворов. (А. С. Пушкин, «Метель») 4. Наконец открыл он глаза и увидел перед собою работницу, раздува..щ.. самовар. (А. С. Пушкин, «Гробовщик») 5. …верхние листья верб начали лепетать, и мало-помалу лепеч..щ.. струя спустилась по ним до самого низу. (Н. В. Гоголь, «Тарас Бульба») 6. Марья Гавриловна была воспит..н.. на французских романах… (А. С. Пушкин, «Метель») Пояснения: грохотать — здесь: громко топать; верба — ива; мало-помалу — постепенно.'},
 {n:63,l:5,st:4,task:'1) Найти в предложениях все причастия (их восемь) и выписать вместе с определяемыми словами, указав форму (полная или краткая) и член предложения. 2) Выполнить морфологический разбор причастий «заключены» и «летевшим» по плану.',
  body:'1. Окна нижнего этажа были заключены в высоко выдавшиеся гранитные карнизы; верхний этаж состоял весь из небольших арок, образовавших галерею; между ними видны были решётки с гербами. (Н. В. Гоголь, «Тарас Бульба») 2. И каждое простое слово сей речи, выговоренное голосом, летевшим прямо с сердечного дна, было облечено в силу. (Н. В. Гоголь, «Тарас Бульба») 3. Небольшой кусок хлеба, проглоченный ею, произвёл только боль в желудке, отвыкшем от пищи… (Н. В. Гоголь, «Тарас Бульба») Пояснения: карниз — выступ над окном или вдоль стены; высоко — здесь: далеко вперёд; арка — свод в виде дуги; галерея — длинный крытый проход; сей — этой; с сердечного дна — из глубины сердца; облечено в силу — здесь: звучало с силой; ею — здесь: голодной девушкой.'},
 {n:64,l:5,st:5,task:'1) Найти в предложениях все причастия и указать у каждого форму (полная или краткая), определяемое слово и член предложения. 2) В каждом предложении есть ловушка: слово, которое легко принять за краткое причастие; причастие, которое легко принять за прилагательное; причастие, которое легко отнести не к тому слову или принять не за тот член предложения. Найти ловушку и объяснить, как не ошибиться.',
  body:'1. Слышен был чад погаснувшей свечи. (Н. В. Гоголь, «Тарас Бульба») 2. Луна сквозь окна освещала их жёлтые и синие лица, ввалившиеся рты, мутные, полузакрытые глаза и высунувшиеся носы... (А. С. Пушкин, «Гробовщик») 3. Он уходил в луга и степи, будто бы за охотою, но заряд его оставался невыстрелянным. (Н. В. Гоголь, «Тарас Бульба») 4. Это было какое-то беспрерывное пиршество, бал, начавшийся шумно и потерявший конец свой. (Н. В. Гоголь, «Тарас Бульба») 5. Всякий приходящий сюда позабывал и бросал всё, что дотоле его занимало. (Н. В. Гоголь, «Тарас Бульба») 6. Предмет, избранный ею, был бедный армейский прапорщик, находившийся в отпуску в своей деревне. (А. С. Пушкин, «Метель») Пояснения: чад — дым и запах; во втором предложении описан сон гробовщика: к нему явились мертвецы; заряд — порох и пуля для одного выстрела; пиршество — пир; сюда — здесь: в Запорожскую Сечь; дотоле — до этого; предмет — здесь: тот, кого полюбили; прапорщик — младший офицер; в отпуску — в отпуске.'},
 {n:65,l:5,st:5,os:'сочинение',task:'Написать сочинение-миниатюру (7–9 предложений) на одну из тем: «Улица после снегопада», «Наш класс перед праздником», «Двор после грозы». Употребить не меньше четырёх полных причастий в разных падежах: хотя бы одно — перед определяемым словом, одно — после него, одно — при существительном-дополнении или обстоятельстве (а не при подлежащем). Запятые при причастии с зависимыми словами, которое стоит после определяемого слова, ставить по образцу: Улица, заметённая снегом, опустела. Употребить не меньше трёх кратких причастий в роли сказуемых, в разном роде и числе. Подчеркнуть причастия как члены предложения; над полными указать падеж, над краткими — род и число. Одно полное и одно краткое причастие разобрать морфологически по плану.',
  body:'Слова для справки: заметённый, искрящийся, притихший, умытый, развешаны, расставлены, повален, унесена.'},
// Урок 6
 {n:66,l:6,st:1,task:'1) Выписать причастия с не в два столбика: «слитно» и «раздельно». Объяснить написание. Найти слово с не, которое не является причастием. 2) Раскрыть скобки в сочетаниях. Объяснить написание.',
  obr:'Неразгаданная загадка — слитно (полное причастие без зависимых слов); загадка не разгадана — раздельно (краткое причастие).',
  body:'1) 1. Невыключенный утюг может стать причиной пожара. 2. На полу валялись листы, не убранные со вчерашнего дня. 3. Посылка ещё не получена. 4. Нескошенный луг пестрел ромашками. 5. Это был не украденный, а просто спрятанный братом велосипед. 6. Недоумевающий котёнок смотрел на своё отражение в зеркале. 7. Отнюдь не запыхавшиеся лыжники решили пройти ещё круг. 8. Дежурный не стёр с доски расписание. 9. Никем не замеченная опечатка попала в газету. 2) (Не)высохшая лужа — лужа, (не)высохшая к вечеру; (не)отправленное сообщение — сообщение (не)отправлено; (не)выученное, а списанное упражнение; (не)покрашенный забор — забор, (не)покрашенный с весны; вовсе (не)испорченный праздник.'},
 {n:67,l:6,st:2,task:'Списать, раскрывая скобки. Объяснить слитное или раздельное написание не.',
  obr:'(Не)политый цветок → неполитый (полное причастие без зависимых слов).',
  body:'1. Мама нашла под диваном (не)распечатанное письмо от бабушки. 2. Часть дороги, (не)затронутая ремонтом, осталась прежней. 3. Все упражнения (не)проверены: учитель заболел. 4. Это был (не)придуманный, а настоящий случай. 5. Наш пёс, сразу (не)взлюбивший почтальона, лает на каждый звонок. 6. Вовсе (не)интересующиеся футболом гости ушли после первого тайма. 7. Кот подкрадывался к (не)съеденной котлете. 8. Причина поломки пока (не)выяснена. 9. Этот далеко (не)изученный остров привлекает учёных. 10. Над (не)остывшей чашкой поднимался пар.'},
 {n:68,l:6,st:2,task:'1) Вставить ё или е после шипящих. Поставить ударение. Распределить слова по столбикам: «ё под ударением», «е без ударения»; слово, которое не подходит ни к одному столбику, записать отдельно и объяснить. 2) Списать предложения, вставляя пропущенные буквы. Объяснить написание.',
  obr:'Утеш..нный → уте́шенный (ударение не на суффиксе — е); смягч..нный → смягчённый (суффикс под ударением — ё).',
  body:'1) Огорч..нный, обеспеч..нный, сокращ..нный, увелич..нный, разреш..нный, заснеж..нный, упрощ..нный, приглуш..нный, взъерош..нный, упорядоч..нный, освеж..нный, ш..рох листвы. 2) 1. Наш дачный сад казался совсем заросшим и заброш..нным. 2. Ученики, привлеч..нные шумом, выглянули в коридор. 3. Бабушка подала салат с измельч..нными орехами и кувшин охлажд..нного морса. 4. Дежурный вытер доску смоч..нной тряпкой. 5. Кот, разбуж..нный звонком, недовольно спрыгнул с дивана. 6. Долгий ремонт школы наконец заверш..н. 7. Кто-то подж..г сухую траву у оврага, и пожарные приехали через десять минут.'},
 {n:69,l:6,st:2,task:'Списать, вставляя пропущенные буквы. Над каждым причастием указать, полное оно или краткое. Краткие причастия подчеркнуть как сказуемые. Найти три причастия, в которых пропущена не н, и объяснить, почему в них нет н.',obr:'Шарфы, выстира..ые вчера, — выстиранные (полное — нн); шарфы выстира..ы — выстираны (краткое — н).',body:'1. Письма, накануне ею написа..ые, были сожже..ы… (А. С. Пушкин, «Метель») 2. Всё его добро было уже уложе..о; оставались одни голые, простреле..ые стены. (А. С. Пушкин, «Выстрел») 3. Дорожки сада были усыпа..ы ровным крупным гравием, хрустевшим под ногами, а с боков обставле..ы большими розовыми раковинами. (А. И. Куприн, «Белый пудель») 4. Они были отда..ы по двенадцатому году в Киевскую академию… (Н. В. Гоголь, «Тарас Бульба») 5. Винные шинки были разби..ы; мёд, горелка и пиво забирались просто, без денег… (Н. В. Гоголь, «Тарас Бульба») 6. Хороши и заметки на их полях, крупно и с круглыми мягкими росчерками сдела..ые гусиным пером. (И. А. Бунин, «Антоновские яблоки») 7. Обширный кабинет был убра.. со всевозможною роскошью; …пол оби.. был зелёным сукном и устла.. коврами. (А. С. Пушкин, «Выстрел») 8. Острый запах окутал сады, там гомонили дети, собирая червобоину и сби..ые ветром жёлтые и розовые яблоки. (М. Горький, «Мои университеты») 9. Но в то время все были зараже..ы дурацкой модой читать запрещё..ые книжки… (М. Горький, «Проходимец») Пояснения: накануне — в предыдущий день; добро — вещи, имущество; гравий — мелкие камешки; по двенадцатому году — в двенадцать лет; академия — здесь: духовное училище; шинок — кабак; горелка — водка; на их полях — на полях старинных книг; росчерк — размашистая линия пера; гусиное перо — перо для письма чернилами; со всевозможною роскошью — очень богато, со всеми дорогими вещами; сукно — плотная шерстяная ткань; гомонить — шумно разговаривать; червобоина — червивые яблоки, упавшие с дерева раньше срока; дурацкая мода — здесь: глупое увлечение; в предл. 9 речь о книжках, которые власти не разрешали читать.'},
 {n:70,l:6,st:3,task:'1) Раскрыть скобки в сочетаниях из произведений классиков. Объяснить написание не. 2) Списать предложения, раскрывая скобки. Объяснить написание. Найти причастие, которое пишется с не слитно, хотя у него есть зависимые слова, и объяснить почему.',
  obr:'(Не)вскопанная никем грядка → не вскопанная (зависимое слово «никем»); (не)вскопанная грядка → невскопанная (полное причастие без зависимых слов).',
  body:'1) Принялся я было за (не)подслащённую наливку (А. С. Пушкин, «Выстрел»); сквозь (не)притворённую дверь (М. Горький, «Фома Гордеев»); (не)охраняемые, беспечные границы (Н. В. Гоголь, «Тарас Бульба»); скучать бездействием и продолжительною трезвостью, (не)сопряжённою ни с каким делом (Н. В. Гоголь, «Тарас Бульба»); чутко слушал бесконечные, никогда (не)надоедавшие рассказы (М. Горький, «В людях»). 2) 1. …у меня в кабинете сидит человек, (не)хотевший объявить своего имени… (А. С. Пушкин, «Выстрел») 2. Напротив него, дверь в дверь, стояла в своём деннике молодая вороная, ещё (не)сложившаяся кобылка Щеголиха. (А. И. Куприн, «Изумруд») 3. Со всех сторон из травы уже стал подыматься густой храп спящего воинства, на который отзывались с поля звонкими ржаньями жеребцы, (не)годующие на свои спутанные ноги. (Н. В. Гоголь, «Тарас Бульба») 4. Мы пришли на кладбище, голое место, ничем (не)ограждённое, усеянное деревянными крестами, (не)осенёнными ни единым деревцом. (А. С. Пушкин, «Станционный смотритель») Пояснения: наливка — сладкий ягодный напиток; притворить дверь — прикрыть её; беспечный — беззаботный; трезвость — здесь: жизнь без пиров; трезвость, сопряжённая с делом, — трезвая жизнь, в которой есть какое-то дело; объявить своё имя — назваться; денник — стойло для лошади; Щеголиха — кличка лошади; подыматься — подниматься; воинство — войско; спутать коню ноги — связать их, чтобы конь не ушёл далеко; крест, осенённый деревцом, — крест, над которым растёт дерево и даёт тень.'},
 {n:71,l:6,st:3,task:'Списать, раскрывая скобки и вставляя пропущенные буквы (ё или е после шипящих, н или нн). Объяснить каждое написание.',
  obr:'(Не)отглаж..нная рубашка → неотгла́женная (полное причастие без зависимых слов — слитно; ударение не на суффиксе — е; полное — нн).',
  body:'1. На столе остывал (не)тронутый ужин. 2. Задача всё ещё (не)реш..на, хотя до звонка осталась минута. 3. Мы шли по (не)очищ..нной от снега дорожке. 4. (Не)смолкающий гул стадиона был слышен за километр. 5. Перед нами стоял (не)смущ..нный, а скорее удивлённый тренер. 6. Подарки для гостей пока (не)упакова..ы. 7. Награда так и (не)вруч..на победителю. 8. Ничуть (не)испуга..ый щенок с лаем бросился за курицей. 9. В углу пылился (не)разобра..ый чемодан.'},
 {n:72,l:6,st:3,task:'Списать, вставляя ё или е после шипящих в суффиксах причастий. Поставить ударение в этих причастиях. Объяснить написание. В предложениях 6 и 7 сравнить написание полной и краткой формы одного причастия.',
  obr:'Встревож..нный → встрево́женный (ударение не на суффиксе — е).',
  body:'1. Офицер, разгоряч..нный вином, игрою и смехом товарищей, почёл себя жестоко обиж..нным… (А. С. Пушкин, «Выстрел») 2. Я молча выпрыгнул из саней и вошёл в церковь, слабо освещ..нную двумя или тремя свечами. (А. С. Пушкин, «Метель») 3. Сергей бессознательно поднял глаза кверху и вдруг, охвач..нный невероятною радостью, вскочил одним толчком на ноги. (А. И. Куприн, «Белый пудель») 4. Через несколько минут Изумруда, уже распряж..нного, приводят опять к трибуне. (А. И. Куприн, «Изумруд») 5. И вывели на вал скруч..нных верёвками запорожцев. (Н. В. Гоголь, «Тарас Бульба») 6. …выезжали паны, окруж..нные несметными слугами. (Н. В. Гоголь, «Тарас Бульба») 7. Мы уже сказывали, что, несмотря на её холодность, Марья Гавриловна всё по-прежнему окруж..на была искателями. (А. С. Пушкин, «Метель») 8. …пока вы тут говорили, у нас уже и этот последний гвоздь заколоч..н. (Н. С. Лесков, «Левша») Пояснения: почёл себя — счёл себя; Изумруд — кличка рысака; трибуна — места для зрителей на ипподроме; вал — земляная насыпь вокруг крепости; несметный — бесчисленный; сказывать — рассказывать; искатель — здесь: жених.'},
 {n:109,l:6,st:3,task:'Списать пары сочетаний, раскрывая скобки и вставляя пропущенные буквы. Сочетания в каждой паре различаются одним признаком. Назвать этот признак и объяснить, как он меняет написание (или почему не меняет).',obr:'(Не)заточ..нный карандаш — карандаш (не)заточ..н → незато́ченный — не зато́чен. Признак — полная или краткая форма: с ним меняются и написание не (слитно — раздельно), и н/нн; ударение не на суффиксе, поэтому в обоих — е.',body:'1. (Не)застёгнутая куртка — куртка (не)застёгнута. 2. (Не)зашнурова..ый ботинок — (не)зашнурова..ый до конца ботинок. 3. (Не)утихающий ветер — отнюдь (не)утихающий ветер. 4. (Не)сложе..ая записка — (не)сложе..ая, а скомканная записка. 5. (Не)истовствующая толпа — (не)истовствующая на трибунах толпа. 6. Платье укороч..о — укороч..ое платье. 7. Посылка завёрну..а — посылка запакова..а. 8. Рюкзак облегч..н — нагрузка облегч..на. 9. Утюг выключ..н — свет включ..н. 10. Уголёк прож..г скатерть — на скатерти остался прож..г. 11. Мальчишка (не)причёса.. — (не)причёса..ый мальчишка. 12. (Не)подмет..нный пол — никем (не)подмет..нный пол. Пояснения: в паре 5 — о толпе, которая бушует, буйствует.'},
