name: Публикация на GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Сборка
        run: |
          python3 tools/build.py
          mkdir -p _site && cp www/index.html _site/index.html
      # версия для учителя (с ответами) — не на сайте, а файлом в этом запуске Actions (Artifacts → uchebnik-dlya-uchitelya)
      - uses: actions/upload-artifact@v4
        with:
          name: uchebnik-dlya-uchitelya
          path: dist/teacher.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
